用路径 / 定义（5.1）","k":[],"r":[]},{"t":"有约束 → 拉格朗日；乘积型先取 ln；对称结构先推相等（5.2）","k":[],"r":[]},{"t":"闭区域 → 内部 + 边界 + 比较，第 0 步先证存在（5.3）","k":[],"r":[]},{"t":"隐函数 z(x,y) 的极值 → F_x=F_y=0 代回原方程；A=−F_xx/F_z；配方秒杀（5.4）","k":[],"r":[]},{"t":"证多元不等式 → 柯西/均值一击致命 + 拉格朗日完整论证双路线（5.5）","k":[],"r":[]}],"r":[]}],"r":[]}],"stats":{"markers":24,"nodes":25}},"parts":["多元极限与连续：三类方法","偏导数与可微性：四类方法","多元求导法则：六类方法","几何应用：一类方法","极值与最值：五类方法"],"methods":{"1.1":{"id":"1.1","name":"重极限计算三招（结构识别思想）","part":"多元极限与连续","book":"多元微分","teachMd":"**核心思想**：重极限没有洛必达，全部功夫在**把二元问题化回一元工具**（等价无穷小、Taylor、夹逼）。按结构三选一：\n\n| 结构特征 | 招式 | 动作 |\n| --- | --- | --- |\n| 只含 $xy$、$x^2+y^2$ 等整体 | **化一元** | 令 $t=xy$ 或 $t=x^2+y^2$，$t\\to0$ |\n| 齐次分式（分子分母同\"总次数\"） | **极坐标** | $x=\\rho\\cos\\theta,\\ y=\\rho\\sin\\theta$，提取 $\\rho$ 的幂 |\n| 分子能被分母控制 | **放缩夹逼** | $\\lvert xy\\rvert\\le\\dfrac{\\rho^2}{2}$、$x^2+y^2\\ge2\\lvert xy\\rvert$ 等 |\n| $0^0$、$1^\\infty$、$\\infty^0$ 型 | **取对数** | 化为乘积极限，\"幂压倒对数\" |\n\n**必背放缩与一元工具**：\n\n1. $\\lvert xy\\rvert\\le\\dfrac{x^2+y^2}{2}$，$\\lvert x+y\\rvert\\le\\sqrt2\\,\\rho$，其中 $\\rho=\\sqrt{x^2+y^2}$；\n2. $\\rho^{a}\\ln\\rho\\to0$（$a>0$，幂压倒对数）；$\\ln(1+u)\\le u$（$u>-1$）；$1-\\cos u\\sim\\dfrac{u^2}{2}$；$\\sin u\\sim u$；\n3. 有界 × 无穷小：振荡因子 $\\sin\\dfrac1y,\\ \\cos\\dfrac1{x^2}$ 才是合法的\"有界\"。\n\n> <span style=\"color:#e53935\">**头号陷阱——极坐标后只代\"固定 $\\theta$\"**：极坐标代换后若表达式仍含 $\\theta$，必须放缩成**与 $\\theta$ 无关**的 $\\rho$ 的无穷小才能下结论；只对固定 $\\theta$ 取 $\\rho\\to0$ 等于只验证了射线，不合法（反例见 1.2 例 1.2-2）。</span>\n\n**勘误式复盘（重要）**——\"无穷小 × 有界\"用错对象：\n\n> 错误：判定 $\\dfrac{x}{\\sin y}+\\dfrac{y}{\\sin x}$ 在 $(x,y)\\to(0,0)$ 时为 $0$，理由\"$x$ 是无穷小 × $\\dfrac{1}{\\sin y}$ 有界\"。\n> 错因：$y\\to0$ 时 $\\dfrac{1}{\\sin y}$ **无界**，前提根本不满足；事实上沿 $y=kx$ 该式 $\\to\\dfrac1k+k$ 随 $k$ 变化，极限不存在。\n> 纠正：\"无穷小 × 有界\"的有界因子必须是**全程有界**的振荡型（$\\sin\\dfrac1y,\\cos\\dfrac1x$ 这类），见练 1.1-2。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 极坐标后含 $\\theta$ 直接令 $\\rho\\to0$ | 放缩出与 $\\theta$ 无关的界，或换路径法证明 |\n| 拆极限求和时不检查各项极限存在 | 各项都有极限才可拆（和的极限=极限的和） |\n| 对二元分式用\"等价替换分子\" | 只能对**因子**用等价无穷小，加减结构先化简 |","examplesMd":"**【例 1.1-1】（★★，经典）** 求下列重极限：\n\n(1) $\\lim\\limits_{(x,y)\\to(0,0)}\\dfrac{\\sqrt{x^{2}+y^{2}+1}-1}{x^{2}+y^{2}}$；　(2) $\\lim\\limits_{(x,y)\\to(0,0)}\\dfrac{x^{4}+y^{4}}{x^{2}+y^{2}}$；　(3) $\\lim\\limits_{(x,y)\\to(0,0)}\\dfrac{x^{2}y^{2}}{x^{2}+y^{2}}$。\n\n**思路分析**：(1) 只含 $x^2+y^2$ 整体——化一元（有理化）；(2) 齐次分式——极坐标；(3) 分子可被分母控制——放缩。\n\n**详细解答**：\n\n(1) 令 $t=x^{2}+y^{2}\\to0^{+}$，有理化：\n\n$\\dfrac{\\sqrt{1+t}-1}{t}=\\dfrac{1}{\\sqrt{1+t}+1}\\longrightarrow\\dfrac12$\n\n(2) 令 $x=\\rho\\cos\\theta,\\ y=\\rho\\sin\\theta$：\n\n$\\dfrac{\\rho^{4}\\left(\\cos^{4}\\theta+\\sin^{4}\\theta\\right)}{\\rho^{2}}=\\rho^{2}\\left(\\cos^{4}\\theta+\\sin^{4}\\theta\\right)$\n\n而 $\\cos^{4}\\theta+\\sin^{4}\\theta\\le1$ 与 $\\theta$ 无关，故原式 $=0$。\n\n(3) $\\lvert xy\\rvert\\le\\dfrac{\\rho^{2}}{2}\\Rightarrow 0\\le\\dfrac{x^{2}y^{2}}{x^{2}+y^{2}}\\le\\dfrac{\\rho^{4}/4}{\\rho^{2}}=\\dfrac{\\rho^{2}}{4}\\to0$，夹逼得极限为 $0$。\n\n**检验**：三题均可数值抽验，如 (3) 取 $(x,y)=(0.01,0.01)$：$\\dfrac{10^{-8}}{2\\times10^{-4}}=5\\times10^{-5}\\approx0$ ✓。\n\n**方法总结**：==先看整体结构再动手：整体换元 > 极坐标 > 放缩，三招层层递进==；凡分子\"总次数\"高于分母，放缩几乎必成。\n\n**【例 1.1-2】（★★，真题风格）** 求 $\\lim\\limits_{(x,y)\\to(0,0)}\\left(x^{2}+y^{2}\\right)^{xy}$。\n\n**思路分析**：底数 $\\to0$、指数 $\\to0$，$0^{0}$ 型——取对数。\n\n**详细解答**：原式 $=\\exp\\Big[xy\\ln\\left(x^{2}+y^{2}\\right)\\Big]$。记 $\\rho=\\sqrt{x^{2}+y^{2}}$，则\n\n$\\Big\\lvert xy\\ln\\left(x^{2}+y^{2}\\right)\\Big\\lvert\\le\\dfrac{\\rho^{2}}{2}\\cdot\\Big\\lvert\\ln\\rho^{2}\\Big\\rvert\\longrightarrow0$\n\n（幂压倒对数），由夹逼对数部分 $\\to0$，故原极限 $=e^{0}=1$。\n\n**检验**：数值抽验 $(x,y)=(0.01,0.02)$：底 $=5\\times10^{-4}$，指数 $=2\\times10^{-4}$，$5\\times10^{-4}=e^{-7.6}$，整体 $\\approx e^{-7.6\\times2\\times10^{-4}}\\approx0.9985\\to1$ ✓。\n\n**方法总结**：幂指型标准动作：**取对数 → 化乘积 → 放缩（幂压倒对数）→ 取指数还原**。指数无穷小的阶（本题 $\\rho^{2}$）远高于对数增长（$\\lvert\\ln\\rho\\rvert$），对数部分必为 $0$。"},"1.2":{"id":"1.2","name":"路径法证极限不存在（先比阶再选路思想）","part":"多元极限与连续","book":"多元微分","teachMd":"**核心思想**：重极限存在 $\\iff$ 沿**所有**路径极限存在且相等。故证不存在只需**两把刀**：\n\n1. 找一条路径，沿它极限不存在（发散或振荡）；\n2. 找两条路径，沿它们的极限**存在但不相等**（更常用）。\n\n**选路三板斧**（按顺序试）：\n\n| 板斧 | 路径 | 适用信号 |\n| --- | --- | --- |\n| ① 直线族 | $y=kx$ | 分母为齐次式，不同 $k$ 给不同值即完成 |\n| ② 幂路径族 | $y=kx^{\\alpha}$ | 分子分母**次数错配**（如 $x^{4}$ 对 $y^{2}$）：比阶配平后取 $y=kx^{2}$ 型 |\n| ③ 贴分母零线 | $y=-x+x^{2}$ | 分母含 $x+y$ 等可在直线上为零的因子 |\n\n> **比阶配平原则**：看分母各项的\"阶结构\"。如 $x^{4}+y^{2}$：$x^{4}=(x^{2})^{2},\\ y^{2}=(y)^{2}$——分母是\"$x^{2}$ 与 $y$\"的平方和，故取 $y$ 与 $x^{2}$ 同阶（$y=kx^{2}$）才能让分母两项同时成 $x^{4}$ 阶，比值显形。直线路径下 $k^{2}x^{2}$ 主导、$x^{4}$ 被忽略，恒得 $0$，\"看不出问题\"。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 验证了所有直线极限相等就断定存在 | 直线只是路径的一小部分，需幂路径（例 1.2-2） |\n| 路径压在分母零线上（无定义点） | \"贴线不压线\"：取 $y=-x+x^{2}$ 而非 $y=-x$ |\n| 证存在用路径法 | 路径法**只能证伪**；证存在须回 1.1 三招 |","examplesMd":"**【例 1.2-1】（★★，经典）** 证明 $\\lim\\limits_{(x,y)\\to(0,0)}\\dfrac{x^{2}y}{x^{4}+y^{2}}$ 不存在。\n\n**思路分析**：分母次数错配（$x^{4}$ 对 $y^{2}$）——比阶：取 $y$ 与 $x^{2}$ 同阶。\n\n**详细解答**：沿 $y=0$：$\\dfrac{0}{x^{4}}=0$。沿 $y=x^{2}$：\n\n$\\dfrac{x^{2}\\cdot x^{2}}{x^{4}+x^{4}}=\\dfrac{x^{4}}{2x^{4}}=\\dfrac12\\neq0$\n\n两路径极限不等，极限**不存在**。∎\n\n**检验**：直线路径 $y=kx$：$\\dfrac{kx^{3}}{x^{4}+k^{2}x^{2}}=\\dfrac{kx}{x^{2}+k^{2}}\\to0$（$\\forall k$）——直线全为 $0$，印证\"次数错配时直线路径看不出问题\"。\n\n**方法总结**：分母 $x^{4}+y^{2}$ 型错配结构：**取 $y=kx^{2}$**，两分母项同阶，比值显形。\n\n**【例 1.2-2】（★★★，经典难题）** 证明 $\\lim\\limits_{(x,y)\\to(0,0)}\\dfrac{x^{3}y}{x^{6}+y^{2}}$ 不存在，并说明它同时是\"极坐标陷阱\"的活教材。\n\n**思路分析**：分母 $x^{6}=(x^{3})^{2}$ 对 $y^{2}$——取 $y$ 与 $x^{3}$ 同阶。\n\n**详细解答**：沿任意直线 $y=kx$：\n\n$\\dfrac{kx^{4}}{x^{6}+k^{2}x^{2}}=\\dfrac{kx^{2}}{x^{4}+k^{2}}\\longrightarrow0\\qquad(\\forall k)$\n\n**所有直线路径极限都是 $0$**。但沿 $y=x^{3}$：\n\n$\\dfrac{x^{6}}{x^{6}+x^{6}}=\\dfrac12\\neq0$\n\n两路径不等，极限**不存在**。∎\n\n**极坐标陷阱复盘**：极坐标下\n\n$\\dfrac{\\rho^{4}\\cos^{3}\\theta\\sin\\theta}{\\rho^{6}\\cos^{6}\\theta+\\rho^{2}\\sin^{2}\\theta}=\\dfrac{\\rho^{2}\\cos^{3}\\theta\\sin\\theta}{\\rho^{4}\\cos^{6}\\theta+\\sin^{2}\\theta}$\n\n固定 $\\theta$（$\\sin\\theta\\neq0$）令 $\\rho\\to0$ 得 $0$——但 $\\theta\\to0$（贴近 $x$ 轴）时分母中 $\\sin^{2}\\theta$ 失效，放不出与 $\\theta$ 无关的界。==只验证固定 $\\theta$ 等于只验证了射线，这不是\"沿所有路径\"。==\n\n**方法总结**：$x^{6}+y^{2}$ 结构取 $y=x^{3}$；一般地，分母 $x^{2\\alpha}+y^{2}$ 取 $y=kx^{\\alpha}$。本题与\"直线全同值\"的组合是 CMC 概念题最爱。"},"1.3":{"id":"1.3","name":"累次极限与重极限（四方向反例思想）","part":"多元极限与连续","book":"多元微分","teachMd":"**核心思想**：**二次（累次）极限**是\"固定一个变量、先对另一个取极限\"的分步操作；**二重极限**是 $(x,y)$ 同时趋近。两者**无必然蕴含关系**，四个方向都要有反例：\n\n| 方向 | 结论 | 标准反例 |\n| --- | --- | --- |\n| 两二次极限存在且相等 ⇒ 重极限存在 | ✘ | $\\dfrac{xy}{x^{2}+y^{2}}$：两个二次极限均为 $0$，重极限不存在（1.2 练 1） |\n| 重极限存在 ⇒ 二次极限存在 | ✘ | $x\\sin\\dfrac1y$（补定义 $f(x,0)=0$）：重极限为 $0$，但 $\\lim\\limits_{y\\to0}x\\sin\\dfrac1y$ 对 $x\\neq0$ 不存在 |\n| $\\lim_x\\lim_y$ 存在 ⇒ $\\lim_y\\lim_x$ 存在 | ✘ | 同上例：$\\lim_x\\lim_y$ 不存在而 $\\lim_y\\lim_x=0$（例 1.3-2） |\n\n**唯一正向桥梁（偶考定理）**：若重极限 $\\lim\\limits_{(x,y)\\to(x_0,y_0)}f=A$ 存在，且当 $x$ 在 $x_0$ 近旁时内层极限 $\\varphi(x)=\\lim\\limits_{y\\to y_0}f(x,y)$ 存在，则 $\\lim\\limits_{x\\to x_0}\\varphi(x)=A$。简记：==三者都存在时必相等==——这是\"交换求极限次序\"合法性的来源。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 两个二次极限相等就写\"重极限存在\" | 见反例一；重极限必须独立验证 |\n| 重极限存在就断言二次极限存在 | 内层极限须额外存在（反例二） |\n| 二次极限算出的值当重极限用 | 只有\"三者都存在\"时才相等 |","examplesMd":"**【例 1.3-1】（★★，经典）** 求 $f(x,y)=\\dfrac{x^{2}y^{2}}{x^{2}y^{2}+\\left(x-y\\right)^{2}}$ 在 $(0,0)$ 处的两个二次极限与二重极限。\n\n**思路分析**：二次极限逐个算；重极限用路径法（分母含 $\\left(x-y\\right)^{2}$——提示贴线 $y=x$）。\n\n**详细解答**：\n\n**二次极限**：固定 $x\\neq0$ 令 $y\\to0$：$\\dfrac{0}{0+x^{2}}=0$，故 $\\lim\\limits_{x\\to0}\\lim\\limits_{y\\to0}f=0$；对称地 $\\lim\\limits_{y\\to0}\\lim\\limits_{x\\to0}f=0$。两个二次极限**存在且相等**。\n\n**二重极限**：沿 $y=x$：$f=\\dfrac{x^{4}}{x^{4}+0}=1\\neq0$；沿 $y=0$：$f=0$。两路径不等，**不存在**。∎\n\n**检验**：沿 $y=2x$：$\\dfrac{4x^{4}}{4x^{4}+x^{2}}=\\dfrac{4x^{2}}{4x^{2}+1}\\to0$，与 $y=x$ 的值 $1$ 再次印证路径依赖。\n\n**方法总结**：分母出现 $\\left(x-y\\right)^{2}$、$\\left(x+y\\right)^{2}$ 型因式时，**先贴该直线取路径**——那里分母退化、比值跳变。\n\n**【例 1.3-2】（★★，概念辨析）** 设 $f(x,y)=x\\sin\\dfrac1y$（$y\\neq0$），补充定义 $f(x,0)=0$。求 $f$ 在 $(0,0)$ 处的二重极限与两个二次极限。\n\n**思路分析**：二重极限用夹逼（振荡因子 $\\sin\\dfrac1y$ 有界）；二次极限逐个检查内层存在性。\n\n**详细解答**：\n\n**二重极限**：$\\lvert f\\rvert\\le\\lvert x\\rvert\\to0$，故 $\\lim\\limits_{(x,y)\\to(0,0)}f=0$。\n\n**二次极限**：$\\lim\\limits_{x\\to0}\\lim\\limits_{y\\to0}f$：内层 $\\lim\\limits_{y\\to0}x\\sin\\dfrac1y$ 对 $x\\neq0$ **不存在**，故该二次极限不存在。$\\lim\\limits_{y\\to0}\\lim\\limits_{x\\to0}f$：内层 $\\lim\\limits_{x\\to0}x\\sin\\dfrac1y=0$（固定 $y\\neq0$），再令 $y\\to0$ 得 $0$，**存在且为 $0$**。\n\n**方法总结**：重极限存在、一个二次极限存在、另一个二次极限不存在——**可以同时发生**。\"先对 $x$ 求极限\"把振荡因子变成了常数，\"先对 $y$ 求极限\"则撞上振荡——次序即命运。"},"2.1":{"id":"2.1","name":"定义法求偏导（先代入再求导思想）","part":"偏导数与可微性","book":"多元微分","teachMd":"**起步动作（课内基本功，速过）**：$f_x=\\lim\\limits_{\\Delta x\\to0}\\dfrac{f\\left(x_0+\\Delta x,y_0\\right)-f\\left(x_0,y_0\\right)}{\\Delta x}$——把 $y$ 当常数用一元公式求导。\n\n**核心思想**：CMC 考的不是\"会不会求偏导\"，而是两个提速/保命动作：\n\n1. **求定点偏导 → 先代入再求导**：$f_y(x_0,y_0)$ 就是**一元函数** $g(y)=f(x_0,y)$ 在 $y_0$ 的导数——先代 $x=x_0$ 砍掉一个变量，计算量骤降，这是多元求导的第一反射；\n2. **分段点 / 补定义点 → 必回定义**：分段点没有统一解析式，**不能**先求偏导通式再代值，必须回到差商（或先代入化成分段一元函数再按一元定义求）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 分段点先求通式再代值 | 通式在分段点无定义，必须用差商定义 |\n| \"$f(0,0)=0$，故 $f_x(0,0)=0$\" | 函数值是数不是函数；对 $x$ 求导要看 $f(x,0)$ 这条**线** |\n| 先代入时代错变量 | $f_x$ 代 $y=y_0$（留 $x$），$f_y$ 代 $x=x_0$（留 $y$） |","examplesMd":"**【例 2.1-1】（★★，经典）** 设 $f(x,y)=\\dfrac{x^{2}}{1+x^{2}y}$，求 $f_x(1,1)$ 与 $f_y(1,1)$。\n\n**思路分析**：求定点偏导——先代入化一元。\n\n**详细解答**：\n\n**求 $f_x(1,1)$**：先代 $y=1$：$g(x)=f(x,1)=\\dfrac{x^{2}}{1+x^{2}}$，\n\n$g'(x)=\\dfrac{2x\\left(1+x^{2}\\right)-x^{2}\\cdot2x}{\\left(1+x^{2}\\right)^{2}}=\\dfrac{2x}{\\left(1+x^{2}\\right)^{2}}\\ \\Longrightarrow\\ f_x(1,1)=g'(1)=\\dfrac{2}{4}=\\dfrac12$\n\n**求 $f_y(1,1)$**：先代 $x=1$：$h(y)=f(1,y)=\\dfrac{1}{1+y}$，\n\n$h'(y)=-\\dfrac{1}{\\left(1+y\\right)^{2}}\\ \\Longrightarrow\\ f_y(1,1)=-\\dfrac14$\n\n**检验**：通式法核对 $f_x=\\dfrac{2x\\left(1+x^{2}y\\right)-x^{2}\\cdot x^{2}y}{\\left(1+x^{2}y\\right)^{2}}$，代 $(1,1)$ 得 $\\dfrac{2\\cdot2-1}{4}=\\dfrac12$ ✓。\n\n**方法总结**：==定点偏导，先代入再求导==；一元化后乘积/商法则只剩单变量，出错率大幅下降。\n\n**【例 2.1-2】（★★，概念经典）** 设 $f(x,y)=\\begin{cases}\\dfrac{x^{2}y}{x^{2}+y^{2}}, & (x,y)\\neq(0,0)\\\\[2pt] 0, & (x,y)=(0,0)\\end{cases}$，求 $f_x(0,0)$ 与 $f_y(0,0)$。\n\n**思路分析**：$(0,0)$ 是分段点——先代入得两条一元曲线，再按定义。\n\n**详细解答**：先代 $y=0$：$f(x,0)\\equiv0$（含 $x=0$ 处），故\n\n$f_x(0,0)=\\lim\\limits_{\\Delta x\\to0}\\dfrac{f\\left(\\Delta x,0\\right)-f\\left(0,0\\right)}{\\Delta x}=\\lim\\dfrac{0-0}{\\Delta x}=0$\n\n同理 $f(0,y)\\equiv0\\Rightarrow f_y(0,0)=0$。\n\n**检验**：两个偏导都存在且为 $0$——但 $f$ 沿 $y=kx$ 极限为 $\\dfrac{k}{1+k^{2}}$，在 $(0,0)$ **不连续**（反例矩阵 E1/E5 的结构，详见 2.3）：可偏导 ⇏ 连续。\n\n**方法总结**：分段点三步：**先代入（得 $f(x,0)$、$f(0,y)$）→ 看这两条线 → 回差商定义**。本题顺带演示了\"偏导存在但函数不连续\"，一题两用。"},"2.2":{"id":"2.2","name":"可微性判定两步法（线性主部思想）","part":"偏导数与可微性","book":"多元微分","teachMd":"**核心思想**：$f$ 在 $P_0$ 可微 $\\iff$ 增量可拆**线性主部 + 高阶无穷小**：\n\n$\\Delta z=A\\Delta x+B\\Delta y+o\\left(\\rho\\right),\\qquad\\rho=\\sqrt{\\left(\\Delta x\\right)^{2}+\\left(\\Delta y\\right)^{2}}$\n\n**两步法（标准流程，卷面就这么写）**：\n\n1. **查偏导存在性**：求 $f_x(P_0),\\ f_y(P_0)$。**有一个不存在即不可微**（可微 ⇒ 可偏导）；两个都存在才进入第 2 步；\n2. **验差商极限**：\n\n$\\lim\\limits_{\\left(\\Delta x,\\Delta y\\right)\\to\\left(0,0\\right)}\\dfrac{f\\left(x_0+\\Delta x,y_0+\\Delta y\\right)-f\\left(x_0,y_0\\right)-f_x\\left(P_0\\right)\\Delta x-f_y\\left(P_0\\right)\\Delta y}{\\sqrt{\\left(\\Delta x\\right)^{2}+\\left(\\Delta y\\right)^{2}}}$\n\n为 $0$ ⇒ 可微；不为 $0$ 或不存在 ⇒ 不可微——**证\"不为 $0$ 只需找一条特殊路径**\"（常取 $\\Delta y=\\Delta x$ 或 $\\Delta y=k\\Delta x$）。\n\n**判定链与弱化判据**：\n\n* 偏导连续 ⇒ 可微 ⇒ 连续 + 可偏导；可微时自动有 $dz=f_xdx+f_ydy$；\n* 弱化判据（决赛向）：$f_x,f_y$ 都在邻域内存在且**其中至少一个在该点连续** ⇒ 可微（证明见拔 2.3）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 验证\"两个偏导都存在\"就判可微 | 偏导存在只是必要条件，必须走第 2 步 |\n| 第 2 步分子漏减线性主部 $A\\Delta x+B\\Delta y$ | 分子是\"增量 − 线性主部\"，别只除 $\\rho$ |\n| 差商不为 $0$ 时试图全面讨论 | 找一条路径算出非零值即完成证伪 |","examplesMd":"**【例 2.2-1】（★★，经典）** 讨论 $f(x,y)=\\begin{cases}\\dfrac{x^{2}y}{x^{2}+y^{2}}, & (x,y)\\neq(0,0)\\\\ 0, & (x,y)=(0,0)\\end{cases}$ 在 $(0,0)$ 处的连续性、可偏导性与可微性。\n\n**思路分析**：三连问按\"连续 → 可偏导 → 可微\"顺序，可微走两步法。\n\n**详细解答**：\n\n**连续**：$\\Big\\lvert\\dfrac{x^{2}y}{x^{2}+y^{2}}\\Big\\rvert\\le\\dfrac{\\rho^{2}\\cdot\\rho}{\\rho^{2}}=\\rho\\to0=f(0,0)$，连续 ✔。\n\n**可偏导**：先代入（例 2.1-2）：$f_x(0,0)=f_y(0,0)=0$ ✔。\n\n**可微**：$A=B=0$，验差商。沿 $\\Delta y=\\Delta x\\to0^{+}$：\n\n$\\dfrac{\\left(\\Delta x\\right)^{2}\\Delta x}{\\left[\\left(\\Delta x\\right)^{2}+\\left(\\Delta x\\right)^{2}\\right]^{3/2}}=\\dfrac{\\left(\\Delta x\\right)^{3}}{\\left(2\\Delta x^{2}\\right)^{3/2}}=\\dfrac{1}{2\\sqrt2}\\neq0$\n\n差商沿此路径极限非零，**不可微** ✘。\n\n**检验**：极坐标复核连续性：$f=\\rho\\cos^{2}\\theta\\sin\\theta$，因子有界、整体 $\\sim\\rho\\to0$ ✓；差商极坐标形式为 $\\dfrac{\\left(\\Delta x\\right)^2\\Delta y}{\\rho^{3}}=\\cos^{2}\\theta\\sin\\theta$（$\\theta$ 固定于 $45^\\circ$ 时为 $\\dfrac{1}{2\\sqrt2}$），同样非零。\n\n**方法总结**：**连续 + 可偏导 ⇏ 可微**——本题即标准反例（反例矩阵 E2）。证不可微的固定动作：取 $\\Delta y=\\Delta x$ 路径算出差商非零。\n\n**【例 2.2-2】（★★，经典）** 讨论 $f(x,y)=\\begin{cases}\\left(x^{2}+y^{2}\\right)\\sin\\dfrac{1}{x^{2}+y^{2}}, & (x,y)\\neq(0,0)\\\\ 0, & (x,y)=(0,0)\\end{cases}$ 在 $(0,0)$ 处的连续性、可偏导性、可微性与偏导连续性。\n\n**思路分析**：结构与例 2.2-1 同型（分子 $\\rho^{2}$ 级），但振荡因子把差商压成 $o(1)$——\"多乘 $\\rho$\"改变可微性。\n\n**详细解答**：\n\n**连续**：无穷小 $\\rho^{2}$ × 有界 $\\sin\\dfrac1{\\rho^{2}}$ $\\to0=f(0,0)$ ✔。\n\n**可偏导**：先代 $y=0$，$g'(0)=\\lim\\limits_{\\Delta x\\to0}\\Delta x\\sin\\dfrac{1}{\\left(\\Delta x\\right)^{2}}=0$，对称地 $f_y(0,0)=0$ ✔。\n\n**可微**：差商（$A=B=0$）：\n\n$\\dfrac{\\rho^{2}\\sin\\dfrac1{\\rho^{2}}}{\\rho}=\\rho\\sin\\dfrac{1}{\\rho^{2}}\\longrightarrow0$\n\n**可微** ✔。\n\n**偏导连续性**：$\\left(x,y\\right)\\neq(0,0)$ 处 $f_x=2x\\sin\\dfrac{1}{\\rho^{2}}-\\dfrac{2x}{\\rho^{2}}\\cos\\dfrac{1}{\\rho^{2}}$，沿 $y=0$ 后者 $\\sim-\\dfrac2x\\cos\\dfrac1{x^{2}}$ 振荡无极限，$f_x$ 在 $(0,0)$ **不连续** ✘。\n\n**方法总结**：**可微 ⇏ 偏导连续**（反例矩阵 E3）；顺带可得\"偏导连续 ⇒ 可微\"不可逆。与例 2.2-1 对照记忆：分子同为\"$x^{2}$ 乘 $y$\"级，$\\rho^{2}$ × 振荡 ⇒ 可微，$\\rho^{3}$ ÷ $\\rho^{2}$ ⇒ 不可微——**差商的阶是判可微的命门**。"},"2.3":{"id":"2.3","name":"概念关系与反例矩阵（一图五例思想）","part":"偏导数与可微性","book":"多元微分","teachMd":"**核心思想**：一图定乾坤（每个箭头**不可逆**，\"连续\"与\"可偏导\"**互不蕴含**）：\n\n$\\text{偏导数连续}\\Longrightarrow\\text{可微}\\Longrightarrow\\begin{cases}\\text{连续}\\\\ \\text{可偏导}\\end{cases}\\qquad\\text{可微}\\Longrightarrow\\text{任意方向方向导数存在}$\n\n**必背反例矩阵 E0–E5**（均在原点讨论，$(x,y)\\neq(0,0)$ 处取所给式、原点补定义 $0$；E0 为正例参照）：\n\n| 编号 | 函数 | 连续 | 可偏导 | 偏导连续 | 可微 | 方向导数全存在 |\n| :-: | --- | :-: | :-: | :-: | :-: | :-: |\n| E0 | $x^{2}+y^{2}$ | ✔ | ✔ | ✔ | ✔ | ✔ |\n| E1 | $\\dfrac{xy}{x^{2}+y^{2}}$ | ✘ | ✔（均为 0） | ✘ | ✘ | ✘（仅坐标轴方向存在） |\n| E2 | $\\dfrac{x^{2}y}{x^{2}+y^{2}}$ | ✔ | ✔（均为 0） | ✘ | ✘ | ✔ |\n| E3 | $\\left(x^{2}+y^{2}\\right)\\sin\\dfrac{1}{x^{2}+y^{2}}$ | ✔ | ✔（均为 0） | ✘ | **✔** | ✔ |\n| E4 | $\\sqrt{x^{2}+y^{2}}$ | ✔ | ✘（$f(x,0)=\\lvert x\\rvert$） | ✘ | ✘ | ✔（均为 1） |\n| E5 | $\\dfrac{x^{2}y}{x^{4}+y^{2}}$ | ✘ | ✔（均为 0） | ✘ | ✘ | ✔ |\n\n**读表口诀**：E1 杀\"可偏导 ⇒ 连续\"；E2 杀\"连续 + 可偏导 ⇒ 可微\"；E3 杀\"可微 ⇒ 偏导连续\"；E4 杀\"连续 ⇒ 可偏导\"；E5 杀\"方向导数全存在 ⇒ 连续\"（详算见练 3.5-3）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 凭一元直觉答概念题 | 一元里\"可导 ⇒ 连续\"在多元失效，先想矩阵再作答 |\n| 反例只记住结论记不住函数 | E1–E5 函数都很短，默写矩阵是性价比最高的记忆 |\n| 认为\"方向导数存在 ⇒ 可微或连续\" | 方向导数是逐方向的一维信息，比偏导强不了多少（E5、E4） |","examplesMd":"**【例 2.3-1】（★★，概念辨析）** 判断下列命题真假，真者给依据，假者从 E0–E5 中举反例：\n\n(1) 若 $f$ 在 $P_0$ 可偏导，则 $f$ 在 $P_0$ 连续；(2) 若 $f$ 在 $P_0$ 连续，则 $f$ 在 $P_0$ 可偏导；(3) 若 $f$ 的两偏导在 $P_0$ 都存在，则 $f$ 在 $P_0$ 可微；(4) 若 $f$ 在 $P_0$ 可微，则 $f_x,f_y$ 在 $P_0$ 连续；(5) 若 $f$ 在 $P_0$ 沿任意方向的方向导数都存在，则 $f$ 在 $P_0$ 连续。\n\n**思路分析**：逐条对照关系图，\"假\"的直接从矩阵取例。\n\n**详细解答**：\n\n(1) **假**。E1：$f(x,0)\\equiv0,\\ f(0,y)\\equiv0$，两偏导存在且为 $0$；但沿 $y=kx$ 极限 $\\dfrac{k}{1+k^{2}}$ 随 $k$ 变化，不连续。\n\n(2) **假**。E4：$f=\\sqrt{x^{2}+y^{2}}$ 处处连续，但 $f(x,0)=\\lvert x\\rvert$ 在 $x=0$ 不可导，$f_x(0,0)$ 不存在。\n\n(3) **假**。E2：连续且两偏导存在，但差商沿 $\\Delta y=\\Delta x$ 为 $\\dfrac{1}{2\\sqrt2}\\neq0$，不可微（例 2.2-1 全算）。\n\n(4) **假**。E3：可微（例 2.2-2 全算），但 $f_x=2x\\sin\\dfrac{1}{\\rho^{2}}-\\dfrac{2x}{\\rho^{2}}\\cos\\dfrac{1}{\\rho^{2}}$ 在原点无极限。\n\n(5) **假**。E5：沿 $\\vec e=(\\cos\\theta,\\sin\\theta)$，$\\dfrac{f(t\\vec e)-0}{t}\\to\\begin{cases}\\dfrac{\\cos^{2}\\theta}{\\sin\\theta}, & \\sin\\theta\\neq0\\\\ 0, & \\sin\\theta=0\\end{cases}$ 每个方向都存在；但沿 $y=kx^{2}$ 极限 $\\dfrac{k}{1+k^{2}}$ 随 $k$ 变化，不连续（详算见练 3.5-3）。\n\n**方法总结**：五个\"假\"恰好用 E1、E4、E2、E3、E5 各一次——**矩阵背熟，概念题不用现场构造**。\n\n**【例 2.3-2】（★★★，概念经典）** 讨论 $f(x,y)=\\dfrac{xy}{\\sqrt{x^{2}+y^{2}}}$（补 $f(0,0)=0$）在原点的连续性、可偏导性、沿任意方向的方向导数存在性与可微性。\n\n**思路分析**：一题集齐\"连续 + 可偏导 + 方向导数全存在，却不可微\"——按 2.2/3.5 的流程逐项检查。\n\n**详细解答**：\n\n**连续**：$\\lvert f\\rvert\\le\\dfrac{\\rho^{2}/2}{\\rho}=\\dfrac{\\rho}{2}\\to0=f(0,0)$ ✔。\n\n**可偏导**：$f(x,0)\\equiv0,\\ f(0,y)\\equiv0\\Rightarrow f_x(0,0)=f_y(0,0)=0$ ✔。\n\n**方向导数**：沿 $\\vec e=(\\cos\\theta,\\sin\\theta)$，$f(t\\vec e)=\\dfrac{t^{2}\\cos\\theta\\sin\\theta}{\\lvert t\\rvert}=\\lvert t\\rvert\\cos\\theta\\sin\\theta$，\n\n$\\dfrac{f(t\\vec e)-0}{t}\\xrightarrow[t\\to0^{+}]{}\\cos\\theta\\sin\\theta$\n\n**所有方向都存在** ✔（注意 $t\\to0^+$ 单侧）。\n\n**可微**：若可微，由 $f_x=f_y=0$ 应有 $f=o\\left(\\rho\\right)$；但沿 $\\theta=\\dfrac\\pi4$，$\\dfrac{f}{\\rho}=\\dfrac{\\lvert t\\rvert\\cdot\\frac12}{\\lvert t\\rvert}=\\dfrac12\\neq0$，**不可微** ✘。\n\n**方法总结**：==方向导数\"逐方向\"地看差商，可微\"整体\"地要求线性逼近==——每个方向各自存在极限（值还随 $\\theta$ 变）推不出整体的 $o(\\rho)$。此函数可作 E 矩阵的第六例（E6）。"},"2.4":{"id":"2.4","name":"高阶与混合偏导（次序可交换的条件思想）","part":"偏导数与可微性","book":"多元微分","teachMd":"**核心思想**：混合偏导 $f_{xy}$ 与 $f_{yx}$ **不是天然相等**——相等需要连续性：\n\n* **Clairut–Schwarz 定理**：$f_{xy},\\ f_{yx}$ 在区域（或某点邻域）内**连续** ⇒ 相等；\n* **弱化形式**：$f_{xy}$ 在 $P_0$ 的邻域存在且在 $P_0$ 连续，$f_{yx}$ 在 $P_0$ 存在 ⇒ 在 $P_0$ 相等（见拔 2.4）；\n* **反例**（必背）：$f=\\dfrac{xy\\left(x^{2}-y^{2}\\right)}{x^{2}+y^{2}}$（补 $f(0,0)=0$）：$f_{xy}(0,0)=-1\\neq1=f_{yx}(0,0)$。\n\n**起步动作（课内，速过）**：初等函数各阶偏导仍初等、在其定义区域内连续，故对具体函数求混合偏导**默认可交换**；竞赛考的是**抽象函数**与**分段函数**——分界点必须回到定义。\n\n**次序选择技巧**：求高阶混合偏导时，先代入已知点化简、或先对\"产生简单因子\"的变量求导，可大幅降算量；对称结构（$x\\leftrightarrow y$ 对称）只需算一半。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 无条件交换求导次序 | 交换只在偏导连续（或弱化条件）下合法 |\n| 分界点求 $f_{xy}$ 用通式 | 通式在分界点失效，先求 $f_x\\left(0,y\\right)$ 这类**线**再差商 |\n| 以为\"$f_{xy}$ 存在则 $f_x$ 连续\" | 多元中偏导存在推不出连续（一元独有红利失效，见 2.3） |","examplesMd":"**【例 2.4-1】（★★★，经典名题）** 设 $f(x,y)=\\begin{cases}\\dfrac{xy\\left(x^{2}-y^{2}\\right)}{x^{2}+y^{2}}, & (x,y)\\neq(0,0)\\\\ 0, & (x,y)=(0,0)\\end{cases}$，求 $f_{xy}(0,0)$ 与 $f_{yx}(0,0)$。\n\n**思路分析**：分界点——先求 $f_x$ 在**竖轴**上的值 $f_x(0,y)$ 与 $f_y$ 在**横轴**上的值 $f_y(x,0)$，再各回差商定义。\n\n**详细解答**：\n\n**第一步（$f_x(0,y)$，$y\\neq0$）**：按定义（固定 $y\\neq0$）：\n\n$f_x(0,y)=\\lim_{h\\to0}\\dfrac{f(h,y)-f(0,y)}{h}=\\lim_{h\\to0}\\dfrac{hy\\left(h^{2}-y^{2}\\right)}{\\left(h^{2}+y^{2}\\right)h}=\\dfrac{y\\left(-y^{2}\\right)}{y^{2}}=-y$\n\n又 $f_x(0,0)=0$（因 $f(h,0)\\equiv0$）。故\n\n$f_{xy}(0,0)=\\lim_{k\\to0}\\dfrac{f_x(0,k)-f_x(0,0)}{k}=\\lim\\dfrac{-k-0}{k}=-1$\n\n**第二步（$f_y(x,0)$，$x\\neq0$）**：对称地\n\n$f_y(x,0)=\\lim_{k\\to0}\\dfrac{f(x,k)-f(x,0)}{k}=\\dfrac{x\\cdot x^{2}}{x^{2}}=x$\n\n又 $f_y(0,0)=0$，故\n\n$f_{yx}(0,0)=\\lim_{h\\to0}\\dfrac{f_y(h,0)-f_y(0,0)}{h}=+1$\n\n**结论**：$f_{xy}(0,0)=-1\\neq1=f_{yx}(0,0)$，**混合偏导在原点不相等**。∎\n\n**检验**：$f_x$ 通式（$(x,y)\\neq(0,0)$）为 $f_x=\\dfrac{y\\left(x^{4}+4x^{2}y^{2}-y^{4}\\right)}{\\left(x^{2}+y^{2}\\right)^{2}}$，代 $x=0$ 得 $-y$ ✓（见练 2.4-2 完整计算）。\n\n**方法总结**：分界点混合偏导四步：**求 $f_x(0,y)$（竖线）→ 求 $f_{xy}(0,0)$（对 $y$ 差商）→ 求 $f_y(x,0)$（横线）→ 求 $f_{yx}(0,0)$（对 $x$ 差商）**。$f_{xy}$ 与 $f_{yx}$ 差一个符号的原因：分子 $x^{2}-y^{2}$ 关于交换 $x\\leftrightarrow y$ 反对称。\n\n**【例 2.4-2】（★★，经典）** 验证 $z=\\ln\\sqrt{x^{2}+y^{2}}$ 满足拉普拉斯方程 $z_{xx}+z_{yy}=0$（$z$ 称为调和函数，去掉原点）。\n\n**思路分析**：具体函数逐个求二阶偏导，看相加是否为零——同时演示\"次序无关、先算 $z_x$ 再对称得 $z_y$\"。\n\n**详细解答**：\n\n$z_x=\\dfrac{x}{x^{2}+y^{2}},\\qquad z_{xx}=\\dfrac{\\left(x^{2}+y^{2}\\right)-x\\cdot2x}{\\left(x^{2}+y^{2}\\right)^{2}}=\\dfrac{y^{2}-x^{2}}{\\left(x^{2}+y^{2}\\right)^{2}}$\n\n由对称性（$x\\leftrightarrow y$ 互换）：\n\n$z_{yy}=\\dfrac{x^{2}-y^{2}}{\\left(x^{2}+y^{2}\\right)^{2}}\\ \\Longrightarrow\\ z_{xx}+z_{yy}=0\\ ✔$\n\n**检验**：数值抽验 $(x,y)=(1,2)$：$z_{xx}=\\dfrac{4-1}{25}=\\dfrac3{25}$，$z_{yy}=-\\dfrac3{25}$，和为 $0$ ✓。\n\n**方法总结**：==对称结构只算一半，交换变量得另一半==。$\\ln r$ 的调和性在 3.6 会以\"拉普拉斯算子的旋转不变性\"再现，两处呼应。"},"3.1":{"id":"3.1","name":"链式法则与抽象复合记号（变量树思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：复合求导看**变量树**——从 $z$ 到最终变量有几条路径，每条路径上导数**相乘**，所有路径**相加**。两种基本情形：\n\n* **全导数**（终点一个自变量）：$z=f(u,v),\\ u=u(t),\\ v=v(t)$：$\\dfrac{dz}{dt}=f_u\\,u'(t)+f_v\\,v'(t)$；\n* **偏导**（终点两个自变量）：$z=f(u,v),\\ u=u(x,y),\\ v=v(x,y)$：$\\dfrac{\\partial z}{\\partial x}=f_u\\,u_x+f_v\\,v_x$（$y$ 同理）。\n\n```\n        z = f(u, v)                z = f(u, v)\n        /          \\               /          \\\n       u            v             u            v\n       |            |            / \\          / \\\n       t            t           x   y        x   y\n    贡献 f_u·u'  贡献 f_v·v'   贡献 f_u·u_x   贡献 f_v·v_x\n                  （两路径相加）\n```\n\n**必背记号规范（卷面得分点）**：\n\n| 记号 | 含义 | 高频坑 |\n| --- | --- | --- |\n| $f_1',\\ f_2'$（或 $f_u,f_v$） | 对**第一个/第二个中间变量**求偏导 | 后面隐含\"括号\"——中间变量的当前表达式 |\n| $\\dfrac{dG}{dx}$ 与 $\\dfrac{\\partial F}{\\partial x}$ 之分 | $G(x)=F\\left(x,y(x)\\right)$ 中，前者是**复合后**一元函数求导，后者是**未复合**二元函数对第一变量求偏导 | $\\dfrac{dG}{dx}=\\dfrac{\\partial F}{\\partial x}+\\dfrac{\\partial F}{\\partial y}y'(x)$，两项都不能丢 |\n\n**提速动作——先代点**：题目给 $f_i'$ 在某点的值时，先算出该点中间变量的值，把链式法则**数值化**后再求偏导，可绕开全部抽象运算（例 3.1-2）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 漏路径（树上有几条路就加几项） | 先画树再动笔 |\n| $f_1'$ 当常数 | 它仍是中间变量的函数（括号意识，二阶求导的命门，见 3.2） |\n| 混用 $d$ 与 $\\partial$ | 终点是一个变量用 $d$，两个以上用 $\\partial$ |","examplesMd":"**【例 3.1-1】（★★，经典）** 设 $z=f\\left(x+y,\\ xy\\right)$，$f$ 有一阶连续偏导，求 $\\dfrac{\\partial z}{\\partial x},\\ \\dfrac{\\partial z}{\\partial y}$ 与 $dz$。\n\n**思路分析**：两中间变量 $u=x+y,\\ v=xy$，两最终变量——每个偏导两条路径。\n\n**详细解答**：\n\n$\\dfrac{\\partial z}{\\partial x}=f_1'\\cdot1+f_2'\\cdot y,\\qquad \\dfrac{\\partial z}{\\partial y}=f_1'\\cdot1+f_2'\\cdot x$\n\n$dz=\\left(f_1'+y f_2'\\right)dx+\\left(f_1'+x f_2'\\right)dy$\n\n**检验**（具体化）：取 $f(u,v)=uv$，则 $z=\\left(x+y\\right)xy=x^{2}y+xy^{2}$，直接求导 $z_x=2xy+y^{2}$；公式法 $f_1'=v=xy,\\ f_2'=u=x+y$，$z_x=xy+y\\left(x+y\\right)=2xy+y^{2}$ ✓。\n\n**方法总结**：==画树、乘路径、加分支==；检验用\"具体化 $f$\"——取一个满足条件的具体函数代回比对，是抽象题的免费验算。\n\n**【例 3.1-2】（★★，真题风格）** 设 $z=f\\left(xy,\\ \\dfrac{y}{x}\\right)$，$f$ 有一阶连续偏导，$f_1'(1,1)=2,\\ f_2'(1,1)=1$。求 $\\left.\\dfrac{\\partial z}{\\partial x}\\right|_{(1,1)}$ 与 $\\left.\\dfrac{\\partial z}{\\partial y}\\right|_{(1,1)}$。\n\n**思路分析**：先代点：$(x,y)=(1,1)$ 处中间变量 $\\left(u,v\\right)=\\left(1,\\ 1\\right)$——恰好是已知条件的点，链式法则直接数值化。\n\n**详细解答**：\n\n$\\dfrac{\\partial z}{\\partial x}=y\\,f_1'\\left(xy,\\dfrac yx\\right)-\\dfrac{y}{x^{2}}\\,f_2'\\left(xy,\\dfrac yx\\right),\\qquad \\dfrac{\\partial z}{\\partial y}=x\\,f_1'\\left(xy,\\dfrac yx\\right)+\\dfrac1x\\,f_2'\\left(xy,\\dfrac yx\\right)$\n\n在 $(1,1)$：$\\left(u,v\\right)=(1,1)$，故\n\n$\\left.\\dfrac{\\partial z}{\\partial x}\\right|_{(1,1)}=1\\cdot2-1\\cdot1=1,\\qquad \\left.\\dfrac{\\partial z}{\\partial y}\\right|_{(1,1)}=1\\cdot2+1\\cdot1=3$\n\n**检验**（具体化）：取 $f(u,v)=2u+v$（满足 $f_1'\\equiv2,\\ f_2'\\equiv1$），$z=2xy+\\dfrac yx$：$z_x=2y-\\dfrac{y}{x^{2}}\\big|_{(1,1)}=1$，$z_y=2x+\\dfrac1x\\big|_{(1,1)}=3$ ✓。\n\n**方法总结**：==给定 $f_i'$ 点值求偏导：先核对\"该点中间变量的值\"再代数==。本题把中间变量设计成在 $(1,1)$ 恰为 $(1,1)$；若不是，须先用原方程解出中间变量值（见 3.3 真题型）。"},"3.2":{"id":"3.2","name":"抽象复合二阶偏导（括号意识思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：一阶结果 $z_x=f_1'\\cdot(\\cdots)+f_2'\\cdot(\\cdots)$ 中，**每个因子都是 $x,y$ 的函数**——再求导时逐项用乘积法则，且 $f_1',f_2'$ 求导要**再走一次链式法则**（这就是\"括号意识\"：$f_1'=f_1'\\left(u(x,y),v(x,y)\\right)$，心中永远带着括号）。\n\n**标准展开**（$z=f(u,v)$，$u=u(x,y),\\ v=v(x,y)$）：\n\n$\\left(f_1'\\right)_x=f_{11}''\\,u_x+f_{12}''\\,v_x,\\qquad \\left(f_2'\\right)_x=f_{21}''\\,u_x+f_{22}''\\,v_x$\n\n（$f$ 二阶偏导连续时 $f_{12}''=f_{21}''$，交叉项合并——2.4 的 Clairut 定理在此处默认使用。）\n\n**勘误式复盘（重要）**——头号失分点：**漏乘外层因子的导数**：\n\n> 错误：对 $z=f\\left(x+y,\\ xy\\right)$ 的 $z_x=f_1'+y f_2'$ 再求 $z_{xy}$ 时，写成 $z_{xy}=f_{11}''+x f_{12}''+y f_{21}''+xy f_{22}''$。\n> 错因：$y f_2'$ 是**乘积**，对 $y$ 求导漏了外层因子 $y$ 的导数（应加 $f_2'\\cdot1$ 一项）。\n> 纠正：$z_{xy}=\\left[f_{11}''+x f_{12}''\\right]+f_2'\\cdot1+y\\left[f_{21}''+x f_{22}''\\right]$，即 $f_{11}''+\\left(x+y\\right)f_{12}''+xy f_{22}''+f_2'$（例 3.2-1 完整计算）。\n\n**结构记忆**：二阶展开 = \"交叉块\"（$f_{ij}''$ 配 $u_\\mu v_\\nu$ 系数）+ \"**孤立项**\"（外层系数求导产生的一阶 $f_i'$ 项）。孤立项漏写是此类题第一大扣分点。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 漏乘外层因子导数（漏孤立项） | 每项按乘积法则彻底展开，最后**清点一阶项个数** |\n| 把 $f_{12}''$ 当常数 | 它仍带括号、仍是 $x,y$ 的函数（三阶题的连环坑） |\n| $v_y$ 型系数忘了平方 | $f_{22}''$ 的系数是 $\\left(v_x\\right)^{2}$ 型**平方项** |","examplesMd":"**【例 3.2-1】（★★，经典）** 设 $z=f\\left(x+y,\\ xy\\right)$，$f$ 有二阶连续偏导，求 $\\dfrac{\\partial^{2}z}{\\partial x^{2}}$ 与 $\\dfrac{\\partial^{2}z}{\\partial x\\partial y}$。\n\n**思路分析**：一阶 $z_x=f_1'+y f_2'$；再求导时 $f_1',f_2'$ 各自带括号（括号内 $u=x+y,\\ v=xy$），外层 $y$ 还要乘积法则。\n\n**详细解答**：\n\n$z_x=f_1'\\cdot1+f_2'\\cdot y$\n\n$z_{xx}=\\left[f_{11}''\\cdot1+f_{12}''\\cdot y\\right]+\\left[f_{21}''\\cdot y+f_{22}''\\cdot y^{2}\\right]=f_{11}''+2y\\,f_{12}''+y^{2}f_{22}''$\n\n$z_{xy}=\\left[f_{11}''\\cdot1+f_{12}''\\cdot x\\right]+f_2'\\cdot1+y\\left[f_{21}''\\cdot x+f_{22}''\\cdot x\\right]=f_{11}''+\\left(x+y\\right)f_{12}''+xy\\,f_{22}''+f_2'$\n\n**检验**（具体化）：取 $f(u,v)=u v$：$z=\\left(x+y\\right)xy$，$z_{xx}=2y$；公式：$f_{11}''=f_{22}''=f_{12}''=0$（$f$ 线性），$2y f_{12}''$ 项……注意 $f_{12}''=1$！$f_1'=v,\\ f_2'=u\\Rightarrow f_{12}''=\\dfrac{\\partial f_1'}{\\partial v}=1,\\ f_{21}''=1,\\ f_{11}''=f_{22}''=0$。$z_{xx}=2y\\cdot1=2y$ ✓；$z_{xy}=\\left(x+y\\right)\\cdot1+f_2'=\\left(x+y\\right)+\\left(x+y\\right)=2x+2y$，直接算 $z=x^{2}y+xy^{2}$ 的 $z_{xy}=2x+2y$ ✓。\n\n**方法总结**：==二阶偏导三步：一阶分层写 → 逐项乘积法则 → 合并交叉项（$f_{12}''=f_{21}''$）==；孤立项（本题 $f_2'$）单独清点。\n\n**【例 3.2-2】（★★，经典）** 设 $z=f\\left(xy,\\ \\dfrac xy\\right)$，$f$ 有二阶连续偏导，求 $\\dfrac{\\partial^{2}z}{\\partial x^{2}}$ 与 $\\dfrac{\\partial^{2}z}{\\partial y^{2}}$。\n\n**思路分析**：$u=xy,\\ v=\\dfrac xy$：$z_x=y f_1'+\\dfrac1y f_2'$，$z_y=x f_1'-\\dfrac x{y^{2}}f_2'$。三个高危点：$f_{22}''$ 的系数来自 $\\left(v_y\\right)^{2}=\\dfrac{x^{2}}{y^{4}}$（**平方**）；外层系数 $-\\dfrac x{y^{2}}$ 对 $y$ 求导产生**孤立项** $\\dfrac{2x}{y^{3}}f_2'$。\n\n**详细解答**：\n\n$z_{xx}=y\\left[f_{11}''\\cdot y+f_{12}''\\cdot\\dfrac1y\\right]+\\dfrac1y\\left[f_{21}''\\cdot y+f_{22}''\\cdot\\dfrac1y\\right]=y^{2}f_{11}''+2f_{12}''+\\dfrac{1}{y^{2}}f_{22}''$\n\n$z_{yy}=x\\left[f_{11}''\\cdot x+f_{12}''\\cdot\\left(-\\dfrac x{y^{2}}\\right)\\right]+\\dfrac{2x}{y^{3}}f_2'-\\dfrac x{y^{2}}\\left[f_{21}''\\cdot x+f_{22}''\\cdot\\left(-\\dfrac x{y^{2}}\\right)\\right]$\n\n$=x^{2}f_{11}''-\\dfrac{2x^{2}}{y^{2}}f_{12}''+\\dfrac{x^{2}}{y^{4}}f_{22}''+\\dfrac{2x}{y^{3}}f_2'$\n\n**检验**（具体化，注意 $f_{ij}''$ 不能当零）：取 $f(u,v)=\\ln v$，则 $z=\\ln\\dfrac xy=\\ln x-\\ln y$，直接算：$z_{xx}=0$，$z_{yy}=\\dfrac1{y^{2}}$。公式核对：$f_1'\\equiv0,\\ f_2'=\\dfrac1v=\\dfrac yx,\\ f_{22}''=-\\dfrac1{v^{2}}=-\\dfrac{y^{2}}{x^{2}}$（**非零**！），$f_{11}''=f_{12}''=0$：\n\n$z_{xx}=0+0+\\dfrac{1}{y^{2}}\\left(-\\dfrac{y^{2}}{x^{2}}\\right)=-\\dfrac{1}{x^{2}}$？——与直接算的 $0$ 不符，**检验抓错**：重查 $z_{xx}$ 中 $f_{22}''$ 的系数——它应是 $\\left(v_x\\right)^{2}=\\left(\\dfrac1y\\right)^{2}=\\dfrac1{y^{2}}$，代 $f_{22}''=-\\dfrac{y^{2}}{x^{2}}$ 得 $-\\dfrac{1}{x^{2}}$；但直接算 $z_{xx}=\\dfrac{\\partial}{\\partial x}\\dfrac{y}{x}\\cdot$？——$z_x=f_2'\\cdot\\dfrac1y=\\dfrac yx\\cdot\\dfrac1y=\\dfrac1x$，$z_{xx}=-\\dfrac1{x^{2}}$ ✓！直接算 $z_{xx}$ 应对 $z_x=\\dfrac1x$ 求导（而非对 $z=\\ln x-\\ln y$ 记\"二阶导为零\"的口算错觉——$z_{xx}=\\dfrac{\\partial^2}{\\partial x^2}\\left(\\ln x-\\ln y\\right)=-\\dfrac1{x^2}$，确实非零）。两法一致 ✓。$z_{yy}$ 公式：$\\dfrac{x^{2}}{y^{4}}\\cdot\\left(-\\dfrac{y^{2}}{x^{2}}\\right)+\\dfrac{2x}{y^{3}}\\cdot\\dfrac yx=-\\dfrac1{y^{2}}+\\dfrac2{y^{2}}=\\dfrac1{y^{2}}$，与直接算一致 ✓。\n\n**方法总结**：==系数要平方（$v_y^{2}$ 进 $f_{22}''$），孤立项要清点（$\\dfrac{2x}{y^{3}}f_2'$），检验具体化时 $f_{ij}''$ 别当零==——本例检验恰好演示：$f=\\ln v$ 的 $f_{22}''=-\\dfrac1{v^{2}}$ 承担了全部二阶贡献，把它当零会\"两法不符\"，当场暴露。"},"3.3":{"id":"3.3","name":"隐函数求导（一个方程与方程组思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：隐函数求导的三法与选用：\n\n| 方法 | 操作 | 变量身份 | 适用 |\n| --- | --- | --- | --- |\n| ① 两边求导 | 把 $y=y(x)$ 代入恒等式，两边对 $x$ 求导 | $y$ 是 $x$ 的**函数** | 方程组、求函数关系 |\n| ② 公式法 | $y'=-\\dfrac{F_x'}{F_y'}$；$F(x,y,z)=0$：$z_x=-\\dfrac{F_x'}{F_z'},\\ z_y=-\\dfrac{F_y'}{F_z'}$ | $x,y,z$ 是**独立变量**（求的是偏导） | 求单点值最快 |\n| ③ 微分法 | 两边取全微分，解出 $dz$ | 无所谓（形式不变） | 求 $dz$ / 全部偏导一次到位 |\n\n**存在定理（条件必须背准）**：$F$ 在 $P_0$ 邻域有**连续偏导**，$F\\left(P_0\\right)=0$ 且 $F_z'\\left(P_0\\right)\\neq0$ ⟹ 局部唯一确定连续可导的 $z=z(x,y)$，且公式成立。几何直觉：单位圆 $x^{2}+y^{2}=1$ 在 $\\left(\\pm1,0\\right)$（$F_y'=2y=0$ 处）不能定 $y(x)$。\n\n**方程组**：$\\begin{cases}F(x,y,z)=0\\\\ G(x,y,z)=0\\end{cases}$（定 $y(x),z(x)$）：两边对 $x$ 求导得线性方程组，克莱姆法则求解，分母为**雅可比行列式** $J=\\dfrac{\\partial(F,G)}{\\partial(y,z)}$，$J\\neq0$ 是隐函数组存在的核心条件。\n\n**CMC 提速动作**：\n* **先代点**：求隐函数在某点的导数，先把点代入原方程定出 $z$ 值，再数值化求导（例 3.3-2）；\n* <span style=\"color:#e53935\">**$f\\left(2x,0\\right)$ 是 $x$ 的函数，不是常数**——\"先代点\"给的是一条线，不是孤立的值</span>（例 3.3-2 最大陷阱）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 公式法求 $F_x'$ 时把 $z$ 当 $x,y$ 的函数 | 公式法中三者**独立**；\"把 $z$ 当函数\"的是两边求导法 |\n| 同一道题混用两套变量身份 | 先声明用哪一法，全程统一 |\n| 方程组忘记验 $J\\neq0$ | 克莱姆分母即 $J$，顺手验证 |","examplesMd":"**【例 3.3-1】（★★，经典）** 设 $xy=e^{x+y}$ 确定 $y=y(x)$，求 $\\dfrac{dy}{dx}$。\n\n**思路分析**：公式法（求函数关系式最稳），收尾**用原方程消去 $e^{x+y}$** 化简。\n\n**详细解答**：令 $F=xy-e^{x+y}$，则 $F_x=y-e^{x+y},\\ F_y=x-e^{x+y}$：\n\n$\\dfrac{dy}{dx}=-\\dfrac{F_x}{F_y}=\\dfrac{e^{x+y}-y}{x-e^{x+y}}$\n\n在曲线上 $e^{x+y}=xy$，代入化简：\n\n$\\dfrac{dy}{dx}=\\dfrac{xy-y}{x-xy}=\\dfrac{y\\left(x-1\\right)}{x\\left(1-y\\right)}$\n\n**检验**：微分法核对：$y\\,dx+x\\,dy=e^{x+y}\\left(dx+dy\\right)=xy\\left(dx+dy\\right)$，移项 $\\left(x-xy\\right)dy=\\left(xy-y\\right)dx$，$y'=\\dfrac{y\\left(x-1\\right)}{x\\left(1-y\\right)}$ ✓。\n\n**方法总结**：==公式法算出后，用原方程消指数/根号再化简==——隐函数答案里出现 $e^{x+y}$、$\\sqrt{\\cdot}$ 时几乎都能消。\n\n**【例 3.3-2】（★★，真题风格）** 设 $f(u,v)$ 有一阶连续偏导，$f(2,0)=3,\\ f_u'(2,0)=5$。$z=z(x,y)$ 是由方程\n\n$xz=f\\left(2x-y,\\ xyz\\right)$\n\n所确定的隐函数，求 $\\left.\\dfrac{\\partial z}{\\partial x}\\right|_{(1,0)}$。\n\n**思路分析**：先代点定 $z$：$(x,y)=(1,0)$ 处方程为 $z=f\\left(2,0\\right)=3$。再沿 $y=0$ 这条线思考：此时 $xyz\\equiv0$，第二中间变量被\"冻结\"。\n\n**详细解答**：两边对 $x$ 求偏导（$z$ 是 $x,y$ 的函数）：\n\n$z+x z_x=2 f_u'\\left(2x-y,\\ xyz\\right)+f_v'\\left(2x-y,\\ xyz\\right)\\cdot\\left(yz+xy\\,z_x\\right)$\n\n在 $(x,y)=(1,0)$、$z=3$：右端第二项系数 $yz+xy z_x=0$（$y=0$），**无需知道 $f_v'$**；$f_u'(2,0)=5$：\n\n$3+z_x=2\\times5+0\\ \\Longrightarrow\\ \\left.z_x\\right|_{(1,0)}=7$\n\n**检验**（具体化两组）：(a) $f=5u-7+v^{2}$：方程 $xz=5\\left(2x-y\\right)-7+x^{2}y^{2}z^{2}$，$y=0$：$xz=10x-7\\Rightarrow z=\\dfrac{10x-7}{x}$，$z_x=\\dfrac{7}{x^{2}}$，在 $x=1$：$7$ ✓（$z(1)=3$ ✓）。(b) $f=5u-7+v$：$y=0$ 同样 $xz=10x-7$，$z_x(1)=7$ ✓。两函数 $f_v$ 不同而答案同——印证 $f_v'$ 不影响结果。\n\n**方法总结**：本题最大陷阱：**$f(2x,0)$ 是 $x$ 的函数**——\"先代点\"得到的是 $z(x,0)=\\dfrac{f(2x,0)}{x}$ 这条线，$f(2,0)=3$ 只是线上一点。一般动作：先代点定 $z$ 值 → 代入偏导方程 → 观察哪些项被点值\"冻死\"（系数为零）→ 解出。"},"3.4":{"id":"3.4","name":"全微分与一阶形式不变性（微分运算统一思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：**一阶微分形式不变性**——无论 $u,v$ 是自变量还是中间变量，一阶微分形式相同：\n\n$dz=\\dfrac{\\partial z}{\\partial u}du+\\dfrac{\\partial z}{\\partial v}dv$\n\n操作口诀：==对谁求偏导，后面就乘谁的微分==，逐层展开，不必预先区分变量层次（**仅一阶成立**，高阶失效）。这使\"微分法\"成为求偏导的统一底座：两边取全微分，把 $dz$ 当未知数解出，则 $dx,\\ dy$ 的系数一次性给出 $z_x,\\ z_y$。\n\n**必背凑微分表**（\"已知 $du=P\\,dx+Q\\,dy$ 求原函数 $u$\"与隐函数微分的原料）：\n\n| 结构 | 凑成 |\n| --- | --- |\n| $x\\,dx+y\\,dy$ | $\\dfrac12 d\\left(x^{2}+y^{2}\\right)$ |\n| $y\\,dx+x\\,dy$ | $d\\left(xy\\right)$ |\n| $y\\,dx-x\\,dy$ | $y^{2}\\,d\\!\\left(\\dfrac xy\\right)$ |\n| $\\dfrac{x\\,dy-y\\,dx}{x^{2}+y^{2}}$ | $d\\!\\left(\\arctan\\dfrac yx\\right)$ |\n| $\\dfrac{x\\,dx+y\\,dy}{x^{2}+y^{2}}$ | $\\dfrac12 d\\ln\\left(x^{2}+y^{2}\\right)$ |\n\n**适用信号**：复合链长、商结构多的隐函数求 $dz$（一次同时得两个偏导）；已知全微分表达式求原函数（CMC 填空原题型）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 仅有偏导就用 $dz=f_xdx+f_ydy$ | 此式前提是**可微**（2.2；初等函数与偏导连续函数自动满足） |\n| 求原函数时不检验 $Q_x=P_y$ | 应先验证是全微分（单连通域内），再求 $u$ |\n| 微分法解出 $dz$ 后忘读系数 | $dz=\\left(\\cdots\\right)dx+\\left(\\cdots\\right)dy$ 的系数就是 $z_x,z_y$ |","examplesMd":"**【例 3.4-1】（★★，经典）** 设 $x^{2}+y^{2}=\\dfrac{z}{y}\\,\\varphi\\!\\left(\\dfrac{z}{y}\\right)$ 确定 $z=z(x,y)$，$\\varphi$ 一元可微，求 $dz$。\n\n**思路分析**：右端是 $\\dfrac zy$ 的函数——**整体换元** $u=\\dfrac zy$，记 $H(u)=u\\varphi(u)$，方程化为 $x^{2}+y^{2}=H(u)$；微分法一次到位。\n\n**详细解答**：两边取全微分：左边 $2x\\,dx+2y\\,dy$；右边用形式不变性 $d\\left[H(u)\\right]=H'(u)\\,du$，其中\n\n$du=d\\!\\left(\\dfrac zy\\right)=\\dfrac{y\\,dz-z\\,dy}{y^{2}}$\n\n故\n\n$2x\\,dx+2y\\,dy=\\left[\\varphi(u)+u\\varphi'(u)\\right]\\cdot\\dfrac{y\\,dz-z\\,dy}{y^{2}}$\n\n解出：\n\n$dz=\\dfrac{2xy}{\\varphi(u)+u\\varphi'(u)}\\,dx+\\left(\\dfrac zy+\\dfrac{2y^{2}}{\\varphi(u)+u\\varphi'(u)}\\right)dy,\\qquad u=\\dfrac zy$\n\n**检验**（具体化 $\\varphi(u)=e^{u}$）：$H'(u)=\\left(1+u\\right)e^{u}$。数值核对 $z_x$：取点 $x=\\dfrac12,\\ y=1$，则方程 $x^{2}+1=ze^{z}$，解得 $z\\approx0.64$；隐函数公式 $z_x=-\\dfrac{F_x}{F_z}$（$F=x^{2}+y^{2}-H(z/y)$）与本题 $z_x=\\dfrac{2xy}{H'(u)}$ 完全一致（有限差分 $\\dfrac{z(0.501,1)-z(0.499,1)}{0.002}$ 与公式值吻合，SymPy 数值验证见配套脚本）。\n\n**方法总结**：==微分法两步：两边全微分（一切函数当多元函数对待）→ 解出 $dz$==。$\\dfrac zy$、$xy$、\"分式中间变量\"是**括号意识**在微分世界的对应物：$d\\!\\left(\\dfrac zy\\right)$ 用商法则展开，别丢 $-z\\,dy$ 项。\n\n**【例 3.4-2】（★★，真题风格）** 已知 $du=\\dfrac{y\\,dx-x\\,dy}{3x^{2}-2xy+3y^{2}}$，求 $u(x,y)$。\n\n**思路分析**：先验证恰当性（$Q_x=P_y$），再\"抓结构\"：分子 $y\\,dx-x\\,dy=y^{2}\\,d\\!\\left(\\dfrac xy\\right)$，分母是**二次齐次**——必可写成 $\\dfrac xy$ 的函数，化一元积分。\n\n**详细解答**：$P=\\dfrac{y}{D},\\ Q=-\\dfrac{x}{D}$（$D=3x^{2}-2xy+3y^{2}$）：$Q_x-P_y=-\\dfrac{D-xD_x}{D^{2}}-\\dfrac{D-yD_y}{D^{2}}=-\\dfrac{2D-\\left(6x^{2}-4xy+6y^{2}\\right)}{D^{2}}=0$ ✓（$D_x=6x-2y,\\ D_y=-2x+6y$），恰当。\n\n令 $s=\\dfrac xy$：分子 $y\\,dx-x\\,dy=y^{2}\\,ds$；分母 $D=y^{2}\\left(3s^{2}-2s+3\\right)$。故\n\n$du=\\dfrac{ds}{3s^{2}-2s+3}=\\dfrac{ds}{3\\left(s-\\frac13\\right)^{2}+\\frac89}=\\dfrac{\\frac13\\,ds}{\\left(s-\\frac13\\right)^{2}+\\frac{8}{9}}$\n\n积分：\n\n$u=\\dfrac13\\cdot\\dfrac{3}{2\\sqrt2}\\arctan\\dfrac{s-\\frac13}{\\frac{2\\sqrt2}{3}}+C=\\dfrac{1}{2\\sqrt2}\\arctan\\!\\left[\\dfrac{3}{2\\sqrt2}\\left(\\dfrac xy-\\dfrac13\\right)\\right]+C$\n\n**检验**：对结果求 $u_x$：记 $W=\\dfrac{3}{2\\sqrt2}\\left(\\dfrac xy-\\dfrac13\\right)$，$u_x=\\dfrac{1}{2\\sqrt2}\\cdot\\dfrac{W_x}{1+W^{2}}=\\dfrac{1}{2\\sqrt2}\\cdot\\dfrac{\\frac{3}{2\\sqrt2}\\cdot\\frac1y}{1+W^{2}}=\\dfrac{3}{8y\\left(1+W^{2}\\right)}$；另一方面 $\\dfrac yD=\\dfrac{y}{y^{2}\\left(3s^{2}-2s+3\\right)}=\\dfrac{1}{y\\left(3s^{2}-2s+3\\right)}$，而 $1+W^{2}=1+\\dfrac{\\left(3s-1\\right)^{2}}{8}=\\dfrac{8+9s^{2}-6s+1}{8}=\\dfrac{9s^{2}-6s+9}{8}=\\dfrac{3}{8}\\left(9s^{2}-6s+9\\right)/3$——直接比：$\\dfrac{3}{8y\\left(1+W^{2}\\right)}=\\dfrac{3}{8y}\\cdot\\dfrac{8}{9s^{2}-6s+9}=\\dfrac{3}{3y\\left(3s^{2}-2s+3\\right)}=\\dfrac{1}{y\\left(3s^{2}-2s+3\\right)}$ ✓。\n\n**方法总结**：$P\\,dx+Q\\,dy$ 求原函数的**结构三板斧**：齐次 ⇒ 化 $\\dfrac xy$；含 $x\\,dy-y\\,dx$ ⇒ 化 $\\arctan\\dfrac yx$；含 $x\\,dx+y\\,dy$ ⇒ 化 $\\ln\\left(x^{2}+y^{2}\\right)$。"},"3.5":{"id":"3.5","name":"方向导数与梯度（最速方向思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：方向导数与梯度是一体两面：\n\n* **方向导数（定义）**：沿单位方向 $\\vec e=\\left(\\cos\\alpha,\\cos\\beta\\right)$，$\\dfrac{\\partial f}{\\partial l}\\Big|_{P_0}=\\lim\\limits_{t\\to0^{+}}\\dfrac{f\\left(P_0+t\\vec e\\right)-f\\left(P_0\\right)}{t}$——**单侧**（$t\\to0^+$），与偏导的双侧差商不同；\n* **计算公式（门槛是可微）**：$f$ 在 $P_0$ 可微时 $\\dfrac{\\partial f}{\\partial l}=f_x\\cos\\alpha+f_y\\cos\\beta=\\operatorname{grad}f\\cdot\\vec e$（三元加一项）；\n* **梯度**：$\\nabla f=\\left(f_x,f_y\\left[,f_z\\right]\\right)$，方向导数 $=\\lvert\\nabla f\\rvert\\cos\\langle\\nabla f,\\vec e\\rangle$——**沿梯度最大**（值 $\\lvert\\nabla f\\rvert$）、逆梯度最小、垂直方向为零；梯度**垂直于等值线（面）**。\n\n**三条铁律**：\n\n1. <span style=\"color:#e53935\">**方向不是单位向量必须先归一化**</span>（高频扣分点：给 $\\vec l=(3,4)$ 要除以 $5$）；\n2. 公式 $\\nabla f\\cdot\\vec e$ 的门槛是**可微**，不是\"偏导存在\"（反例见拔 3.5）；\n3. \"方向导数**最大**\"⇒ $\\vec l$ 与 $\\nabla f$ **同向**平行（\"最小\"才反向）——筛参数的关键（例 3.5-2）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 忘归一化，$\\nabla f\\cdot\\vec l$ 直接当方向导数 | 先 $\\vec e=\\vec l/\\lvert\\vec l\\rvert$ |\n| \"平行\"不辨同向反向 | 最大 ⇒ 同向；只平行则可能取最小值 |\n| 不可微时仍套 $\\nabla f\\cdot\\vec e$ | 回定义（单侧差商），见拔 3.5 |","examplesMd":"**【例 3.5-1】（★★，经典）** 设 $f(x,y,z)=xy^{2}+yz^{2}$，求 $f$ 在 $P_0(1,2,0)$ 处沿 $\\vec l=(1,2,2)$ 方向的方向导数，并求最大方向导数。\n\n**思路分析**：三步：求梯度 → 归一化方向 → 点乘。\n\n**详细解答**：$\\nabla f=\\left(y^{2},\\ 2xy+z^{2},\\ 2yz\\right)$，在 $P_0$：$\\nabla f=(4,\\ 4,\\ 0)$。\n\n$\\lvert\\vec l\\rvert=\\sqrt{1+4+4}=3,\\qquad \\vec e=\\left(\\dfrac13,\\ \\dfrac23,\\ \\dfrac23\\right)$\n\n$\\dfrac{\\partial f}{\\partial l}=\\nabla f\\cdot\\vec e=\\dfrac43+\\dfrac83+0=4$\n\n最大方向导数 $=\\lvert\\nabla f\\rvert=\\sqrt{16+16}=4\\sqrt2$（沿 $\\nabla f$ 方向）。\n\n**检验**：$f$ 是多项式（偏导连续 ⇒ 可微），公式合法；数值核：沿 $\\vec e$ 走 $t$：$f\\left(1+\\tfrac t3,\\ 2+\\tfrac{2t}3,\\ \\tfrac{2t}3\\right)=\\left(1+\\tfrac t3\\right)\\left(2+\\tfrac{2t}3\\right)^{2}+0$，展开一次项系数 $=\\dfrac43+\\dfrac{8}3=4$ ✓。\n\n**方法总结**：==梯度（向量）→ 归一化（单位化）→ 点乘（数值）==；最大值永远只需 $\\lvert\\nabla f\\rvert$，不必再算方向。\n\n**【例 3.5-2】（★★★，真题风格）** 设 $f(x,y)=ax^{2}+by^{2}+1$（$a,b$ 为常数）。已知 $f$ 在点 $(4,3)$ 处沿方向 $\\vec l=-4\\vec i-3\\vec j$ 的方向导数**最大**，最大值为 $10$。求 $a,b$。\n\n**思路分析**：\"最大\" ⇒ $\\nabla f(4,3)$ 与 $\\vec l=(-4,-3)$ **同向平行**且模为 $10$。\n\n**详细解答**：$\\nabla f=(2ax,\\ 2ay)$，在 $(4,3)$：$\\left(8a,\\ 6b\\right)$。同向平行：\n\n$\\dfrac{8a}{-4}=\\dfrac{6b}{-3}>0\\ \\Longrightarrow\\ a=b\\ \\text{且}\\ a<0$\n\n模长：$\\lvert\\nabla f\\rvert=\\sqrt{64a^{2}+36b^{2}}=\\lvert a\\rvert\\sqrt{64+36}=10\\lvert a\\rvert=10\\ \\Longrightarrow\\ \\lvert a\\rvert=1$，结合 $a<0$ 得\n\n$\\boxed{a=b=-1}$\n\n**检验**：$(a,b)=(1,1)$ 也满足\"平行\"，但那时 $\\nabla f(4,3)=(8,6)$ 与 $\\vec l=(-4,-3)$ **反向**：$\\vec e=\\left(-\\tfrac45,-\\tfrac35\\right)$，$\\nabla f\\cdot\\vec e=-\\dfrac{32}5-\\dfrac{18}5=-10$——取到的是最小值 $-10$ 而非最大值。\"**最大** ⇒ 同向\"正是筛掉它的关键。\n\n**方法总结**：==给\"沿某方向最大\"求参数：同向平行定比值 + 模长定大小==；反向解的甄别必须写进解答，否则丢过程分。"},"3.6":{"id":"3.6","name":"变量替换化简偏微分方程（带括号求两次导思想）","part":"多元求导法则","book":"多元微分","teachMd":"**核心思想**：题目\"作变换 $u=\\cdots,\\ v=\\cdots$，化简方程 $Az_{xx}+Bz_{xy}+Cz_{yy}=0$\"——全部功夫是 3.2 的括号意识：把 $z=z\\left(u(x,y),v(x,y)\\right)$ **老老实实带括号求两次导**，代入后用 $u,v$ 表出残余的 $x,y$ 收尾。\n\n**两个必背经典代换**（$u=x+y,\\ v=x-y$，即 $45°$ 旋转）：\n\n$z_{xx}-z_{yy}=4\\,z_{uv},\\qquad z_{xx}+z_{yy}=2\\left(z_{uu}+z_{vv}\\right)$\n\n第二式说明**拉普拉斯方程在旋转变换下不变**（决赛常客）；第一式把波动算子\"因子化\"。\n\n**适用信号**：题目显式给代换（考研/CMC 决赛式）；或方程含 $x^{2}z_{xx}-y^{2}z_{yy}$、$z_{xx}+z_{yy}$ 等结构，提示自选代换。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 跳步背\"变换公式\"直接套 | 系数极易错，考场动作永远是\"现推一遍一、二阶展开\" |\n| 收尾停在 $x,y$ 记号 | 最后必须把残余的 $x^{2},\\ \\dfrac xy$ 等用 $u,v$ 表出 |\n| $z_u$ 再求导忘它仍带 $\\left(u,v\\right)$ 括号 | 二阶展开每一步都是 3.2 的规矩 |","examplesMd":"**【例 3.6-1】（★★，经典）** 设 $z=z(x,y)$ 有二阶连续偏导，作变换 $u=x+y,\\ v=x-y$。证明：$z_{xx}-z_{yy}=4z_{uv}$，$z_{xx}+z_{yy}=2\\left(z_{uu}+z_{vv}\\right)$。\n\n**思路分析**：$u_x=v_x=1,\\ u_y=1,\\ v_y=-1$——一阶展开后逐项再求导。\n\n**详细解答**：$z_x=z_u\\cdot1+z_v\\cdot1=z_u+z_v$；$z_y=z_u-z_v$。\n\n$z_{xx}=\\left(z_u\\right)_x+\\left(z_v\\right)_x=\\left(z_{uu}+z_{uv}\\right)+\\left(z_{vu}+z_{vv}\\right)=z_{uu}+2z_{uv}+z_{vv}$\n\n$z_{yy}=\\left(z_u\\right)_y-\\left(z_v\\right)_y=\\left(z_{uu}-z_{uv}\\right)-\\left(z_{vu}-z_{vv}\\right)=z_{uu}-2z_{uv}+z_{vv}$\n\n相减得 $z_{xx}-z_{yy}=4z_{uv}$；相加得 $z_{xx}+z_{yy}=2\\left(z_{uu}+z_{vv}\\right)$。∎\n\n**检验**（具体化）：取 $z=x^{2}-y^{2}$（即 $z=uv$）：$z_{xx}=2,\\ z_{yy}=-2$，差 $=4$；右边 $4z_{uv}=4\\cdot\\dfrac{\\partial^{2}\\left(uv\\right)}{\\partial u\\partial v}=4$ ✓。和 $=0$；$2\\left(z_{uu}+z_{vv}\\right)=2\\left(0+0\\right)=0$ ✓。\n\n**方法总结**：$u,v$ 系数全是 $\\pm1$ 是本题好算的原因；**变换后方程结构\"降耦合\"**（$z_{uv}$ 只剩交叉项）正是代换的目的。\n\n**【例 3.6-2】（★★★，真题风格）** 设 $z=z(x,y)$ 有二阶连续偏导，作变换 $u=xy,\\ v=\\dfrac xy$，把方程 $x^{2}z_{xx}-y^{2}z_{yy}=0$ 化为关于 $u,v$ 的方程。\n\n**思路分析**：先求出 $z_{xx},\\ z_{yy}$ 的变换式（3.2 例 3.2-2 已算过同结构），代入后用 $u,v$ 表出 $x^{2}$ 与 $\\dfrac xy$ 收尾。\n\n**详细解答**：引用例 3.2-2 的展开（结构完全相同）：\n\n$z_{xx}=y^{2}z_{uu}+2z_{uv}+\\dfrac{1}{y^{2}}z_{vv},\\qquad z_{yy}=x^{2}z_{uu}-\\dfrac{2x^{2}}{y^{2}}z_{uv}+\\dfrac{x^{2}}{y^{4}}z_{vv}+\\dfrac{2x}{y^{3}}z_{v}$\n\n代入：\n\n$x^{2}z_{xx}-y^{2}z_{yy}=\\left[x^{2}y^{2}z_{uu}+2x^{2}z_{uv}+\\dfrac{x^{2}}{y^{2}}z_{vv}\\right]-\\left[x^{2}y^{2}z_{uu}-2x^{2}z_{uv}+\\dfrac{x^{2}}{y^{2}}z_{vv}+\\dfrac{2x}{y}z_{v}\\right]$\n\n$z_{uu}$ 与 $z_{vv}$ 项全部对消（这正是该代换的巧妙处），剩\n\n$=4x^{2}z_{uv}-\\dfrac{2x}{y}z_{v}=4uv\\,z_{uv}-2v\\,z_{v}$\n\n（用了 $x^{2}=\\left(xy\\right)\\cdot\\dfrac xy=uv$ 与 $\\dfrac xy=v$。）原方程 $=0$ 即\n\n$4uv\\,z_{uv}-2v\\,z_{v}=0\\ \\Longrightarrow\\ 2u\\,z_{uv}-z_{v}=0\\qquad(v\\neq0)$\n\n**检验**（具体化）：取满足新方程的简单解 $z=\\sqrt{u}$（$z_{uv}=z_{v}=0$，满足 $2u z_{uv}-z_v=0$），对应 $z=\\sqrt{xy}$。验证原方程：$z_x=\\dfrac{y}{2\\sqrt{xy}}$，$z_{xx}=-\\dfrac{y^{2}}{4\\left(xy\\right)^{3/2}}$，$x^{2}z_{xx}=-\\dfrac{\\sqrt{xy}}{4}$；对称地 $y^{2}z_{yy}=-\\dfrac{\\sqrt{xy}}{4}$，差为 $0$ ✓。\n\n**方法总结**：==变换化简三步：现推一、二阶展开 → 代入看哪些项对消 → 用 $u,v$ 表出残余系数==。$z_{uu},z_{vv}$ 项恰好对消不是巧合——$u,v$ 取\"乘积与商\"时 $u_xv_x$ 型交叉结构天然对称。"},"4.1":{"id":"4.1","name":"切线与切平面一张表（切向量与法向量思想）","part":"几何应用","book":"多元微分","teachMd":"**起步动作（课内公式全表，速过）**：\n\n| 对象 | 方程形式 | 关键向量 | 切线/切平面 |\n| --- | --- | --- | --- |\n| 空间曲线 | $x=x(t),\\ y=y(t),\\ z=z(t)$ | 切向量 $\\vec T=\\left(x'(t_0),y'(t_0),z'(t_0)\\right)$ | 切线 $\\dfrac{x-x_0}{x'}=\\dfrac{y-y_0}{y'}=\\dfrac{z-z_0}{z'}$；法平面 $x'\\left(x-x_0\\right)+y'\\left(y-y_0\\right)+z'\\left(z-z_0\\right)=0$ |\n| 曲线（一般式） | $\\begin{cases}F=0\\\\ G=0\\end{cases}$（两曲面交线） | $\\vec T=\\vec n_F\\times\\vec n_G$（**叉积**） | 同上 |\n| 曲面（隐式） | $F(x,y,z)=0$ | 法向量 $\\vec n=\\left(F_x,F_y,F_z\\right)$ | 切平面 $F_x\\left(x-x_0\\right)+F_y\\left(y-y_0\\right)+F_z\\left(z-z_0\\right)=0$；法线对称式 |\n| 曲面（显式） | $z=f(x,y)$ | $\\vec n=\\left(f_x,f_y,-1\\right)$ | 同上 |\n\n**竞赛聚焦点**：\n\n* **交线切向量 = 两法向量叉积**（CMC 比参数式更爱考）：行列式展开 $\\vec n_F\\times\\vec n_G$ 后可约去公因子；\n* **切平面截距 / 距离**：切平面 $\\dfrac{xx_0}{a^{2}}+\\cdots=1$ 型的截距、原点到切平面的距离 $\\dfrac{\\lvert D\\rvert}{\\lvert\\vec n\\rvert}$——常与 5.2 条件极值拼成大题；\n* 分母为零的对称式（如 $\\dfrac{y+2}{0}$）表示\"该坐标固定\"——不是错误，是约定。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 交线切向量硬找参数化 | 两法向量叉积一步到位 |\n| 显式曲面法向量写成 $\\left(f_x,f_y,1\\right)$ | 是 $\\left(f_x,f_y,-1\\right)$（由 $F=f(x,y)-z$ 而来） |\n| 切平面方程忘验证点在曲面上 | 动笔前代值检查 $F\\left(P_0\\right)=0$ |","examplesMd":"**【例 4.1-1】（★★，经典）** 求曲线 $\\begin{cases}x^{2}+y^{2}+z^{2}=6\\\\ x+y+z=0\\end{cases}$ 在点 $P_0(1,-2,1)$ 处的切线与法平面方程。\n\n**思路分析**：球面与平面的交线（一个圆）——切向量 = 两法向量叉积。\n\n**详细解答**：$P_0$ 在曲线上：$1+4+1=6$ ✓，$1-2+1=0$ ✓。\n\n$\\vec n_1=\\left(2x,\\ 2y,\\ 2z\\right)\\big|_{P_0}=\\left(2,\\ -4,\\ 2\\right)$，$\\vec n_2=\\left(1,\\ 1,\\ 1\\right)$。\n\n$\\vec T=\\vec n_1\\times\\vec n_2=\\begin{vmatrix}\\vec i&\\vec j&\\vec k\\\\ 2&-4&2\\\\ 1&1&1\\end{vmatrix}=\\left(-4-2,\\ 2-2,\\ 2+4\\right)=\\left(-6,\\ 0,\\ 6\\right)\\parallel\\left(-1,\\ 0,\\ 1\\right)$\n\n**切线**：$\\dfrac{x-1}{-1}=\\dfrac{y+2}{0}=\\dfrac{z-1}{1}$（分母 $0$ 表示 $y\\equiv-2$）。\n\n**法平面**：$-\\left(x-1\\right)+0+\\left(z-1\\right)=0$，即 $z=x$。\n\n**检验**：切向量应垂直于两法向量：$\\vec T\\cdot\\vec n_1=\\left(-6\\right)2+0+6\\cdot2=0$ ✓，$\\vec T\\cdot\\vec n_2=-6+0+6=0$ ✓。\n\n**方法总结**：==交线切向量 = $\\vec n_F\\times\\vec n_G$，算完叉积必做\"点乘归零\"复核==。\n\n**【例 4.1-2】（★★，经典）** 求椭球面 $x^{2}+2y^{2}+3z^{2}=6$ 在点 $P_0(1,1,1)$ 处的切平面与法线方程，并求原点到该切平面的距离。\n\n**思路分析**：隐式曲面一张表；距离用点到平面公式。\n\n**详细解答**：$P_0$ 在曲面上：$1+2+3=6$ ✓。$\\vec n=\\left(2x,\\ 4y,\\ 6z\\right)\\big|_{P_0}=\\left(2,4,6\\right)\\parallel\\left(1,2,3\\right)$。\n\n**切平面**：$\\left(x-1\\right)+2\\left(y-1\\right)+3\\left(z-1\\right)=0$，即\n\n$x+2y+3z=6$\n\n**法线**：$\\dfrac{x-1}{1}=\\dfrac{y-1}{2}=\\dfrac{z-1}{3}$。\n\n**距离**：$d=\\dfrac{\\lvert0+0+0-6\\rvert}{\\sqrt{1+4+9}}=\\dfrac{6}{\\sqrt{14}}$。\n\n**检验**：切平面法向量即梯度方向（3.5：梯度垂直于等值面 $x^{2}+2y^{2}+3z^{2}=c$——切平面是等值面族的公共切面，切法线沿梯度）✓；数值：把 $P_0$ 代回切平面 $1+2+3=6$ ✓。\n\n**方法总结**：隐式曲面切平面 = \"梯度当法向量\"；截距式 $\\dfrac{x}{6}+\\dfrac{y}{3}+\\dfrac{z}{2}=1$ 可直接读出三轴截距——为 5.2 的\"切平面四面体\"类问题备好原料。"},"5.1":{"id":"5.1","name":"无条件极值（AC−B² 判别思想）","part":"极值与最值","book":"多元微分","teachMd":"**核心思想**：极值点只可能出现在**驻点**（各一阶偏导为零）与**偏导不存在的点**。驻点处记 $A=f_{xx},\\ B=f_{xy},\\ C=f_{yy}$（二阶偏导连续）：\n\n| $AC-B^{2}$ | 结论 |\n| :-: | --- |\n| $>0$ 且 $A>0$ | 极小值 |\n| $>0$ 且 $A<0$ | 极大值 |\n| $<0$ | 非极值（鞍点） |\n| $=0$ | **判定失效**：用定义 / 取路径 / 高阶方法 |\n\n**失效时的标准动作**：沿几条路径取值比较（如沿 $y=0$、$y=x$、$y=-x$ 看变号），或回到定义 $f(P)-f(P_0)$ 的符号；进阶可用二元泰勒（冷门速览）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 只查驻点，漏掉偏导不存在的点（如 $-\\sqrt{x^{2}+y^{2}}$ 型尖点） | 候选点 = 驻点 ∪ 偏导不存在点 |\n| $AC-B^{2}=0$ 时硬下结论 | 失效必须换路径/定义（例 5.1-2 对例） |\n| $A$ 的符号看错（记\"同 $A$ 极小异 $A$ 极大\"） | $AC-B^{2}>0$ 时 $A$（或 $C$，同号）的正负定极小/极大 |","examplesMd":"**【例 5.1-1】（★★，经典）** 求 $z=x^{3}+y^{3}-3xy$ 的极值。\n\n**思路分析**：解驻点方程组 → 逐点判 $AC-B^{2}$。\n\n**详细解答**：$z_x=3x^{2}-3y,\\ z_y=3y^{2}-3x$。联立：$y=x^{2},\\ x=y^{2}$ ⟹ $x=x^{4}$ ⟹ $x=0$ 或 $x=1$（实数范围内 $x^{3}=1$），驻点 $\\left(0,0\\right)$ 与 $\\left(1,1\\right)$。\n\n$A=6x,\\ B=-3,\\ C=6y$：\n\n* $\\left(0,0\\right)$：$AC-B^{2}=0-9=-9<0$，**鞍点**，非极值；\n* $\\left(1,1\\right)$：$AC-B^{2}=36-9=27>0$，$A=6>0$，**极小值** $z\\left(1,1\\right)=1+1-3=-1$。\n\n**检验**：数值采样：$z\\left(1.1,1\\right)=1.331+1-3.3=-0.969>-1$，$z\\left(0.9,1\\right)=0.729+1-2.7=-0.971>-1$，$(1,1)$ 附近确实更低 ✓；鞍点：$z\\left(t,t\\right)=2t^{3}-3t^{2}$ 在 $t=0$ 两侧均为负但 $z\\left(t,-t\\right)=2t^{3}+3t^{2}>0$（$t>0$）——变号 ✓。\n\n**方法总结**：驻点方程组常需\"两式相除/代入\"消元（本题 $y=x^{2},\\ x=y^{2}$ 对称结构）；判定后数值抽验一正一负即可确认。\n\n**【例 5.1-2】（★★，经典）** 判定下列函数在原点处是否取得极值（$AC-B^{2}$ 均失效）：\n\n(1) $f=x^{4}+y^{2}$；　(2) $g=x^{3}+y^{2}$。\n\n**思路分析**：原点处 $A=B=C=0$（或 $AC-B^{2}=0$）——失效。改用**定义/路径**。\n\n**详细解答**：\n\n(1) $f\\left(0,0\\right)=0$，而 $f=x^{4}+y^{2}\\ge0$ 对一切 $\\left(x,y\\right)$ 成立，由定义**极小值** $0$ ✔。\n\n(2) 沿 $y=0$：$g=x^{3}$ 在 $x=0$ 两侧变号（$g\\left(\\pm t,0\\right)=\\pm t^{3}$）；又 $g\\left(0,t\\right)=t^{2}>0$——原点附近函数值有正有负（取 $\\left(t,0\\right)$ 与 $\\left(-t,0\\right)$），**非极值** ✘。\n\n**方法总结**：==$AC-B^{2}=0$ 时，\"定义看符号\"与\"路径看变号\"是标准动作==；形如 $x^{2n}+y^{2}$ 的必极小，$x^{2n+1}+y^{2}$ 的必非极值——这对\"孪生反例\"记住形态即可秒判。"},"5.2":{"id":"5.2","name":"条件极值（拉格朗日乘数法思想）","part":"极值与最值","book":"多元微分","teachMd":"**核心思想**：目标 $f$、约束 $g=0$（可多个）。构造\n\n$L\\left(x,y,\\lambda\\right)=f\\left(x,y\\right)+\\lambda\\,g\\left(x,y\\right)\\qquad\\left(\\text{双约束：}L=f+\\lambda_1g_1+\\lambda_2g_2\\right)$\n\n解 $L_x=L_y=L_\\lambda=0$ 得候选点。几何本质：极值点处 $\\nabla f\\parallel\\nabla g$（梯度共线）。\n\n**三条使用纪律**：\n\n1. **拉格朗日方程组的解只是驻点（候选），不是自动的最值**——必须配合\"存在性 + 边界退化排除 + 唯一驻点\"完成论证，大题缺此扣过程分；\n2. **乘积型目标先取对数**：最大化 $xyz$ ⟺ 最大化 $\\ln x+\\ln y+\\ln z$（化乘积为和，方程组瞬间降次）；\n3. **对称结构先推相等**：目标与约束都轮换对称时，先证候选点坐标相等（或讨论不等情形导出矛盾），绕开笨重方程组。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 约束写成 $g\\left(x,y\\right)$ 忘整理成 $=0$ | 一律化为 $g=0$ 再乘 $\\lambda$ |\n| 解出驻点直接下\"最大/最小\"结论 | 补存在性与唯一性/边界检查 |\n| 对称题硬解方程组到一半放弃 | 先设坐标相等试探，再验证 |","examplesMd":"**【例 5.2-1】（★★，经典）** 求椭球面 $x^{2}+y^{2}+z^{2}=1$ 的内接长方体（各面平行于坐标面）的最大体积。\n\n**思路分析**：对称性只看第一卦限：$V_{1}=xyz$，总 $V=8xyz$；乘积型 + 对称结构——先推相等。\n\n**详细解答**：令 $L=xyz+\\lambda\\left(x^{2}+y^{2}+z^{2}-1\\right)$：\n\n$\\begin{cases}yz+2\\lambda x=0\\\\ xz+2\\lambda y=0\\\\ xy+2\\lambda z=0\\end{cases}$\n\n三式分别乘 $x,y,z$ 相加：$3xyz+2\\lambda=0$（$x,y,z>0$）。由前两式相除（$x,y>0$）：$\\dfrac yx=\\dfrac xy\\Rightarrow x=y$，同理 $x=y=z$。代约束：$3x^{2}=1$：\n\n$x=y=z=\\dfrac{1}{\\sqrt3}\\ \\Longrightarrow\\ V_{\\max}=8\\left(\\dfrac{1}{\\sqrt3}\\right)^{3}=\\dfrac{8}{3\\sqrt3}=\\dfrac{8\\sqrt3}{9}$\n\n**存在性与排除**：$xyz$ 在有界闭集（椭球面的第一卦限部分）上连续，最值存在；边界上 $xyz\\to0$ 非最大；唯一内部驻点即最大点。∎\n\n**检验**：数值对比：$\\left(\\dfrac1{\\sqrt3}\\right)^{3}\\approx0.19245$；另取 $\\left(\\dfrac1{\\sqrt2},\\dfrac1{\\sqrt2},0\\right)$：$V_{1}=0$；取 $\\left(0.6,0.6,\\sqrt{0.28}\\right)$：$xyz\\approx0.190$（更小）✓。\n\n**方法总结**：==对称 + 乘积 → \"乘 $x$ 相加 + 两两相除\"推相等==，这是内接图形类题的固定开局；收尾三件套（存在性、边界、唯一驻点）一段话写全。\n\n**【例 5.2-2】（★★，经典名题）** 在周长为 $2p$ 的一切三角形中，求面积最大者。\n\n**思路分析**：海伦公式 $S^{2}=p\\left(p-a\\right)\\left(p-b\\right)\\left(p-c\\right)$——乘积型，取对数。\n\n**详细解答**：最大化 $\\ln S^{2}=\\ln p+\\ln\\left(p-a\\right)+\\ln\\left(p-b\\right)+\\ln\\left(p-c\\right)$（$\\ln p$ 为常数），约束 $a+b+c=2p$。令\n\n$L=\\ln\\left(p-a\\right)+\\ln\\left(p-b\\right)+\\ln\\left(p-c\\right)+\\lambda\\left(a+b+c-2p\\right)$\n\n$L_a=-\\dfrac{1}{p-a}+\\lambda=0$（三式同理）$\\Rightarrow p-a=p-b=p-c\\Rightarrow a=b=c=\\dfrac{2p}{3}$（正三角形）。\n\n$S_{\\max}=\\sqrt{p\\left(\\dfrac p3\\right)^{3}}=\\dfrac{p^{2}}{3\\sqrt3}=\\dfrac{\\sqrt3\\,p^{2}}{9}$\n\n**存在性与排除**：约束集 $\\left\\{a,b,c>0,\\ a+b+c=2p\\right\\}$ 为开三角形；边界（某边 $\\to0$）时 $S\\to0$ 非最大；$S$ 连续且在内部唯一驻点——面积最大者为正三角形。∎\n\n**检验**：等周对比：$p=3$（周长 6）：正三角形 $S=\\sqrt3$；直角 $\\left(1.5,2,2.5\\right)$（周长 6）：$S=\\dfrac12\\cdot1.5\\cdot2=1.5<1.732$ ✓。\n\n**方法总结**：==海伦公式 + 取对数是三角形极值题的标准搭配==；\"边界退化排除\"在开约束集上尤其要写明（否则\"最值存在\"没有着落）。"},"5.3":{"id":"5.3","name":"闭区域上的最值（内部+边界扫描思想）","part":"极值与最值","book":"多元微分","teachMd":"**核心思想**：闭区域（有界 + 含边界）上连续函数必有最值（存在性定理），且最值只可能在：\n\n$\\text{① 内部驻点}\\quad\\text{② 内部偏导不存在的点}\\quad\\text{③ 边界上的最值点}$\n\n**完整流程（卷面模板）**：\n\n$\\text{第 0 步：存在性（有界闭 + 连续）}\\to\\text{① 求内部驻点}\\to\\text{② 边界最值（拉格朗日 / 代入化一元 / 参数化）}\\to\\text{③ 列表比较}$\n\n**边界处理的三个选择**：\n\n| 边界形态 | 首选 |\n| --- | --- |\n| 显式曲线（如 $y=0$、$x+y=6$） | **代入化一元**（最快） |\n| 隐式曲线（圆、椭圆） | **参数化**（$\\cos\\theta,\\sin\\theta$）或拉格朗日 |\n| 边界本身要求极值论证 | 拉格朗日（5.2 全套） |\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 只算内部驻点就交卷 | 边界最值常是全局最值（例 5.3-2 的最小值在边界） |\n| 边界端点（角点）漏掉 | 代入化一元后闭区间端点也要比较 |\n| 无内部驻点时以为\"无最值\" | 最值全在边界（练 5.3-1），照样比大小 |","examplesMd":"**【例 5.3-1】（★★，经典）** 求 $z=xy$ 在闭区域 $D:\\ x^{2}+y^{2}\\le1$ 上的最大值与最小值。\n\n**思路分析**：内部驻点只有原点（鞍点，仍列为候选）；圆边界参数化。\n\n**详细解答**：\n\n**内部**：$z_x=y,\\ z_y=x\\Rightarrow\\left(0,0\\right)$，$z=0$（$AC-B^{2}=0\\cdot0-1<0$ 鞍点，列入候选）。\n\n**边界** $x^{2}+y^{2}=1$：令 $x=\\cos\\theta,\\ y=\\sin\\theta$：$z=\\dfrac12\\sin2\\theta\\in\\left[-\\dfrac12,\\ \\dfrac12\\right]$，在 $\\theta=\\dfrac\\pi4$（点 $\\left(\\dfrac{\\sqrt2}2,\\dfrac{\\sqrt2}2\\right)$）取 $\\dfrac12$，在 $\\theta=-\\dfrac\\pi4$（点 $\\left(\\dfrac{\\sqrt2}2,-\\dfrac{\\sqrt2}2\\right)$）取 $-\\dfrac12$。\n\n**比较**：候选值 $\\left\\{0,\\ \\dfrac12,\\ -\\dfrac12\\right\\}$：\n\n$z_{\\max}=\\dfrac12,\\qquad z_{\\min}=-\\dfrac12$\n\n**检验**：拉格朗日复核边界：$L=xy+\\lambda\\left(x^{2}+y^{2}-1\\right)$ 给 $y=-2\\lambda x,\\ x=-2\\lambda y\\Rightarrow x=\\pm y$，$2x^{2}=1$：$x=\\pm\\dfrac{\\sqrt2}2$ 同号/异号两对点，值 $\\pm\\dfrac12$ ✓。\n\n**方法总结**：圆边界**优先参数化**（$\\sin2\\theta$ 一步出范围）；内部鞍点虽非极值、但**必须列入最值候选**——最值与极值是两回事。\n\n**【例 5.3-2】（★★，经典）** 求 $f\\left(x,y\\right)=x^{2}y\\left(4-x-y\\right)$ 在闭区域 $D:\\ x\\ge0,\\ y\\ge0,\\ x+y\\le6$ 上的最大值与最小值。\n\n**思路分析**：三角形区域，三边都是显式——内部解驻点方程，边界逐边代入化一元。\n\n**详细解答**：\n\n**内部**：$f_x=xy\\left(8-3x-2y\\right),\\ f_y=x^{2}\\left(4-x-2y\\right)$。$x,y>0$ 时 $8-3x-2y=0,\\ 4-x-2y=0$，相减 $4-2x=0$：$x=2,\\ y=1$（在 $D$ 内 ✓）。$f\\left(2,1\\right)=4\\cdot1\\cdot1=4$。判定：$A=f_{xx}\\big|_{\\left(2,1\\right)}=y\\left(8-6x-2y\\right)=-6$，$B=x\\left(8-3x-4y\\right)=-4$，$C=-2x^{2}=-8$：$AC-B^{2}=48-16=32>0$，$A<0$，极大值 $4$（列为候选）。\n\n**边界**：$x=0$ 或 $y=0$ 上 $f\\equiv0$；$x+y=6$ 上 $y=6-x$（$0\\le x\\le6$），$4-x-y=-2$：\n\n$f=-2x^{2}\\left(6-x\\right)=2x^{3}-12x^{2},\\qquad f'=6x^{2}-24x=6x\\left(x-4\\right)$\n\n驻点 $x=4$：$f\\left(4\\right)=128-192=-64$；端点 $x=0,6$：$f=0$。边界值域 $\\left[-64,\\ 0\\right]$。\n\n**比较**：候选值 $\\left\\{4,\\ 0,\\ -64\\right\\}$：\n\n$f_{\\max}=4\\ \\left(\\text{内部点}\\left(2,1\\right)\\right),\\qquad f_{\\min}=-64\\ \\left(\\text{边界点}\\left(4,2\\right)\\right)$\n\n**检验**：数值抽验 $f\\left(4,2\\right)=16\\cdot2\\cdot\\left(4-6\\right)=-64$ ✓；$f\\left(2.1,1\\right)=4.41\\cdot1\\cdot0.9\\approx3.97<4$ ✓（$\\left(2,1\\right)$ 附近确为局部最大）。\n\n**方法总结**：==多边形区域\"内部 + 逐边\"扫描，每边化成一元闭区间问题==；最大在内部、最小在边界是本题的典型分布——两边都不能省。"},"5.4":{"id":"5.4","name":"隐函数极值（驻点方程 + 二阶速判思想）","part":"极值与最值","book":"多元微分","teachMd":"**核心思想**：$F\\left(x,y,z\\right)=0$ 确定 $z=z(x,y)$，则\n\n$z_x=-\\dfrac{F_x}{F_z},\\qquad z_y=-\\dfrac{F_y}{F_z}$\n\n**驻点 ⟺ 分子为零**（$F_z\\neq0$ 处）：$\\begin{cases}F_x=0\\\\ F_y=0\\end{cases}$ 与原方程 $F=0$ **联立**解出候选点（每个点连同 $z$ 值一起求）。**驻点处二阶速判公式**（由 $z_x=z_y=0$ 大幅简化）：\n\n$\\boxed{\\ A=z_{xx}=-\\dfrac{F_{xx}}{F_z},\\qquad B=z_{xy}=-\\dfrac{F_{xy}}{F_z},\\qquad C=z_{yy}=-\\dfrac{F_{yy}}{F_z}\\ }\\qquad\\left(\\text{驻点处}\\right)$\n\n（证明见练 5.4-2。）之后照 5.1 判 $AC-B^{2}$。\n\n**CMC 秒杀视角——配方**：二次曲面型的 $F$ 先配方（如 $2\\left(x+2z\\right)^{2}+2y^{2}=\\varphi\\left(z\\right)$ 型），隐函数的**取值范围**直接显形，边界值即极值（例 5.4-2）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 解驻点时只用 $F_x=F_y=0$，忘联立原方程定 $z$ | 三个方程 $\\left(F=0,\\ F_x=0,\\ F_y=0\\right)$ 解三个未知数 |\n| 非驻点处滥用 $A=-F_{xx}/F_z$ | 速判公式**只在驻点成立**（依赖 $z_x=z_y=0$） |\n| 一组 $\\left(x,y\\right)$ 对应多个 $z$ 支时混为一谈 | 逐支判定（练 5.4-1：同一 $\\left(0,0\\right)$ 三支三种结论） |","examplesMd":"**【例 5.4-1】（★★，经典）** 求由方程 $x^{2}+y^{2}+z^{2}=2z$ 确定的隐函数 $z=z(x,y)$ 的极值。\n\n**思路分析**：$F=x^{2}+y^{2}+z^{2}-2z$：$F_x=2x,\\ F_y=2y$，驻点 $x=y=0$，代回原方程定 $z$（两支）。\n\n**详细解答**：$F_z=2z-2$。驻点：$\\left(0,0\\right)$ 且 $z^{2}-2z=0\\Rightarrow z=0$ 或 $z=2$：\n\n* **支 $z=2$**（$F_z=2\\neq0$）：$A=C=-\\dfrac{2}{2}=-1$，$B=0$：$AC-B^{2}=1>0$，$A<0$，**极大值** $z=2$；\n* **支 $z=0$**（$F_z=-2$）：$A=C=-\\dfrac{2}{-2}=1$，$B=0$：**极小值** $z=0$。\n\n**检验**（显化）：方程即球面 $x^{2}+y^{2}+\\left(z-1\\right)^{2}=1$（球心 $\\left(0,0,1\\right)$ 半径 1）。上半支 $z=1+\\sqrt{1-x^{2}-y^{2}}$ 顶点 $\\left(0,0\\right)$ 取最大 $2$；下半支取最小 $0$ ✓——几何直觉与代数判定完全一致。\n\n**方法总结**：==隐函数极值三步：$F_x=F_y=0$ 联立原方程定全点 → 驻点处 $A,B,C=-F_{xx},F_{xy},F_{yy}/F_z$ → 照 5.1 判定==；能显化（球、锥等）的务必显化复核。\n\n**【例 5.4-2】（★★★，真题风格）** 求由方程 $2x^{2}+2y^{2}+z^{2}+8xz-z+8=0$ 确定的隐函数 $z=z(x,y)$ 的极值。\n\n**思路分析**：$F_z=2z+8x-1$，驻点由 $4x+8z=0,\\ 4y=0$ 与原方程联立。\n\n**详细解答**：$F_x=4x+8z,\\ F_y=4y$。驻点：$x=-2z,\\ y=0$，代入原方程：\n\n$2\\left(4z^{2}\\right)+0+z^{2}+8\\left(-2z\\right)z-z+8=-7z^{2}-z+8=0\\ \\Longrightarrow\\ 7z^{2}+z-8=0$\n\n$z=\\dfrac{-1\\pm\\sqrt{1+224}}{14}=\\dfrac{-1\\pm15}{14}\\ \\Longrightarrow\\ z=1\\ \\text{或}\\ z=-\\dfrac87$\n\n驻点 $\\left(-2,\\ 0\\right)$（$z=1$）与 $\\left(\\dfrac{16}{7},\\ 0\\right)$（$z=-\\dfrac87$）。\n\n**二阶判定**（$F_z=2z+8x-1$；$F_{xx}=4,\\ F_{xy}=0,\\ F_{yy}=4$）：\n\n* $\\left(-2,0,1\\right)$：$F_z=2-16-1=-15$：$A=C=-\\dfrac{4}{-15}=\\dfrac{4}{15}>0$，$B=0$：$AC-B^{2}>0$，**极小值** $z=1$；\n* $\\left(\\dfrac{16}7,0,-\\dfrac87\\right)$：$F_z=-\\dfrac{16}7+\\dfrac{128}7-1=15$：$A=C=-\\dfrac4{15}<0$：**极大值** $z=-\\dfrac87$。\n\n**配方秒杀（复核）**：$2x^{2}+8xz=2\\left(x+2z\\right)^{2}-8z^{2}$，方程化为\n\n$2\\left(x+2z\\right)^{2}+2y^{2}=7z^{2}+z-8$\n\n左端 $\\ge0\\Rightarrow\\left(7z+8\\right)\\left(z-1\\right)\\ge0\\Rightarrow z\\le-\\dfrac87$ 或 $z\\ge1$：隐函数取值范围直接显形，**两个边界值恰在 $x+2z=0,\\ y=0$（即两驻点处）取到**——$z=1$ 是 $z\\ge1$ 支的最小、$z=-\\dfrac87$ 是 $z\\le-\\dfrac87$ 支的最大，与判定一致。∎\n\n**方法总结**：==二次曲面型隐函数极值 = \"驻点方程 + 二阶速判\"，配方是免费的全局复核==。注意两支的极值大小可以\"倒挂\"（极大 $-\\dfrac87<$ 极小 $1$——各自是本支局部性质，毫不矛盾）。"},"5.5":{"id":"5.5","name":"压轴综合：多元不等式与最值应用（双路线思想）","part":"极值与最值","book":"多元微分","teachMd":"**核心思想**：多元不等式证明的**双路线**（大题完整版必须至少给一条严谨路线）：\n\n* **路线一（代数一击）**：均值不等式（AM-GM）、柯西不等式（$\\left(\\sum a_ib_i\\right)^{2}\\le\\sum a_i^{2}\\sum b_i^{2}$）、拉格朗日恒等式——三行内结束战斗，适合填空/选择题与不等式本身；\n* **路线二（极值论证）**：把不等式转化为**条件极值/闭域最值**（\"求证 $f\\le M$ 在约束 $g=0$ 下\"），完整流程含**存在性 + 边界退化排除 + 唯一驻点**，适合解答大题（过程分在这里）。\n\n**常用模型速查**：\n\n| 条件 | 结论（等号条件） |\n| --- | --- |\n| $a,b,c>0$，和定 $S$ | $abc\\le\\left(\\dfrac S3\\right)^{3}$（$a=b=c$） |\n| $x,y,z>0$，$x+y+z=1$ | $xyz\\le\\dfrac{1}{27}$；$xy+yz+zx\\le\\dfrac13$ |\n| 球面/椭球约束 | 柯西：$\\left(\\sum u_iv_i\\right)^{2}\\le\\lVert u\\rVert^{2}\\lVert v\\rVert^{2}$ |\n| 齐次函数 | 欧拉定理：$f$ 为 $k$ 次齐次 $\\Rightarrow xf_x+yf_y+zf_z=kf$（拔 5.5） |\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 只写\"由均值不等式得\"不给等号条件 | 等号条件是检验答案与取等的钥匙，必须写 |\n| 极值路线漏\"存在性\"与\"边界排除\" | 大题按步给分，三件套缺一扣分 |\n| 不等式两侧量纲/齐次性不匹配 | 先检查两边齐次次数是否一致，再选代换 |","examplesMd":"**【例 5.5-1】（★★★，真题风格）** 设 $a,b,c>0$，正数 $x,y,z$ 满足 $\\dfrac{x^{2}}{a^{2}}+\\dfrac{y^{2}}{b^{2}}+\\dfrac{z^{2}}{c^{2}}=1$。\n\n(1) 求证：$\\dfrac{x^{2}}{a^{2}}+\\dfrac{y^{2}}{b^{2}}+\\dfrac{z^{2}}{c^{2}}\\ge\\dfrac{\\left(x+y+z\\right)^{2}}{a^{2}+b^{2}+c^{2}}$；　(2) 求证：$xyz\\le\\dfrac{abc}{3\\sqrt3}$。\n\n**思路分析**：(1) 柯西/拉格朗日恒等式；(2) 双路线——AM-GM 三行，或拉格朗日乘数法完整论证。\n\n**详细解答**：\n\n**(1)** 取 $u=\\left(\\dfrac xa,\\ \\dfrac yb,\\ \\dfrac zc\\right)$，$v=\\left(a,\\ b,\\ c\\right)$，则 $u\\cdot v=x+y+z$，且（拉格朗日恒等式）\n\n$\\Big(\\sum u_i^{2}\\Big)\\Big(\\sum v_i^{2}\\Big)-\\Big(\\sum u_iv_i\\Big)^{2}=\\sum_{i<j}\\left(u_iv_j-u_jv_i\\right)^{2}\\ \\ge0$\n\n即 $\\left(a^{2}+b^{2}+c^{2}\\right)\\cdot1\\ge\\left(x+y+z\\right)^{2}$，除以正数即得。∎（等号 $\\dfrac xa$ 系数成比例：$u\\parallel v$，即 $\\dfrac{x}{a^{2}}=\\dfrac{y}{b^{2}}=\\dfrac{z}{c^{2}}$。）\n\n**(2) 路线一（AM-GM）**：对约束左端用三项均值不等式：\n\n$1=\\dfrac{x^{2}}{a^{2}}+\\dfrac{y^{2}}{b^{2}}+\\dfrac{z^{2}}{c^{2}}\\ \\ge\\ 3\\sqrt[3]{\\dfrac{x^{2}y^{2}z^{2}}{a^{2}b^{2}c^{2}}}\\ \\Longrightarrow\\ \\left(xyz\\right)^{2/3}\\le\\dfrac{\\left(abc\\right)^{2/3}}{3}\\ \\Longrightarrow\\ xyz\\le\\dfrac{abc}{3\\sqrt3}$\n\n等号 $\\dfrac xa=\\dfrac yb=\\dfrac zc=\\dfrac{1}{\\sqrt3}$，即 $\\left(x,y,z\\right)=\\left(\\dfrac{a}{\\sqrt3},\\dfrac{b}{\\sqrt3},\\dfrac{c}{\\sqrt3}\\right)$。∎\n\n**(2) 路线二（拉格朗日完整版）**：最大化 $\\ln\\left(xyz\\right)$（化乘积为和），$L=\\ln x+\\ln y+\\ln z-\\lambda\\left(\\dfrac{x^{2}}{a^{2}}+\\dfrac{y^{2}}{b^{2}}+\\dfrac{z^{2}}{c^{2}}-1\\right)$。$L_x=0$ 给 $\\dfrac1x=\\dfrac{2\\lambda x}{a^{2}}$，故 $\\dfrac{x^{2}}{a^{2}}=\\dfrac{y^{2}}{b^{2}}=\\dfrac{z^{2}}{c^{2}}=\\dfrac13$，唯一正驻点如上。**存在性**：椭球面（有界闭集）上连续函数必有最值；**边界排除**：某变量 $\\to0$ 时 $xyz\\to0$ 非最大。故驻点即最大点，$xyz\\le\\dfrac{abc}{3\\sqrt3}$。∎\n\n**检验**：数值：$a=b=c=1$（单位球约束），取 $x=y=z=\\dfrac{1}{\\sqrt3}$：$xyz=\\dfrac{1}{3\\sqrt3}\\approx0.192$；随机取球面点 $\\left(\\dfrac{1}{\\sqrt2},\\dfrac{1}{\\sqrt2},0\\right)$：$0$；$\\left(0.8,\\sqrt{0.36},0\\right)$：$0$；$\\left(0.7,0.5,\\sqrt{1-0.49-0.25}\\right)=\\left(0.7,0.5,0.5099\\right)$：$xyz\\approx0.178<0.192$ ✓。\n\n**方法总结**：==(1) 柯西定\"平方和比\"，(2) 均值定\"乘积\"，两式共享同一取等点 $\\left(\\dfrac{a}{\\sqrt3},\\cdots\\right)$==——第 (1) 问往往是第 (2) 问的脚手架（把线性量和约束连起来）。\n\n**【例 5.5-2】（★★，经典）** 设 $a,b,c>0$ 且 $a+b+c=1$，证明：$\\sqrt a+\\sqrt b+\\sqrt c\\le\\sqrt3$。\n\n**思路分析**：双路线示范：柯西两行；拉格朗日完整流程。\n\n**详细解答**：\n\n**路线一（柯西）**：$\\left(\\sqrt a+\\sqrt b+\\sqrt c\\right)^{2}\\le\\left(1+1+1\\right)\\left(a+b+c\\right)=3$。∎\n\n**路线二（条件极值）**：$f=\\sqrt a+\\sqrt b+\\sqrt c$ 在闭区域 $a,b,c\\ge0,\\ a+b+c=1$（有界闭）上连续，最大值存在。内部驻点：$L=\\sqrt a+\\sqrt b+\\sqrt c+\\lambda\\left(a+b+c-1\\right)$，$L_a=\\dfrac{1}{2\\sqrt a}+\\lambda=0$（三式）$\\Rightarrow a=b=c=\\dfrac13$，$f=\\sqrt3$。边界（某变量为 $0$）：化为二元问题，最大在 $\\left(\\dfrac12,\\dfrac12,0\\right)$ 型点，$f=\\sqrt2<\\sqrt3$。故 $f_{\\max}=\\sqrt3$。∎\n\n**检验**：$a=b=c=\\dfrac13$：$f=3\\cdot\\dfrac{1}{\\sqrt3}=\\sqrt3$ ✓；$a=1,b=c=0$：$f=1<\\sqrt3$ ✓。\n\n**方法总结**：路线一供选择题秒杀、路线二供解答题满分；**同一道题在卷面上写路线二，草稿上用路线一互核**，是压轴不等式的性价比策略。"}}},"多元积分":{"key":"多元积分","title":"多元积分学习题集（重积分·线积分·面积分·场论·综合证明）— CMC 全国大学生数学竞赛备战笔记（聚焦版）","introMd":"> **适用对象**：CMC 非数学类（A 类）考生；考研数学一冲高分者同样适用。\n> **覆盖范围**：二重积分换序与\"积不出\"识别、倒挂限、极坐标与广义极坐标、对称性与轮换对称、分块（绝对值 / max / 取整）、投影法与截面法、柱面坐标、球面坐标定限与广义球、第一型线面积分（$dS$ 投影、齐次与 Euler）、第二型线面积分、格林公式（补线 / 挖洞 / 抵消构造）、路径无关与原函数、高斯公式（闭曲面 / 补面 / 点源挖洞）、斯托克斯与空间曲线、场论三度与方向导数型面积分、交换次序证积分等式、Schwarz 不等式与 Chebyshev 相关不等式、升维法（高斯积分族、球面切片、还原曲面）。\n> **组织方式**：按**方法技巧思想**分类，共 5 部分 18 类；**聚焦 CMC 高频考点与难点**——初赛每卷稳定出现\"格林 / 高斯 / 线面积分大题\"与\"换序、对称性填空\"，故第三、四部分（线面积分）与 1.1、1.3 写满；课内已熟练的基本功（直角坐标定限、公式直接套用）只作起步动作一带而过；冷门考点（一般 e y\\le\\varphi_2(x)\\}$，画草图；\n2. **换向扫描**：把 $D$ 竖着切改为横着切，求出新的范围 $D=\\{(x,y): c\\le y\\le d,\\ \\psi_1(y)\\le x\\le\\psi_2(y)\\}$；\n3. **回代定限**：写出新的累次积分，内层往往变成 $\\int(\\psi_2-\\psi_1)g(y)\\,dy$ 的可积形式。\n\n**必背\"积不出\"函数清单**（见到它们，先想换序或分部）：$e^{x^2},\\ e^{-x^2},\\ \\dfrac{\\sin x}{x},\\ \\dfrac{\\cos x}{x},\\ \\sin x^2,\\ \\cos x^2,\\ \\dfrac{1}{\\ln x},\\ \\dfrac{e^x}{x}$。\n\n> <span style=\"color:#e53935\">**头号陷阱——上下限\"倒挂\"**：如 $\\displaystyle\\int_0^1 dx\\int_{\\sqrt x}^{x}\\dfrac{\\cos y}{y}\\,dy$，在 $(0,1)$ 上 $\\sqrt x>x$，上限小于下限（第 15 届 B 类填空 (5) 原型）。它等于 $-\\displaystyle\\iint_{x\\le y\\le\\sqrt x}$，**区域本身合法，值带负号**。见例 1.1-2。</span>\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 倒挂限直接当正常区域算 | 先加负号还原：$\\int_a^b=b>a$ 时才正常，否则 $\\int_{\\sqrt x}^{x}=-\\int_x^{\\sqrt x}$ |\n| 换序后新区域边界求错 | 曲线 $y=x^2$ 与 $y=\\sqrt x$ 互为反函数，交换 $x,y$ 角色后边界方程互换 |\n| 三角域/圆弧域换序漏交界 | 扫描线与边界相切处（交点）必须分段 |","examplesMd":"**【例 1.1-1】（★★，经典）** 计算：\n(1) $\\displaystyle\\int_0^1 dx\\int_x^1 e^{y^2}\\,dy$；　(2) $\\displaystyle\\int_0^1 dx\\int_x^1 \\dfrac{\\sin y}{y}\\,dy$。\n\n**思路分析**：内层 $e^{y^2}$、$\\dfrac{\\sin y}{y}$ 均积不出 → 换序。区域都是三角形 $D=\\{0\\le x\\le y\\le1\\}$。\n\n**详细解答**：区域 $D$：$0\\le y\\le1$，$0\\le x\\le y$（横着扫描）。\n\n(1) 原式 $=\\displaystyle\\iint_D e^{y^2}\\,d\\sigma=\\int_0^1 e^{y^2}\\,dy\\int_0^y dx=\\int_0^1 y\\,e^{y^2}\\,dy=\\dfrac12\\int_0^1 e^{y^2}d(y^2)=\\dfrac{e-1}{2}$。\n\n(2) 原式 $=\\displaystyle\\int_0^1 \\dfrac{\\sin y}{y}\\,dy\\int_0^y dx=\\int_0^1 \\sin y\\,dy=1-\\cos1$。\n\n**检验**：(2) 数值抽验 $\\cos1\\approx0.5403$，答案 $\\approx0.4597>0$ ✓（被积函数在 $D$ 上非负，结果为正合理）。\n\n**方法总结**：==换序的本质动作只有一个：把内层\"积不出\"的函数变成外层乘子 $\\int_0^y dx=y$==。三角形区域 $0\\le x\\le y\\le1$ 是最常考载体。\n\n**【例 1.1-2】（★★，真题风格）** 计算 $I=\\displaystyle\\int_0^1 dx\\int_{\\sqrt x}^{x}\\dfrac{\\cos y}{y}\\,dy$。\n\n**思路分析**：上限 $\\sqrt x$ 与下限 $x$ 在 $(0,1)$ 上\"倒挂\"→ 先取负号还原正常区域，再换序。\n\n**详细解答**：$I=-\\displaystyle\\iint_{D}\\dfrac{\\cos y}{y}\\,d\\sigma$，其中 $D=\\{0\\le x\\le1,\\ x\\le y\\le\\sqrt x\\}$。\n\n换序：曲线 $y=\\sqrt x$ 即 $x=y^2$，曲线 $y=x$ 即 $x=y$；在 $D$ 内 $x$ 介于两者之间，$0\\le y\\le1$：\n\n$I=-\\displaystyle\\int_0^1\\frac{\\cos y}{y}\\,dy\\int_{y^2}^{y}dx=-\\int_0^1\\frac{\\cos y}{y}(y-y^2)\\,dy=-\\int_0^1(1-y)\\cos y\\,dy$\n\n分部积分：$\\displaystyle\\int_0^1(1-y)\\cos y\\,dy=\\Big[(1-y)\\sin y\\Big]_0^1+\\int_0^1\\sin y\\,dy=0+\\big(1-\\cos1\\big)$\n\n故 $I=\\cos1-1$。\n\n**检验**：数值抽验 $-\\int_0^1(1-y)\\cos y\\,dy\\approx-0.4597=\\cos1-1$ ✓；内层倒挂使整体取负，符号正确。\n\n**方法总结**：倒挂三板斧：**认出倒挂（上限<下限）→ 取负还原区域 → 按正常流程换序**。第 15 届 B 类填空 (5) 即此题型（详见《专题笔记》§4.1）。"},"1.2":{"id":"1.2","name":"极坐标与广义极坐标（去根号与齐次思想）","part":"二重积分","book":"多元积分","teachMd":"**核心思想**：被积函数或区域含 $x^2+y^2$、$xy$ 等二次型结构时，极坐标 $x=r\\cos\\theta,\\ y=r\\sin\\theta,\\ d\\sigma=r\\,dr\\,d\\theta$ 把\"平方和\"线性化。\n\n**适用信号（三选一即用）**：\n\n1. 区域是圆 / 圆环 / 扇形 / 心形线 / 双纽线 / 玫瑰线；\n2. 被积函数含 $x^2+y^2$ 或 $\\sqrt{x^2+y^2}$；\n3. 分母为 $x^2+y^2$ 的齐次分式。\n\n**必背公式表**：\n\n| 对象 | 极坐标方程 | 备注 |\n| --- | --- | --- |\n| 圆 $x^2+y^2=2ax$ | $r=2a\\cos\\theta$ | 圆心 $(a,0)$，$\\theta\\in[-\\frac\\pi2,\\frac\\pi2]$ |\n| 圆 $x^2+y^2=2ay$ | $r=2a\\sin\\theta$ | 圆心 $(0,a)$，$\\theta\\in[0,\\pi]$ |\n| 心形线 | $r=a(1+\\cos\\theta)$ | 面积 $\\dfrac32\\pi a^2$，弧长 $8a$ |\n| 双纽线 $r^2=a^2\\cos2\\theta$（$a^2=r_0^2$ 记法见题） | 两支，$\\theta\\in[-\\frac\\pi4,\\frac\\pi4]\\cup[\\frac{3\\pi}4,\\frac{5\\pi}4]$ | 单支面积 $\\dfrac{a^2}2$ |\n| 椭圆 $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}\\le1$ | 广义极坐标 $x=ar\\cos\\theta,\\ y=br\\sin\\theta$ | $d\\sigma=ab\\,r\\,dr\\,d\\theta$ |\n\n**起步动作（课内已熟）**：$d\\sigma=r\\,dr\\,d\\theta$；先画区域定 $\\theta$ 范围，再从原点向外穿线定 $r$ 范围。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 忘乘 Jacobi 因子 $r$ | $d\\sigma=r\\,dr\\,d\\theta$，漏 $r$ 是最高频计算错误 |\n| 圆 $x^2+y^2=2ax$ 的 $\\theta$ 范围写成 $[0,2\\pi]$ | 圆不过原点也**要从原点穿线**：该圆 $\\theta\\in[-\\frac\\pi2,\\frac\\pi2]$ |\n| 心形线上 $\\cos\\theta$ 变号段直接去绝对值 | $r\\ge0$ 恒成立（$1+\\cos\\theta\\ge0$），但双纽线必须分支处理 |","examplesMd":"**【例 1.2-1】（★★，经典）** 设 $D$ 为心形线 $r=a(1+\\cos\\theta)$ 所围区域，计算 $\\displaystyle\\iint_D x\\,d\\sigma$ 与 $\\displaystyle\\iint_D y\\,d\\sigma$。\n\n**思路分析**：先查对称性（1.3 纪律）：$D$ 关于 $x$ 轴对称，$y$ 是 $y$ 的奇函数 → 直接归零；$x$ 是 $y$ 的偶函数，极坐标硬算。\n\n**详细解答**：\n\n$\\displaystyle\\iint_D y\\,d\\sigma=0$（$D$ 关于 $x$ 轴对称，被积函数关于 $y$ 为奇）。\n\n$\\displaystyle\\iint_D x\\,d\\sigma=\\int_0^{2\\pi}d\\theta\\int_0^{a(1+\\cos\\theta)}r\\cos\\theta\\cdot r\\,dr=\\dfrac{a^3}3\\int_0^{2\\pi}\\cos\\theta(1+\\cos\\theta)^3d\\theta$\n\n展开 $(1+\\cos\\theta)^3\\cos\\theta=\\cos\\theta+3\\cos^2\\theta+3\\cos^3\\theta+\\cos^4\\theta$，其中 $\\cos\\theta,\\cos^3\\theta$ 积分为零，$\\displaystyle\\int_0^{2\\pi}\\cos^2\\theta d\\theta=\\pi$，$\\displaystyle\\int_0^{2\\pi}\\cos^4\\theta d\\theta=\\dfrac{3\\pi}4$（华里士公式，见《一元积分学习题集》2.4），故\n\n$\\displaystyle\\iint_D x\\,d\\sigma=\\dfrac{a^3}3\\Big(3\\pi+\\dfrac{3\\pi}4\\Big)=\\dfrac{5\\pi a^3}4$\n\n**检验**：$D$ 面积 $\\dfrac32\\pi a^2$，形心 $x$ 坐标 $=\\dfrac{5\\pi a^3/4}{3\\pi a^2/2}=\\dfrac{5a}6$，恰为心形线形心标准值 ✓。\n\n**方法总结**：==对称性先查后算：奇函数过对称轴直接归零，剩下的才动极坐标==。心形线积分全靠华里士公式收尾。\n\n**【例 1.2-2】（★★，竞赛风格）** 计算 $\\displaystyle\\iint_D\\sqrt{1-\\dfrac{x^2}4-\\dfrac{y^2}9}\\ d\\sigma$，其中 $D:\\dfrac{x^2}4+\\dfrac{y^2}9\\le1$。\n\n**思路分析**：椭圆区域 + 被积函数只含 $\\dfrac{x^2}4+\\dfrac{y^2}9$ 这一整体 → 广义极坐标一步线性化。\n\n**详细解答**：令 $x=2r\\cos\\theta,\\ y=3r\\sin\\theta$，则 $d\\sigma=6r\\,dr\\,d\\theta$，被积函数 $=\\sqrt{1-r^2}$：\n\n$I=\\displaystyle\\int_0^{2\\pi}d\\theta\\int_0^16r\\sqrt{1-r^2}\\,dr=12\\pi\\cdot\\Big[-\\dfrac13(1-r^2)^{3/2}\\Big]_0^1=12\\pi\\cdot\\dfrac13=4\\pi$\n\n**检验**：几何复核：该积分即上半椭球面 $z=\\sqrt{1-x^2/4-y^2/9}$ 下方体积 $=\\dfrac12\\cdot\\dfrac43\\pi\\cdot2\\cdot3\\cdot1=4\\pi$ ✓。\n\n**方法总结**：椭圆配**广义极坐标**（$d\\sigma=ab\\,r\\,dr\\,d\\theta$），本质与普通极坐标相同——把二次型化成 $r^2$。"},"1.3":{"id":"1.3","name":"对称性与轮换对称（先查后算思想）","part":"二重积分","book":"多元积分","teachMd":"**核心思想**：CMC 线面积分大题的\"第一反应\"不是算，而是**查对称**。区域对称 + 函数奇偶配合，可把二重积分砍半甚至归零；区域关于 $x,y$（或 $x,y,z$）**轮换不变**时，$\\iint x^2$ 与 $\\iint y^2$ 相等，配平可秒出整体。\n\n**必背公式矩阵**（$D$ 关于 $y$ 轴对称，$D^*$ 关于原点对称等情形类推）：\n\n| 区域对称性 | 函数条件 | 结论 |\n| --- | --- | --- |\n| 关于 $x$ 轴对称 | $f(x,-y)=-f(x,y)$（关于 $y$ 奇） | $\\iint_D f\\,d\\sigma=0$ |\n| 关于 $x$ 轴对称 | $f(x,-y)=f(x,y)$（关于 $y$ 偶） | $=2\\iint_{D_{y\\ge0}}f\\,d\\sigma$ |\n| 关于 $y=x$ 对称（轮换） | 任意 $f$ | $\\iint_D f(x,y)d\\sigma=\\iint_D f(y,x)d\\sigma$ |\n\n**轮换配平速用**：$D$ 关于 $y=x$ 对称（如圆域、正方形、菱形 $|x|+|y|\\le1$）时：\n\n$\\displaystyle\\iint_D x^2\\,d\\sigma=\\iint_D y^2\\,d\\sigma=\\dfrac12\\iint_D(x^2+y^2)\\,d\\sigma$\n\n**形心反用**（$D$ 面积 $A$、形心 $(\\bar x,\\bar y)$）：\n\n$\\displaystyle\\iint_D x\\,d\\sigma=A\\bar x,\\qquad \\iint_D y\\,d\\sigma=A\\bar y$\n\n**起步动作**：拿到 $\\iint_D f$，先花 10 秒三连问：区域对称吗？函数关于哪个变量奇/偶？区域轮换不变吗？\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 只查区域不查函数（或反之） | 必须\"区域对称 × 函数奇偶\"**成对**成立才能归零 |\n| 圆 $(x-a)^2+y^2\\le R^2$ 用奇偶性归零 $\\iint x$ | 圆心不在原点，关于 $y$ 轴不对称；移轴后再用形心 |\n| 轮换对称当成普通对称 | 轮换是\"换名字不变\"，不需镜像对称轴 |","examplesMd":"**【例 1.3-1】（★★，经典）** 计算 $\\displaystyle\\iint_{x^2+y^2\\le1}(2x+3y+1)^2\\,d\\sigma$，并由此写出一遍公式。\n\n**思路分析**：区域轮换、函数平方展开——先展开，交叉项与奇次项全部归零，只剩矩量。\n\n**详细解答**：展开 $(2x+3y+1)^2=4x^2+9y^2+1+12xy+4x+6y$。圆心在原点：\n\n- $12xy$：关于 $x$（或 $y$）奇 → $0$；$4x,\\ 6y$：奇 → $0$；\n- $\\displaystyle\\iint x^2d\\sigma=\\iint y^2d\\sigma=\\dfrac12\\iint(x^2+y^2)d\\sigma=\\dfrac12\\int_0^{2\\pi}d\\theta\\int_0^1r^2\\cdot r\\,dr=\\dfrac\\pi4$。\n\n故原式 $=4\\cdot\\dfrac\\pi4+9\\cdot\\dfrac\\pi4+1\\cdot\\pi=13\\cdot\\dfrac\\pi4+\\pi=\\dfrac{17\\pi}4$。\n\n**一遍公式**（单位圆盘）：$\\displaystyle\\iint_{x^2+y^2\\le R^2}(ax+by+c)^2d\\sigma=\\dfrac{\\pi R^4}4(a^2+b^2)+\\pi R^2c^2$。\n\n**检验**：$a=2,b=3,c=1,R=1$ 代入公式：$\\dfrac\\pi4(13)+\\pi=\\dfrac{17\\pi}4$ ✓（SymPy 极坐标直算一致）。\n\n**方法总结**：==展开 → 奇次归零 → 轮换配平 → 只算 $\\iint(x^2+y^2)$==。线性函数平方永远这么处理。\n\n**【例 1.3-2】（★★，巧题）** 计算 $\\displaystyle\\iint_D(x+y)\\,d\\sigma$，其中 $D:x^2+y^2\\le2x+2y$。\n\n**思路分析**：区域是圆 $(x-1)^2+(y-1)^2\\le2$——**移轴后用形心**，一行出答案。\n\n**详细解答**：圆心 $(1,1)$、半径 $\\sqrt2$、面积 $A=2\\pi$。由形心公式（形心即圆心）：\n\n$\\displaystyle\\iint_D(x+y)\\,d\\sigma=A(\\bar x+\\bar y)=2\\pi(1+1)=4\\pi$\n\n**检验**：移轴 $x=1+u,\\ y=1+v$：$\\iint(2+u+v)=2A+0+0=4\\pi$ ✓。\n\n**方法总结**：==一次式配圆：$\\iint f_{一次}\\,d\\sigma=$（形心处函数值）×（面积）==。竞赛中遇到\"斜圆配一次式\"，这是最快路径。"},"1.4":{"id":"1.4","name":"分块处理（变号线与相等线思想）","part":"二重积分","book":"多元积分","teachMd":"**核心思想**：绝对值 $|f|$、最大值 $\\max(f,g)$、取整 $\\lfloor f\\rfloor$ 不是\"算不了\"，而是**自带分块线**：$|f|$ 的分块线是 $f=0$（变号线），$\\max(f,g)$ 的分块线是 $f=g$（相等线）。找出分块线，积分区域一分为二，每块上函数变成初等形式。\n\n**转化速查表**：\n\n| 结构 | 分块线 | 每块上的形式 |\n| --- | --- | --- |\n| $\\lvert x^2+y^2-1\\rvert$ | 单位圆 $r=1$ | 内负外正 |\n| $\\max(x^2,y^2)$ | $y=\\pm x$ | $|y|\\ge|x|$ 处取 $y^2$ |\n| $\\lfloor x+y\\rfloor$ | $x+y=$ 整数 | 每条带内为常数 |\n| $e^{\\max(x^2,y^2)}$ | $y=\\pm x$ | 与 $\\max$ 同结构 |\n\n**常用技巧**：对称区域上 $\\max$ 型常用\"$2\\iint_{y\\ge x \\text{（区域一半）}}$\"翻倍；$\\lfloor\\cdot\\rfloor$ 常转化为面积加权。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\iint\\lvert f\\rvert$ 当 $\\pm\\iint f$ 处理 | 绝对值必须**分块去绝对值**再积分 |\n| $\\max(x^2,y^2)$ 的分块线写成 $x=y$ 一条 | $y^2=x^2\\iff y=\\pm x$，共两条线 |\n| 分块后忘合并 / 漏块 | 分块完先写\"两块之和\"的框架再逐块算 |","examplesMd":"**【例 1.4-1】（★★，经典）** 计算 $\\displaystyle\\iint_{x^2+y^2\\le4}\\big|x^2+y^2-1\\big|\\,d\\sigma$。\n\n**思路分析**：变号线是单位圆 $r=1$——分 $r\\le1$ 与 $1\\le r\\le2$ 两块。\n\n**详细解答**：极坐标：\n\n$I=\\displaystyle\\int_0^{2\\pi}d\\theta\\Big[\\int_0^1(1-r^2)r\\,dr+\\int_1^2(r^2-1)r\\,dr\\Big]=2\\pi\\Big[\\Big(\\dfrac12-\\dfrac14\\Big)+\\Big(\\dfrac{16-4}{4}-\\dfrac{4-1}{2}\\Big)\\Big]$\n\n$=2\\pi\\Big[\\dfrac14+\\Big(3-\\dfrac32\\Big)\\Big]=2\\pi\\cdot\\dfrac52=5\\pi$\n\n**检验**：内圆盘上均值 $\\dfrac{\\int_0^1(1-r^2)rdr}{\\int_0^1rdr}=\\dfrac{1/4}{1/2}=\\dfrac12$，外环上均值 $\\dfrac{\\int_1^2(r^2-1)rdr}{\\int_1^2rdr}=\\dfrac{9/4}{3/2}=\\dfrac32$，加权 $\\dfrac{\\pi\\cdot\\frac12+3\\pi\\cdot\\frac32}{4\\pi}=\\dfrac54$，乘总面积 $4\\pi$ 得 $5\\pi$ ✓。\n\n**方法总结**：==圆域上 $|r^2-a|$ 型：以 $r=\\sqrt a$ 为界分两块，全部化为一元 $r$ 的多项式积分==。\n\n**【例 1.4-2】（★★，竞赛风格）** 计算 $\\displaystyle\\iint_{[0,1]^2}\\max(x^2,y^2)\\,d\\sigma$。\n\n**思路分析**：相等线 $x=y$ 把单位正方形分成两块，由对称性两块积分相等——翻倍即可。\n\n**详细解答**：当 $0\\le x\\le y\\le1$ 时 $\\max=y^2$，另一块对称：\n\n$I=2\\displaystyle\\iint_{0\\le x\\le y\\le1}y^2\\,d\\sigma=2\\int_0^1 y^2\\,dy\\int_0^y dx=2\\int_0^1y^3\\,dy=\\dfrac12$\n\n**检验**：$\\max(x^2,y^2)\\ge\\dfrac{x^2+y^2}2$，$\\iint\\dfrac{x^2+y^2}2=\\dfrac13$，$\\dfrac12\\ge\\dfrac13$ ✓。\n\n**方法总结**：==max 型三板斧：找相等线 → 用对称翻倍 → 一块积分==。"},"2.1":{"id":"2.1","name":"投影法（先一后二思想）","part":"三重积分","book":"多元积分","teachMd":"**核心思想**：$\\Omega$ 夹在两张曲面 $z=z_1(x,y)$（下）与 $z=z_2(x,y)$（上）之间时，先竖着穿线积 $z$，剩一个二重积分交给 $D_{xy}$——**三重降二重，二重再选坐标**。\n\n$\\displaystyle\\iiint_\\Omega f\\,dV=\\iint_{D_{xy}}d\\sigma\\int_{z_1(x,y)}^{z_2(x,y)}f\\,dz$\n\n**适用信号**：上下曲面方程都好写、投影区域是圆 / 椭圆 / 多边形；被积函数与 $z$ 无关时更佳（内层直接出高度差）。\n\n**起步动作（课内已熟）**：联立两曲面方程消 $z$ 得投影边界；穿线方向从下曲面穿入、上曲面穿出。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 上下曲面判反（谁在上随区域可能换） | 在投影内取一点代入两个 $z$ 值比较 |\n| 投影区域求错（忘消 $z$） | 边界必由 $z_1=z_2$ 而来，不是某一曲面的自然边界 |\n| 立体需分块（上下曲面在中途换角色）时一算了之 | 穿线发现\"入出面切换\"就必须分块 |","examplesMd":"**【例 2.1-1】（★，经典）** 求 $z=x^2+y^2$ 与 $z=2-x^2-y^2$ 围成的立体体积。\n\n**思路分析**：两抛物面上下夹逼，投影是圆——投影法 + 极坐标。\n\n**详细解答**：消 $z$：$x^2+y^2=1$，投影 $D:r\\le1$。上−下高度 $=2-2r^2$：\n\n$V=\\displaystyle\\iint_D(2-2r^2)\\,d\\sigma=\\int_0^{2\\pi}d\\theta\\int_0^1(2-2r^2)r\\,dr=2\\pi\\Big(1-\\dfrac12\\Big)=\\pi$\n\n**检验**：高度最大 $2$（原点）、边界 $0$，均值约 $1$ 乘面积 $\\pi$ ✓。\n\n**方法总结**：==双曲面夹体：消 $z$ 定投影 → 高度差一个二重积分==。\n\n**【例 2.1-2】（★★，经典名题）** 求\"冰激凌\"立体 $\\Omega:\\sqrt{x^2+y^2}\\le z\\le\\sqrt{2-x^2-y^2}$ 的体积。\n\n**思路分析**：锥面 $z=\\sqrt{x^2+y^2}$（开口向上）在下方、球面 $z=\\sqrt{2-r^2}$ 在上方；交线由联立 $r=\\sqrt{2-r^2}$ 解得 $r=1$、$z=1$。\n\n**详细解答**：投影 $D:r\\le1$，高度差 $=\\sqrt{2-r^2}-r$：\n\n$V=\\displaystyle\\int_0^{2\\pi}d\\theta\\int_0^1\\big(\\sqrt{2-r^2}-r\\big)r\\,dr=2\\pi\\Big[\\int_0^1r\\sqrt{2-r^2}\\,dr-\\dfrac13\\Big]$\n\n$\\displaystyle\\int_0^1r\\sqrt{2-r^2}\\,dr\\overset{u=2-r^2}{=}\\dfrac12\\int_1^2\\sqrt u\\,du=\\dfrac13\\big(2\\sqrt2-1\\big)$\n\n故 $V=2\\pi\\Big[\\dfrac{2\\sqrt2-2}3\\Big]=\\dfrac{4(\\sqrt2-1)\\pi}3\\approx1.736$。\n\n**检验**：SymPy 极坐标复核 $=\\dfrac{4(\\sqrt2-1)\\pi}3$ ✓；对比：同球上半球体积 $\\dfrac{4\\pi(\\sqrt2)^3}6\\approx5.90$，冰激凌只是其一角 ✓。\n\n**方法总结**：锥 + 球是投影法的标准载体；交线\"锥顶球\"必由 $r=\\sqrt{2-r^2}$ 型方程解出。"},"2.2":{"id":"2.2","name":"球面坐标与广义球（从原点穿线思想）","part":"三重积分","book":"多元积分","teachMd":"**核心思想**：$\\Omega$ 是球、锥、或含 $x^2+y^2+z^2$ 的\"从原点看出去\"的立体时，用\n\n$x=r\\sin\\varphi\\cos\\theta,\\quad y=r\\sin\\varphi\\sin\\theta,\\quad z=r\\cos\\varphi,\\quad dV=r^2\\sin\\varphi\\,dr\\,d\\varphi\\,d\\theta$\n\n**两步定限法（真题主战场）**：\n\n1. **先定角度**：从原点向立体发射线，确定 $\\theta$（绕 $z$ 轴）与 $\\varphi$（自 $+z$ 轴向下）的范围——常由锥（$\\varphi=$ 常数）与过 $z$ 轴的半平面（$\\theta=$ 常数）圈出；\n2. **再穿射线**：固定方向 $(\\theta,\\varphi)$，从原点 (或内边界 $r_1$) 穿到外边界 $r_{\\max}(\\theta,\\varphi)$——把边界曲面方程化成 $r$ 的方程解出。\n\n**必背三条边界转换**：\n\n| 曲面（直角） | 球坐标方程 |\n| --- | --- |\n| 球 $x^2+y^2+z^2=a^2$ | $r=a$ |\n| 锥 $z=k\\sqrt{x^2+y^2}$ | $\\tan\\varphi=\\dfrac1k$（如 $z=r\\Rightarrow\\varphi=\\dfrac\\pi4$；$z$ 轴即 $\\varphi=0$） |\n| 球 $x^2+y^2+z^2=2az$ | $r=2a\\cos\\varphi$（球心 $(0,0,a)$） |\n\n**广义球代换**：椭球 $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}+\\dfrac{z^2}{c^2}\\le1$ 用 $x=ar\\sin\\varphi\\cos\\theta,\\ y=br\\sin\\varphi\\sin\\theta,\\ z=cr\\cos\\varphi$，$dV=abc\\,r^2\\sin\\varphi\\,drd\\varphi d\\theta$。\n\n> <span style=\"color:#e53935\">**头号陷阱——$\\sin\\varphi$ 与 $\\cos\\varphi$ 写反**：$\\varphi$ 从 $+z$ 轴量起，故 $z=r\\cos\\varphi$。球 $x^2+y^2+z^2=2z$（球心在 $z$ 轴正方向）对应 $r=2\\cos\\varphi$ 且 $\\varphi\\in[0,\\frac\\pi2]$；写成 $2\\sin\\varphi$ 则体积算出 $2\\pi^2$（错），正确应为 $\\dfrac{4\\pi}3$（单位球体积）。</span>\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 边界 $r_{\\max}$ 解错（如 $r^4\\le a^2r^2\\sin^2\\varphi$ 应得 $r\\le a\\sin\\varphi$，漏平方/开方是高频错） | 两边先除 $r^2$ 再开方，逐项检查量纲 |\n| $\\theta$、$\\varphi$ 范围由\"想象\"给出 | $\\theta$ 看绕 $z$ 轴的经度范围，$\\varphi$ 看锥角，务必画图 |\n| 忘乘 $r^2\\sin\\varphi$ | 球坐标 Jacobi 必背 |","examplesMd":"**【例 2.2-1】（★★，经典）** 计算 $\\displaystyle\\iiint_\\Omega z\\,dV$，其中 $\\Omega$ 由锥面 $z=\\sqrt{x^2+y^2}$ 与球面 $x^2+y^2+z^2=1$ 围成（锥内部分）。\n\n**思路分析**：锥 + 球——球坐标两步定限：$\\varphi\\in[0,\\frac\\pi4]$（锥内），$r\\in[0,1]$。\n\n**详细解答**：\n\n$I=\\displaystyle\\int_0^{2\\pi}d\\theta\\int_0^{\\pi/4}d\\varphi\\int_0^1 r\\cos\\varphi\\cdot r^2\\sin\\varphi\\,dr=2\\pi\\cdot\\dfrac14\\cdot\\int_0^{\\pi/4}\\sin\\varphi\\cos\\varphi\\,d\\varphi=\\dfrac\\pi2\\cdot\\dfrac12\\sin^2\\varphi\\Big|_0^{\\pi/4}=\\dfrac\\pi8$\n\n**检验**：体积 $\\dfrac{\\pi}3(1-\\dfrac{\\sqrt2}2)$，粗估 $z$ 均值 $\\dfrac{3}8$ 量级，$\\dfrac{\\pi}8\\approx0.39$ 合理 ✓（SymPy 一致）。\n\n**方法总结**：==锥角定 $\\varphi$、球面定 $r$、绕轴定 $\\theta$==，三步各一句话。\n\n**【例 2.2-2】（★★★，真题风格）** 计算 $\\displaystyle\\iiint_\\Omega(x^2+y^2+z^2)\\,dV$，其中 $\\Omega:\\ (x^2+y^2+z^2)^2\\le a^2(x^2+y^2)$。\n\n**思路分析**：环索体（lemniscoid）——边界 $r^4\\le a^2r^2\\sin^2\\varphi$，即 $r\\le a\\sin\\varphi$，\"从原点看\"各方向都封在 $a$ 内。被积函数 $=r^2$。\n\n**详细解答**：由 $r^4\\le a^2r^2\\sin^2\\varphi$（$r>0$ 处）得 $r\\le a\\sin\\varphi$：\n\n$I=\\displaystyle\\int_0^{2\\pi}d\\theta\\int_0^{\\pi}d\\varphi\\int_0^{a\\sin\\varphi}r^2\\cdot r^2\\sin\\varphi\\,dr=2\\pi\\int_0^\\pi\\dfrac{a^5\\sin^5\\varphi}5\\cdot\\sin\\varphi\\,d\\varphi=\\dfrac{2\\pi a^5}5\\int_0^\\pi\\sin^6\\varphi\\,d\\varphi$\n\n华里士：$\\displaystyle\\int_0^\\pi\\sin^6\\varphi d\\varphi=2\\cdot\\dfrac56\\cdot\\dfrac34\\cdot\\dfrac12\\cdot\\dfrac\\pi2=\\dfrac{5\\pi}{16}$，故 $I=\\dfrac{2\\pi a^5}5\\cdot\\dfrac{5\\pi}{16}=\\dfrac{\\pi^2a^5}8$。\n\n**检验**：$a=1$ 时 SymPy 球坐标计算 $=\\dfrac{\\pi^2}8\\approx1.2337$ ✓；第 11 届大题 (二) 的核心定限动作与此完全相同（详见《专题笔记》真题 2，那里被积函数为 $\\dfrac{xyz}{x^2+y^2}$）。\n\n**方法总结**：四次型边界 $(x^2+y^2+z^2)^2\\le a^2(x^2+y^2)$ 一律\"除 $r^2$ 开方\"化成 $r\\le a\\sin\\varphi$。**漏开方直接用 $r^4$ 是本题的历史性错法**（《专题笔记》真题 2 易错点）。"},"2.3":{"id":"2.3","name":"截面法与柱面坐标（先二后一思想）","part":"三重积分","book":"多元积分","teachMd":"**核心思想**：当被积函数**只含 $z$**（或可轮换成只含一个变量），而水平截面 $D_z$ 的面积 $A(z)$ 容易计算时，先对截面二重积分（= 面积），再沿 $z$ 积一元：\n\n$\\displaystyle\\iiint_\\Omega f(z)\\,dV=\\int_{z_1}^{z_2}f(z)\\,A(z)\\,dz$\n\n**适用信号**：\n\n1. 被积函数只含 $z$（或只含 $x$、只含 $y$——换方向切片）；\n2. 截面是圆 / 椭圆 / 矩形（面积一眼可算），尤其是**两个曲面围成的\"变截面\"体**（第 15 届 A 类大题 (四) 椭球台即用此法）。\n\n**柱面坐标定位**：$\\displaystyle\\iiint f\\,dV=\\int_0^{2\\pi}d\\theta\\int_{r_1(\\theta)}^{r_2(\\theta)}r\\,dr\\int_{z_1}^{z_2}f\\,dz$——本质是\"投影法 + 极坐标\"，适合旋转体；与截面法互为镜像（**先积谁，谁的后处理简单就用谁**）。\n\n**必背截面面积**：半径 $\\rho(z)$ 的圆截面 $A=\\pi\\rho^2(z)$；椭球 $\\dfrac{x^2}{a^2}+\\dfrac{y^2}{b^2}\\le1-\\dfrac{z^2}{c^2}$ 的截面 $A(z)=\\pi ab\\Big(1-\\dfrac{z^2}{c^2}\\Big)$。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 函数含 $z$ 以外变量还硬用截面法 | 先轮换 / 移轴，不行就回 2.1 或 2.2 |\n| 截面半径由\"上曲面\"单方面给出 | $\\rho(z)$ 由上下曲面中**更靠内**者决定，取 $\\min$ |\n| 柱坐标忘乘 $r$ | 同极坐标，$dV=r\\,dz\\,dr\\,d\\theta$ |","examplesMd":"**【例 2.3-1】（★★，经典）** 计算 $\\displaystyle\\iiint_\\Omega(x^2+y^2)\\,dV$，其中 $\\Omega$ 由 $z=x^2+y^2$ 与 $z=4$ 围成。\n\n**思路分析**：函数含 $x^2+y^2$、区域是旋转抛物体——柱面坐标（投影 + 极坐标）。\n\n**详细解答**：\n\n$I=\\displaystyle\\int_0^{2\\pi}d\\theta\\int_0^2r\\,dr\\int_{r^2}^{4}r^2\\,dz=2\\pi\\int_0^2r^3(4-r^2)\\,dr=2\\pi\\Big[16-\\dfrac{64}6\\Big]=\\dfrac{32\\pi}3$\n\n**检验**：体积 $\\displaystyle\\iint(4-r^2)d\\sigma=8\\pi$，均值 $\\dfrac{32\\pi/3}{8\\pi}=\\dfrac43$，介于 $0$（轴上）与 $4$（边上）偏向小端 ✓。\n\n**方法总结**：==旋转体 + $x^2+y^2$ 因子 = 柱面坐标直接送分==。\n\n**【例 2.3-2】（★★，经典）** 计算 $\\displaystyle\\iiint_\\Omega z\\,dV$，其中 $\\Omega$ 由锥面 $z=\\sqrt{x^2+y^2}$ 与平面 $z=1$ 围成。\n\n**思路分析**：函数只含 $z$，锥的截面半径 $\\rho(z)=z$——截面法一步化一元。\n\n**详细解答**：$z\\in[0,1]$，截面 $D_z:\\ x^2+y^2\\le z^2$，$A(z)=\\pi z^2$：\n\n$I=\\displaystyle\\int_0^1z\\cdot\\pi z^2\\,dz=\\dfrac\\pi4$\n\n**检验**：体积 $\\dfrac\\pi3$，均值 $\\dfrac34$（锥形重心在 $\\dfrac34$ 高度处，标准结论 ✓）；柱面坐标复核 $\\int_0^{2\\pi}d\\theta\\int_0^1rdr\\int_r^1z\\,dz=\\pi\\int_0^1(1-r^2)r\\,dr=\\dfrac\\pi4$ ✓。\n\n**方法总结**：==锥体截面 $\\pi z^2$、抛物体截面 $\\pi z$、球截面 $\\pi(R^2-z^2)$，三个现成公式背熟==。"},"3.1":{"id":"3.1","name":"第一类曲线积分（对称性与形心反用思想）","part":"曲线积分","book":"多元积分","teachMd":"**核心思想**：$\\displaystyle\\int_L f\\,ds$ 中 $ds$ 与方向无关（\"对弧长\"），因此**对称性照常可用**——这是它与第二类最大的区别，也是竞赛第一考点。\n\n**必背三件套**：\n\n| 工具 | 内容 |\n| --- | --- | --- |\n| 参数化 | $\\displaystyle\\int_L f\\,ds=\\int_\\alpha^\\beta f(x(t),y(t))\\sqrt{x'^2(t)+y'^2(t)}\\,dt$（极坐标下 $ds=\\sqrt{r^2+r'^2}\\,d\\theta$） |\n| 奇偶杀半 | $L$ 关于 $x$ 轴对称、$f$ 关于 $y$ 为奇 $\\Rightarrow$ 积分为 $0$ |\n| 轮换配平 | $L$ 轮换不变（如圆）$\\Rightarrow\\displaystyle\\oint_Lx^2ds=\\oint_Ly^2ds=\\dfrac12\\oint_L(x^2+y^2)ds$ |\n\n**形心反用**：$\\displaystyle\\int_Lx\\,ds=\\bar x\\cdot L_{弧长}$（圆弧形心在圆心角平分线上、距圆心 $\\dfrac{2R\\sin(\\Delta\\theta/2)}{\\Delta\\theta}$ 处——半圆弧形心距圆心 $\\dfrac{2R}\\pi$）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $ds$ 写成 $\\sqrt{x'^2-y'^2}$ 或漏绝对值 | $ds=\\sqrt{x'^2+y'^2}\\,dt$（三维加 $z'^2$），恒正 |\n| 心形线 $ds$ 中 $\\cos\\frac\\theta2$ 直接去绝对值 | $\\theta\\in[-\\pi,\\pi]$ 时 $\\cos\\frac\\theta2\\ge0$ 可以去；一般区间先检查符号 |\n| 第一类积分用\"方向\"约分 | $ds$ 无方向，上下限必须小在下大在上 |","examplesMd":"**【例 3.1-1】（★★，经典）** 计算 $\\displaystyle\\int_L\\sqrt{x^2+y^2}\\,ds$，其中 $L$ 为心形线 $r=a(1+\\cos\\theta)$（$a>0$）。\n\n**思路分析**：被积函数即 $r$ 本身；极坐标弧微元 $ds=\\sqrt{r^2+r'^2}\\,d\\theta=a\\sqrt{2+2\\cos\\theta}\\,d\\theta=2a\\left|\\cos\\dfrac\\theta2\\right|d\\theta$。\n\n**详细解答**：$\\theta\\in[-\\pi,\\pi]$ 上 $\\cos\\dfrac\\theta2\\ge0$：\n\n$I=\\displaystyle\\int_{-\\pi}^{\\pi}a(1+\\cos\\theta)\\cdot2a\\cos\\frac\\theta2\\,d\\theta=4a^2\\int_{-\\pi}^{\\pi}\\cos^3\\frac\\theta2\\,d\\theta=4a^2\\cdot2\\int_0^{\\pi}\\cos^3\\frac\\theta2\\,d\\theta$\n\n$u=\\dfrac\\theta2$：$=16a^2\\displaystyle\\int_0^{\\pi/2}\\cos^3u\\,du=16a^2\\cdot\\dfrac23=\\dfrac{32a^2}3$\n\n**检验**：$a=1$ 数值积分 $10.6667=\\dfrac{32}3$ ✓；量纲：弧长 $\\sim a$、函数 $\\sim a$，结果 $\\sim a^2$ ✓。\n\n**方法总结**：==极坐标曲线的 $ds=\\sqrt{r^2+r'^2}\\,d\\theta$；心形线化半角是标准动作==。\n\n**【例 3.1-2】（★★，概念经典）** 计算 $\\displaystyle\\oint_L(x^2+y^2)\\,ds$ 与 $\\displaystyle\\oint_Lx^2\\,ds$，其中 $L:x^2+y^2=R^2$。\n\n**思路分析**：圆轮换不变——$x^2+y^2=R^2$ 在 $L$ 上是**常数**。\n\n**详细解答**：\n\n$\\displaystyle\\oint_L(x^2+y^2)\\,ds=R^2\\oint_Lds=R^2\\cdot2\\pi R=2\\pi R^3$\n\n$\\displaystyle\\oint_Lx^2\\,ds=\\dfrac12\\oint_L(x^2+y^2)ds=\\pi R^3$（轮换配平）\n\n**检验**：参数化直算 $\\displaystyle\\oint x^2ds=\\int_0^{2\\pi}R^2\\cos^2\\theta\\cdot R\\,d\\theta=R^3\\pi$ ✓。\n\n**方法总结**：==曲线方程可以代入被积函数（\"边界值代入\"）；轮换配平再砍一半==。这两条是第一类积分的\"免费午餐\"。"},"3.2":{"id":"3.2","name":"格林公式（闭曲线·补线·挖洞思想）","part":"曲线积分","book":"多元积分","teachMd":"**核心思想**：格林公式把平面第二类闭曲线积分翻成二重积分：\n\n$\\displaystyle\\oint_{L^+}P\\,dx+Q\\,dy=\\iint_D\\Big(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\Big)d\\sigma$\n\n（$L^+$ 为正向：沿曲线走、区域在左手侧，即逆时针。）**使用前必查奇点**：$P,Q$ 须在 $D$ 内有一阶连续偏导。三大套路按情形对号：\n\n| 情形 | 套路 | 关键动作 |\n| --- | --- | --- |\n| 闭曲线、内部无奇点 | **直接用** | 算 $\\dfrac{\\partial Q}{\\partial x}-\\dfrac{\\partial P}{\\partial y}$，常为常数或简单式 |\n| 不闭 + 抵消构造 | **补线** | 补一条易算线段（常沿坐标轴），减去补线积分；或 $P\\,dx+Q\\,dy$ 中含 $e^x\\sin y$ 等抵消结构 |\n| 闭曲线、内部有奇点 | **挖洞** | 取包含奇点的小椭圆 / 小圆，在环形域用格林，内边界取**顺时针**（对环形域是正向） |\n\n**勘误式复盘（重要）**——方向与补线符号（整理者亲历）：\n\n> 错误：计算 $\\displaystyle\\int_L(x-y)\\,dx+(x+y)\\,dy$，$L$ 为上半圆 $x^2+y^2=2x$ 从 $(0,0)$ 到 $(2,0)$，得 $\\pi+2$。\n> 错因：补线后**没有核对整条闭路的绕向**。沿上弧从 $(0,0)$ 走到 $(2,0)$ 再沿 $x$ 轴返回，是**顺时针**（在左端点 $(0,0)$ 处向上出发 = 沿圆顺时针），对应格林公式取负：$\\oint=-\\iint(Q_x-P_y)d\\sigma$；且补线积分 $\\int_2^0x\\,dx=-2$ 移项时符号又错一次。\n> 纠正：$\\oint_{CW}= -2\\cdot\\dfrac\\pi2=-\\pi=I_{弧}+I_{线}=I_{弧}-2$，故 $I_{弧}=2-\\pi$（见练 3.2-2 详解）。==判绕向最快动作：看起点处沿曲线的行进方向，逆时针绕行才取正==。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 忽视\"区域内偏导连续\"直接用格林 | 有奇点必挖洞（例 3.2-2） |\n| 挖洞后内边界方向取反 | 环形域正向：外逆内顺 |\n| 补线积分忘减 | $\\int_L=\\oint_{L+L_{补}}-\\int_{L_{补}}$，两项都不能丢 |","examplesMd":"**【例 3.2-1】（★★，经典）** 计算 $I=\\displaystyle\\int_L\\left(e^x\\sin y-y\\right)dx+\\left(e^x\\cos y-1\\right)dy$，$L$ 为上半圆 $x^2+y^2=R^2$（$y\\ge0$）从 $(R,0)$ 到 $(-R,0)$ 的一段弧。\n\n**思路分析**：$Q_x-P_y=e^x\\cos y-(e^x\\cos y-1)=1$（抵消构造：$e^x\\sin y,e^x\\cos y$ 项相消）→ 补直径用格林。\n\n**详细解答**：补直径 $L_0$：$y=0$，$x$ 从 $-R$ 到 $R$。$L+L_0$ 为逆时针闭路，围成半圆盘：\n\n$\\displaystyle\\oint_{L+L_0}=\\iint_D1\\,d\\sigma=\\frac{\\pi R^2}2$\n\n$L_0$ 上：$dy=0$，$P=e^x\\sin0-0=0$，故 $\\displaystyle\\int_{L_0}=0$。所以 $I=\\dfrac{\\pi R^2}2-0=\\dfrac{\\pi R^2}2$。\n\n**检验**：$R=1$ 数值参数化直算 $\\int_0^{\\pi}\\big[(e^{\\cos t}\\sin(\\sin t)-\\sin t)(-\\sin t)+(e^{\\cos t}\\cos(\\sin t)-1)\\cos t\\big]dt=\\dfrac\\pi2$ ✓。\n\n**方法总结**：==见到 $e^x\\sin y / e^x\\cos y$ 成对出现，先算 $Q_x-P_y$——大概率是抵消构造==。\n\n**【例 3.2-2】（★★★，经典难题）** 计算 $I=\\displaystyle\\oint_L\\dfrac{x\\,dy-y\\,dx}{4x^2+9y^2}$，其中 $L$ 为菱形 $|x|+|y|=2$，取逆时针方向。\n\n**思路分析**：$P,Q$ 在 $(0,0)$ 无定义（奇点在 $L$ 内）→ **挖洞**，洞的形状按分母取小椭圆 $4x^2+9y^2=\\varepsilon^2$ 使分母变常数。\n\n**详细解答**：记 $D_0=4x^2+9y^2$，直接求偏导：$\\dfrac{\\partial
