\\rvert)$ | $\\varphi'(x)e^{\\varphi(x)}dx$ | $d(e^{\\varphi(x)})$ |\n\n**适用信号**：被积函数是\"复合函数 × 某因子的导数\"；或分母的导数恰与分子成比例（差常数倍）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\int \\dfrac{dx}{x(1+\\ln x)}$ 直接写 $\\ln(1+\\ln x)$ | 漏了内层导数 $\\tfrac1x$；本题恰好 $\\tfrac{dx}{x} = d(\\ln x)$，凑成 $\\arctan$ 型 |\n| 凑 $\\tan x\\,dx = -d(\\cos x)$ 后忘负号 | 每凑一次微分，立即\"还原验算\"：对结果求导应得被积函数 |\n| $\\dfrac{1}{1+x^2}$ 与 $\\dfrac{x}{1+x^4}$ 混淆 | 后者凑 $d(x^2)$ 得 $\\arctan(x^2)$ 型，结构不同 |","examplesMd":"**【例 1.1-1】（★★，经典）** 求 $\\int \\dfrac{dx}{x\\left(1+\\ln^2 x\\right)}$（$x>0$）。\n\n**思路分析**：分母含 $\\ln x$ 的函数，而 $\\dfrac1x$ 正是 $\\ln x$ 的导数——凑 $t=\\ln x$ 整体化，化归为 $\\arctan$ 标准形。\n\n**详细解答**：令 $t=\\ln x$，则 $dt = \\dfrac{dx}{x}$，且 $x>0$ 时 $t\\in\\mathbb R$，\n\n$\\int \\dfrac{dx}{x(1+\\ln^2 x)} = \\int \\dfrac{dt}{1+t^2} = \\arctan t + C = \\arctan(\\ln x) + C$\n\n（检验：$\\left[\\arctan(\\ln x)\\right]' = \\dfrac{1}{1+\\ln^2 x}\\cdot\\dfrac1x = \\dfrac{1}{x(1+\\ln^2 x)}$ ✓——对 $\\arctan u$ 用链式法则，$u=\\ln x$，$u'=\\tfrac1x$。）\n\n**方法总结**：口诀 ==分母的函数先认亲，分子是不是它的导数身==——是（或差常数倍）就整体换元。\n\n**【例 1.1-2】（★★，巧题）** 求 $\\int \\dfrac{dx}{1+\\sin x}$。\n\n**思路分析**：直接凑没有现成导数。先\"分子分母同乘共轭式\"制造 $\\sec^2 x$ 与 $\\sec x\\tan x$——它们分别是 $\\tan x$、$\\sec x$ 的导数，凑微分即成。\n\n**详细解答**：分子分母同乘 $1-\\sin x$（$1+\\sin x\\neq 0$ 处），\n\n$\\dfrac{1}{1+\\sin x} = \\dfrac{1-\\sin x}{\\cos^2 x} = \\sec^2 x - \\sec x\\tan x$\n\n于是\n\n$\\int \\dfrac{dx}{1+\\sin x} = \\int \\sec^2 x\\,dx - \\int \\sec x\\tan x\\,dx = \\tan x - \\sec x + C$\n\n（检验：$(\\tan x-\\sec x)' = \\sec^2 x - \\sec x\\tan x = \\dfrac{1-\\sin x}{\\cos^2 x} = \\dfrac1{1+\\sin x}$ ✓。）\n\n**方法总结**：三角分式先问\"能不能造导数\"：$1\\mp\\sin x$ 乘共轭得 $\\sec^2,\\ \\sec\\tan$；万能代换（见 1.5）是最后手段，不是第一反应。"},"1.2":{"id":"1.2","name":"第二类换元法与三角代换（去根号思想）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：根号是积分的头号敌人。三大根式各有\"专属三角代换\"，利用 $\\sin^2+\\cos^2=1$ 或 $1+\\tan^2=\\sec^2$ 把根号一次性炸掉：\n\n| 根式 | 代换 | 根式化为 | 还原（直角三角形法） |\n| --- | --- | --- | --- |\n| $\\sqrt{a^2-x^2}$ | $x=a\\sin t$，$t\\in\\left[-\\tfrac\\pi2,\\tfrac\\pi2\\right]$ | $a\\cos t$ | $\\sin t=\\dfrac xa$，$\\tan t = \\dfrac{x}{\\sqrt{a^2-x^2}}$ |\n| $\\sqrt{a^2+x^2}$ | $x=a\\tan t$，$t\\in\\left(-\\tfrac\\pi2,\\tfrac\\pi2\\right)$ | $a\\sec t$ | $\\tan t=\\dfrac xa$ |\n| $\\sqrt{x^2-a^2}$ | $x=a\\sec t$ | $a\\tan t$ | $\\sec t=\\dfrac xa$ |\n\n**必背积分表（换元后常查）**：\n\n| 公式 | 公式 |\n| --- | --- |\n| $\\int\\dfrac{dx}{\\sqrt{a^2-x^2}}=\\arcsin\\dfrac xa+C$ | $\\int\\dfrac{dx}{a^2+x^2}=\\dfrac1a\\arctan\\dfrac xa+C$ |\n| $\\int\\dfrac{dx}{x^2-a^2}=\\dfrac1{2a}\\ln\\left\\lvert\\dfrac{x-a}{x+a}\\right\\rvert+C$ | $\\int\\dfrac{dx}{\\sqrt{x^2}\\pm a^2}\\!=\\!\\ln\\left\\lvert x+\\sqrt{x^2\\pm a^2}\\right\\rvert\\!+\\!C$ |\n| $\\int\\sqrt{a^2-x^2}\\,dx=\\dfrac xa\\sqrt{a^2-x^2}+\\dfrac{a^2}{2}\\arcsin\\dfrac xa+C$ | $\\int\\dfrac{dx}{(x^2+a^2)^{3/2}}=\\dfrac{x}{a^2\\sqrt{x^2+a^2}}+C$ |\n\n**适用信号**：出现 $\\sqrt{a^2-x^2},\\ \\sqrt{a^2+x^2},\\ \\sqrt{x^2-a^2}$；或分母含 $x^2\\sqrt{x^2+a^2}$ 之类\"高次根式\"（可三角代换，也可倒代换，见 1.6）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 开根号不带绝对值：$\\sqrt{1-\\sin^2 t}=\\cos t$ 直接去绝对值 | 必须限定 $t$ 的主值区间（如 $t\\in\\left(-\\tfrac\\pi2,\\tfrac\\pi2\\right)$ 使 $\\cos t>0$），才有 $\\sqrt{\\cdot}=\\cos t$ |\n| $\\sqrt{x^2-a^2}$ 代换后忘讨论 $x>a$ 与 $x<-a$ | 用 $x=\\pm a\\sec t$ 或直接用公式 $\\ln\\lvert x+\\sqrt{x^2-a^2}\\rvert$ |\n| 换元后回代乱套 | 画直角三角形：对边/邻边/斜边按代换关系标注，一切比值一目了然 |","examplesMd":"**【例 1.2-1】（★★，经典）** 求 $\\int\\sqrt{4-x^2}\\,dx$。\n\n**思路分析**：典型 $\\sqrt{a^2-x^2}$（$a=2$）型，令 $x=2\\sin t$ 去根号，再对 $\\cos^2 t$ 用倍角降幂。\n\n**详细解答**：令 $x=2\\sin t$，$t\\in\\left[-\\tfrac\\pi2,\\tfrac\\pi2\\right]$，则 $dx=2\\cos t\\,dt$，$\\sqrt{4-x^2}=2\\cos t$（主值区间内 $\\cos t\\ge 0$，开方不带绝对值），\n\n$\\int\\sqrt{4-x^2}\\,dx = 4\\int\\cos^2 t\\,dt = 2\\int(1+\\cos 2t)\\,dt = 2t+\\sin 2t + C$\n\n由 $\\sin t = \\dfrac x2$ 得 $t=\\arcsin\\dfrac x2$，$\\cos t = \\dfrac{\\sqrt{4-x^2}}{2}$，故\n\n$\\int\\sqrt{4-x^2}\\,dx = 2\\arcsin\\dfrac x2 + \\dfrac{x\\sqrt{4-x^2}}{2} + C$\n\n（检验：求导得 $\\dfrac{1}{\\sqrt{1-x^2/4}} + \\dfrac12\\left(\\sqrt{4-x^2} - \\dfrac{x^2}{\\sqrt{4-x^2}}\\right) = \\dfrac{2}{\\sqrt{4-x^2}} + \\dfrac{4-2x^2}{2\\sqrt{4-x^2}} = \\dfrac{4}{\\sqrt{4-x^2}} - \\dfrac{x^2}{\\sqrt{4-x^2}}\\cdot\\dfrac{2}{2}$，合并 $= \\dfrac{4-x^2}{\\sqrt{4-x^2}} = \\sqrt{4-x^2}$ ✓。）\n\n**方法总结**：三角代换三步走：==代换去根、降幂积分、三角形回代==。\n\n**【例 1.2-2】（★★，经典）** 求 $\\int\\dfrac{dx}{x^2\\sqrt{x^2+4}}$（$x>0$）。\n\n**思路分析**：$\\sqrt{x^2+a^2}$ 型，令 $x=2\\tan t$。分母的 $\\tan^2 t$ 会与 $\\sec t$ 组合成 $\\cot t\\cos t$ 型，化为 $\\int\\sin t\\cos t\\,dt$ 的雏形（也可倒代换，见 1.6 练习）。\n\n**详细解答**：令 $x=2\\tan t$，$t\\in\\left(0,\\tfrac\\pi2\\right)$，则 $dx=2\\sec^2 t\\,dt$，$\\sqrt{x^2+4}=2\\sec t$，\n\n$\\int\\dfrac{dx}{x^2\\sqrt{x^2+4}} = \\int\\dfrac{2\\sec^2 t\\,dt}{4\\tan^2 t\\cdot 2\\sec t} = \\dfrac14\\int\\dfrac{\\sec t}{\\tan^2 t}\\,dt = \\dfrac14\\int\\dfrac{\\cos t}{\\sin^2 t}\\,dt$\n\n再令 $u=\\sin t$（凑微分 $-d(\\cos t)$ 亦可）：\n\n$\\dfrac14\\int\\dfrac{du}{u^2} = -\\dfrac{1}{4u}+C = -\\dfrac{1}{4\\sin t}+C$\n\n回代：直角三角形中对边 $x$、邻边 $2$、斜边 $\\sqrt{x^2+4}$，$\\sin t = \\dfrac{x}{\\sqrt{x^2+4}}$，故\n\n$\\int\\dfrac{dx}{x^2\\sqrt{x^2+4}} = -\\dfrac{\\sqrt{x^2+4}}{4x}+C$\n\n（检验：$\\left[-\\dfrac{\\sqrt{x^2+4}}{4x}\\right]' = -\\dfrac14\\cdot\\dfrac{\\frac{x}{\\sqrt{x^2+4}}\\cdot x-\\sqrt{x^2+4}}{x^2} = -\\dfrac14\\cdot\\dfrac{\\frac{x^2-(x^2+4)}{\\sqrt{x^2+4}}}{x^2} = \\dfrac{1}{x^2\\sqrt{x^2+4}}$ ✓。）\n\n**方法总结**：换元后先\"化简分式结构\"（把 $\\sec,\\tan$ 全化成 $\\sin,\\cos$），往往自动现出凑微分形状。"},"1.3":{"id":"1.3","name":"分部积分法（反对幂指弦排序思想）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：乘积积分 $\\int u\\,dv = uv - \\int v\\,du$ 的本质是\"转移求导权\"：把导数转移到好积的因子上。谁当 $u$（被求导者）？按\"求导后变简单\"的程度排序：\n\n==反、对、幂、指、弦==——越靠前越当 $u$（求导降级快），越靠后越进 $dv$（积分不升级）。\n\n其中\"弦\"指三角函数。口诀来源：$\\arctan,\\ln$ 求导后消失（降为幂函数），$x^n$ 求导降一次幂，而 $e^x,\\sin x,\\cos x$ 求导积分都\"原地踏步\"，故留给 $dv$。\n\n**适用信号**：两类不同质因子相乘（幂×指、幂×弦、对×幂、反×幂）；或单独出现 $\\ln x,\\ \\arctan x,\\ \\arcsin x$（视作乘 $1$，即 $dv=dx$）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $u,dv$ 选反：$\\int x e^x dx$ 取 $u=e^x$ | 越积越复杂；按\"反对幂指弦\"，$u=x$，$dv=e^xdx$ |\n| 分部两次用同一结构但 $u,dv$ 互换（如第二次把 $dv$ 又当 $u$） | 循环积分两次分部必须\"同方向\"，否则恒等式来回抵消（见 1.7） |\n| 定积分分部忘代限：$\\int_a^b u\\,dv = uv\\big\\lvert_a^b-\\int_a^b v\\,du$ | 每次分部立刻把 $uv\\big\\lvert_a^b$ 算掉，减少带限变量的堆积 |\n\n#### 分部速算：表格法（DI 法）\n\n**核心思想**：连续同向分部时，把\"逐次求导\"与\"逐次积分\"写成两列——左列（D 列）放 $u$ 的各阶导数，右列（I 列）放 $dv$ 因子的各次原函数，然后==斜乘正负交替==读出所有 $uv$ 项，剩余部分==横乘==收尾。逐次手写分部的全部算术，被压缩成一张表。\n\n以 $\\int x^2 e^x\\,dx$ 为例（例 1.3-1 的表格复算）：\n\n| D 列（逐次求导） | I 列（逐次积分） | 斜乘符号 |\n| --- | --- | --- |\n| $x^2$ | $e^x$ | $+$ |\n| $2x$ | $e^x$ | $-$ |\n| $2$ | $e^x$ | $+$ |\n| $0$ ← 到 $0$ 即停 |  |  |\n\n沿斜线相乘（本行的 D 乘本行的 I）、符号 $+,-,+$ 交替，D 列归零即止：\n\n$\\int x^2e^x\\,dx = x^2e^x-2xe^x+2e^x+C = e^x\\left(x^2-2x+2\\right)+C$\n\n——与例 1.3-1 连续两次分部的结果完全一致。\n\n**三种终止方式（先判型，再列表）**：\n\n| 型 | 终止信号 | 现有题演示 |\n| --- | --- | --- |\n| 幂函数型：$x^ne^x,\\ x^n\\sin x,\\ x^n\\cos x$ | D 列求导到 $0$，全表斜乘读完 | 例 1.3-1（$x^2e^x$：三行到 $0$） |\n| 循环型：$e^{ax}\\sin bx,\\ e^{ax}\\cos bx$ | 某一行与首行成比例（积分转一圈重现）——立即停，横乘该行、移项解方程 | 例 1.3-2（$e^{2x}\\sin x$：D 列 $\\sin x\\to\\cos x\\to-\\sin x$ 转一圈重现；第三行横乘 $\\left(-\\sin x\\right)\\cdot\\dfrac{e^{2x}}{4}=-\\dfrac14\\times$被积函数，得 $-\\dfrac14I$，移项即 $\\dfrac54I$） |\n| 横乘收尾型：$\\ln x$、$\\arctan x$ 等当 $u$ | 斜乘到某行后，该行 D $\\times$ I 乘积变成秒杀积分——停止斜乘，横向积出最后一项 | 练 1.3-1（$x^2\\ln x$：D 列 $\\ln x\\to\\dfrac1x$，I 列 $\\dfrac{x^3}3$；第二行横乘 $\\dfrac1x\\cdot\\dfrac{x^3}3=\\dfrac{x^2}3$ 直接可积，收尾 $-\\int\\dfrac{x^2}3dx=-\\dfrac{x^3}9$） |\n\n**适用信号**：预计要分部 $\\ge 2$ 次；被积函数是\"多项式 $\\times\\ e^x/\\sin/\\cos$\"；$e^{ax}\\sin bx$ 型循环题。\n\n**定积分版**：表格照列，每个斜乘项分别代上下限（$uv\\big\\lvert_a^b$），一表出数——练 2.4-3 的 $\\int_0^1x^2e^xdx$：三行斜乘项代限，$\\left[e^x\\left(x^2-2x+2\\right)\\right]_0^1=e-2$。\n\n**易错警示（表格法专属）**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 循环型一路求导列到天荒地老（$e^x\\sin x$ 两列永不归零） | 先判型：见\"某行与首行成比例\"立即停，横乘移项解方程 |\n| 斜乘符号从 $-$ 起或交替错乱 | 首项恒为 $+$（就是第一次分部的 $uv$ 项），此后 $+,-,+,-$ |\n| 把 $\\ln x,\\ \\arctan x$ 放进 I 列逐次积分 | D 列必须\"越求越简\"——$u$ 的选取与\"反对幂指弦\"完全同源：反、对排最前，正因它们求导一次就降级 |\n| 用了表格法就省略检验 | 表格只是压缩书写、不是新公式——结果仍要\"求导还原\"检验 |\n\n**方法定位**：表格法 = ==\"反对幂指弦\"排序 + 连续同向分部==的流水线写法；原理上没有任何新东西——这正是它考试提速且安全可靠的全部原因。","examplesMd":"**【例 1.3-1】（★★，经典）** 求 $\\int x^2 e^{x}\\,dx$。\n\n**思路分析**：幂 × 指，按排序 $u=x^2$，$dv=e^xdx$；幂降两次到零即完成。\n\n**详细解答**：连续两次分部（每次都取幂函数部分为 $u$）：\n\n$\\int x^2 e^x dx = x^2 e^x - \\int 2x e^x dx = x^2 e^x - 2\\left(xe^x - \\int e^x dx\\right) = e^x\\left(x^2-2x+2\\right)+C$\n\n（检验：$\\left[e^x(x^2-2x+2)\\right]' = e^x(x^2-2x+2+2x-2) = x^2e^x$ ✓。）\n\n**方法总结**：$x^n e^x$ 型分部 $n$ 次，结果是 $e^x$ 乘一个首项 $x^n$ 的\"错位系数\"多项式——==幂落几层，指数不动==（本题三步分部可压缩成一张三行表格秒读，见本节\"表格法（DI 法）\"模块）。\n\n**【例 1.3-2】（★★，经典陷阱题）** 求 $\\int e^{2x}\\sin x\\,dx$。\n\n**思路分析**：指 × 弦，两者地位对等，怎么选都能做——但两次分部必须\"同方向\"（两次都把指数凑进 $dv$，或两次都把弦凑进 $dv$），做完会重新出现原积分，回代解方程（1.7 的思想在此预演）。\n\n**详细解答**：取 $dv = e^{2x}dx$（两次都如此）：\n\n$\\int e^{2x}\\sin x\\,dx = \\dfrac12 e^{2x}\\sin x - \\dfrac12\\int e^{2x}\\cos x\\,dx$\n\n$\\int e^{2x}\\cos x\\,dx = \\dfrac12 e^{2x}\\cos x + \\dfrac12\\int e^{2x}\\sin x\\,dx$\n\n回代：\n\n$I = \\dfrac12 e^{2x}\\sin x - \\dfrac14 e^{2x}\\cos x - \\dfrac14 I \\quad\\Longrightarrow\\quad \\dfrac54 I = \\dfrac{e^{2x}}{4}\\left(2\\sin x-\\cos x\\right)$\n\n$\\int e^{2x}\\sin x\\,dx = \\dfrac{e^{2x}}{5}\\left(2\\sin x-\\cos x\\right)+C$\n\n（检验：$\\left[\\dfrac{e^{2x}(2\\sin x-\\cos x)}{5}\\right]' = \\dfrac{e^{2x}}{5}\\left[2(2\\sin x-\\cos x)+(2\\cos x+\\sin x)\\right] = \\dfrac{e^{2x}}{5}\\cdot 5\\sin x$ ✓。）\n\n**方法总结**：$e^{ax}\\sin bx$ 型：两次同向分部 → 原积分重现 → ==移项解方程，除以 $1+k^2$ 型系数==。一般公式 $\\int e^{ax}\\sin bx\\,dx = \\dfrac{e^{ax}(a\\sin bx-b\\cos bx)}{a^2+b^2}+C$。（循环终止的表格版见本节\"表格法\"模块：D 列转一圈重现首行即停、横乘移项。）"},"1.4":{"id":"1.4","name":"有理函数积分（部分分式分解思想）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：任何有理函数 $\\dfrac{P(x)}{Q(x)}$ 的积分都\"必然可做\"——先多项式除法化真分式，再按分母的标准分解拆成四类\"原子分式\"，逐一击破：\n\n| 原子分式 | 通解 |\n| --- | --- |\n| $\\dfrac{A}{x-a}$ | $A\\ln\\lvert x-a\\rvert$ |\n| $\\dfrac{A}{(x-a)^k}\\ (k\\ge2)$ | $\\dfrac{A}{1-k}(x-a)^{1-k}$（直接幂公式） |\n| $\\dfrac{Bx+C}{x^2+px+q}$（$p^2<4q$） | 分子拆 $\\tfrac B2(2x+p)$ + 余常数 → $\\ln$ + $\\arctan$ |\n| $\\dfrac{Bx+C}{(x^2+px+q)^k}$ | 递推（见 1.7） |\n\n**技术要点**：定系数用\"代根法 + 比较系数法\"双管齐下；能代根的先代根（$x=a$ 处只剩一项），代不了的（二次因子）再比较系数。\n\n**适用信号**：被积函数是真分式且分母可分解（$x^n\\pm1$、$x^n\\pm a$、十字相乘可分解的二次/三次）；或\"假分式 + 高次\"结构先除法。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 假分式直接拆部分分式 | ==先做多项式除法==化\"多项式 + 真分式\"（例 1.4-2） |\n| 二次因子的分子只配常数 | 分子必须是 $Bx+C$ 一次式 |\n| $x^3+1$ 只分出 $\\dfrac{A}{x+1}$ | $x^3+1=(x+1)(x^2-x+1)$，还剩二次因子；$n$ 次多项式分解出 $n$ 个系数 |\n| 漏绝对值：$\\int\\dfrac{dx}{x-a}=\\ln(x-a)$ | $\\ln\\lvert x-a\\rvert+C$ |","examplesMd":"**【例 1.4-1】（★★，经典）** 求 $\\int\\dfrac{2x+3}{x^3+x^2-2x}\\,dx$。\n\n**思路分析**：分母 $x(x^2+x-2)=x(x+2)(x-1)$ 是三个互异一次因子，设三 项部分分式，代根法定系数。\n\n**详细解答**：设 $\\dfrac{2x+3}{x(x+2)(x-1)} = \\dfrac{A}{x}+\\dfrac{B}{x+2}+\\dfrac{C}{x-1}$，通分比较分子：\n\n$2x+3 = A(x+2)(x-1)+Bx(x-1)+Cx(x+2)$\n\n代 $x=0$：$3=-2A\\Rightarrow A=-\\dfrac32$；代 $x=1$：$5=3C\\Rightarrow C=\\dfrac53$；代 $x=-2$：$-1=6B\\Rightarrow B=-\\dfrac16$。（三个根代完，系数全部落定，无需比较系数。）\n\n$\\int\\dfrac{2x+3}{x^3+x^2-2x}\\,dx = -\\dfrac32\\ln\\lvert x\\rvert-\\dfrac16\\ln\\lvert x+2\\rvert+\\dfrac53\\ln\\lvert x-1\\rvert+C$\n\n（检验：在 $x=3$ 处分别求被积函数值 $\\tfrac{9}{30}=\\tfrac3{10}$ 与上式导数值 $\\left(-\\tfrac{1.5}{3}-\\tfrac{1}{60}+\\tfrac{5}{3}\\cdot\\tfrac12\\right)=\\left(-\\tfrac12-\\tfrac1{60}+\\tfrac56\\right)=\\tfrac3{10}$ ✓。）\n\n**方法总结**：==一次因子代根，二次因子比系数==；系数定完立刻在某个数值点回代验一次。\n\n**【例 1.4-2】（★★，经典陷阱题）** 求 $\\int\\dfrac{x^3+1}{x^2-1}\\,dx$。\n\n**思路分析**：分子次数不低于分母——是假分式！陷阱在于直接对 $\\dfrac{x^3+1}{x^2-1}$ 拆部分分式。先除法。\n\n**详细解答**：多项式除法（或凑）：\n\n$\\dfrac{x^3+1}{x^2-1} = \\dfrac{x(x^2-1)+x+1}{x^2-1} = x+\\dfrac{x+1}{(x-1)(x+1)} = x+\\dfrac{1}{x-1}\\quad(x\\neq -1)$\n\n（约分发生在 $x\\ne-1$ 的区间上，不定积分按区间书写即可。）\n\n$\\int\\dfrac{x^3+1}{x^2-1}\\,dx = \\dfrac{x^2}{2}+\\ln\\lvert x-1\\rvert+C$\n\n（检验：求导 $=x+\\dfrac{1}{x-1} = \\dfrac{x(x-1)+1}{x-1} = \\dfrac{x^2-x+1}{x-1}\\cdot\\dfrac{x+1}{x+1} = \\dfrac{x^3+1}{x^2-1}$ ✓。）\n\n**方法总结**：见假分式，==先除后拆，能约先约==；部分分式是\"化真之后的精细化\"。"},"1.5":{"id":"1.5","name":"三角有理式积分（半角代换与万能代换的取舍）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：$\\sin x,\\cos x$ 的有理式，理论上\"万能代换\" $t=\\tan\\dfrac x2$ 必能化为有理函数：\n\n$\\sin x = \\dfrac{2t}{1+t^2},\\qquad \\cos x = \\dfrac{1-t^2}{1+t^2},\\qquad dx = \\dfrac{2\\,dt}{1+t^2}$\n\n但\"万能\"往往\"低效\"。正确姿势是先按结构挑轻武器，卡死才上万能代换：\n\n| 结构特征 | 首选（优先级从高到低） |\n| --- | --- |\n| $\\sin^m x\\cos^n x$，某者为奇 | 抽出奇次因子凑微分 $d(\\cos x)$ 或 $d(\\sin x)$（1.1） |\n| $\\sin^m x\\cos^n x$ 都偶 | 倍角降幂 $\\sin x\\cos x=\\tfrac12\\sin2x$ 等（2.4 定积分化） |\n| 只含 $\\tan x$ / 可整理成 $\\tan$ 的有理式 | $t=\\tan x$，$dx=\\dfrac{dt}{1+t^2}$ |\n| 分母形如 $a+b\\sin x$、$a+b\\cos x$ | 万能代换 $t=\\tan\\dfrac x2$ |\n| $a\\sin x+b\\cos x$ 线性组合 | 辅助角化 $R\\sin(x+\\varphi)$ |\n\n**适用信号**：被积函数仅由 $\\sin x,\\cos x$ 经四则运算构成，且倍角/配偶（1.8）不能速战。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 见三角有理式就万能代换 | 先查降幂、配偶、$\\tan$ 代换三条路（本题集多处例题能省一半篇幅） |\n| 万能代换在含 $\\pi$ 的长区间上积分不拆分 | $t=\\tan\\tfrac x2$ 在 $x=\\pi$ 处无定义，跨 $\\pi$ 的区间必须分段（见 2.5/4.2） |\n| $\\tan$ 代换后 $\\sin^2 x=\\dfrac{t^2}{1+t^2}$ 记错 | 由 $\\sin^2 = \\tan^2\\cos^2 = \\dfrac{t^2}{1+t^2}$ 现场推导，勿背错分子分母 |","examplesMd":"**【例 1.5-1】（★★，经典）** 求 $\\int\\dfrac{dx}{2+\\cos x}$。\n\n**思路分析**：分母 $a+b\\cos x$ 型（$b\\ne0$），万能代换的标准用武之地。\n\n**详细解答**：令 $t=\\tan\\dfrac x2$，则 $\\cos x = \\dfrac{1-t^2}{1+t^2}$，$dx=\\dfrac{2\\,dt}{1+t^2}$：\n\n$\\int\\dfrac{dx}{2+\\cos x} = \\int\\dfrac{\\frac{2\\,dt}{1+t^2}}{2+\\frac{1-t^2}{1+t^2}} = \\int\\dfrac{2\\,dt}{3+t^2} = \\dfrac{2}{\\sqrt3}\\arctan\\dfrac{t}{\\sqrt3}+C = \\dfrac{2}{\\sqrt3}\\arctan\\left(\\dfrac{\\tan\\frac x2}{\\sqrt3}\\right)+C$\n\n（检验：令 $t=\\tan\\tfrac x2$ 还原后对 $t$ 求导为 $\\dfrac{2}{3+t^2}$，链式回代 ✓。）\n\n**方法总结**：万能代换 = ==把三角全部翻译成 $t$ 的分式==，剩下交给 1.4。\n\n**【例 1.5-2】（★★，经典）** 求 $\\int\\dfrac{dx}{2+\\sin x}$。\n\n**思路分析**：同为 $a+b\\sin x$ 型，仍万能代换；本题亮点在换元后分母是完全平方式 $t^2+t+1$ 配方，与例 1 形成对照。\n\n**详细解答**：令 $t=\\tan\\dfrac x2$，则 $\\sin x = \\dfrac{2t}{1+t^2}$：\n\n$\\int\\dfrac{dx}{2+\\sin x} = \\int\\dfrac{\\frac{2dt}{1+t^2}}{2+\\frac{2t}{1+t^2}} = \\int\\dfrac{dt}{t^2+t+1} = \\int\\dfrac{dt}{\\left(t+\\frac12\\right)^2+\\frac34}$\n\n$= \\dfrac{2}{\\sqrt3}\\arctan\\dfrac{2t+1}{\\sqrt3}+C = \\dfrac{2}{\\sqrt3}\\arctan\\dfrac{2\\tan\\frac x2+1}{\\sqrt3}+C$\n\n（检验：代 $t$ 回求导，$\\dfrac{d}{dt}\\left[\\dfrac{2}{\\sqrt3}\\arctan\\dfrac{2t+1}{\\sqrt3}\\right] = \\dfrac{1}{t^2+t+1}$ ✓，与被积函数的 $t$ 表达式一致。）\n\n**方法总结**：换元后分母是二次三项式 → ==配方 + $\\arctan$==（1.4 原子分式的复用）。"},"1.6":{"id":"1.6","name":"简单无理式积分（根式代换与欧拉代换）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：除 1.2 的三大标准根式外，其余根式的通用策略是\"令根式本身为新变量\"，把无理式整体翻译成有理函数：\n\n1. **根式代换**：$\\int R\\left(x,\\sqrt[n]{ax+b}\\right)dx$ 令 $t=\\sqrt[n]{ax+b}$；含多个根式 $\\sqrt x,\\sqrt[3]x$ 时令 $t$ 为它们的最小公倍次根（$t=x^{1/6}$）。\n2. **倒代换**：$t=\\dfrac1x$，专治分母中 $x$ 的次数比分子高很多的结构（如 $\\dfrac{dx}{x^k\\sqrt{x^2+a^2}}$）。\n3. **欧拉代换**：$\\sqrt{ax^2+bx+c}$，当 $a>0$ 时令 $\\sqrt{ax^2+bx+c}=t\\pm\\sqrt a\\,x$；当 $c>0$ 时令 $\\sqrt{ax^2+bx+c}=tx\\pm\\sqrt c$——必能去根，属\"压箱底的重武器\"。\n\n**适用信号**：$\\sqrt[n]{ax+b}$、$\\sqrt{ax+b}$ 与 $\\sqrt{cx+d}$ 的混合、$\\dfrac{1}{x^n(\\text{二次根式})}$、一般二次根式 $\\sqrt{ax^2+bx+c}$。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 根式代换后 $dx$ 忘换（漏乘 $dx/dt$） | 换元三件套：换根式、换 $dx$、换积分限 |\n| 倒代换后开方：$\\sqrt{x^2+1} = \\dfrac{\\sqrt{1+t^2}}{t}$ 丢 $\\lvert t\\rvert$ | 先限定 $x>0$（或分段讨论），开方带绝对值再由符号化简 |\n| 有理化\"分子共轭\"后丢常数因子 | 共轭相乘本质是乘 $\\dfrac{A-B}{A-B}$，分母变化要如实写出 |","examplesMd":"**【例 1.6-1】（★，经典）** 求 $\\int\\dfrac{dx}{1+\\sqrt x}$（$x>0$）。\n\n**思路分析**：一次根式 $\\sqrt x$ 直接令 $t=\\sqrt x$，化为伪分式再\"加除法\"。\n\n**详细解答**：令 $x=t^2$（$t>0$），$dx=2t\\,dt$：\n\n$\\int\\dfrac{dx}{1+\\sqrt x} = \\int\\dfrac{2t}{1+t}\\,dt = 2\\int\\left(1-\\dfrac{1}{1+t}\\right)dt = 2t-2\\ln(1+t)+C = 2\\sqrt x-2\\ln\\left(1+\\sqrt x\\right)+C$\n\n（检验：$\\left[2\\sqrt x-2\\ln(1+\\sqrt x)\\right]' = \\dfrac{1}{\\sqrt x}-\\dfrac{1}{\\sqrt x(1+\\sqrt x)} = \\dfrac{1}{1+\\sqrt x}$ ✓。）\n\n**方法总结**：==根式当新元，无理变有理==；伪分式用\"整式除法 $t = (1+t)-1$\"。\n\n**【例 1.6-2】（★★，经典）** 求 $\\int\\dfrac{dx}{\\left(1+\\sqrt[3]{x}\\right)\\sqrt{x}}$（$x>0$）。\n\n**思路分析**：同时出现 $\\sqrt x$（2 次）与 $\\sqrt[3]x$（3 次），取最小公倍 6：令 $t=\\sqrt[6]{x}$，两个根式同时有理化。\n\n**详细解答**：令 $x=t^6$，$dx=6t^5dt$，$\\sqrt x=t^3$，$\\sqrt[3]x=t^2$：\n\n$\\int\\dfrac{dx}{\\left(1+\\sqrt[3]x\\right)\\sqrt x} = \\int\\dfrac{6t^5\\,dt}{(1+t^2)\\,t^3} = 6\\int\\dfrac{t^2}{1+t^2}\\,dt = 6\\int\\left(1-\\dfrac{1}{1+t^2}\\right)dt = 6\\sqrt[6]{x}-6\\arctan\\sqrt[6]{x}+C$\n\n（检验：$\\left[6t-6\\arctan t\\right]' = 6-\\dfrac6{1+t^2} = \\dfrac{6t^2}{1+t^2}$，回代即被积函数的 $t$ 形 ✓。）\n\n**方法总结**：多根共存，==最小公倍次根一网打尽==。"},"1.7":{"id":"1.7","name":"循环积分与递推公式（分部递推、回代解方程思想）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：两类\"自己转一圈重现\"的积分：\n\n1. **循环型**：分部两次后原积分重现（系数为 $kI$），==移项解方程==即得（例 1.3-2 的 $e^x\\sin x$ 是雏形，$\\sec^3x$、$\\sqrt{x^2+a^2}$ 是主力）。其可视化写法即 1.3 的表格法——I 列转一圈重现首行即停，横乘移项便得本式。\n2. **递推型**：建立 $I_n$ 与 $I_{n-2}$（或 $I_{n-1}$）的递推关系，把高次幂逐步\"点火\"烧到 $I_0$ 或 $I_1$。招牌两个：\n\n$I_n=\\int\\dfrac{dx}{(x^2+a^2)^n}:\\quad I_n = \\dfrac{x}{2a^2(n-1)(x^2+a^2)^{n-1}}+\\dfrac{2n-3}{2a^2(n-1)}\\,I_{n-1}$\n\n$I_n=\\int_0^{\\pi/2}\\sin^nx\\,dx:\\quad I_n=\\dfrac{n-1}{n}I_{n-2},\\quad I_0=\\dfrac\\pi2,\\ I_1=1$（定积分版见 2.4 华里士）\n\n**适用信号**：积分带下标 $n$（幂次参数化）；或分部一次后出现\"低一次的自己\"。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 循环方程解出 $I$ 后忘加 $C$ | $\\left(1-k\\right)I = F(x)\\Rightarrow I=\\dfrac{F(x)}{1-k}+C$，常数在除法中丢失，必须补 |\n| 递推式只推不\"落地\" | 必须落到 $I_0$、$I_1$ 这些已知值上，$n$ 奇偶不同终点不同 |\n| $I_n$ 递推中系数 $\\dfrac{2n-3}{2a^2(n-1)}$ 记错 | 用 $n=2,\\ a=1$ 特例自检：$I_2 = \\dfrac{x}{2(x^2+1)}+\\dfrac12 I_1$，对 $I_2$ 求导可验 |","examplesMd":"**【例 1.7-1】（★★，经典）** 推导 $I_n=\\int\\dfrac{dx}{(x^2+a^2)^n}$ 的递推公式，并求 $\\int\\dfrac{dx}{(x^2+1)^2}$。\n\n**思路分析**：被积函数\"分母幂次高\"时，强行凑 $x\\,dx$ 出来分部——把 $x$ 的一次方嫁给分母的一阶，制造降次。\n\n**详细解答**：\n\n$I_n = \\dfrac{x}{(x^2+a^2)^n}+\\int x\\cdot\\dfrac{2n\\,x}{(x^2+a^2)^{n+1}}dx = \\dfrac{x}{(x^2+a^2)^n}+2n\\int\\dfrac{x^2}{(x^2+a^2)^{n+1}}dx$\n\n（第一行即分部：$u=\\dfrac1{(x^2+a^2)^n}$，$dv=dx$。）把 $x^2=(x^2+a^2)-a^2$ 拆开：\n\n$I_n = \\dfrac{x}{(x^2+a^2)^n}+2n\\,I_n-2na^2 I_{n+1}\\ \\Longrightarrow\\ I_{n+1}=\\dfrac{x}{2na^2(x^2+a^2)^n}+\\dfrac{2n-1}{2na^2}I_n$\n\n换 $n\\to n-1$ 得标准式：$I_n=\\dfrac{x}{2a^2(n-1)(x^2+a^2)^{n-1}}+\\dfrac{2n-3}{2a^2(n-1)}I_{n-1}$。\n\n取 $a=1,n=2$，$I_1=\\arctan x$：\n\n$\\int\\dfrac{dx}{(x^2+1)^2} = \\dfrac{x}{2(x^2+1)}+\\dfrac12\\arctan x+C$\n\n（检验：$\\left[\\dfrac{x}{2(x^2+1)}\\right]' = \\dfrac{1-x^2}{2(x^2+1)^2}$，$\\left[\\dfrac12\\arctan x\\right]'=\\dfrac{1+x^2}{2(x^2+1)^2}$，和 $=\\dfrac{2}{2(x^2+1)^2}$ ✓。）\n\n**方法总结**：==凑 $x$ 分部，拆 $x^2$ 降次==——有理函数高次分母的通用降维术（1.4 的第四类原子分式正用它）。\n\n**【例 1.7-2】（★★，经典名题）** 求 $\\int\\sqrt{x^2+a^2}\\,dx$（用循环法，与查表法互验）。\n\n**思路分析**：分部一次令 $u=\\sqrt{x^2+a^2}$，$dv=dx$，右边的 $\\int\\dfrac{x^2}{\\sqrt{x^2+a^2}}dx$ 拆 $x^2=(x^2+a^2)-a^2$ 后原积分重现——循环解方程。\n\n**详细解答**：记 $I=\\int\\sqrt{x^2+a^2}\\,dx$，\n\n$I = x\\sqrt{x^2+a^2}-\\int\\dfrac{x^2}{\\sqrt{x^2+a^2}}\\,dx = x\\sqrt{x^2+a^2}-I+a^2\\int\\dfrac{dx}{\\sqrt{x^2+a^2}}$\n\n$2I = x\\sqrt{x^2+a^2}+a^2\\ln\\left\\lvert x+\\sqrt{x^2+a^2}\\right\\rvert + C_1$\n\n$I = \\dfrac{x}{2}\\sqrt{x^2+a^2}+\\dfrac{a^2}{2}\\ln\\left\\lvert x+\\sqrt{x^2+a^2}\\right\\rvert+C$\n\n（检验：求导 $=\\dfrac12\\sqrt{x^2+a^2}+\\dfrac{x^2}{2\\sqrt{x^2+a^2}}+\\dfrac{a^2}{2\\sqrt{x^2+a^2}} = \\sqrt{x^2+a^2}$ ✓；与 1.2 积分表所列一致——表就是这样推出来的。）\n\n**方法总结**：二次根式分部必循环，==移项除以 $2$== 即查表结果；理解推导后，$\\sqrt{a^2-x^2},\\sqrt{x^2-a^2}$ 同法三分钟自制。"},"1.8":{"id":"1.8","name":"组合与配偶技巧（对称组合、共轭消根）","part":"不定积分","book":"一元积分","teachMd":"**核心思想**：单个积分难算时，把它与自己的\"对称伙伴\"打包联立——两个未知量、两个方程，一加减便同归于尽：\n\n1. **配偶联立**：$I=\\int\\dfrac{\\sin x}{\\sin x+\\cos x}dx$ 与 $J=\\int\\dfrac{\\cos x}{\\sin x+\\cos x}dx$，则 $I+J$ 与 $J-I$ 都秒算，解出 $I$。\n2. **恒等式改写**：$1=\\sin^2x+\\cos^2x$、$\\sqrt{1-\\sin 2x}=\\lvert\\cos x-\\sin x\\rvert$、$\\left(\\sqrt{1+x}+\\sqrt x\\right)\\left(\\sqrt{1+x}-\\sqrt x\\right)=1$——把\"1 或根式\"拆成有利形状。\n3. **对称因式**：$\\dfrac{1+x^2}{1+x^4}$ 型（拔 1.1）、$\\dfrac{x^2}{1+x^4}$ 与 $\\dfrac{1}{1+x^4}$ 在 $[0,+\\infty)$ 上互为倒代换镜像（见 4.2）。\n\n**适用信号**：$\\sin x\\pm\\cos x$ 的分式；$\\sqrt{1\\pm\\sin 2x}$；结构对称的有理式；\"两个长相相似的积分\"成对出现。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 只算 $I$ 不算 $J$，硬啃分母 | ==先写 $I+J$、$J-I$ 看是否初等可积==，是则联立 |\n| $\\sqrt{1-\\sin 2x}$ 直接 $=\\cos x-\\sin x$ | 必须 $\\lvert\\cos x-\\sin x\\rvert$，再按区间讨论去绝对值（见 2.6） |\n| $\\sin x+\\cos x = \\sqrt2\\sin\\left(x+\\tfrac\\pi4\\right)$ 记成 $\\sqrt2\\cos$ | 用 $x=0$ 验：左边 $=1$，$\\sqrt2\\sin\\tfrac\\pi4=1$ ✓ |","examplesMd":"**【例 1.8-1】（★★，经典）** 求 $I=\\int\\dfrac{\\sin x}{\\sin x+\\cos x}\\,dx$。\n\n**思路分析**：拉来配偶 $J=\\int\\dfrac{\\cos x}{\\sin x+\\cos x}dx$ 联立：$I+J$ 的分子凑出分母，$J-I$ 的分子恰为分母的导数。\n\n**详细解答**：设 $J=\\int\\dfrac{\\cos x}{\\sin x+\\cos x}dx$，则\n\n$I+J=\\int\\dfrac{\\sin x+\\cos x}{\\sin x+\\cos x}dx=x+C_1$\n\n$J-I=\\int\\dfrac{\\cos x-\\sin x}{\\sin x+\\cos x}dx=\\ln\\lvert\\sin x+\\cos x\\rvert+C_2$（分子是分母的导数，凑微分）\n\n两式相减除以 $2$：\n\n$I = \\dfrac{x}{2}-\\dfrac{1}{2}\\ln\\lvert\\sin x+\\cos x\\rvert+C$\n\n（检验：$\\left[\\tfrac x2-\\tfrac12\\ln(\\sin x+\\cos x)\\right]' = \\tfrac12-\\tfrac{\\cos x-\\sin x}{2(\\sin x+\\cos x)} = \\dfrac{\\sin x}{\\sin x+\\cos x}$ ✓。）\n\n**方法总结**：==和差配偶，一次到位==；\"分子凑分母（得 $x$）+ 分子凑分母的导数（得 $\\ln$）\"是定式。\n\n**【例 1.8-2】（★★，巧题）** 求 $\\int\\dfrac{dx}{\\sin^2x\\cos^2x}$。\n\n**思路分析**：分母是 $\\sin^2\\cos^2$ 的乘积——把分子 $1$ 换成 $\\sin^2x+\\cos^2x$，立刻拆成两个秒杀积分。\n\n**详细解答**：\n\n$\\dfrac{1}{\\sin^2x\\cos^2x} = \\dfrac{\\sin^2x+\\cos^2x}{\\sin^2x\\cos^2x} = \\dfrac{1}{\\cos^2x}+\\dfrac{1}{\\sin^2x}$\n\n$\\int\\dfrac{dx}{\\sin^2x\\cos^2x} = \\tan x-\\cot x+C$\n\n（检验：$(\\tan x-\\cot x)' = \\sec^2x+\\csc^2x = \\dfrac{\\sin^2+\\cos^2}{\\sin^2\\cos^2}$ ✓。）\n\n**方法总结**：分子 $1$ 不是死字——==$1=\\sin^2+\\cos^2$ 是万能积木==（同族：$1=(x)'$ 的凑微分观、$1=\\dfrac{b-a}{b-a}$ 的区间再现观，见 2.3）。"},"2.1":{"id":"2.1","name":"牛顿–莱布尼茨公式与原函数核查（\"积不出\"预警思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：N–L 公式 $\\int_a^b f(x)dx = F(x)\\Big|_a^b$ 只有在**原函数初等可求、且区间上无瑕点**时才能直接使用。动笔前先过两道安检：\n\n1. **原函数安检（\"积不出\"清单）**：以下函数的的原函数**不是初等函数**，见到它们当被积函数（或其变体），立即放弃硬算，转向对称性（2.2）、区间再现（2.3）、几何意义或定义式估计：\n\n| 积不出函数 | 常见变装 |\n| --- | --- |\n| $e^{\\pm x^2}$ | $e^{-x^2/2}$，概率背景 |\n| $\\dfrac{\\sin x}{x},\\ \\dfrac{\\cos x}{x}$ | $\\sin x^2$，$\\int_0^x\\dfrac{\\sin t}{t}dt$ 变限 |\n| $\\dfrac{1}{\\ln x}$ | 对数积分 |\n| $\\dfrac{e^x}{x},\\ \\sqrt{1+x^3}$ | 分母/根式锁定型 |\n\n2. **瑕点安检**：区间内部或端点使分母为 $0$、函数无界 → 是反常积分（第四部分），必须先判敛再谈计算；**无脑套 N–L 是定积分第一大惨案**（例 2.1-2）。\n\n**适用信号**：拿到定积分的第一秒：被积函数初等可积？区间上连续？两问皆\"是\"，才走\"求原函数→代上下限\"。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\int_{-1}^1\\dfrac{dx}{x^2} = -\\dfrac1x\\Big\\vert_{-1}^1 = -2$ | $x=0$ 是瑕点，积分发散（例 2.1-2 勘误） |\n| $\\int_0^\\pi\\dfrac{dx}{1+\\sin x}$ 型含三角\"可去\"陷阱一律视为发散 | 仅当分母在某点真为 $0$ 且函数无界才发散；$1+\\sin x\\ge0$ 在端点为 $0$ 须单独检查该点 |\n| 对\"积不出\"函数硬找原函数浪费时间 | 30 秒内识别，立即换武器（2.2/2.3/2.5） |","examplesMd":"**【例 2.1-1】（★★，经典名题）** 求 $\\int_{-1}^{1}\\dfrac{1+x^2}{1+x^4}\\,dx$。\n\n**思路分析**：原函数在拔 1.1 已求出，但回代 $x=\\pm1$ 并不省事。注意区间对称、被积函数为偶函数——而它恰是\"除以 $x^2$ 凑 $d\\left(x-\\tfrac1x\\right)$\"的结构，换元后上下限变为 $\\mp\\infty$，一步到 $\\arctan$。\n\n**详细解答**：被积函数为偶函数，\n\n$I = 2\\int_0^1\\dfrac{1+x^2}{1+x^4}\\,dx = 2\\int_0^1\\dfrac{1+\\frac{1}{x^2}}{x^2+\\frac1{x^2}}\\,dx$\n\n令 $u=x-\\dfrac1x$，则 $du=\\left(1+\\dfrac1{x^2}\\right)dx$，$x^2+\\dfrac1{x^2}=u^2+2$；$x\\to0^+$ 时 $u\\to-\\infty$，$x=1$ 时 $u=0$：\n\n$I = 2\\int_{-\\infty}^{0}\\dfrac{du}{u^2+2} = \\dfrac{2}{\\sqrt2}\\arctan\\dfrac{u}{\\sqrt2}\\Bigg|_{-\\infty}^{0} = \\sqrt2\\left(0-\\left(-\\dfrac\\pi2\\right)\\right) = \\dfrac{\\pi}{\\sqrt2}$\n\n（数值检验：$\\dfrac{\\pi}{\\sqrt2}\\approx2.2214$；被积函数在 $x=0$ 处为 $1$、两端为 $2$，区间长 $2$，估值 $2\\sim4$，相符 ✓。）\n\n**方法总结**：对称区间 + 拔 1.1 型结构 = ==换元把有限区间射到无穷，再吃 $\\arctan$ 的满弧==。\n\n**【例 2.1-2】（★★，经典陷阱题）** 求 $\\int_{-1}^{1}\\dfrac{dx}{x^2}$。\n\n**思路分析**：先安检：分母在 $x=0$ 处为零，且 $\\dfrac1{x^2}\\to+\\infty$——这是瑕点在区间**内部**的反常积分，不是普通定积分。\n\n**详细解答**：\n\n**勘误式复盘（重要）**：\n\n错误做法：$\\int_{-1}^{1}\\dfrac{dx}{x^2} = \\left[-\\dfrac1x\\right]_{-1}^{1} = (-1)-(+1) = -2$。\n\n错因复盘：N–L 公式要求被积函数在 $[a,b]$ 上（或其在区间上原函数连续可代值）逐点连续；$\\dfrac1{x^2}$ 在 $x=0$ 无界，公式前提直接失效。更荒谬的信号是结果为**负数**，而被积函数恒正——<span style=\"color:#e53935\">正函数积出负值，必是公式滥用</span>。\n\n纠正：按瑕点拆分（反常积分定义，见 4.1）：\n\n$\\int_{-1}^{1}\\dfrac{dx}{x^2} = \\int_{-1}^{0}\\dfrac{dx}{x^2}+\\int_0^1\\dfrac{dx}{x^2}$，其中 $\\int_0^1\\dfrac{dx}{x^2} = \\lim_{\\varepsilon\\to0^+}\\left[-\\dfrac1x\\right]_\\varepsilon^1 = \\lim_{\\varepsilon\\to0^+}\\left(\\dfrac1\\varepsilon-1\\right)=+\\infty$\n\n故原积分**发散**。\n\n**方法总结**：动笔定积分前\"两查\"：==一查原函数是否积得出，二查区间内有没有瑕点==；负号、超界数值都是报警器。"},"2.2":{"id":"2.2","name":"对称性与周期性（奇偶化简、平移截断思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：定积分的值由\"区间 × 函数\"共同决定，两者各有免费午餐：\n\n1. **奇偶性**（区间对称 $[-a,a]$）：$\\displaystyle\\int_{-a}^a f = 0$（$f$ 奇）；$\\displaystyle\\int_{-a}^a f = 2\\int_0^a f$（$f$ 偶）。复杂函数先\"**奇偶拆分**\"：$f = \\underbrace{\\tfrac{f(x)+f(-x)}{2}}_{\\text{偶}} + \\underbrace{\\tfrac{f(x)-f(-x)}{2}}_{\\text{奇}}$。\n2. **配对原理（$1+e^{g}$ 杀手锏）**：\n\n$\\int_{-a}^{a}\\dfrac{f(x)}{1+e^{g(x)}}\\,dx = \\int_0^a f(x)\\,dx\\quad\\text{（}f\\text{ 偶，}g\\text{ 奇）}$\n\n因为 $\\dfrac{1}{1+e^{g(x)}}+\\dfrac{1}{1+e^{-g(x)}}=1$。\n3. **周期性**（$f$ 以 $T$ 为周期）：$\\displaystyle\\int_a^{a+T}f = \\int_0^T f$（起点任意）；$\\displaystyle\\int_0^{nT}f = n\\int_0^T f$；长区间 $\\int_a^b f$ 先\"切整周期 + 算尾巴\"。\n\n**适用信号**：对称区间（含 $\\sin,\\ln(x+\\sqrt{1+x^2}),\\arctan x,x$ 的奇因子）；分母 $1+e^{(\\cdot)}$ 型；$\\sin,\\cos$ 的整数倍周期、$|·|$ 折叠周期。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 见 $[-a,a]$ 只查\"整奇整偶\" | 先做奇偶拆分，往往一半立灭（如 $x^3\\cos^2x$ 奇、$\\sin^2x\\cos^2x$ 偶） |\n| 周期函数\"平移截断\"用在非整周期上直接约 | $\\int_0^{nT}f = n\\int_0^Tf$ 要求整周期；余段须单独算 |\n| $f(x)+f(-x)$ 配对时把区间仍写成 $[-a,a]$ | 配对后区间变 $[0,a]$，系数 $2$ 消失 |","examplesMd":"**【例 2.2-1】（★★，经典）** 求 $\\int_{-\\pi/2}^{\\pi/2}\\left(x^3+\\sin^2x\\right)\\cos^2x\\,dx$。\n\n**思路分析**：对称区间，先做奇偶拆分：$x^3\\cos^2x$ 是奇函数直接归零，剩偶函数部分用倍角降幂。\n\n**详细解答**：$x^3\\cos^2x$ 为奇函数，积分为 $0$；$\\sin^2x\\cos^2x$ 为偶函数，故\n\n$I = 2\\int_0^{\\pi/2}\\sin^2x\\cos^2x\\,dx = 2\\int_0^{\\pi/2}\\dfrac{\\sin^22x}{4}\\,dx = \\dfrac12\\int_0^{\\pi/2}\\dfrac{1-\\cos4x}{2}dx = \\dfrac14\\left[x-\\dfrac{\\sin4x}{4}\\right]_0^{\\pi/2} = \\dfrac{\\pi}{8}$\n\n（数值检验：$\\pi/8\\approx0.3927$；被积函数在 $[0,\\tfrac\\pi2]$ 峰值 $\\tfrac14$，粗估 $\\le\\tfrac14\\cdot\\tfrac\\pi2\\approx0.39$，恰好吻合 ✓。）\n\n**方法总结**：==对称区间先拆奇偶，偶的部分倍角降幂==——两板斧解决九成对称型填空。\n\n**【例 2.2-2】（★★，经典）** 求 $\\int_0^{4\\pi}x\\left|\\sin x\\right|\\,dx$。\n\n**思路分析**：$|·|$ 的周期是 $\\pi$，但多了个因子 $x$ 破坏周期性——把区间按 $\\pi$ 切段，每段内平移标准化：$x=k\\pi+t$，$|\\sin(k\\pi+t)|=\\sin t$（$t\\in[0,\\pi]$）。\n\n**详细解答**：按段 $[k\\pi,(k+1)\\pi]$（$k=0,1,2,3$）换元 $x=k\\pi+t$：\n\n$\\int_{k\\pi}^{(k+1)\\pi}x\\left|\\sin x\\right|dx = \\int_0^{\\pi}(k\\pi+t)\\sin t\\,dt = k\\pi\\cdot2+\\pi = (2k+1)\\pi$\n\n（用 $\\int_0^\\pi\\sin t\\,dt=2$，$\\int_0^\\pi t\\sin t\\,dt=\\pi$。）求和：\n\n$\\int_0^{4\\pi}x\\left|\\sin x\\right|dx = \\pi\\sum_{k=0}^{3}(2k+1) = \\pi(1+3+5+7) = 16\\pi$\n\n（一般化：$\\int_0^{n\\pi}x\\lvert\\sin x\\rvert dx = n^2\\pi$，奇数和 $1+3+\\cdots+(2n-1)=n^2$。数值检验 $16\\pi\\approx50.27$ ✓。）\n\n**方法总结**：==破坏周期的因子，切段平移把它\"系数化\"==——$x$ 变成段号 $k\\pi$ 的常数因子，各段再求和。"},"2.3":{"id":"2.3","name":"区间再现公式（镜像翻转思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：积分值与\"用什么字母当变量\"无关，于是令 $x\\to a+b-x$（区间关于中点镜像翻转）后与原式**相等**——两次不同的\"视角\"相加，常常产生奇迹：\n\n$\\int_a^b f(x)\\,dx = \\int_a^b f(a+b-x)\\,dx\\qquad\\text{（区间再现公式）}$\n\n**必背三大推论**：\n\n| 推论 | 用途 |\n| --- | --- |\n| $\\int_0^\\pi x f(\\sin x)\\,dx = \\dfrac\\pi2\\int_0^\\pi f(\\sin x)\\,dx$ | 消灭讨厌的因子 $x$（$f(\\sin)$ 保证镜像后仍在 $\\sin$ 上） |\n| $\\int_{-a}^{a}f(x)dx = \\int_0^a\\left[f(x)+f(-x)\\right]dx$ | 2.2 配对原理的一般形式 |\n| $\\int_0^{\\pi/2}f(\\lvert\\sin x\\rvert,\\lvert\\cos x\\rvert)dx = \\int_0^{\\pi/2}f(\\lvert\\cos x\\rvert,\\lvert\\sin x\\rvert)dx$ | $\\sin\\leftrightarrow\\cos$ 互换自由 |\n\n**适用信号**：被积函数含因子 $x$ 与\"关于中点对称的部分\"并存；$\\tan$ 幂、$\\sin^m+\\cos^n$ 结构；$\\ln(1+\\tan x)$ 型\"翻转变形虫\"。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 再现后 $dx$ 漏负号 | $x = a+b-t \\Rightarrow dx=-dt$，上下限同时反转，负号消解——务必完整写出 |\n| $\\int_0^\\pi xf(\\sin x)dx$ 想用再现消 $x$，但 $f$ 里混有 $\\cos x$ | $\\cos(\\pi-x)=-\\cos x$ 不自映射，公式失效；只有纯 $\\sin$ 结构才可半价 |\n| 再现一次就急着相加 | 先观察 $f(x)+f(a+b-x)$ 是否化简成常数/可积函数，化简不了就别硬用 |","examplesMd":"**【例 2.3-1】（★★，经典名题）** 求 $I=\\int_0^{\\pi}\\dfrac{x\\sin x}{1+\\cos^2x}\\,dx$。\n\n**思路分析**：因子 $x$ 挡路，$f(\\sin x)$ 部分纯良——推论一直接\"半价\"消灭 $x$。\n\n**详细解答**：令 $x=\\pi-t$：\n\n$I=\\int_0^\\pi\\dfrac{(\\pi-t)\\sin t}{1+\\cos^2t}\\,dt = \\pi\\int_0^\\pi\\dfrac{\\sin t}{1+\\cos^2t}dt-I$\n\n故 $2I=\\pi\\int_0^\\pi\\dfrac{\\sin t\\,dt}{1+\\cos^2t}$。对后者凑微分 $d(\\cos t)$（分子 $\\sin t\\,dt=-d(\\cos t)$，分母 $1+\\cos^2t$）：\n\n$\\int_0^\\pi\\dfrac{\\sin t}{1+\\cos^2t}dt = \\left[-\\arctan(\\cos t)\\right]_0^\\pi = \\left(\\dfrac\\pi4\\right)-\\left(-\\dfrac\\pi4\\right)\\cdot(-1)^{-1}\\ldots$ 逐点计算：$-\\arctan(\\cos\\pi)=-\\arctan(-1)=\\dfrac\\pi4$；$-\\arctan(\\cos0)=-\\dfrac\\pi4$；差 $=\\dfrac\\pi2$。于是\n\n$2I = \\pi\\cdot\\dfrac{\\pi}{2}\\ \\Longrightarrow\\ I=\\dfrac{\\pi^2}{4}\\approx2.467$\n\n（数值检验 ✓；被积函数峰值在 $x=\\tfrac\\pi2$ 附近约 $\\tfrac{\\pi/2}{1}=\\tfrac\\pi2$，积分同量级。）\n\n**方法总结**：==$x\\cdot f(\\sin)$ 半价律：$x$ 换成 $\\dfrac\\pi2$==——再现公式的第一生产力。\n\n**【例 2.3-2】（★★，经典）** 求 $I=\\int_0^{\\pi/2}\\dfrac{\\sin x}{\\sin x+\\cos x}\\,dx$。\n\n**思路分析**：这是例 1.8-1 的定积分版。硬找原函数可行但啰嗦；用镜像 $x\\to\\tfrac\\pi2-x$（$\\sin\\leftrightarrow\\cos$ 互换），与原式相加成 $1$。\n\n**详细解答**：令 $x=\\dfrac\\pi2-t$：\n\n$I=\\int_0^{\\pi/2}\\dfrac{\\cos t}{\\cos t+\\sin t}\\,dt$\n\n相加：$2I=\\int_0^{\\pi/2}\\dfrac{\\sin x+\\cos x}{\\sin x+\\cos x}dx=\\dfrac\\pi2$，故 $I=\\dfrac\\pi4$。\n\n（对照 1.8 例 1 的原函数法：$\\left[\\dfrac x2-\\dfrac12\\ln(\\sin x+\\cos x)\\right]_0^{\\pi/2} = \\dfrac\\pi4-\\dfrac12\\ln1-\\left(0-\\dfrac12\\ln1\\right)=\\dfrac\\pi4$ ✓ 两法互验。）\n\n**方法总结**：分母是 $\\sin+\\cos$ 的对称结构，==镜像一加，分母自杀==。"},"2.4":{"id":"2.4","name":"定积分分部与华里士公式（点火递推思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：$\\int_0^{\\pi/2}\\sin^mx\\cos^nx\\,dx$ 不必逐次分部——华里士（Wallis）公式一次点火，直接数双阶乘：\n\n$\\int_0^{\\pi/2}\\sin^mx\\cos^nx\\,dx=\\begin{cases}\\dfrac{(m-1)!!\\,(n-1)!!}{(m+n)!!}\\cdot\\dfrac{\\pi}{2}, & m,n\\ \\text{均为偶数（含 }0\\text{）}\\\\[2mm]\\dfrac{(m-1)!!\\,(n-1)!!}{(m+n)!!}, & m,n\\ \\text{至少一个奇数}\\end{cases}$\n\n**必背速记**：\n\n| 指数形态 | 结果 | 口感 |\n| --- | --- | --- |\n| $\\int_0^{\\pi/2}\\sin^{2k}=\\dfrac{(2k-1)!!}{(2k)!!}\\cdot\\dfrac\\pi2$ | $k=1:\\dfrac\\pi4$，$k=2:\\dfrac{3\\pi}{16}$，$k=3:\\dfrac{5\\pi}{32}$ | 偶数幂带 $\\dfrac\\pi2$ |\n| $\\int_0^{\\pi/2}\\sin^{2k+1}=\\dfrac{(2k)!!}{(2k+1)!!}$ | $k=1:\\dfrac23$，$k=2:\\dfrac{8}{15}$ | 奇数幂不带 $\\pi$ |\n\n**适用信号**：$[0,\\tfrac\\pi2]$ 上 $\\sin^m\\cos^n$；一般区间先对称/周期化到标准区间；含 $x^n\\sin x$、$x^ne^x$ 的用分部（例 2）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 区间不是 $[0,\\tfrac\\pi2]$ 就点火 | 先搬区间：$\\int_0^\\pi\\sin^nx\\,dx = 2\\int_0^{\\pi/2}\\sin^nx\\,dx$ 对一切 $n$ 成立（$\\sin(\\pi-x)=\\sin x$）；$[0,2\\pi]$ 型先拆成两个半周期 |\n| <span style=\"color:#e53935\">奇数幂误带 $\\dfrac\\pi2$：$\\int_0^{\\pi/2}\\cos^5x\\,dx=\\dfrac{4!!}{5!!}\\cdot\\dfrac\\pi2$</span> | 奇数幂不带 $\\pi$：正确为 $\\dfrac{4!!}{5!!}=\\dfrac{8}{15}$——点火公式头号事故 |\n| $(-1)!!=1$ 不知道 | 约定 $0!!=(-1)!!=1$，使公式在 $m=0$ 或 $n=0$ 时照常运转 |","examplesMd":"**【例 2.4-1】（★★，经典）** 求 $\\int_0^{\\pi/2}\\sin^6x\\cos^2x\\,dx$。\n\n**思路分析**：标准区间、双偶幂——直接点火。\n\n**详细解答**：双偶幂，点火并带因子 $\\dfrac{\\pi}{2}$：\n\n$\\int_0^{\\pi/2}\\sin^6x\\cos^2x\\,dx = \\dfrac{5!!\\cdot 1!!}{8!!}\\cdot\\dfrac{\\pi}{2} = \\dfrac{15\\cdot1}{384}\\cdot\\dfrac{\\pi}{2} = \\dfrac{5\\pi}{256}$\n\n（双阶乘清点：$5!!=5\\cdot3\\cdot1=15$，$8!!=8\\cdot6\\cdot4\\cdot2=384$；数值检验 $5\\pi/256\\approx0.0614$ ✓。）\n\n**方法总结**：点火前双查——==区间是否 $[0,\\tfrac\\pi2]$，奇偶决定带不带 $\\dfrac\\pi2$==。\n\n**【例 2.4-2】（★★，经典）** 求 $\\int_0^\\pi x^2\\sin x\\,dx$。\n\n**思路分析**：$x^2\\sin x$：幂 × 弦，定积分分部两次（\"反对幂指弦\"同款排序），三角在两次分部中轮流\"变号\"。\n\n**详细解答**：\n\n$\\int_0^\\pi x^2\\sin x\\,dx = \\left[-x^2\\cos x\\right]_0^\\pi+\\int_0^\\pi 2x\\cos x\\,dx = \\pi^2+2\\int_0^\\pi x\\cos x\\,dx$\n\n再分部：$\\int_0^\\pi x\\cos x\\,dx = \\left[x\\sin x\\right]_0^\\pi-\\int_0^\\pi\\sin x\\,dx = 0-2 = -2$。合并：\n\n$\\int_0^\\pi x^2\\sin x\\,dx = \\pi^2-4\\approx5.870$\n\n（检验：$\\pi^2-4\\approx5.87$ ✓（数值验证过）；被积函数在 $[0,\\pi]$ 非负，结果为正 ✓。）\n\n**方法总结**：定积分分部==每步算完 $uv\\big|_a^b$ 立刻出数==，别让边界项拖着变量走。"},"2.5":{"id":"2.5","name":"定积分定义求和式极限（和式转积分思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：$n$ 项和、每项形状随 $\\dfrac kn$ 变化——这不是数列题，是**披着数列外衣的定积分**：\n\n$\\lim_{n\\to\\infty}\\dfrac1n\\sum_{k=1}^{n}f\\left(\\dfrac kn\\right) = \\int_0^1 f(x)\\,dx$\n\n（右端点分割；左端点 $\\sum_{k=0}^{n-1}$、中点 $\\sum\\left(\\tfrac{2k-1}{2n}\\right)$ 同理，极限不变。）\n\n**必背转化表（凑形优先）**：\n\n| 和式形状 | 凑法 | 极限 |\n| --- | --- | --- |\n| $\\sum \\dfrac{n}{n^2+k^2}$ | 提出 $\\dfrac1n$：$\\dfrac{1}{n}\\sum\\dfrac{1}{1+(k/n)^2}$ | $\\int_0^1\\dfrac{dx}{1+x^2}=\\dfrac\\pi4$ |\n| $\\sum \\dfrac{1}{n}\\sqrt{1+\\dfrac kn}$ | 已是标准形 | $\\int_0^1\\sqrt{1+x}\\,dx$ |\n| $\\sum \\dfrac{k}{n^2+k^2}$ | $=\\dfrac1n\\sum\\dfrac{k/n}{1+(k/n)^2}$ | $\\int_0^1\\dfrac{x\\,dx}{1+x^2}=\\dfrac{\\ln2}{2}$ |\n| $\\sum \\sin\\dfrac{k\\pi}{n}\\cdot\\dfrac1n$ | 系数是 $\\pi$ 别慌 | $\\int_0^1\\sin\\pi x\\,dx=\\dfrac2\\pi$ |\n\n**适用信号**：$n$ 项求和取极限；每项含 $\\dfrac1n$ 与 $\\dfrac kn$（或可凑出）；各项\"同阶不齐整\"（夹逼会丢精度，见姊妹篇 2.1 与本节的分工）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\sum\\dfrac{n}{n^2+k^2}$ 硬用夹逼得 $0$ 或发散 | 通项 $\\sim\\dfrac1n$，$n$ 项和是 $O(1)$ 精度量——夹逼太粗，必须积分定义 |\n| 和式带 $-\\dfrac1n$（如 $k=0$ 起步多算一项） | 有限个端点项差 $O\\left(\\tfrac1n\\right)$，极限不受影响；但书写时要说明 |\n| $f$ 依赖 $n$（如含 $n$ 在指数上） | 定义式要求 $f$ 与 $n$ 无关；那种题先放缩/拆项（5.7 的 $\\int x^nf$ 型） |","examplesMd":"**【例 2.5-1】（★★，经典）** 求 $\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\dfrac{n}{n^2+k^2}$。\n\n**思路分析**：提出 $\\dfrac1n$，识别 $f(x)=\\dfrac1{1+x^2}$。\n\n**详细解答**：\n\n$\\sum_{k=1}^{n}\\dfrac{n}{n^2+k^2} = \\dfrac1n\\sum_{k=1}^n\\dfrac{1}{1+\\left(\\frac kn\\right)^2}\\ \\longrightarrow\\ \\int_0^1\\dfrac{dx}{1+x^2} = \\arctan x\\Big|_0^1 = \\dfrac\\pi4$\n\n（检验：$n=2000$ 时和式 $\\approx0.78527$，与 $\\tfrac\\pi4\\approx0.78540$ 已贴到第三位小数 ✓。）\n\n**方法总结**：==先提 $\\dfrac1n$，再看剩余部分能否统一写成 $f\\left(\\tfrac kn\\right)$==。\n\n**【例 2.5-2】（★★，经典）** 求 $\\lim_{n\\to\\infty}\\dfrac1n\\left(\\sqrt{1+\\dfrac1n}+\\sqrt{1+\\dfrac2n}+\\cdots+\\sqrt{1+\\dfrac nn}\\right)$。\n\n**思路分析**：已是标准形，$f(x)=\\sqrt{1+x}$；收尾的定积分用 1.6 练习 1 的根式代换。\n\n**详细解答**：\n\n$\\lim_{n\\to\\infty}\\dfrac1n\\sum_{k=1}^n\\sqrt{1+\\dfrac kn} = \\int_0^1\\sqrt{1+x}\\,dx = \\dfrac23\\left(1+x\\right)^{3/2}\\Big|_0^1 = \\dfrac23\\left(2\\sqrt2-1\\right)$\n\n（数值检验：$\\tfrac23(2\\sqrt2-1)\\approx1.219$，$n=2000$ 时和式 $\\approx1.2191$ ✓。）\n\n**方法总结**：定义式只是\"翻译\"，翻译完的定积分回到第一、二部分的武器库。"},"2.6":{"id":"2.6","name":"分段函数与绝对值处理（先拆后算思想）","part":"定积分计算","book":"一元积分","teachMd":"**核心思想**：$\\lvert\\cdot\\rvert,\\ \\max,\\ \\min,\\ [x]$、分段定义——它们的共性是**折点**。铁律：\n\n==先解方程找折点，按折点拆区间，逐段去掉外衣，最后逐段积分相加==\n\n**常用脱衣表**：\n\n| 外衣 | 脱法 |\n| --- | --- |\n| $\\lvert f(x)\\rvert$ | 解 $f(x)=0$ 找零点，按 $f$ 符号分段 |\n| $\\max(f,g)$ | 解 $f=g$ 找交点；$\\max=\\dfrac{f+g+\\lvert f-g\\rvert}{2}$ |\n| $[x]$（取整） | 按整数点切段，段内为常数 |\n| $\\sqrt{f^2(x)}$ | 就是 $\\lvert f(x)\\rvert$（如 $\\sqrt{1-\\sin2x}=\\lvert\\cos x-\\sin x\\rvert$） |\n\n**适用信号**：被积函数含绝对值、根号下完全平方式、$\\max/\\min$、取整、分段定义式、$\\tan\\lvert\\cdot\\rvert$ 类折点函数。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\sqrt{1-\\sin2x}=\\cos x-\\sin x$ 不带绝对值 | 平方开方必出 $\\lvert\\cdot\\rvert$，例 2.6-1 的正反教材 |\n| 折点找漏（如 $\\sin x=\\tfrac{2x}{\\pi}$ 有三个交点） | 画图 + 单调性论证交点个数，再拆 |\n| 拆段后上下限写反 | 每段写清楚\"$x$ 从谁到谁\"，负号随限走 |","examplesMd":"**【例 2.6-1】（★★，经典名题）** 求 $\\int_0^{\\pi}\\sqrt{1-\\sin2x}\\,dx$。\n\n**思路分析**：$1-\\sin2x=(\\sin x-\\cos x)^2$——开方得绝对值，折点在 $\\cos x=\\sin x$ 即 $x=\\tfrac\\pi4$。\n\n**详细解答**：\n\n$\\sqrt{1-\\sin2x} = \\left|\\cos x-\\sin x\\right|$\n\n在 $[0,\\tfrac\\pi4]$ 上 $\\cos x\\ge\\sin x$，在 $[\\tfrac\\pi4,\\pi]$ 上 $\\sin x\\ge\\cos x$，故\n\n$I = \\int_0^{\\pi/4}\\left(\\cos x-\\sin x\\right)dx+\\int_{\\pi/4}^{\\pi}\\left(\\sin x-\\cos x\\right)dx = \\left[\\sin x+\\cos x\\right]_0^{\\pi/4}+\\left[-\\cos x-\\sin x\\right]_{\\pi/4}^{\\pi}$\n\n$= \\left(\\sqrt2-1\\right)+\\left(1+\\sqrt2\\right) = 2\\sqrt2$\n\n（检验：$\\left[\\sin+\\cos\\right]_0^{\\pi/4} = \\sqrt2-1$ ✓；$\\left[-\\cos-\\sin\\right]_{\\pi/4}^{\\pi} = (1)-(-\\sqrt2) = 1+\\sqrt2$ ✓；数值 $2.828$ ✓。）\n\n**方法总结**：==根号下平方 = 绝对值 = 找零拆段==，三步一气呵成。\n\n**【例 2.6-2】（★★，经典）** 求 $\\int_0^{2}\\max\\left(x,\\ x^2\\right)\\,dx$。\n\n**思路分析**：解 $x=x^2$ 得 $x=0,1$：$[0,1]$ 上 $x\\ge x^2$，$[1,2]$ 上 $x^2\\ge x$。\n\n**详细解答**：\n\n$\\int_0^2\\max\\left(x,x^2\\right)dx = \\int_0^1x\\,dx+\\int_1^2x^2\\,dx = \\dfrac12+\\left(\\dfrac83-\\dfrac13\\right) = \\dfrac12+\\dfrac73 = \\dfrac{17}{6}$\n\n（检验：$\\tfrac{17}6\\approx2.83$，介于 $\\int_0^2x\\,dx=2$ 与 $\\int_0^2x^2dx=\\tfrac83$ 之间，且贴近后者（$\\max$ 在 $[1,2]$ 取 $x^2$）✓。）\n\n**方法总结**：$\\max/\\min$ 先求交点定\"话语权分区\"，与小值之差即面积差。"},"3.1":{"id":"3.1","name":"变限积分求导（复合求导链式思想）","part":"变限积分","book":"一元积分","teachMd":"**核心思想**：变限积分的求导法则（要求 $f$ 连续、$\\varphi,\\psi$ 可导）：\n\n$\\dfrac{d}{dx}\\int_{\\varphi(x)}^{\\psi(x)}f(t)\\,dt = f\\left(\\psi(x)\\right)\\psi'(x)-f\\left(\\varphi(x)\\right)\\varphi'(x)$\n\n三条铁则：**\"上限代、乘导数；下限代、乘导数、添负号；内层还有 $x$，先换元剥出来\"**。\n\n被积函数中**不许含有求导变量 $x$**——一旦出现（$f(x-t)$、$(x-t)^2$ 之类），必须先通过换元（$u=x-t$ 型）或拆项把 $x$ \"请出积分号\"，再求导。这是本方法的头号陷阱。\n\n**适用信号**：积分限上带 $x$（单限、双限、复合限）；被积函数含参数 $x$；抽象 $f$ 只给连续性。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\dfrac{d}{dx}\\int_0^{x^2}f(t)dt = f(x^2)$ | 漏上限导数：应为 $2x\\,f(x^2)$（复合链式） |\n| <span style=\"color:#e53935\">$\\dfrac{d}{dx}\\int_0^x f(x-t)\\,dt = f(0)$ 或直接把 $x$ 当常数</span> | 被积函数含 $x$ 不可直接套公式：先令 $u=x-t$，得 $\\int_0^x f(u)du$，再求导得 $f(x)$（例 3.1-2） |\n| 求导后 $f$ 的\"连续性\"前提没交代 | 法则要求 $f$ 连续（保证 $F(x)=\\int_a^xf$ 可导且 $F'=f$）；题设只有可积时结论可失效 |","examplesMd":"**【例 3.1-1】（★★，经典）** 设 $F(x)=\\int_{x}^{x^2}\\sqrt{1+t^4}\\,dt$，求 $F'(x)$。\n\n**思路分析**：双限皆复合——上限 $x^2$、下限 $x$，逐项套公式，别忘下限负号。\n\n**详细解答**：\n\n$F'(x) = \\sqrt{1+\\left(x^2\\right)^4}\\cdot\\left(x^2\\right)'-\\sqrt{1+x^4}\\cdot\\left(x\\right)' = 2x\\sqrt{1+x^8}-\\sqrt{1+x^4}$\n\n（结构检验：两项的\"根号内容\"分别对准上下限；$x<0$ 时 $2x\\sqrt{\\cdots}$ 为负由 $x$ 本身携带，公式不另加符号 ✓。）\n\n**方法总结**：==上限正、下限负；代谁的限、乘谁的导==。\n\n**【例 3.1-2】（★★，经典陷阱题）** 设 $f$ 连续，$F(x)=\\int_0^x f(x-t)\\,dt$，求 $F'(x)$。\n\n**思路分析**：被积函数 $f(x-t)$ 含 $x$——公式禁止直接求导。换元 $u=x-t$ 把 $x$ 从\"积分变量肩上\"搬到\"积分限上\"。\n\n**详细解答**：令 $u=x-t$（视 $x$ 为常数），$dt=-du$；$t=0\\Rightarrow u=x$，$t=x\\Rightarrow u=0$：\n\n$F(x)=\\int_0^x f(x-t)dt = \\int_x^0 f(u)(-du) = \\int_0^x f(u)\\,du$\n\n故 $F'(x)=f(x)$。\n\n（检验：取 $f(u)=u$，则 $F(x)=\\int_0^x(x-t)dt = \\left[xt-\\tfrac{t^2}2\\right]_0^x = \\tfrac{x^2}2$，$F'=x=f(x)$ ✓——特例检验是抽象题的标配动作。）\n\n**方法总结**：==内层有 $x$，换元搬出来==；$f(x-t)$ 永远先做 $u=x-t$。"},"3.2":{"id":"3.2","name":"含变限积分的极限（洛必达与等价替换组合思想）","part":"变限积分","book":"一元积分","teachMd":"**核心思想**：变限积分天生是 $\\dfrac0 0$（或 $\\dfrac\\infty\\infty$）型的\"存款\"——上限与积分同时趋于 $0$，洛必达一来，积分号瞬间消失（$F'=f$ 降维）：\n\n$\\lim_{x\\to0}\\dfrac{\\int_0^x g(t)\\,dt}{x^\\alpha} \\overset{\\text{洛}}{=} \\lim_{x\\to0}\\dfrac{g(x)}{\\alpha x^{\\alpha-1}}$\n\n**技术要点**：\n\n1. 分母的次数 $\\alpha$ 由分子的**主部阶数**决定：$\\int_0^x t^p dt\\sim\\dfrac{x^{p+1}}{p+1}$——\"积一次分，阶数加一\"。\n2. 复合上限（$\\sin x$、$x^2$、$\\cos x$）先由 3.1 求导再进入等价替换。\n3. $\\dfrac{\\infty}{\\infty}$ 型变限（如 $\\int_0^x e^{t^2}dt$）洛必达同样立功，但要注意分母构造。\n\n**适用信号**：极限式中出现 $\\int_{(\\cdot)}^{(\\cdot)}$ 且上下限随极限变量趋于同一处（或 $\\to\\infty$），比值的分母是幂或指数。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 洛必达前不验证未定式类型 | 非 $\\dfrac00,\\dfrac\\infty\\infty$ 不能用（姊妹篇 1.3 的教训在积分场重演） |\n| 分子积分求导后忘链式（复合上限） | $\\int_0^{\\sin x}(\\cdot)dt$ 求导乘 $\\cos x$（3.1） |\n| 定阶靠感觉 | 用泰勒定阶：被积函数在 $0$ 处展开取首项（$g(t)\\sim ct^p\\Rightarrow\\int_0^xg\\sim\\dfrac{c x^{p+1}}{p+1}$） |","examplesMd":"**【例 3.2-1】（★★，经典）** 求 $\\lim_{x\\to0}\\dfrac{\\displaystyle\\int_0^{x}\\sin t^2\\,dt}{x^3}$。\n\n**思路分析**：$\\dfrac00$ 型（分子 $\\to0$ 因积分区间塌缩）。洛必达一次，分母降为 $3x^2$，再用 $\\sin u\\sim u$。\n\n**详细解答**：\n\n$\\lim_{x\\to0}\\dfrac{\\int_0^x\\sin t^2dt}{x^3}\\overset{\\text{洛}}{=}\\lim_{x\\to0}\\dfrac{\\sin x^2}{3x^2} = \\dfrac13\\lim_{x\\to0}\\dfrac{\\sin x^2}{x^2} = \\dfrac13$\n\n（洛必达合法性：分子分母在 $0$ 附近可导、导数比极限存在；$\\sin t^2$ 连续保证分子可导。定阶复核：$\\sin t^2\\sim t^2\\Rightarrow\\int_0^x\\sim\\tfrac{x^3}3$ ✓。）\n\n**方法总结**：==先洛必达一次脱积分，再等价替换收尾==；分母次数 = 被积函数主部阶数 + 1。\n\n**【例 3.2-2】（★★，经典）** 求 $\\lim_{x\\to+\\infty}\\dfrac{\\displaystyle\\int_0^{x}e^{t^2}dt}{\\dfrac{e^{x^2}}{x}}$。\n\n**思路分析**：$\\dfrac\\infty\\infty$ 型。分母刻意构造为 $\\dfrac{e^{x^2}}{x}$，洛必达后分母导数出现 $e^{x^2}\\left(2-\\dfrac1{x^2}\\right)$，指数风暴对消。\n\n**详细解答**：\n\n$\\lim_{x\\to+\\infty}\\dfrac{\\int_0^xe^{t^2}dt}{\\dfrac{e^{x^2}}{x}}\\overset{\\text{洛}}{=}\\lim_{x\\to+\\infty}\\dfrac{e^{x^2}}{e^{x^2}\\left(2-\\dfrac{1}{x^2}\\right)} = \\lim_{x\\to+\\infty}\\dfrac{1}{2-\\dfrac1{x^2}} = \\dfrac12$\n\n（合理性检验：分部积分可证 $\\int_0^xe^{t^2}dt\\sim\\dfrac{e^{x^2}}{2x}$，故比值 $\\to\\tfrac12$ ✓。）\n\n**方法总结**：$\\infty$ 型变限极限中，==分母常是\"猜出来的渐近主部\"==——竞赛里见到 $\\dfrac{e^{x^2}}{x}$ 这类分母，就要意识到命题人在暗示主部。"},"3.3":{"id":"3.3","name":"变限积分的函数性态（求导画像思想）","part":"变限积分","book":"一元积分","teachMd":"**核心思想**：变限积分 $F(x)=\\int_a^xf(t)dt$ 是一个普通的函数，研究它的单调、极值、凹凸、拐点、零点——**不需要也不应该先求出 $F$ 的显式表达式**（很多根本积不出）。==求导画像==：$F'=f$ 看符号（单调），$F''=f'$ 看符号（凹凸）。原函数积不出时，最值可以\"定点报告\"：位置说得出，数值留积分形式。\n\n**适用信号**：题目给出 $F(x)=\\int_{(\\cdot)}^{(\\cdot)}f$ 并问单调性/极值/拐点/最值/方程 $F(x)=0$ 的根。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 先硬求 $F$ 的表达式再研究 | 积不出（2.1 清单）就卡死；应当直接用 $F'=f$ 画像 |\n| 极值点只写位置不判类型 | 由 $F'$ 穿越符号（$F''=f'$ 在该点符号）判定极大/极小 |\n| 最值在无穷区间上不检端点/极限 | 闭区间查两端，开区间或 $\\mathbb R$ 上查 $\\lim_{x\\to\\pm\\infty}F$ 的归宿 |","examplesMd":"**【例 3.3-1】（★★，经典）** 设 $F(x)=\\int_0^x t\\sin t\\,dt$，$x\\in[0,2\\pi]$。求 $F$ 的单调区间与最值。\n\n**思路分析**：$F'(x)=x\\sin x$——符号由 $\\sin x$（$x>0$）决定：$[0,\\pi]$ 非负、$[\\pi,2\\pi]$ 非正。极值点处的 $F$ 值可用 $t\\sin t$ 的原函数（可积）算出。\n\n**详细解答**：$F'(x)=x\\sin x$：在 $(0,\\pi)$ 内为正、$(\\pi,2\\pi)$ 内为负，故 $F$ 在 $\\left[0,\\pi\\right]$ 单调增、$\\left[\\pi,2\\pi\\right]$ 单调减。$F(x) = \\left[-t\\cos t+\\sin t\\right]_0^x = -x\\cos x+\\sin x$，于是\n\n$F(\\pi) = \\pi,\\qquad F(2\\pi) = -2\\pi,\\qquad F(0)=0$\n\n最大值 $F(\\pi)=\\pi$（极大），最小值 $F(2\\pi)=-2\\pi$（在端点取得）。\n\n（检验：$F(2\\pi)=-2\\pi\\approx-6.28$，比 $F(0)=0$ 小 ✓；答案三值与 $F'$ 符号走向一致：升到 $\\pi$ 再降过 $0$ 到 $-2\\pi$。）\n\n**方法总结**：==$F'=f$ 定走向，端点与驻点一起比大小==；原函数能积出就顺手算值，积不出就报\"$F(x_0)=\\int_a^{x_0}f$\"。\n\n**【例 3.3-2】（★★，经典）** 设 $F(x)=\\int_0^x e^{-t^2}\\left(1-t^2\\right)dt$。求 $F$ 的拐点。\n\n**思路分析**：拐点看 $F''=f'$ 变号。$f(t)=e^{-t^2}(1-t^2)$，求导得 $f'(x) = e^{-x^2}\\left(-2x\\right)\\left(1-x^2\\right)+e^{-x^2}\\left(-2x\\right) = 2x\\left(x^2-2\\right)e^{-x^2}$。\n\n**详细解答**：\n\n$F''(x) = 2x\\left(x^2-2\\right)e^{-x^2}$\n\n$e^{-x^2}>0$ 恒成立，符号由 $2x(x^2-2)=2x(x-\\sqrt2)(x+\\sqrt2)$ 决定：在 $x=-\\sqrt2,0,\\sqrt2$ 三处变号，均为拐点横坐标。\n\n$F(0)=0$；$F\\left(\\pm\\sqrt2\\right)=\\int_0^{\\pm\\sqrt2}e^{-t^2}(1-t^2)dt$（原函数积不出，保留积分形式完全合规——数值仅作画像参考：$F(\\sqrt2)\\approx0.083$，$F(-\\sqrt2)\\approx-0.083$，由奇函数性 $f$ 为奇 $\\Rightarrow F$ 为偶？注意 $f$ 是**偶**函数 $\\Rightarrow F$ 是**奇**函数，故 $F(-\\sqrt2)=-F(\\sqrt2)$ ✓）。\n\n拐点：$\\left(-\\sqrt2,\\ F\\left(-\\sqrt2\\right)\\right)$，$\\left(0,0\\right)$，$\\left(\\sqrt2,\\ F\\left(\\sqrt2\\right)\\right)$。\n\n**方法总结**：拐点 = $f'$ 的变号零点；==函数值允许\"积分形式交卷\"==，这本身就是竞赛标准答案形态。"},"3.4":{"id":"3.4","name":"含变限积分的方程（求导脱限思想）","part":"变限积分","book":"一元积分","teachMd":"**核心思想**：方程里积分限带 $x$、积分号里全是 $t$——两边求导，积分应声消失，方程**降维成微分方程**。三板斧：\n\n1. **求导脱限**：两边对 $x$ 求导（3.1）；\n2. **代 $x=0$ 拿初值**：原方程代 $x=0$（积分塌缩为零）得 $f(0)$——这是求导后丢失的信息，必须补；\n3. **解微分方程并回代验证**：解出的 $f$ 代回原积分方程复核（防增根）。\n\n**适用信号**：$f$ 满足 $\\int_0^xf(t)dt$ 与 $f(x)$、$x$ 的恒等式；或\"核含 $(x-t)$\"的 Volterra 型方程（需两次求导）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 求导后忘用原方程取初值 | 微分方程通解含任意常数，没有初值无法定解——初值永远藏在 $x=0$ 处 |\n| 核 $(x-t)$ 只求导一次就解 | 一次求导后仍含积分，须再求一次（配合 3.1 拔高的三阶导技术） |\n| 求出的解不回代原方程 | 求导可能引入增解（尤其在分段定义域上），==回代验证是收尾动作== |","examplesMd":"**【例 3.4-1】（★★，经典）** 设 $f$ 连续，且 $f(x)=1+2\\displaystyle\\int_0^x f(t)\\,dt$。求 $f(x)$。\n\n**思路分析**：两边求导得 $f'=2f$；代 $x=0$ 得 $f(0)=1$。\n\n**详细解答**：求导：$f'(x)=2f(x)$；初值：$f(0)=1+2\\int_0^0f=1$。解一阶线性方程：\n\n$f(x)=Ce^{2x},\\quad f(0)=C=1\\ \\Longrightarrow\\ f(x)=e^{2x}$\n\n回代验证：$1+2\\int_0^xe^{2t}dt = 1+\\left(e^{2x}-1\\right) = e^{2x} = f(x)$ ✓。\n\n**方法总结**：==求导、定初值、解方程、回代验==四步完整闭环。\n\n**【例 3.4-2】（★★，经典）** 设 $f$ 可导，且 $\\displaystyle\\int_0^{x}f(t)\\,dt = x^2+f(x)$ 对一切 $x$ 成立。求 $f(x)$。\n\n**思路分析**：求导得 $f(x) = 2x+f'(x)$，即 $f'-f=-2x$（一阶线性）；初值由 $x=0$：$0=0+f(0)$。\n\n**详细解答**：初值 $f(0)=0$。解 $f'-f=-2x$：乘积分因子 $e^{-x}$，$\\left(f e^{-x}\\right)' = -2xe^{-x}$，两边积分（分部）得 $f e^{-x} = 2(x+1)e^{-x}+C$，故 $f = 2x+2+Ce^x$；由 $f(0)=0$ 得 $C=-2$：\n\n$f(x) = 2x+2-2e^x$\n\n回代验证：$\\int_0^x\\left(2t+2-2e^t\\right)dt = x^2+2x-2e^x+2$；而 $x^2+f(x) = x^2+2x+2-2e^x$ ✓ 相等。\n\n**方法总结**：含多项式的积分方程化为一阶线性方程后，==积分因子法==直取通解；回代验算是拿满分的手续。"},"4.1":{"id":"4.1","name":"敛散性判别（比较定阶思想）","part":"反常积分","book":"一元积分","teachMd":"**核心思想**：反常积分的敛散只由\"出事地点\"附近的主部阶数决定——拿它与标准尺子 $p$ 积分比阶：\n\n| 标准尺子 | 敛散分界 |\n| --- | --- |\n| $\\int_1^{+\\infty}\\dfrac{dx}{x^p}$ | $p>1$ 收敛，$p\\le1$ 发散（无穷远处） |\n| $\\int_0^{1}\\dfrac{dx}{x^p}$ | $p<1$ 收敛，$p\\ge1$ 发散（瑕点处） |\n\n**必背判别流程**：\n\n1. **找瑕点/无穷端**（分母为零处、$\\infty$；<span style=\"color:#e53935\">瑕点藏在区间内部最易漏查</span>）；\n2. **抓大头定阶**：等价替换出主部 $g(x)\\sim\\dfrac{c}{x^p}$（或 $\\dfrac{c}{(x-a)^p}$）；\n3. **对表宣判**；等价失灵时用**比较判别法**：$0\\le f\\le g$，$g$ 收则 $f$ 收，$f$ 散则 $g$ 散；极限形式 $\\lim\\dfrac{f}{g}=l$（$0<l<+\\infty$）则同敛散。\n\n**适用信号**：只问敛散（不算值）；分母含 $x$ 的幂、$\\ln x$；带参数时先做 4.4 的临界扫描。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\int_0^{+\\infty}\\dfrac{dx}{x^p}$ 只在 $\\infty$ 处判 | 两端都有出事点，必须拆 $\\int_0^1+\\int_1^{+\\infty}$ 分别判（例 4.1-1） |\n| $\\int_1^{+\\infty}\\dfrac{dx}{x\\ln x}$ 判收敛 | 换元 $u=\\ln x$ 后恰是 $p=1$ 的尺子，发散——$\\ln$ 尺与幂尺要\"复合\"着量 |\n| 比较判别法用于变号函数 | 比较法要求非负；变号函数先取绝对值判绝对收敛，或用狄利克雷判别（非数学类低频，了解即可） |","examplesMd":"**【例 4.1-1】（★★，概念经典）** 讨论 $\\displaystyle\\int_0^{+\\infty}\\dfrac{dx}{x^{p}}$（$p\\in\\mathbb R$）的敛散性。\n\n**思路分析**：两处出事点：$x=0$（分母零）与 $x=+\\infty$。必须在 $x=1$ 处切成两段分别判——两个条件都要满足。\n\n**详细解答**：\n\n$\\int_0^{+\\infty}\\dfrac{dx}{x^p} = \\int_0^{1}\\dfrac{dx}{x^p}+\\int_1^{+\\infty}\\dfrac{dx}{x^p}$\n\n第一段（瑕点 $0$）：$p<1$ 收敛、$p\\ge1$ 发散；第二段（无穷端）：$p>1$ 收敛、$p\\le1$ 发散。\n\n两段同时收敛需要 $p<1$ **且** $p>1$——不可能。故==对任何实数 $p$，该积分都发散==（$p$ 在两端的要求恰好互斥）。\n\n（检验：$p=1$ 时 $\\ln$ 双双发散 ✓；$p=\\tfrac12$ 时第一段收敛但第二段是调和尺发散 ✓；$p=2$ 反之 ✓。）\n\n**方法总结**：==多出事点必拆段，全收才收，一段发散即发散==。\n\n**【例 4.1-2】（★★，经典）** 讨论 $\\displaystyle\\int_2^{+\\infty}\\dfrac{dx}{x\\left(\\ln x\\right)^{p}}$（$p>0$）的敛散性。\n\n**思路分析**：分母是幂尺 × 对数尺——令 $u=\\ln x$ 化成纯幂尺（对数尺的本质：$du=\\dfrac{dx}{x}$）。\n\n**详细解答**：令 $u=\\ln x$，则 $\\dfrac{dx}{x}=du$，下限 $x=2\\Rightarrow u=\\ln2$，上限 $\\to+\\infty$：\n\n$\\int_2^{+\\infty}\\dfrac{dx}{x\\left(\\ln x\\right)^p} = \\int_{\\ln2}^{+\\infty}\\dfrac{du}{u^p}$\n\n由幂尺：$p>1$ 收敛，$0<p\\le1$ 发散。收敛时还可算出值：\n\n$p>1:\\ \\int_{\\ln2}^{+\\infty}u^{-p}du = \\dfrac{(\\ln2)^{1-p}}{p-1}$\n\n（检验 $p=2$：值 $=\\dfrac1{\\ln2}\\approx1.443$ ✓。）\n\n**方法总结**：==$x$ 的幂管无穷远，$\\ln x$ 的幂管\"慢速衰减\"==；见到 $\\dfrac{dx}{x\\cdot(\\ln x)^p}$ 就做 $u=\\ln x$。"},"4.2":{"id":"4.2","name":"反常积分计算（对称与再现推广思想）","part":"反常积分","book":"一元积分","teachMd":"**核心思想**：收敛的反常积分允许做变量替换与\"配对相加\"——定积分的对称性（2.2）与区间再现（2.3）在此全部升级可用，且多了一件新武器：**倒代换 $x\\to\\dfrac1x$ 把 $[1,+\\infty)$ 与 $(0,1]$ 互换**，于是\n\n$I=\\int_0^{+\\infty}f(x)dx\\ \\Longrightarrow\\ I=\\int_0^{+\\infty}\\dfrac{f\\left(\\frac1x\\right)}{x^2}\\,dx\\ \\Longrightarrow\\ 2I=\\int_0^{+\\infty}\\left[f(x)+\\dfrac{f(\\frac1x)}{x^2}\\right]dx$\n\n被积函数一配对，常有奇效（例 4.2-1、4.2-2、拔 4.2 三连发）。\n\n**适用信号**：积分区间 $[0,+\\infty)$ 或 $(-\\infty,+\\infty)$；被积函数含 $x$ 与 $\\dfrac1x$ 的对称结构；$\\ln x$ 乘对称核。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 发散积分也做配角运算（$I=-I\\Rightarrow I=0$） | 配对前先确认收敛！发散时 $I=-I$ 可推出任意值，是悖论源头 |\n| $\\int_0^\\infty$ 换元后忘验证新积分限/瑕点 | 每次替换写清区间流向；跨瑕点的替换（如 $u=\\tan x$ 在 $x=\\tfrac\\pi2$）要拆段 |\n| $\\ln x$ 的符号：$x\\in(0,1)$ 时 $\\ln x<0$ | $\\int_0^1\\ln x\\,dx=-1$ 为负——正负号随时抽查 |","examplesMd":"**【例 4.2-1】（★★，经典名题）** 求 $I=\\displaystyle\\int_0^{+\\infty}\\dfrac{dx}{1+x^4}$。\n\n**思路分析**：直接部分分式（拔 1.8）再代 $\\pm\\infty$ 太重。倒代换 $x=\\dfrac1t$ 产生姊妹积分 $\\int_0^\\infty\\dfrac{t^2}{1+t^4}dt$，两式相加恰是拔 1.1 的\"除 $x^2$\"结构！\n\n**详细解答**：收敛性先验：$x\\to\\infty$ 时 $\\sim\\tfrac1{x^4}$，收敛；$x\\to0^+$ 无瑕点。做倒代换 $x=\\dfrac1t$（$dx=-\\dfrac{dt}{t^2}$，$x:0\\to\\infty$ 即 $t:\\infty\\to0$）：\n\n$I=\\int_0^{+\\infty}\\dfrac{t^2}{1+t^4}\\,dt\\ \\Longrightarrow\\ 2I=\\int_0^{+\\infty}\\dfrac{1+x^2}{1+x^4}\\,dx$\n\n用拔 1.1 的原函数 $\\dfrac1{\\sqrt2}\\arctan\\dfrac{x^2-1}{\\sqrt2 x}$（即 $\\dfrac1{\\sqrt2}\\arctan\\dfrac{x-\\frac1x}{\\sqrt2}$）：\n\n$2I = \\dfrac{1}{\\sqrt2}\\left[\\arctan\\dfrac{x-\\frac1x}{\\sqrt2}\\right]_{0^+}^{+\\infty} = \\dfrac1{\\sqrt2}\\left(\\dfrac\\pi2-\\left(-\\dfrac\\pi2\\right)\\right) = \\dfrac{\\pi}{\\sqrt2}$\n\n$I = \\dfrac{\\pi}{2\\sqrt2}\\approx1.1107$\n\n（数值检验 ✓；与 $\\int_0^\\infty\\dfrac{dx}{1+x^2}=\\dfrac\\pi2$ 对照——分母次数翻倍、答案缩至 $\\tfrac{1}{\\sqrt2}$ 倍，量级合理。）\n\n**方法总结**：==$[0,\\infty)$ 上 $\\dfrac{1}{1+x^n}$ 型：倒代换配对成 $\\dfrac{1+x^{n/2}}{\\cdots}$ 结构再吃 $\\arctan$ 满弧==。\n\n**【例 4.2-2】（★★，经典）** 求 $I=\\displaystyle\\int_0^{+\\infty}\\dfrac{\\ln x}{1+x^2}\\,dx$。\n\n**思路分析**：$\\ln x$ 在 $x\\to0^+$ 发散负向、$x\\to+\\infty$ 增长缓慢——先判敛（分母 $x^2$ 镇两端），再倒代换看能否\"自相消\"。\n\n**详细解答**：敛性：$x\\to0^+$ 时 $\\left|\\dfrac{\\ln x}{1+x^2}\\right|\\sim\\lvert\\ln x\\rvert$，而 $\\int_0^\\cdot\\lvert\\ln x\\rvert dx$ 收敛（幂尺 $p<1$ 皆能镇住 $\\ln$）；$x\\to\\infty$ 时 $\\sim\\dfrac{\\ln x}{x^2}$ 收敛。绝对收敛 ✓，可以放心换元。令 $x=\\dfrac1t$：\n\n$I=\\int_0^{+\\infty}\\dfrac{\\ln\\frac1t}{1+\\frac1{t^2}}\\cdot\\dfrac{dt}{t^2} = \\int_0^{+\\infty}\\dfrac{-\\ln t}{t^2+1}\\,dt = -I$\n\n由 $I=-I$ 得 $I=0$。\n\n（合理性检验：被积函数在 $(0,1)$ 为负、$(1,\\infty)$ 为正，图形关于 $(1,0)$ 的\"对数对称\"恰让两块面积相等——数值验证 $0.000$ ✓。）\n\n**方法总结**：==$I=-I\\Rightarrow I=0$ 的前提是收敛==；\"正负面积对消\"式答案在竞赛填空中屡试不爽。"},"4.3":{"id":"4.3","name":"Γ 函数与 B 函数（阶乘的积分语言）","part":"反常积分","book":"一元积分","teachMd":"**核心思想**：把一大类\"积得值、积不出式\"的积分统一收录进两张表，互相换算即可出值：\n\n$\\Gamma(s)=\\int_0^{+\\infty}x^{s-1}e^{-x}\\,dx\\ (s>0),\\qquad B(m,n)=\\int_0^1x^{m-1}(1-x)^{n-1}\\,dx\\ (m,n>0)$\n\n**必背换算表**：\n\n| 关系式 | 用途 |\n| --- | --- |\n| $\\Gamma(s+1)=s\\,\\Gamma(s)$ | 降参数（\"阶乘递推\"） |\n| $\\Gamma(n+1)=n!$（$n\\in\\mathbb N$） | $\\Gamma$ 是阶乘的推广 |\n| $\\Gamma\\left(\\dfrac12\\right)=\\sqrt\\pi$ | 半整数点全靠它：$\\Gamma\\left(\\dfrac{7}{2}\\right)=\\dfrac{105}{16}\\sqrt\\pi$ 等 |\n| $B(m,n)=\\dfrac{\\Gamma(m)\\Gamma(n)}{\\Gamma(m+n)}$ | $B\\leftrightarrow\\Gamma$ 互译 |\n| $\\int_0^{+\\infty}x^{k}e^{-x^{\\alpha}}dx=\\dfrac1{\\alpha}\\Gamma\\left(\\dfrac{k+1}{\\alpha}\\right)$ | 指数型反常积分一步出值 |\n| $\\int_0^1x^{m-1}(1-x)^{n-1}dx=B(m,n)=\\dfrac{(m-1)!(n-1)!}{(m+n-1)!}$（$m,n\\in\\mathbb N$） | 幂乘积型 |\n| $\\int_0^{\\pi/2}\\sin^ux\\cos^vx\\,dx=\\dfrac12 B\\left(\\dfrac{u+1}{2},\\dfrac{v+1}2\\right)$ | 三角幂型（与 2.4 华里士同源） |\n\n**适用信号**：$\\int_0^\\infty x^ke^{-x^a}$；$\\int_0^1 x^m(1-x)^n$；$\\int_0^{\\pi/2}\\sin^m\\cos^n$（指数非整数时尤其——华里士只吃整数，Γ/B 通吃）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $\\int_0^\\infty x^5e^{-x^2}dx=\\Gamma(3)$ | 漏系数：令 $t=x^2$ 后 $=\\dfrac12\\Gamma(3)=1$（$dx$ 换元带 $\\tfrac{1}{2\\sqrt t}$） |\n| $B(m,n)$ 与 $\\dfrac{\\Gamma(m)}{\\Gamma(n)}$ 记混 | 是**乘积除以和**：$B=\\dfrac{\\Gamma(m)\\Gamma(n)}{\\Gamma(m+n)}$ |\n| $\\Gamma\\left(\\tfrac12\\right)$ 记成 $\\dfrac{\\sqrt\\pi}{2}$ | $=\\sqrt\\pi$；用 $\\Gamma\\left(\\tfrac32\\right)=\\tfrac12\\Gamma\\left(\\tfrac12\\right)=\\tfrac{\\sqrt\\pi}{2}$ 反推自检 |","examplesMd":"**【例 4.3-1】（★★，经典）** 求 $\\displaystyle\\int_0^{+\\infty}x^{7}e^{-x^2}\\,dx$。\n\n**思路分析**：指数上 $x^2$、幂 $x^7$——套 $\\dfrac1\\alpha\\Gamma\\left(\\dfrac{k+1}\\alpha\\right)$（$k=7,\\alpha=2$）。\n\n**详细解答**：令 $t=x^2$（$x=t^{\\frac12},\\ dx=\\dfrac{1}{2}t^{-\\frac12}dt$）：\n\n$\\int_0^{+\\infty}x^7e^{-x^2}dx = \\int_0^{+\\infty}t^{\\frac72}e^{-t}\\cdot\\dfrac12t^{-\\frac12}dt = \\dfrac12\\int_0^{+\\infty}t^{3}e^{-t}dt = \\dfrac12\\Gamma(4) = \\dfrac{3!}{2} = 3$\n\n（检验：$\\int_0^\\infty x^7e^{-x^2}$ 数值 $=3.000$ ✓；同款 $\\int_0^\\infty x^5e^{-x^2}=\\tfrac12\\Gamma(3)=1$ ✓。）\n\n**方法总结**：==$x^k e^{-x^\\alpha}$：换元 $t=x^\\alpha$，答案 $\\dfrac1\\alpha\\Gamma\\left(\\dfrac{k+1}{\\alpha}\\right)$==；整数点回落阶乘。\n\n**【例 4.3-2】（★★，经典）** 求 $\\displaystyle\\int_0^{1}x^{3}\\left(1-x\\right)^{5}\\,dx$。\n\n**思路分析**：幂乘积型（$[0,1]$ 上 $x^m(1-x)^n$），直接 $B$ 函数整数版。\n\n**详细解答**：\n\n$\\int_0^1x^3(1-x)^5dx = B(4,6) = \\dfrac{\\Gamma(4)\\Gamma(6)}{\\Gamma(10)} = \\dfrac{3!\\cdot5!}{9!} = \\dfrac{6\\cdot120}{362880} = \\dfrac{1}{504}$\n\n（检验：$\\tfrac{1}{504}\\approx0.00198$，数值 ✓；被积函数峰值约 $\\left(\\tfrac38\\right)^3\\left(\\tfrac58\\right)^5\\approx0.0079$、区间长 $1$，量级合理。）\n\n**方法总结**：==$B(m,n)=\\dfrac{(m-1)!(n-1)!}{(m+n-1)!}$==（整数三点连乘），比逐项展开 $\\binom50$ 快得多。"},"4.4":{"id":"4.4","name":"含参数反常积分与综合判敛（临界指数扫描思想）","part":"反常积分","book":"一元积分","teachMd":"**核心思想**：带参数 $p$ 的反常积分，把 $p$ 当**扫描变量**：在每个出事点写出收敛所需的关于 $p$ 的不等式（\"临界条件\"），全部条件取**交集**。临界点 $p=p_0$（不等式取等处）单独精算——那里往往藏着\"对数救场\"或\"对数补刀\"的微妙剧情（例 4.4-2）。\n\n**操作模板**：\n\n1. 拆段（每个出事点一段）；\n2. 每段抓大头，得 $p$ 的不等式；\n3. 取交集；边界 $p$ 值逐个代入精判。\n\n**适用信号**：积分含参数 $p,\\alpha$ 问\"何时收敛\"；或问\"对给定的 $p$ 判断敛散\"（同一套扫描，只是代入）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 边界 $p_0$ 直接按\"抓大头\"下结论 | <span style=\"color:#e53935\">临界处主部相消/相持，必须代回精算（如 $p=1$ 时 $\\tfrac1{x\\ln x}$ 与 $\\tfrac1{x\\ln^2x}$ 生死不同）</span> |\n| 只扫一端 | 两端出事点各扫各的，交集才作数（同 4.1 拔高） |\n| 把\"收敛\"误当\"绝对收敛\"汇报 | 非负被积函数二者一致；变号时要分开说 |","examplesMd":"**【例 4.4-1】（★★，经典）** 讨论 $\\displaystyle\\int_0^{+\\infty}\\dfrac{dx}{x^{p}\\left(1+x\\right)}$（$p$ 为实数）的敛散性。\n\n**思路分析**：双出事点：$x\\to0^+$（$x^p$ 若太小则爆炸）与 $x\\to+\\infty$（整体 $\\sim x^{-p-1}$）。分别扫描取交集。\n\n**详细解答**：拆 $\\int_0^1+\\int_1^{+\\infty}$：\n\n在 $x\\to0^+$：$\\dfrac{1}{x^p(1+x)}\\sim\\dfrac1{x^p}$，收敛要求 $p<1$；\n\n在 $x\\to+\\infty$：$\\dfrac{1}{x^p(1+x)}\\sim\\dfrac1{x^{p+1}}$，收敛要求 $p+1>1$ 即 $p>0$。\n\n交集：$0<p<1$ 时收敛，其余发散。\n\n（临界自检：$p=0$ 时即 $\\int_0^\\infty\\dfrac{dx}{1+x}$ 在 $\\infty$ 端调和发散 ✓；$p=1$ 时 $\\tfrac1{x(1+x)}$ 在 $0$ 端 $\\sim\\tfrac1x$ 发散 ✓。）\n\n**方法总结**：==每端一行不等式，交集就是答案==；临界值代入特检。\n\n**【例 4.4-2】（★★，经典难题）** 讨论 $\\displaystyle\\int_2^{+\\infty}\\dfrac{dx}{x^{p}\\left(\\ln x\\right)^{2}}$（$p$ 为实数）的敛散性。\n\n**思路分析**：$p>1$ 显然收敛、$p<1$ 显然发散（幂占主导）——真正的剧情在 $p=1$：幂判\"打平\"，$\\ln^2$ 出场救场。这是\"临界精算\"的标准戏码。\n\n**详细解答**：\n\n**$p>1$**：取 $q\\in(1,p)$，则 $\\dfrac{1}{x^p\\ln^2x}\\le\\dfrac1{x^q}$（当 $x$ 充分大，因 $x^{p-q}\\ln^2x\\to\\infty$），收敛。\n\n**$p<1$**：取 $q\\in(p,1)$，$\\dfrac{1}{x^p\\ln^2x}\\ge\\dfrac1{x^q}$（充分大时 $x^{q-p}\\ge\\ln^2x$），发散。\n\n**$p=1$**：$\\displaystyle\\int_2^{+\\infty}\\dfrac{dx}{x\\ln^2x} = \\int_{\\ln2}^{+\\infty}\\dfrac{du}{u^2}$（$u=\\ln x$，例 4.1-2）$=\\dfrac{1}{\\ln2}$，收敛。\n\n结论：==$p\\ge1$ 时收敛，$p<1$ 时发散==（$p=1$ 被 $\\ln^2$ 救回）。\n\n（对照记忆：$\\dfrac{1}{x\\ln x}$（一次 $\\ln$）在 $p=1$ 仍发散——对数的\"救场能力\"随其次数而定，救得了 $\\ln^2$，救不了 $\\ln$。）\n\n**方法总结**：==幂先定大局，$\\ln$ 定临界==；临界 $p$ 值换元 $u=\\ln x$ 精算。"},"5.1":{"id":"5.1","name":"平面图形面积（微元先行思想）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：面积三套坐标系 = 三种微元：\n\n| 坐标系 | 面积公式 | 选址原则 |\n| --- | --- | --- |\n| 直角（$y$ 型） | $S=\\displaystyle\\int_a^b\\left[f_{\\text{上}}(x)-f_{\\text{下}}(x)\\right]dx$ | 上下边界各是一条曲线 |\n| 直角（$x$ 型） | $S=\\displaystyle\\int_c^d\\left[x_{\\text{右}}(y)-x_{\\text{左}}(y)\\right]dy$ | 左右边界各是一条曲线（抛物线开口向旁时首选） |\n| 极坐标 | $S=\\dfrac12\\displaystyle\\int_{\\alpha}^{\\beta}r^2(\\theta)\\,d\\theta$ | 边界由 $r(\\theta)$ 给出（心形线、双纽线、螺线） |\n\n**适用信号**：给曲线求围成面积；两条曲线交围；极坐标曲线。第一步永远是**求交点定限**。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| $y^2=2x$ 型对 $y$ 积分仍套 $\\int f_{\\text{上}}-f_{\\text{下}}\\,dx$ | 开口向右的抛物线应选 $x$ 型（对 $y$ 积分），一步到位 |\n| 极坐标忘乘 $\\dfrac12$，或 $r^2$ 只平方了 $r$ 的系数 | $S=\\dfrac12\\int r^2d\\theta$；双纽线 $r^2=a^2\\cos2\\theta$ 直接平方 $r^2$ 本身 |\n| 双纽线/心形线只积一半象限 | 先由 $r\\ge0$ 的 $\\theta$ 范围定定义域，再数对称倍数 |","examplesMd":"**【例 5.1-1】（★★，经典）** 求抛物线 $y^2=2x$ 与直线 $y=x-4$ 所围图形的面积。\n\n**思路分析**：抛物线开口向右——选 $x$ 型（对 $y$ 积分）：右边界 $x=y+4$，左边界 $x=\\dfrac{y^2}2$。先解交点定 $y$ 的范围。\n\n**详细解答**：联立 $\\dfrac{y^2}{2}=y+4$：$y^2-2y-8=0$，$y=-2,\\ 4$。故\n\n$S=\\int_{-2}^{4}\\left[(y+4)-\\dfrac{y^2}{2}\\right]dy = \\left[\\dfrac{y^2}{2}+4y-\\dfrac{y^3}{6}\\right]_{-2}^{4}$\n\n$=\\left(8+16-\\dfrac{64}{6}\\right)-\\left(2-8+\\dfrac{8}{6}\\right) = \\dfrac{40}{3}+\\dfrac{14}{3} = 18$\n\n（数值检验 $18$ ✓；量级：交点横跨 $y\\in[-2,4]$（宽 6）、水平厚度最大在 $y=4$ 处 $=6$，粗估 $\\sim\\tfrac23\\cdot36=24$ 同量级。）\n\n**方法总结**：==开口决定积分变量：右开口对 $y$ 积，上开口对 $x$ 积==；\"右减左、上减下\"，被积函数非负自查。\n\n**【例 5.1-2】（★★，经典）** 求双纽线 $r^2=a^2\\cos2\\theta$（$a>0$）所围图形的总面积。\n\n**思路分析**：$r^2\\ge0$ 要求 $\\cos2\\theta\\ge0$：$|\\theta|\\le\\tfrac\\pi4$ 或 $\\tfrac{3\\pi}4\\le\\theta\\le\\tfrac{5\\pi}4$——两支。由对称性（关于两轴皆对称），算第一象限一支的一半再乘 4。\n\n**详细解答**：在第一象限内 $\\theta\\in\\left[0,\\tfrac\\pi4\\right]$，由关于极轴与 $y$ 轴的双对称：\n\n$S = 4\\cdot\\dfrac12\\int_0^{\\pi/4}a^2\\cos2\\theta\\,d\\theta = 2a^2\\left[\\dfrac{\\sin2\\theta}{2}\\right]_0^{\\pi/4} = a^2$\n\n（检验：$\\sin\\tfrac\\pi2=1$，故 $S=2a^2\\cdot\\tfrac12=a^2$ ✓。）\n\n**方法总结**：极坐标面积==先定 $\\theta$ 的\"合法区间\"（$r\\ge0$），再数对称倍数==；$\\tfrac12r^2$ 微元来自扇形面积 $\\tfrac12 r\\cdot r\\,d\\theta$。"},"5.2":{"id":"5.2","name":"旋转体体积与侧面积（圆盘与柱壳对偶思想）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：旋转体体积两条对偶生产线，按\"旋转轴与条带方向\"选择：\n\n| 方法 | 微元 | 公式 | 适用 |\n| --- | --- | --- | --- |\n| 圆盘/垫圈（垂直切片） | 薄圆盘 $\\pi y^2\\,dx$ | $V_x=\\pi\\displaystyle\\int_a^by^2dx$（绕 $x$ 轴） | 条带⊥轴 |\n| 柱壳（平行切片） | 薄筒 $2\\pi x\\cdot y\\,dx$ | $V_y=2\\pi\\displaystyle\\int_a^b x\\,y\\,dx$（绕 $y$ 轴） | 条带∥轴 |\n\n侧面积（绕 $x$ 轴）：$S_{\\text{侧}} = 2\\pi\\displaystyle\\int_a^b\\lvert y\\rvert\\sqrt{1+y'^2}\\,dx$（==体积管平方式，侧面积管弧长==，两者别互串）。\n\n**适用信号**：\"绕 $x$/$y$ 轴（或给定直线）旋转\"。绕 $y$ 轴且函数含 $\\ln$、反三角时柱壳法常有奇效（避免反解 $x$）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 绕 $y$ 轴硬用圆盘法反解 $x=x(y)$ | 反解困难时改柱壳：$2\\pi\\int xy\\,dx$，免反解 |\n| 垫圈忘挖内孔：区域不贴轴时 $V=\\pi\\int\\left(R^2-r^2\\right)dx$ | 画截面圆环，外径 $R$ 内径 $r$ 各自查清 |\n| 侧面积误用 $\\int2\\pi y\\,dx$（漏弧长因子） | 必须 $2\\pi\\int y\\,ds$，$ds=\\sqrt{1+y'^2}dx$ |","examplesMd":"**【例 5.2-1】（★★，经典）** 求 $y=\\sin x$（$0\\le x\\le\\pi$）与 $x$ 轴围成图形分别绕 $x$ 轴、$y$ 轴旋转一周所得旋转体体积。\n\n**思路分析**：绕 $x$ 轴——条带垂直于轴，圆盘法 $\\pi\\int\\sin^2$；绕 $y$ 轴——条带平行于轴，柱壳法 $2\\pi\\int x\\sin x$，两个都是\"送分积分\"（2.4）。\n\n**详细解答**：\n\n绕 $x$ 轴：$V_x=\\pi\\int_0^\\pi\\sin^2x\\,dx = \\pi\\cdot\\dfrac\\pi2 = \\dfrac{\\pi^2}{2}$\n\n绕 $y$ 轴：$V_y=2\\pi\\int_0^\\pi x\\sin x\\,dx = 2\\pi\\Big[-x\\cos x+\\sin x\\Big]_0^\\pi = 2\\pi\\cdot\\pi = 2\\pi^2$\n\n（数值检验：$\\tfrac{\\pi^2}2\\approx4.93$，$2\\pi^2\\approx19.74$ ✓；Pappus 定理快核：图形面积 $A=2$、形心 $\\bar x=\\tfrac\\pi2$（对称），$V_y=2\\pi\\bar xA=2\\pi^2$ ✓ 完全吻合——Pappus 是旋转体的免费验算器。）\n\n**方法总结**：==绕谁转，先问条带平行还是垂直；柱壳免反解，圆盘好降幂==；Pappus（形心）可作旁证。\n\n**【例 5.2-2】（★★，经典名题）** 求星形线 $x^{\\frac23}+y^{\\frac23}=a^{\\frac23}$ 绕 $x$ 轴旋转一周所得旋转体的体积。\n\n**思路分析**：星形线参数化 $x=a\\cos^3t,\\ y=a\\sin^3t$。绕 $x$ 轴用圆盘法 $V=\\pi\\int y^2dx$，其中 $y^2=a^2\\sin^6t$、$dx=-3a\\cos^2t\\sin t\\,dt$——积分正是华里士点火（2.4）。\n\n**详细解答**：利用图形关于 $y$ 轴对称（$x\\in[-a,a]$），\n\n$V = \\pi\\int_{-a}^{a}y^2\\,dx = 2\\pi\\int_0^a y^2dx = 2\\pi\\int_{\\pi/2}^{0}a^2\\sin^6t\\cdot\\left(-3a\\cos^2t\\sin t\\right)dt$\n\n$= 6\\pi a^3\\int_0^{\\pi/2}\\sin^7t\\cos^2t\\,dt = 6\\pi a^3\\cdot\\dfrac{6!!\\cdot1!!}{9!!} = 6\\pi a^3\\cdot\\dfrac{48}{945} = \\dfrac{32\\pi a^3}{105}$\n\n（点火核对：$7$ 奇 $2$ 偶——至少一个奇数，不带 $\\pi$ 因子；$6!!=48$，$9!!=945$，$\\tfrac{48}{945}=\\tfrac{16}{315}$，$6\\cdot\\tfrac{16}{315}=\\tfrac{32}{105}$ ✓；数值检验 $0.9575a^3$ ✓；对照：外切球体积 $\\tfrac43\\pi a^3\\approx4.19a^3$，星形线旋转体远小于球，合理。）\n\n**方法总结**：参数曲线绕 $x$ 轴：$V=\\pi\\int y^2\\left|dx\\right|$，==参数换元后 $t$ 的走向与绝对值要同步==；点火公式收尾。"},"5.3":{"id":"5.3","name":"弧长与曲率（$ds$ 三态思想）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：一切弧长、侧面积、曲线质量都从弧微分 $ds$ 出发——三种坐标形态对号入座：\n\n| 曲线给出方式 | $ds$ | 弧长 |\n| --- | --- | --- |\n| $y=f(x)$ | $\\sqrt{1+y'^2}\\,dx$ | $\\displaystyle\\int_a^b\\sqrt{1+y'^2}dx$ |\n| 参数 $\\left(x(t),y(t)\\right)$ | $\\sqrt{x'^2+y'^2}\\,dt$ | $\\displaystyle\\int_{t_1}^{t_2}\\sqrt{x'^2+y'^2}\\,dt$ |\n| 极坐标 $r(\\theta)$ | $\\sqrt{r^2+r'^2}\\,d\\theta$ | $\\displaystyle\\int_\\alpha^\\beta\\sqrt{r^2+r'^2}\\,d\\theta$ |\n\n曲率（弯曲程度）：$K=\\dfrac{\\lvert y''\\rvert}{\\left(1+y'^2\\right)^{3/2}}$，曲率半径 $\\rho=\\dfrac1K$。\n\n**适用信号**：问弧长/全长；问\"在哪一点曲率最大\"；旋转体侧面积（$2\\pi\\int y\\,ds$，5.2 联动）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 参数式 $ds=\\sqrt{x'^2+y'^2}\\,dt$ 漏开方或漏平方 | 现场用\"勾股\"重推：$ds^2=dx^2+dy^2$ |\n| 极坐标 $ds=\\sqrt{r^2+r'^2}\\,d\\theta$ 记成 $\\sqrt{1+r'^2}$ | 极坐标不是直角坐标；由 $x=r\\cos\\theta$ 微分代入可重推 |\n| 曲率公式用 $K=\\dfrac{y''}{(1+y'^2)^{3/2}}$ 丢绝对值 | 必须取 $\\lvert y''\\rvert$（曲率非负） |\n| 弧长积分遇到 $\\sqrt{\\cos^2}$ 不加绝对值 | 开方出 $\\lvert\\cdot\\rvert$，按区间去绝对再积分（例 5.3-1 的 $3a\\sin t\\cos t$ 在第一象限内非负，属幸运情形，须说明） |","examplesMd":"**【例 5.3-1】（★★，经典）** 求星形线 $x=a\\cos^3t,\\ y=a\\sin^3t$ 的全长。\n\n**思路分析**：参数式弧长；星形线四象限对称，只算第一象限乘 4。\n\n**详细解答**：$x'(t)=-3a\\cos^2t\\sin t$，$y'(t)=3a\\sin^2t\\cos t$：\n\n$ds = \\sqrt{9a^2\\cos^4t\\sin^2t+9a^2\\sin^4t\\cos^2t}\\;dt = 3a\\lvert\\sin t\\cos t\\rvert\\,dt$\n\n第一象限 $t\\in\\left[0,\\tfrac\\pi2\\right]$ 内 $\\sin t\\cos t\\ge0$，故\n\n$s = 4\\int_0^{\\pi/2}3a\\sin t\\cos t\\,dt = 12a\\cdot\\left[\\dfrac{\\sin^2t}{2}\\right]_0^{\\pi/2} = 6a$\n\n（检验：$6a\\approx6a$，与\"外切正方形折线 $8a$、内切菱形 $4\\sqrt2a\\approx5.66a$\"比较，星形线介于其间 ✓；数值验证 $6.000$ ✓。）\n\n**方法总结**：参数弧长==先化简 $ds$ 再谈积分==——$\\cos^4\\sin^2+\\sin^4\\cos^2=\\sin^2\\cos^2$ 的因式提取是本例灵魂。\n\n**【例 5.3-2】（★★，经典）** 求曲线 $y=\\ln x$ 上曲率最大的点及最大曲率。\n\n**思路分析**：$y'=\\dfrac1x,\\ y''=-\\dfrac1{x^2}$，代入曲率公式化成 $x$ 的函数再求最值。\n\n**详细解答**：\n\n$K(x) = \\dfrac{\\frac{1}{x^2}}{\\left(1+\\frac{1}{x^2}\\right)^{3/2}} = \\dfrac{x}{\\left(1+x^2\\right)^{3/2}}\\quad(x>0)$\n\n求导：$K'(x) = \\left(1+x^2\\right)^{-\\frac32}-3x^2\\left(1+x^2\\right)^{-\\frac52} = \\dfrac{1-2x^2}{\\left(1+x^2\\right)^{5/2}}$\n\n令 $K'=0$ 得 $x=\\dfrac1{\\sqrt2}$（$x>0$），且 $K$ 在其左增右减，为最大值点：\n\n$K_{\\max} = \\dfrac{\\frac1{\\sqrt2}}{\\left(1+\\frac12\\right)^{3/2}} = \\dfrac{2}{3\\sqrt3}\\approx0.3849$\n\n曲率最大点为 $\\left(\\dfrac1{\\sqrt2},\\ \\ln\\dfrac{1}{\\sqrt2}\\right)=\\left(\\dfrac{1}{\\sqrt2},\\ -\\dfrac12\\ln2\\right)$。\n\n（检验：数值验证 $K_{\\max}=\\tfrac{2}{3\\sqrt3}$ ✓；量级——半径 $\\tfrac{3\\sqrt3}{2}\\approx2.6$ 的圆弧，$\\ln x$ 在该点确实\"最弯\"（两侧趋于平直），合理。）\n\n**方法总结**：曲率最值 = 普通函数最值；==$K(x)$ 化简后常呈\"幂 × 二项式半整数幂\"结构==，求导令零即可。"},"5.4":{"id":"5.4","name":"物理应用（功·压力·质心的微元建模）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：物理应用没有新数学，只有新\"翻译\"——把物理量拆成微元再积分：\n\n| 物理量 | 微元 | 积分 |\n| --- | --- | --- |\n| 变力做功 | $dW=F(x)\\,dx$ | $W=\\displaystyle\\int F\\,dx$ |\n| 抽水做功（提升高度 $h(x)$） | $dW=\\rho g\\,x\\text{截面积}\\cdot h(x)dx$ | 分层积分 |\n| 水压力（深 $h$ 处宽 $w(h)$） | $dF=\\rho g\\,h\\cdot w(h)\\,dh$ | $F=\\rho g\\displaystyle\\int h\\,w(h)\\,dh$ |\n| 质心 | $\\bar x=\\dfrac{\\int x\\,dA}{A}$，$\\bar y=\\dfrac{\\frac12\\int f^2dx}{A}$ | 均值化 |\n\n（$dA$ 为面积微元；对 $y=f(x)\\ge0$ 下区域：$\\bar x=\\dfrac1A\\int_a^bxf(x)dx$，$\\bar y=\\dfrac1{2A}\\int_a^bf^2(x)dx$。）\n\n**适用信号**：题目出现\"功、压力、质心、流量\"等物理词——先建坐标系，再找微元，最后落到熟悉的积分。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 抽水题\"每一层提升高度\"取错 | 高度从**水面**起算，不是从池底；画图标 $h$ |\n| 压力题窄条宽度 $w(h)$ 写错（梯形/三角形截面） | 先列\"深度 $h$ 处的宽度函数\"再积分，代入两个深度验宽度 |\n| 质心公式 $\\bar y$ 漏 $\\tfrac12$ | 竖直小条自身质心在半高处：$dM_x=\\tfrac12f(x)\\cdot f(x)dx$ |","examplesMd":"**【例 5.4-1】（★★，经典）** 半径为 $R$ 的半球形水池（开口向上、盛满水）,将水全部抽到池口平面，求所做的功（水的密度 $\\rho$，重力加速度 $g$）。\n\n**思路分析**：建坐标：原点在池口圆心、$y$ 轴竖直向下（$y$ = 水深）。深 $y$ 处水层要提升高度 $y$；该层是半径 $\\sqrt{R^2-y^2}$、厚 $dy$ 的薄圆盘。\n\n**详细解答**：深 $y$ 处薄层：体积 $\\pi\\left(R^2-y^2\\right)dy$，重力 $\\rho g\\pi\\left(R^2-y^2\\right)dy$，提升 $y$：\n\n$W=\\int_0^R \\rho g\\pi\\left(R^2-y^2\\right)y\\,dy = \\rho g\\pi\\left[\\dfrac{R^2y^2}{2}-\\dfrac{y^4}{4}\\right]_0^R = \\dfrac{\\rho g\\pi R^4}{4}$\n\n（量纲与特例检验：$\\rho g\\pi R^4/4 = \\left(\\tfrac{\\pi R^3}{3}\\cdot\\rho g\\right)\\cdot\\left(\\tfrac{3R}{8}\\right)$——即\"水重 × 平均提升高 $\\tfrac{3R}8$\"；质心在深 $\\tfrac{3R}{8}$ 处，与半球体质心公式一致 ✓。）\n\n**方法总结**：抽水功 ==分层、每层\"重量 × 提升高\"==；收尾用\"总重 × 质心深度\"做旁证。\n\n**【例 5.4-2】（★★，经典）** 等腰三角形闸门（顶宽为 $0$，底边长 $a$、高 $h$）垂直立于水中。比较\"顶点在上（恰在水面）\"与\"底边在上（恰在水面）\"两种放法的总压力。\n\n**思路分析**：压强只认深度。两种放法中\"深度 $y$ 处窄条宽度函数\"不同（一个随 $y$ 增、一个随 $y$ 减），分别积分比较。\n\n**详细解答**：设水深 $y\\in[0,h]$，向下为正。\n\n**顶点在上**：深 $y$ 处窄条宽 $w(y)=\\dfrac{a}{h}y$（相似三角形：宽度与深度成正比）：\n\n$F_1=\\rho g\\int_0^h y\\cdot\\dfrac{a}{h}y\\,dy = \\dfrac{\\rho gah^2}{3}$\n\n**底边在上**：$w(y)=\\dfrac ah\\left(h-y\\right)$：\n\n$F_2=\\rho g\\int_0^h y\\cdot\\dfrac{a}{h}(h-y)\\,dy = \\dfrac{\\rho gah^2}{2}-\\dfrac{\\rho gah^2}{3} = \\dfrac{\\rho gah^2}{6}$\n\n故 $F_1=2F_2$：==尖朝下时压力是尖朝上的两倍==（闸门工程中\"宽边在上\"更省料即此原理）。\n\n（检验：$F_1+F_2 = \\rho g\\left(\\tfrac{ah}{2}\\right)\\cdot h = \\text{面积}\\times\\text{底深压强}$ ✓——两种放法的\"面积 × 平均压强\"和恰为底边全深的压强乘面积，数量级吻合。）\n\n**方法总结**：压力题==一条宽度的线性函数打天下==；写对 $w(y)$（相似三角形），积分是送分的。"},"5.5":{"id":"5.5","name":"积分中值定理（第一中值与第二中值的分工）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：积分的\"平均值\"必被 $f$ 取到——用它把积分**降维成函数值**，是沟通\" $\\int$ 与 $f$ \"的法定通道：\n\n| 定理 | 内容 | 条件 |\n| --- | --- | --- |\n| 第一中值 | $\\displaystyle\\int_a^bf(x)dx=f(\\xi)(b-a)$，$\\xi\\in[a,b]$ | $f$ 连续；$f$ 非常数时可取 $\\xi\\in(a,b)$ |\n| 加权第一中值 | $\\displaystyle\\int_a^bf(x)g(x)dx=f(\\xi)\\int_a^bg(x)dx$ | $f$ 连续，$g$ 可积且**不变号** |\n| 第二中值（了解） | $g$ 单调时 $\\displaystyle\\int_a^bfg=g(a)\\int_a^\\xi f+g(b)\\int_\\xi^bf$ | 用于 $g$ 变号而 $f$ 可积的场合 |\n\n**适用信号**：要\"脱掉积分号\"证存在性/极限；结论形如 $\\exists\\xi:\\ f(\\xi)=\\text{积分平均值}$；含参 $n$ 的积分极限（配合夹逼）。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 加权版忘记\"$g$ 不变号\"条件 | $g$ 变号可失效（例 5.5-2 反例） |\n| $\\xi$ 范围直接写开区间 | 条款只保证闭区间；开区间需 $f$ 非常数另证（练 5.5-2） |\n| 用中值定理求极限时不控制 $\\xi_n$ 的位置 | $\\xi_n$ 依赖 $n$，须配合夹逼/一致连续收网 |","examplesMd":"**【例 5.5-1】（★★，经典）** 设 $f$ 在 $[0,1]$ 上连续，证明 $\\lim_{n\\to\\infty}n\\displaystyle\\int_0^{1}x^{n}f(x)\\,dx=f(1)$。\n\n**思路分析**：$nx^n$ 是\" concentrating at 1\"的权（$\\int_0^1nx^ndx=\\dfrac n{n+1}\\to1$）。中值定理给 $n\\int_0^1x^nf=f(\\xi_n)\\cdot\\dfrac n{n+1}$，但 $\\xi_n$ 位置不受控——改用**分段收网**：远离 $1$ 的段被 $x^n$ 压死，靠近 $1$ 的段用一致连续。\n\n**详细解答**：任给 $\\varepsilon>0$。由 $f$ 在 $[0,1]$ 一致连续，存在 $\\delta>0$，使 $x\\in[1-\\delta,1]$ 时 $\\lvert f(x)-f(1)\\rvert<\\varepsilon$。设 $\\lvert f\\rvert\\le M$。\n\n$n\\int_0^1x^nf\\,dx-f(1) = n\\int_0^1x^n\\left[f(x)-f(1)\\right]dx+f(1)\\left(\\dfrac{n}{n+1}-1\\right)$\n\n第二项 $\\to0$。第一项拆两段：\n\n$\\left|n\\int_0^{1-\\delta}x^n\\left[f-f(1)\\right]dx\\right|\\le 2M\\cdot n\\cdot\\dfrac{(1-\\delta)^{n+1}}{n+1}\\longrightarrow0\\ (n\\to\\infty)$\n\n$\\left|n\\int_{1-\\delta}^{1}x^n\\left[f-f(1)\\right]dx\\right|\\le\\varepsilon\\cdot\\dfrac{n}{n+1}\\le\\varepsilon$\n\n故 $\\limsup\\left\\lvert n\\int_0^1x^nf-f(1)\\right\\rvert\\le\\varepsilon$；令 $\\varepsilon\\to0^+$ 得极限为 $f(1)$。\n\n（特例检验：$f\\equiv c$ 时左边 $=c\\cdot\\dfrac n{n+1}\\to c=f(1)$ ✓；$f(x)=x$ 时 $n\\int_0^1x^{n+1}=\\dfrac n{n+2}\\to1=f(1)$ ✓。）\n\n**方法总结**：==$nx^n$ 类\"凝聚权\"：远离凝聚点的段指数压死，近段用一致连续==——与姊妹篇数列极限的\"分段夹逼\"同宗。\n\n**【例 5.5-2】（★★，概念辨析）** 举例说明加权第一中值定理中\"$g$ 不变号\"的条件不可去掉。\n\n**思路分析**：构造 $g$ 变号且 $\\int g=0$ 的例子——右边 $f(\\xi)\\int g$ 恒为零，只要左边不为零即告失败。\n\n**详细解答**：取 $[a,b]=[-1,1]$，$f(x)=g(x)=x$（$f$ 连续、$g$ 可积但变号）：\n\n$\\int_{-1}^{1}f(x)g(x)dx=\\int_{-1}^{1}x^2dx=\\dfrac23$\n\n而 $f(\\xi)\\displaystyle\\int_{-1}^1g(x)dx=f(\\xi)\\cdot0=0$ 对**一切** $\\xi$ 成立。$\\dfrac23\\ne0$，等式无法成立——条件不可去。\n\n（同款自检：$\\int_{-1}^{1}x\\cdot x^3dx=0$？$\\int x^4=\\tfrac25\\ne0$——只要\"$f$ 偶 $\\times$ 奇 $g$\"不成立时随便挑都能出反例；真正要点是 $\\int g=0$ 而 $\\int fg\\ne0$。）\n\n**方法总结**：反例三件套：==$g$ 变号 + $\\int g=0$ + $\\int fg\\ne0$==；对称区间上的奇偶函数是反例工厂。"},"5.6":{"id":"5.6","name":"积分不等式（构造函数与 Schwarz 配对思想）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：积分不等式三大件套：\n\n1. **Schwarz 不等式**：$\\left(\\displaystyle\\int_a^bf g\\right)^2\\le\\int_a^bf^2\\cdot\\int_a^bg^2$——把\"乘积的和（积分）\"控制住；推论 $\\displaystyle\\int_a^bf^2\\ge\\dfrac{1}{b-a}\\left(\\int_a^bf\\right)^2$。\n2. **保序放缩**：点态不等式两边积分（$f\\le g\\Rightarrow\\int f\\le\\int g$，严格不等式在连续非常数时保持严格）。\n3. **构造函数法**：把结论中所有项移到一边设为 $F(x)$（积分限参数化为 $x$），证 $F'\\ge0$ + $F(a)\\ge0$——姊妹篇单调性证不等式的积分版。\n\n**必背 Schwarz 证明（判别式法）**：对任意 $\\lambda$，$0\\le\\displaystyle\\int_a^b\\left(f+\\lambda g\\right)^2=I_{ff}+2\\lambda I_{fg}+\\lambda^2I_{gg}$——关于 $\\lambda$ 的二次函数非负 ⇒ 判别式 $\\le0$ ⇒ $I_{fg}^2\\le I_{ff}I_{gg}$。\n\n**适用信号**：结论含 $\\left(\\int\\right)^2$、$\\int f^2$、两积分乘积；含 $\\ln$、$\\arctan$ 等具体函数的数值界；\"证明对一切 $x$ 成立\"型。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 保序放缩得 $\\le$ 就收工，题目要严格 $<$ | 检查等号成立条件：两函数几乎处处相等时才取等；连续函数点态严格不等 ⇒ 积分严格 |\n| Schwarz 用于 $f,g$ 不可积的场合 | 需 $f^2,g^2,fg$ 均可积（连续情形自动满足） |\n| 构造 $F(x)$ 后不验 $F(0)$（初值） | $F'\\ge0$ 只给\"递增\"，还需起点值非负才能全区间非负 |","examplesMd":"**【例 5.6-1】（★★，经典）** 证明：$\\left(\\displaystyle\\int_a^{b}f(x)\\,dx\\right)^{2}\\le\\left(b-a\\right)\\displaystyle\\int_a^{b}f^{2}(x)\\,dx$（$f$ 连续），并说明何时取等。\n\n**思路分析**：Schwarz 取 $g\\equiv1$ 一行得证；此处演示判别式法原文，并顺带导出取等条件。\n\n**详细解答**：对任意实数 $\\lambda$：\n\n$0\\le\\int_a^b\\left(f(x)+\\lambda\\right)^2dx=\\int_a^bf^2+2\\lambda\\int_a^bf+\\lambda^2(b-a)$\n\n右端是 $\\lambda$ 的二次函数，恒非负 ⇒ 其判别式非正：\n\n$\\Delta=4\\left(\\int_a^bf\\right)^2-4(b-a)\\int_a^bf^2\\le0\\ \\Longrightarrow\\ \\left(\\int_a^bf\\right)^2\\le(b-a)\\int_a^bf^2$\n\n**取等条件**：$\\Delta=0$ ⇔ 二次函数有实根 $\\lambda_0$ 且积分恒为零 ⇔ $\\left(f(x)+\\lambda_0\\right)^2$ 积分为零 ⇔ $f\\equiv-\\lambda_0$（常数）。==仅当 $f$ 为常数时取等==。\n\n（数值抽检：$f(x)=x$ 于 $[0,1]$：左 $=\\tfrac14$，右 $=1\\cdot\\tfrac13=\\tfrac13$，$\\tfrac14\\le\\tfrac13$ ✓。）\n\n**方法总结**：==平方非负 ⇒ 判别式 ≤ 0==，一行流拿下 Schwarz 家族；\"何时取等\"是竞赛加分点。\n\n**【例 5.6-2】（★★，经典）** 设 $f$ 在 $[a,b]$ 上连续且 $f(x)>0$。证明：$\\displaystyle\\int_a^{b}f(x)\\,dx\\cdot\\int_a^{b}\\dfrac{dx}{f(x)}\\ \\ge\\ \\left(b-a\\right)^{2}$。\n\n**思路分析**：Schwarz 配对：取 $u=\\sqrt f,\\ v=\\dfrac1{\\sqrt f}$，则 $\\int uv=\\int1=b-a$。\n\n**详细解答**：由 Schwarz 不等式（$u,v$ 连续）：\n\n$\\left(b-a\\right)^2=\\left(\\int_a^b u\\,v\\,dx\\right)^2\\le\\int_a^bu^2dx\\cdot\\int_a^bv^2dx=\\int_a^bf(x)dx\\cdot\\int_a^b\\dfrac{dx}{f(x)}$\n\n取等当且仅当 $u,v$ 成比例 ⇔ $f$ 为常数。\n\n（数值抽检：$[0,1]$，$f=x$：$\\int_0^1xdx\\cdot\\int_0^1\\dfrac{dx}{x}=\\tfrac12\\cdot\\infty\\ge1$ ✓——$f$ 在端点趋 $0$ 时右积分爆炸，不等式\"远离取等\"，方向自洽。）\n\n**方法总结**：==正函数的\"倒数积\"下界：$\\sqrt f$ 与 $\\tfrac1{\\sqrt f}$ 配对==；同款配对见练 5.6-2。"},"5.7":{"id":"5.7","name":"积分估计与存在性综合（放缩与构造组合拳）","part":"应用与证明","book":"一元积分","teachMd":"**核心思想**：当积分\"积不出\"或目标并非精确值时，转而问三件事：**它多大？**（估计）、**极限去哪？**（含参收敛）、**有没有特殊点？**（存在性）。工具箱：\n\n1. **点态夹逼 + 积分**：$g\\le f\\le h$ ⇒ $\\int g\\le\\int f\\le\\int h$（严格性看等号条件）；\n2. **Taylor 截断**：$e^{x^2}\\ge1+x^2$ 等基本放缩（幂级数截尾保号）；\n3. **含参积分极限**：$n\\to\\infty$ 时 $\\int_0^1x^nf\\to0$（例 5.5-1 的孪生结论）；\n4. **存在性构造**：零点定理 + 变限积分（把 5.5 与 5.6 的武器混合编队）。\n\n**适用信号**：问\"估计/比较/极限/证明存在 $\\xi$\"；被积函数积不出但单调、凸性、符号信息丰富。\n\n**易错警示**：\n\n| 错误 | 纠正 |\n| --- | --- |\n| 放缩方向随手写反 | 放完立刻代一个内点数值抽查方向 |\n| \"存在性\"证明只给必要性叙述 | 必须落到定理：零点/介值/罗尔/费马，并核验全部条件 |\n| 含参极限直接\"极限穿过积分号\" | 非一致收敛不可穿；先分段估计再收网（例 5.7-2 的范式） |","examplesMd":"**【例 5.7-1】（★★，经典）** 证明：$\\dfrac{4}{3}<\\displaystyle\\int_0^{1}e^{x^{2}}\\,dx<e$。\n\n**思路分析**：$e^{x^2}$ 积不出（2.1 清单）——用截断放缩：上界 $e^{x^2}\\le e$；下界用 $e^{u}\\ge1+u$（$u=x^2$，严格当 $u>0$）。\n\n**详细解答**：在 $(0,1)$ 内：$e^{x^2}\\ge1+x^2$（严格，因 $x^2>0$）且 $e^{x^2}<e$（因 $x^2<1$）。积分保序且严格不等保严格：\n\n$\\int_0^1e^{x^2}dx>\\int_0^1\\left(1+x^2\\right)dx=\\dfrac43,\\qquad \\int_0^1e^{x^2}dx<\\int_0^1e\\,dx=e$\n\n（数值检验：$\\int_0^1e^{x^2}\\approx1.4627$，确有 $1.333<1.463<2.718$ ✓。）\n\n**方法总结**：==$e^u\\ge1+u$ 是积分下界的第一板砖==；上界常用\"区间端点包住\"。\n\n**【例 5.7-2】（★★，经典）** 设 $f$ 在 $[0,1]$ 上连续，证明 $\\lim_{n\\to\\infty}\\displaystyle\\int_0^{1}x^{n}f(x)\\,dx=0$。\n\n**思路分析**：与例 5.5-1 同款\"凝聚权\"，但此处无因子 $n$，结论是零——分段收网：远离 $1$ 的段被 $x^n$ 指数级压死；贴近 $1$ 的段长度 $\\delta$ 任意小。\n\n**详细解答**：设 $\\lvert f\\rvert\\le M$。任给 $\\varepsilon>0$，取 $\\delta=\\dfrac{\\varepsilon}{2M}$（不妨 $M>0$）：\n\n$\\left|\\int_0^1x^nf\\,dx\\right|\\le\\int_0^{1-\\delta}x^n\\lvert f\\rvert dx+\\int_{1-\\delta}^{1}x^n\\lvert f\\rvert dx\\le M(1-\\delta)^{n+1}+M\\delta$\n\n令 $n\\to\\infty$：$\\limsup\\left\\lvert\\int_0^1x^nf\\right\\rvert\\le M\\delta=\\dfrac\\varepsilon2<\\varepsilon$。由 $\\varepsilon$ 任意，极限为 $0$。\n\n（对照记忆：乘上 $n$ 后极限变为 $f(1)$（例 5.5-1）——\"权重总量 $\\tfrac{1}{n+1}\\to0$ 但质心贴 $1$\"，两道题合看即得全景。）\n\n**方法总结**：==指数压远段、$\\delta$ 收近段==，两段夹逼是含参积分极限的标准范式。"}}},"多元微分":{"key":"多元微分","title":"多元微分学习题集（极限连续·偏导可微·求导法则·几何·极值）— CMC 全国大学生数学竞赛备战笔记（聚焦版）","introMd":"> **适用对象**：CMC 非数学类（A 类）考生；考研数学一/二想冲高分者同样适用。\n> **覆盖范围**：重极限计算与路径法证不存在、累次与重极限、定义法求偏导与分段点、可微性两步判定、概念关系反例矩阵、混合偏导（Clairaut）、链式法则与抽象复合（一阶/二阶）、隐函数（组）与 Jacobi、全微分与一阶形式不变性（求原函数）、方向导数与梯度、变量替换化简偏微分方程、切线切平面、无条件/条件/闭区域/隐函数极值与多元不等式压轴。\n> **组织方式**：按**方法技巧思想**分类，共 5 部分 19 类；**聚焦 CMC 高频考点与难点**——近届每卷稳定考\"隐函数+抽象复合、方向导数/梯度、极值\"三大块与概念关系题，故求导法则与极值部分写满；课内已熟练的基础套路（偏导四则运算、几何公式套用等）只作起步动作一带而过，冷门考点（多元泰勒、多元中值定理等）以「冷门速览」几行带过；每类结构：思想方法讲解 → 例题精讲 → 练习题 → 拔高题 → 小节末统一详解。\n> **配套资料**：建议与《多元微分学专题_CMC备战笔记》配合使用——笔记看\"懂\"，习题集练\"熟\"；姊妹篇《一元微分学习题集_CMC备战笔记》《一元积分学习题集_CMC备战笔记》《微分方程习题集_CMC备战笔记》提供求导、积分两项基本功。","freqMd":"### 出题频率速览（CMC 非数学类初赛）与本书取舍\n\n| 考点 | 频率 | 本书处理 |\n| --- | --- | --- |\n| 抽象复合＋隐函数求偏导（填空） | ⭐⭐⭐⭐⭐ | 主攻：$f_1',f_2'$ 记号规范 + 先代点（3.1、3.3） |\n| 连续 / 可偏导 / 可微关系（概念题） | ⭐⭐⭐⭐⭐ | 主攻：两步法 + 反例矩阵 E1–E5（2.2、2.3） |\n| 抽象复合二阶偏导 | ⭐⭐⭐⭐⭐ | 主攻：括号意识，头号失分点（3.2） |\n| 极值 / 条件极值 / 闭区域最值（大题） | ⭐⭐⭐⭐ | 主攻：三件套完整流程含存在性论证（5.1–5.3） |\n| 隐函数极值（大题） | ⭐⭐⭐⭐ | 主攻：驻点方程 + 二阶速判 + 配方秒杀（5.4） |\n| 重极限计算与存在性判断 | ⭐⭐⭐⭐ | 主攻：计算三招 + 选路三板斧（1.1、1.2） |\n| 方向导数与梯度 | ⭐⭐⭐ | 主攻：归一化 + 最速方向与\"最大\"筛选（3.5） |\n| 全微分 / 形式不变性（求原函数） | ⭐⭐⭐ | 主攻：微分法一次到位 + 凑微分（3.4） |\n| 变量替换化简偏微分方程 | ⭐⭐ | 主攻：经典两代换（3.6，决赛向） |\n| 几何应用（切线 / 切平面 / 法平面） | ⭐⭐ | 速过：一张全表 + 交线叉积（4.1） |\n| 累次极限、混合偏导反例 | ⭐⭐ | 精选：反例与定理成对记忆（1.3、2.4） |\n| 多元泰勒公式、多元中值定理 | ⭐ | **冷门速览**：几行带过（决赛偶见） |","openTree":{"raw":"看到多元函数题\n├── 问极限\n│    ├── 计算重极限 → 看结构三选一：整体换元化一元 / 极坐标 / 放缩夹逼（1.1）\n│    │     └── 幂指型（0⁰、1^∞）→ 取对数，幂压倒对数（1.1）\n│    ├── 证明极限不存在 → 选路三板斧：直线 y=kx → 幂路径 y=kxᵅ（比阶配次）→ 贴分母零线（1.2）\n│    └── 累次极限
