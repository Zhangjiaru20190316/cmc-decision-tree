<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题型方法决策树 · CMC 备战交互总图</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#24292f; --sub:#57606a; --line:#e4e7ee;
  --brand:#3b5bdb; --brand-ink:#fff; --chip-t:#1c7ed6; --chip-m:#2f9e44; --chip-k:#e8590c;
  --mark:#fff3bf; --code:#f1f3f5; --shadow:0 1px 3px rgba(16,24,40,.08);
  --a:#1c7ed6;
}
html.dark{
  --bg:#16181d; --card:#1e2128; --ink:#e6e8ec; --sub:#9aa3af; --line:#2c313a;
  --brand:#5c7cfa; --chip-t:#4dabf7; --chip-m:#51cf66; --chip-k:#ff922b;
  --mark:#665f1e; --code:#262a32; --shadow:0 1px 3px rgba(0,0,0,.4);
  --a:#4dabf7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.75 "Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif}
a{color:var(--a);text-decoration:none} a:hover{text-decoration:underline}
mark{background:var(--mark);padding:0 3px;border-radius:3px;color:inherit}
button{font:inherit;cursor:pointer}

/* ---- 顶栏 ---- */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
#topbar .brand{font-weight:700;font-size:16px;color:var(--brand);white-space:nowrap}
#searchbox{position:relative;flex:1;min-width:180px;max-width:460px}
#q{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);outline:none}
#q:focus{border-color:var(--brand)}
#qresults{position:absolute;top:110%;left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:60vh;overflow:auto;display:none;z-index:60}
#qresults .qr-group{padding:6px 12px 2px;font-size:12px;color:var(--sub);border-top:1px dashed var(--line)}
#qresults .qr-group:first-child{border-top:none}
#qresults .qr-item{display:block;padding:6px 12px;border-radius:6px;color:var(--ink)}
#qresults .qr-item:hover{background:var(--bg);text-decoration:none}
#qresults .qr-item b{color:var(--brand)}
#qresults .qr-item .qr-sub{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.topnav a{padding:5px 10px;border-radius:8px;color:var(--sub);font-size:13.5px}
.topnav a:hover{background:var(--bg);color:var(--ink);text-decoration:none}
#themebtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--sub)}

/* ---- 面包屑 ---- */
#crumbs{display:flex;gap:4px;align-items:center;padding:8px 18px 0;font-size:13px;color:var(--sub);flex-wrap:wrap}
#crumbs a{color:var(--sub)} #crumbs a:hover{color:var(--brand)}
#crumbs .sep{opacity:.5}

/* ---- 布局 ---- */
#app{max-width:1060px;margin:0 auto;padding:10px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin:14px 0}
.hero{background:linear-gradient(135deg,var(--brand) 0%,#7048e8 100%);color:#fff;border:none}
.hero h1{margin:0 0 6px;font-size:22px}
.hero .hero-sub{opacity:.92;font-size:13.5px}
.hero mark{background:rgba(255,255,255,.22);color:#fff}
h2.sec{font-size:17px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:18px;background:var(--brand);border-radius:2px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g3,.g4,.g2{grid-template-columns:1fr}}

/* ---- 卡片式入口 ---- */
.entry{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  box-shadow:var(--shadow);transition:transform .12s, border-color .12s;position:relative;color:var(--ink)}
.entry:hover{transform:translateY(-2px);text-decoration:none;border-color:var(--brand)}
.entry .e-tag{font-size:12px;color:var(--sub)}
.entry .e-title{font-size:16px;font-weight:700;margin:2px 0}
.entry .e-sub{font-size:12.5px;color:var(--sub);line-height:1.6}
.entry.branch .e-title{font-size:18px}
.blkdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}

/* ---- 章节内容排版 ---- */
.md h4{margin:14px 0 6px;font-size:15px} .md h5{margin:10px 0 4px;font-size:14px;color:var(--sub)}
.md p{margin:8px 0} .md ul,.md ol{margin:6px 0;padding-left:1.6em}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--brand);background:var(--bg);border-radius:0 8px 8px 0;color:var(--sub)}
.md blockquote p{margin:2px 0}
.md pre.ascii,pre.ascii{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;
  font:12.5px/1.5 "Cascadia Mono",Consolas,"Courier New",monospace;white-space:pre}
.md table,.tbl{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td,.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th,.tbl th{background:var(--bg);white-space:nowrap}
.md hr{border:none;border-top:1px dashed var(--line);margin:14px 0}
.md code,code{background:var(--code);border-radius:4px;padding:1px 5px;font-size:.92em}
.callout{border:1px solid var(--line);border-left:4px solid var(--chip-m);background:var(--card);
  border-radius:0 10px 10px 0;padding:12px 16px;margin:10px 0}
.callout.warn{border-left-color:var(--chip-k)}
.callout.info{border-left-color:var(--chip-t)}
.katex{font-size:1.02em}
.katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}

/* ---- 引用小徽章 ---- */
.chip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;border:1px solid;margin:1px 2px;white-space:nowrap;cursor:pointer;line-height:1.7}
.chip:hover{text-decoration:none;filter:brightness(.95)}
.chip.t{color:var(--chip-t);border-color:var(--chip-t);background:transparent}
.chip.m{color:var(--chip-m);border-color:var(--chip-m)}
.chip.k{color:var(--chip-k);border-color:var(--chip-k)}
.chip.ghost{color:var(--sub);border-color:var(--line);cursor:default}
.ext{color:var(--sub);border-bottom:1px dotted var(--sub);cursor:help}

/* ---- 交互决策树 ---- */
.treebox .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.treebox .toolbar .tbtn{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-size:12.5px;color:var(--sub)}
.treebox .toolbar .tbtn:hover{color:var(--brand);border-color:var(--brand)}
.treebox .toolbar .tbtn.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.itree{border:1px solid var(--line);border-radius:10px;padding:10px 6px;background:var(--card)}
.itree .trroot{font-weight:600;padding:4px 10px;background:var(--bg);border-radius:8px;margin-bottom:4px;display:inline-block}
.tnode{position:relative}
.trow{display:flex;align-items:flex-start;gap:6px;padding:3px 6px;border-radius:7px;cursor:default}
.trow.clickable{cursor:pointer}
.trow.clickable:hover{background:var(--bg)}
.trow .tw{flex:none;width:16px;text-align:center;color:var(--sub);font-size:12px;line-height:1.9;user-select:none}
.trow .tt{flex:1;min-width:0}
.trow .tline{line-height:1.7}
.trow .tline .cont{color:var(--sub)}
.tkids{margin-left:18px;padding-left:12px;border-left:1.5px solid var(--line);display:none}
.tnode.open > .tkids{display:block}
.tnode.open > .trow > .tw{transform:rotate(90deg)}
.trow .tw{transition:transform .12s}
.leafdot{width:6px;height:6px;border-radius:50%;background:var(--sub);display:inline-block;margin:9px 5px 0 3px}

/* ---- 题型/方法页头 ---- */
.pagehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.pagehead .pid{font-size:13px;color:#fff;background:var(--brand);border-radius:8px;padding:2px 10px;font-weight:600}
.pagehead h1{margin:0;font-size:21px}
.pagemeta{color:var(--sub);font-size:13px;margin:2px 0 8px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:14px 0 0}
.navrow a{font-size:13.5px}
footer{color:var(--sub);font-size:12.5px;text-align:center;padding:18px;border-top:1px dashed var(--line);margin-top:30px}
details.fold{border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:10px 0;background:var(--card)}
details.fold summary{cursor:pointer;font-weight:600;color:var(--brand)}
details.fold[open]{padding-bottom:12px}
.stars{color:#f59f00;letter-spacing:1px}
</style>
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/home">📐 题型方法决策树</a>
  <div id="searchbox">
    <input id="q" type="text" placeholder="搜索题型 / 方法 / 技巧 / 口诀 / 信号…" autocomplete="off">
    <div id="qresults"></div>
  </div>
  <nav class="topnav">
    <a href="#/quick">速查总表</a>
    <a href="#/strategy">考场策略</a>
    <a href="#/tricks">技巧层</a>
    <a href="#/about">使用说明</a>
    <button id="themebtn" title="切换深浅色">🌙</button>
  </nav>
</header>
<nav id="crumbs"></nav>
<main id="app"></main>
<footer id="foot"></footer>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="window.__tryMath&&window.__tryMath()"></script>
<script>
const DATA = {"meta":{"builtAt":"2026-10-21","counts":{"blocks":8,"types":40,"methods":134,"tricks":20}},"main":{"title":"题型方法决策树（全题型判型→选法总图）— CMC 全国大学生数学竞赛备战笔记","introMd":"> **适用对象**：CMC 非数学类（A 类 / B 类）考生；考研数学一/二冲高分者同样适用。\n> **覆盖范围**：非数学类初赛全部常见题型（高等数学：极限与定阶、一元/多元微积分、微分方程、无穷级数、压轴综合），共 8 大题块 40 个题型。每个题型给出\"判型信号 → 决策树 → 方法优先级 → 口诀 → 真题对拍 → 判型示范题 → 关联出处\"七要素。\n> **组织方式**：按\"考场上看到题面第一眼\"组织——先判题型（本册），再选方法（各习题集开篇决策树），卡壳时找技巧（《解题技巧总汇》）。本册是体系的**题型层总图**：专题笔记教\"懂\"、习题集练\"熟\"、技巧总汇串\"通\"、本册负责\"一眼判型、三秒定向\"。\n> **配套资料**：《一元微分_习题集》《一元积分_习题集》《多元微分_习题集》《多元积分_习题集》《微分方程_习题集》《无穷级数_习题集》（均在 `02_习题集/`，共 134 个带编号方法、268 道例题）、《解题技巧总汇》（20 类跨章技巧，同目录）、`01_专题笔记/` 各专题，以及 `04_真题库/`（第 11–17 届初赛卷，本册\"真题对拍\"逐条核对自这些卷子，核对不到的不标）。","guideMd":"### 1. 三层决策体系：本册在哪一层\n\n```\n考场上拿到一道题\n      │\n      ▼\n【第 1 层 · 题型层 —— 本册】 题型 1.1~8.3\n      这是什么题型？有哪些信号？走哪条分支？\n      │  （每题 5~10 秒）\n      ▼\n【第 2 层 · 方法层 —— 六本习题集开篇决策树】 方法 X.Y\n      这道题用哪个具体方法？关键动作是什么？陷阱在哪？\n      │  （每题 1~3 分钟读完题后）\n      ▼\n【第 3 层 · 技巧层 —— 《解题技巧总汇》】 技巧 1~20\n      常规方法卡壳/压轴题：分段估计、二进分割、构造、\n      区间再现、Stirling 定阶……这些\"暗器\"什么时候出手？\n```\n\n三层各管一段：**题型层管\"认得出\"，方法层管\"算得对\"，技巧层管\"打得穿\"**。本册的每个题型条目里，\"关联\"一栏把三层编号挂在一起，方便复盘时一层层下钻。\n\n### 2. 怎么用本册（三条动线）\n\n1. **备考期（按题块刷）**：先过本册某题块的决策树 → 打开对应习题集刷该题块的方法 → 回来做题块末尾的判型示范题自测\"能不能 5 秒判型\"。\n2. **模考后（按题复盘）**：错题先归入本册某题型（写在错题本第一列）→ 再记方法编号 → 再记是否需要技巧层\"暗器\"。一个季度后统计各题型错误率，决定刷哪本习题集。\n3. **考前一周（只看两样）**：本册每题块的决策树 + 收尾的全题型速查总表。\n\n### 3. 编号与格式约定\n\n- 题型编号 `题型 X.Y`：X = 题块号（一~八），Y = 题块内序号；全书 40 个题型连续编号不跳号。\n- 方法引用 `（分册 方法 X.Y）`：指六本习题集里的方法编号，如（一元积分 方法 2.3）；技巧引用 `（技巧 N）` 指《解题技巧总汇》。\n- 真题对拍格式 `第 N 届初赛·题号`：均逐条核对自 `真题下载/` 的本地真题卷（含参考答案）；**届别题号写法与原卷一致**，未经核对的一律不写。\n- 难度：★ 基础（概念与基本功）／★★ 竞赛常规（初赛主力）／★★★ 拔高（压轴、决赛风格）。\n\n### 4. 跳转链接怎么用\n\n本册每个题型下的\"经典例题跳转表\"把 **134 个分册方法与 20 类技巧**各链到一道最经典本质的例题：点\"方法\"列跳到《xx_习题集》对应方法节（例题与详解就在该节内），\"经典例\"列给出册内例题编号与标签，\"一句话用法精髓\"列是不跳转也能用的速记。\n\n- **Typora / VS Code / Obsidian / GitHub**：直接点击即可跳到目标文件的对应方法标题（锚点按 GitHub 规则生成）。\n- **思源笔记**：把本册（以及各习题集）插入思源后，链接以超链接形式保留；若目标文档同在思源中通常可跳转，跳转粒度以思源的实际转换为准。\n- **兜底**：即使链接在你的环境不可点，行内文字自带\"册名＋方法 X.Y＋例 X.Y-k\"，在目标文件内搜索编号一步到位。\n\n***","rootTree":{"raw":"拿到题目，第一问：要的是\"值\"、是\"证\"、还是\"判\"？\n│\n├─ A.【算出值 / 求出表达式】\n│   ├─ 题面有 lim，自变量连续（x→x₀, x→∞）────────→ 题型 1.1 函数极限\n│   ├─ 题面有 lim，自变量是 n\n│   │   ├─ 递推式 x_{n+1}=f(x_n) / 隐式给出────────→ 题型 1.6 递推数列\n│   │   ├─ n 项求和 Σ 或 n 项乘积 Π ────────────────→ 题型 1.3 n 项和与积\n│   │   └─ 其余（含 n!、nⁿ、取整、混合结构）────────→ 题型 1.2 数列极限\n│   ├─ lim 里藏着 ∫（变限积分）────────────────────→ 题型 1.4 含变限积分的极限\n│   ├─ \"确定常数/参数，使…为…的同阶无穷小\"──────────→ 题型 1.5 无穷小定阶\n│   ├─ 求 f'、f⁽ⁿ⁾、dy/dx、切线法线 ───────────────→ 题型 2.1 求导计算\n│   ├─ 求极值 / 最值 / 渐近线 / 凹凸区间 ────────────→ 题型 2.4 极值最值与性态\n│   ├─ 题面是 ∫（一重）────────────────────────────→ 题型 3.1~3.4（选哪类看 3.x 决策树）\n│   ├─ 求面积 / 体积 / 弧长 / 弧长 / 物理量 ──────────→ 题型 3.5 几何物理应用\n│   ├─ 求偏导 z_x、z_xy、隐函数偏导、化简 PDE ───────→ 题型 4.3 偏导计算\n│   ├─ 求多元极值 / 条件极值 / 闭域最值 ─────────────→ 题型 4.5 多元极值最值\n│   ├─ 二重/三重积分 ∬∭ ───────────────────────────→ 题型 5.1 重积分决策\n│   ├─ 曲线积分 ∮/∫_L（对弧长 d s 或对坐标 dx,dy）──→ 题型 5.2 / 5.3\n│   ├─ 曲面积分 ∬_Σ（对面积 dS 或对坐标 dydz,…）────→ 题型 5.2 / 5.4\n│   ├─ 梯度 / 散度 / 旋度 / 通量 / 环流量 ───────────→ 题型 5.5 场论\n│   ├─ 求微分方程的解 / 特解 / 初值问题 ─────────────→ 题型 6.1 / 6.2\n│   ├─ 已知解反求方程 / 由结构定理定系数 ────────────→ 题型 6.3 解的结构\n│   ├─ 求级数的和 / 和函数 / 收敛域 ─────────────────→ 题型 7.2 / 7.4\n│   └─ 把函数展开为幂级数 / 傅里叶级数 ──────────────→ 题型 7.3 / 7.5\n│\n├─ B.【证明结论】\n│   ├─ 证存在 ξ、η（结论带 f'(ξ)、f''(ξ)、多中值）─→ 题型 2.5 中值证明\n│   ├─ 证方程根/零点的个数或存在性 ─────────────────→ 题型 2.3 方程根与零点\n│   ├─ 证函数不等式（单边、双边）──────────────────→ 题型 2.6 函数不等式\n│   ├─ 证积分等式（两边相等 / 与参数无关）──────────→ 题型 3.6 积分等式\n│   ├─ 证积分不等式 / 积分的上界与估计 ─────────────→ 题型 3.6 + 题块八\n│   ├─ 证数列收敛 / 极限存在 ───────────────────────→ 题型 1.6 + 技巧 14\n│   ├─ 证级数收敛/发散 / 绝对条件 / 和的范围 ────────→ 题型 7.1 + 题块八\n│   ├─ 证\"解有界 / 解趋于…\"(微分方程定性)──────────→ 题型 6.2（渐近行为）\n│   └─ 证\"存在满足…的对象\"（构造级数/函数/点列）────→ 题型 8.2 构造与存在\n│\n└─ C.【判断对错 / 求间断点 / 判概念】\n    ├─ 一元：连续？可导？间断点分类？反例？────────→ 题型 2.2 概念判断\n    ├─ 多元：连续？偏导存在？可微？─────────────────→ 题型 4.2 可微性判断\n    ├─ 级数：判敛（正项/交错/任意项）───────────────→ ⭐⭐⭐⭐ 大题常客 | 解答第二大题常客 |\n| 一般数列极限 | ⭐⭐ 偶考（多与上面合并出题） | 填空 |","types":["1.1","1.2","1.3","1.4","1.5","1.6"]},{"num":"二","title":"一元微分学","count":6,"introMd":"> 本题块承担初赛的两大任务：**填空里的\"算\"**（高阶导数、隐函数、切线是常客）与**大题里的\"证\"**（中值证明与不等式是解答题第二大题的高频主角）。判型时先分清是\"要值\"还是\"要证\"——这决定走 2.1/2.4 还是 2.3/2.5/2.6。\n\n| 考点 | 初赛考频（据已核对真题，见收尾索引） | 常见形式 |\n| --- | --- | --- |\n| 求导计算（含高阶、隐函数） | ⭐⭐⭐⭐⭐ 几乎必考 | 填空：高阶导数 / 切线 |\n| 连续、可导概念判断 | ⭐⭐⭐ 中频 | 填空：间断点 |\n| 方程根与零点个数 | ⭐⭐⭐ 中频（多与大题融合） | 大题第一问 |\n| 极值最值与性态 | ⭐⭐⭐ 中频 | 大题（应用背景） |\n| 中值定理证明 | ⭐⭐⭐⭐⭐ 大题常客 | 解答题主力 |\n| 函数不等式证明 | ⭐⭐⭐⭐ 高频 | 大题 |","types":["2.1","2.2","2.3","2.4","2.5","2.6"]},{"num":"三","title":"一元积分学","count":6,"introMd":"> 本题块是初赛的\"计算主力 + 证明压轴\"双料：填空里定积分的对称性技巧几乎每届出现；而大题压轴的\"积分估计\"（分段估计、放缩收网）是 CMC 区分度最大的题型之一。判型的第一刀：**要值还是要证**；第二刀：**原函数存在吗**（\"积不出\"信号）。\n\n| 考点 | 初赛考频（据已核对真题，见收尾索引） | 常见形式 |\n| --- | --- | --- |\n| 不定积分 | ⭐⭐（少直接考，作工具） | 填空、大题中间步骤 |\n| 定积分计算（对称/再现/点火） | ⭐⭐⭐⭐ 高频 | 填空 |\n| 变限积分 | ⭐⭐⭐⭐⭐ 必考（常与极限/性态结合） | 填空、大题 |\n| 反常积分 | ⭐⭐⭐⭐ 高频（判敛常为压轴） | 填空、压轴大题 |\n| 几何与物理应用 | ⭐⭐⭐ 中频 | 填空、大题 |\n| 积分等式/不等式/估计 | ⭐⭐⭐⭐⭐ 压轴常客 | 大题最后两道之一 |","types":["3.1","3.2","3.3","3.4","3.5","3.6"]},{"num":"四","title":"多元微分学","count":5,"introMd":"> 本题块在初赛的考法很集中：**偏导计算几乎必考一道**（填空或大题第一问，抽象复合与变量替换是主旋律），几何应用（切线/切平面）常客；而重极限与可微性概念题多藏在填空。判型第一刀：**给的函数是显式、隐式还是抽象复合**。\n\n| 考点 | 初赛考频（据已核对真题，见收尾索引） | 常见形式 |\n| --- | --- | --- |\n| 重极限存在性 | ⭐⭐ 偶考 | 填空 |\n| 连续/偏导/可微概念 | ⭐⭐ 偶考（常与重极限合并） | 填空 |\n| 偏导计算（链式·隐函数·变量替换） | ⭐⭐⭐⭐⭐ 必考 | 填空、大题第一问 |\n| 切线与切平面 | ⭐⭐⭐ 中高频 | 填空 |\n| 极值最值（无条件/条件/闭域） | ⭐⭐⭐ 中频（多藏于应用大题） | 大题 |","types":["4.1","4.2","4.3","4.4","4.5"]},{"num":"五","title":"多元积分学","count":5,"introMd":"> 本题块是初赛大题的**第二大产地**（与级数、积分估计轮流坐压轴）：二重积分几乎每届一道（填空或大题），曲线/曲面积分大题至少每两届一道。判型第一刀：**积分对象是什么（区域/曲线/曲面）+ 对什么微分（$dA$、$ds$、$dx\\,dy$、$dydz$）**；第二刀：**对称性能不能先吃掉一半**。\n\n| 考点 | 初赛考频（据已核对真题，见收尾索引） | 常见形式 |\n| --- | --- | --- |\n| 二重/三重积分 | ⭐⭐⭐⭐⭐ 必考 | 填空 + 大题 |\n| 第一类线/面积分 | ⭐⭐⭐⭐ 高频 | 填空、大题 |\n| 第二类曲线积分（格林/路径无关） | ⭐⭐⭐⭐ 高频 | 大题 |\n| 第二类曲面积分（高斯/斯托克斯） | ⭐⭐⭐⭐ 高频 | 大题 |\n| 场论三度与通量环流量 | ⭐⭐⭐ 中频 | 填空、大题一问 |","types":["5.1","5.2","5.3","5.4","5.5"]},{"num":"六","title":"微分方程","count":4,"introMd":"> 本题块在初赛是\"**填空常客 + 大题隐藏大 BOSS**\"：填空直接解方程（一阶判型或二阶常系数），大题则常与变限积分、曲面积分、级数联动（积分方程、几何反求、面积分条件化 ODE）。判型第一刀：**什么阶**；第二刀：**能否归入标准型**；第三刀：**是\"解方程\"还是\"用方程\"**。\n\n| 考点 | 初赛考频（据已核对真题，见收尾索引） | 常见形式 |\n| --- | --- | --- |\n| 一阶方程判型求解 | ⭐⭐⭐⭐ 高频 | 填空 |\n| 高阶与常系数线性 | ⭐⭐⭐⭐ 高频 | 填空、大题 |\n| 解的结构与反求 | ⭐⭐⭐ 中频（藏于大题） | 大题 |\n| 应用建模与积分方程 | ⭐⭐⭐⭐ 高频（联动型大题） | 大题压轴部件 |","types":["6.1","6.2","6.3","6.4"]},{"num":"七","title":"无穷级数","count":5,"introMd":"> 本题块是初赛**压轴大题的第一大产地**：几乎每届的最后两道大题中至少一道是级数（判敛+求和、收敛性证明、与积分/递推联动）。判型第一刀：**正项、交错还是任意项**；第二刀：**要判敛、要求和还是证性质**。\n\n| 考点 | 初赛考频（据已核对真题） | 常见形式 |\n| --- | --- | --- |\n| 数项级数判敛（含证明） | ⭐⭐⭐⭐⭐ 压轴常客 | 大题 |\n| 幂级数收敛域与和函数 | ⭐⭐⭐⭐ 高频 | 填空、大题部件 |\n| 函数展开与泰勒应用 | ⭐⭐⭐ 中频（常作工具） | 大题内部 |\n| 数项级数求和 | ⭐⭐⭐⭐ 高频 | 填空、大题一问 |\n| 傅里叶级数 | ⭐⭐ 偶考（正交性常作暗器） | 填空 |","types":["7.1","7.2","7.3","7.4","7.5"]},{"num":"八","title":"压轴综合","count":3,"introMd":"> 初赛最后两道大题（各 14 分）的专属题库：**估计与渐近、构造与存在、反例与判断**。这些题的特征是\"常规方法都认识，但组合方式没见过\"——解题钥匙在《解题技巧总汇》的 20 类技巧里，本题块负责把\"卡壳信号\"翻译成\"该掏哪件暗器\"。\n\n| 考点 | 初赛考频（据已核对真题） | 常见形式 |\n| --- | --- | --- |\n| 估计与渐近（分段估计·定阶） | ⭐⭐⭐⭐⭐ 压轴第一常客 | 大题末两道 |\n| 构造与存在性 | ⭐⭐⭐⭐ 高频 | 大题压轴 |\n| 概念判断与反例 | ⭐⭐ 中频（多嵌于大题） | 大题一问/填空 |","types":["8.1","8.2","8.3"]}],"types":{"1.1":{"id":"1.1","name":"函数极限计算","block":"一","lead":"","extras":[],"signals":"自变量连续变化（$x \\to x_0$、$x \\to \\infty$、单侧），题面是显式或含抽象函数 $f$ 的 $\\lim$，问\"值是多少\"。填空第一题的脸。","tree":{"raw":"lim，x 连续变化\n├─ 是未定式吗？（0/0、∞/∞、0·∞、∞−∞、1^∞、0⁰、∞⁰）\n│   └─ 否（直接代入/约去零因子即可）→ 直接代入收尾\n├─ 底数与指数都含 x（幂指型）────────────────→ e 化：u^v = e^{v ln u}\n│   （一元微分 方法 1.6）\n├─ 含抽象函数 f（只给 f 在一点的极限/可导性）\n│   ├─ 结构是 [f(x)−f(a)]/(x−a) 的变形 ──────────→ 凑导数定义（方法 1.7）\n│   ├─ f 做分子/分母，另一边是具体无穷小 ─────────→ 等价替换 + 保号性（方法 1.2）\n│   └─ f 与 f'、f'' 混合并给端点值 ──────────────→ 泰勒展开定阶（方法 1.4）\n├─ 具体函数 0/0 或 ∞/∞\n│   ├─ 有明显等价结构（sin、ln(1+)、e^−1、1−cos、(1+x)^α−1）\n│   │   └─ 乘除因子 ───────────────────────────→ 先等价替换再动手（方法 1.2）\n│   ├─ 相减型（根式差、指数差、ln 差）──────────→ 有理化 / 拉格朗日 / 泰勒（方法 rvert\\le M$（$M=\\max\\lvert f\\rvert$），且 $t\\in(0,1]$ 时 $g_n(t)\\to f(1)$ 逐点成立。任取 $\\varepsilon>0$：由 $f$ 在 $1$ 连续取 $\\eta>0$，使 $s\\in(1-\\eta,1]$ 时 $\\lvert f(s)-f(1)\\rvert<\\varepsilon$；再取 $\\delta\\in(0,1)$，注意 $t\\in[1-\\delta,1]$ 时 $t^{\\frac1{n+1}}\\ge(1-\\delta)^{\\frac1{n+1}}\\to1$，故 $n$ 充分大后该段 $\\lvert g_n(t)-f(1)\\rvert<\\varepsilon$ 一致成立。于是\n\n$\n\\Big|\\int_0^1 g_n\\,dt-f(1)\\Big|\\le\\int_0^{1-\\delta}\\underbrace{\\lvert g_n-f(1)\\rvert}_{\\le\\,2M}\\,dt+\\int_{1-\\delta}^{1}\\underbrace{\\lvert g_n-f(1)\\rvert}_{<\\,\\varepsilon}\\,dt\\le 2M(1-\\delta)+\\varepsilon ,\n$\n\n先令 $n\\to\\infty$，再令 $\\delta\\to0^{+}$，最后令 $\\varepsilon\\to0^{+}$ 收网。∎\n\n**要点**：换元 $t=x^{n+1}$ 把\"幂权重\"变成\"均匀平均\"，是处理 $\\int x^nf$ 的第一杀招（峰值在 $x=1$ 的\"集中紧\"表亲）；收网顺序**先 $n$ 后 $\\delta$ 再 $\\varepsilon$**，不可颠倒。","ref":"《解题技巧总汇》技巧 1–3、5、19–20（本题型主武器库）；（一元积分 方法 5.7）；（一元微分 方法 2.1 夹逼分段放缩）。\n\n***"},"8.2":{"id":"8.2","name":"构造与存在性综合","block":"八","lead":"","extras":[],"signals":"\"证明存在（满足某种性质的）级数/函数/点列\"；给定递推或迭代过程证收敛/发散；由抽象条件（积分恒为零、闭曲面积分为零等）反推函数。","tree":{"raw":"构造 / 存在\n├─ 要构造\"收敛更慢/更快\"的级数（比较级数）→ 尾段控制构造：按余项大小分段\n│                                              取 b_n = a_n/2^k（14届六 套路，技巧 5 同族）\n├─ 迭代/缩放网（3^k、2^k 网格求和收网）──→ 网格求和 + 几何级数控制（14届二补·三 套路）\n├─ 递推压缩 → 收敛 / 收敛速度 ─────────────→ 压缩映射 + 几何误差（技巧 14）\n├─ 由\"恒为零\"条件反推函数 ─────────────────→ 取特殊子集（小球面/小区间）+ 极限论证\n│                                              （13届补·四 套路）\n├─ 存在 ξ 使 g(ξ)=h(ξ)（无导数介入）──────→ 连续函数差 F=g−h 的零点定理；\n│   对称结构（f(ξ)=f(ξ+T)）────────────────→ F(0)+F(1−T)=0 型\"配对抵消\"\n├─ 二分/区间套 ───────────────────────────→ 技巧 8（存在性的深层工具）\n└─ 反证法（假设不存在 ⇒ 矛盾）───────────────→ 常与介值/单调组合","roots":[{"t":"构造 / 存在","k":[{"t":"要构造\"收敛更慢/更快\"的级数（比较级数）→ 尾段控制构造：按余项大小分段\n取 b_n = a_n/2^k（14届六 套路，技巧 5 同族）","k":[],"r":[{"k":"trick","id":"5"}]},{"t":"迭代/缩放网（3^k、2^k 网格求和收网）──→ 网格求和 + 几何级数控制（14届二补·三 套路）","k":[],"r":[]},{"t":"递推压缩 → 收敛 / 收敛速度 ─────────────→ 压缩映射 + 几何误差（技巧 14）","k":[],"r":[{"k":"trick","id":"14"}]},{"t":"由\"恒为零\"条件反推函数 ─────────────────→ 取特殊 送分小题（如敛散判断的必要条件、单调性验证），先拿下再谈第二问。\n\n**考频落点**（据已核对真题）：填空的稳定供给源——函数极限（1.1）、高阶导/隐函数求导（2.1/4.3）、变限积分（1.4/3.3）、反常积分（3.4）、空间解析几何（3.5）、重积分（5.1）；大题的稳定供给源——中值证明（2.5）、积分估计压轴（3.6/8.1）、级数压轴（7.1/7.4/8.1）、曲线曲面积分大题（5.2–5.4）、微分方程联动（6.4）。\n","sourceIdxMd":"## 真题出处核对索引\n\n**本册全部\"真题对拍\"条目核对自以下本地卷面**（`真题下载/`，含参考答案；届别题号与原卷一致）：\n\n| 卷面 | 结构 | 已被引用的题号 |\n| --- | --- | --- |\n| 第十二届初赛（非数学类，2020.11） | 填空 5×6' + 解答 6 道 | 一·1/2/3/4/5；二~七全部 |\n| 第十三届初赛（非数学类，2021） | 填空 5×6' + 解答 5 道 14' | 一·1/2/3/4/5；二~六全部 |\n| 第十三届初赛补赛（非数学类，2021） | 同上 | 一·1~5；二~六全部 |\n| 第十四届初赛（非数学类，2022.11） | 同上 | 一·1~5；二~六全部 |\n| 第十四届初赛第二次补赛（非数学类，2023.3） | 同上 | 一·1~5；二~六全部 |\n| 第十七届初赛 非数学A类（2025） | 同上 | 一·1~5；二~六全部 |\n| 第十七届初赛 非数学B类（2025） | 同上 | 一·1~5；二~六全部 |\n\n**未引用卷面与原因**（诚实声明）：第十一届、第十五届 A/B 的 PDF 文本层为乱码编码、视觉核对未完成，第十六届及更早本地无卷——按\"未经核对不引用\"的规则，本册一律未引这几届；待后续补核后可在各题型\"真题对拍\"下增补。各题型的\"方法关键词\"转写自官方参考答案的解题步骤，个别题面细节以原卷为准。\n\n***\n\n*全书统计：8 大题块、40 个题型，每个题型含判型信号、决策树、方法优先级表、口诀、真题对拍、判型示范题（共 40 道，附思路骨架）与关联出处七要素；示范题数值结果已用 SymPy 逐题自验。使用建议：先背总决策树与各题块决策树，再以真题卷（`真题下载/`）做全卷模考，错题按题型编号归档，回对应习题集深挖。*\n\n"},"books":{"一元微分":{"key":"一元微分","title":"一元微分学习题集（极限·连续·可导·中值定理）— CMC 全国大学生数学竞赛备战笔记","introMd":"> **适用对象**：CMC 非数学类（A 类）考生；考研数学一/二想冲高分者同样适用。\n> **覆盖范围**：一元函数极限（函数极限 + 数列极限）、连续（含一致连续）、可导与微分、微分中值定理与导数应用。\n> **组织方式**：按**方法技巧思想**分类，共 5 部分 32 类；每类结构：思想方法讲解 → 例题精讲 → 练习题 → 拔高题 → 小节末统一详解（练习与拔高**先做题，再到小节末对照详解**）。\n> **配套资料**：建议与《第一章\\_极限专题\\_CMC备战笔记》《微分学专题\\_CMC备战笔记》配合使用——笔记看\"懂\"，习题集练\"熟\"。","freqMd":"### 出题频率速览（CMC 非数学类初赛）\n\n| 考点                    | 频率    | 常见形式                   |\n| --------------------- | ----- | ---------------------- |\n| 函数极限计算                | ⭐⭐⭐⭐⭐ | 填空第 1 题几乎必考            |\n| 数列极限（含递推、Stolz、定积分定义） | ⭐⭐⭐⭐  | 填空 + 解答                |\n| 无穷小阶、定参数              | ⭐⭐⭐⭐  | 填空高频                   |\n| 中值定理证明题               | ⭐⭐⭐⭐⭐ | 解答大题主战场（罗尔构造、双中值、泰勒估计） |\n| 不等式证明                 | ⭐⭐⭐⭐  | 单调性构造 + 泰勒             |\n| 连续与间断点                | ⭐⭐⭐   | 填空为主，一致连续偶考解答          |\n| 可导性讨论、导数定义            | ⭐⭐⭐⭐  | 填空 + 选择概念题             |\n| 方程根个数                 | ⭐⭐⭐   | 参数讨论型解答题               |","openTree":{"raw":"看到极限题\n├── 未定式？→ 判类型\n│    ├── 0/0、∞/∞ → 等价替换化简 → 仍困难？\n│    │        ├── 分母幂次高/差式相消 → 泰勒展开（1.4）\n│    │        └── 简单 → 洛必达（1.3，注意条件）\n│    ├── 1^∞、0^0、∞^0 → e 化：u^v = e^{v ln u}（1.6）\n│    └── ∞−∞ → 通分 / 有理化 / 换元化归\n├── 含抽象函数 f（只知可导）→ 凑导数定义（1.7），禁用洛必达\n├── 含 sin(1/x)、[x]、振荡因子 → 夹逼 / 有界×无穷小（1.5）\n└── 数列\n     ├── n 项和 → 夹逼（2.1）/ 定积分定义（2.5）/ Stolz（2.4）三选一\n     ├── n 项积 → 取对数化积为和\n     ├── 递推式 x_{n+1}=φ(x_n) → 单调有界（2.2）/ 压缩映射（2.6）\n     ├── 差分型（含 a_{n+1}−a_n）→ Stolz（2.4）\n     └── 含 (-1)^n、sin(n) 振荡 → 海涅归结 / 子列法（2.3、2.7）","roots":[{"t":"看到极限题","k":[{"t":"未定式？→ 判类型","k":[{"t":"0/0、∞/∞ → 等价替换化简 → 仍困难？","k":[{"t":"分母幂次高/差式相消 → 泰勒展开（1.4）","k":[],"r":[]},{"t":"简单 → 洛必达（1.3，注意条件）","k":[],"r":[]}],"r":[]},{"t":"1^∞、0^0、∞^0 → e 化：u^v = e^{v ln u}（1.6）","k":[],"r":[]},{"t":"∞−∞ → 通分 / 有理化 / 换元化归","k":[],"r":[]}],"r":[]},{"t":"含抽象函数 f（只知可导）→ 凑导数定义（1.7），禁用洛必达","k":[],"r":[]},{"t":"含 sin(1/x)、[x]、振荡因子 → 夹逼 / 有界×无穷小（1.5）","k":[],"r":[]},{"t":"数列","k":[{"t":"n 项和 → 夹逼（2.1）/ 定积分定义（2.5）/ Stolz（2.4）三选一","k":[],"r":[]},{"t":"n 项积 → 取对数化积为和","k":[],"r":[]},{"t":"递推式 x_{n+1}=φ(x_n) → 单调有界（2.2）/ 压缩映射（2.6）","k":[],"r":[]},{"t":"差分型（含 a_{n+1}−a_n）→ Stolz（2.4）","k":[],"r":[]},{"t":"含 (-1)^n、sin(n) 振荡 → 海涅归结 / 子列法（2.3、2.7）","k":[],"r":[]}],"r":[]}],"r":[]}],"stats":{"markers":14,"nodes":15}},"parts":["函数极限：八大方法","数列极限：七大方法","连续与一致连续：四类方法","可导与微分：六类方法","微分中值定理与导数应用：七类方法"],"methods":{"1.1":{"id":"1.1","name":"变量替换与重要极限（化归思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：所有极限最终都化归为两个标准形——\n\n$\\lim_{\\Box \\to 0} \\dfrac{\\sin \\Box}{\\Box} = 1, \\qquad \\lim_{\\Box \\to 0} (1 + \\Box)^{\\frac{1}{\\Box}} = e \\quad (\\Box \\text{ 为同一无穷小整体})$\n\n**技术要点**：\n\n1. 把复杂的\"□\"看成一个整体变量（换元 t \\= □），确认换元后 t → 0；\n2. $1^\\infty$ 型的标准处理：底数写成 $1 + \\alpha(x)$（其中 $\\alpha \\to 0$），则\n   $\\lim (1+\\alpha)^\\beta = e^{\\lim \\alpha\\beta} \\quad (\\beta \\to \\infty)$\n3. 常见\"藏起来的重要极限\"：$\\lim_{x \\to \\infty}\\left(\\dfrac{x+1}{x-1}\\right)^{x}$、$\\lim_{t \\to 0}(\\cos t)^{1/t^2}$ 等。\n\n**适用信号**：出现复合结构 $f(g(x))$ 且 $g(x) \\to 0$；出现 $(1 + \\text{无穷小})^{\\text{无穷大}}$。\n\n**易错警示**：\n\n| 错误                                                                  | 纠正                                                         |\n| ------------------------------------------------------------------- | ---------------------------------------------------------- |\n| $(1+\\Box)^{1/\\Box} \\to e$ 中 $\\Box \\not\\to 0$                        | 必须验证 $\\Box \\to 0$（如 $x \\to \\infty$ 时 $\\Box = 1/x \\to 0$ ✓） |\n| $\\lim (1+\\alpha)^\\beta$ 直接写 $e^{\\lim \\alpha\\beta}$ 不验证 $1^\\infty$ 型 | 若底数不趋于 1，需用一般 e 化 $u^v = e^{v\\ln u}$（见 1.6）                |\n| $x \\to \\infty$ 与 $x \\to 0$ 混淆导致指数符号错                                | 换元后一律回到标准形检查                                               |","examplesMd":"**【例 1.1-1】（★，经典）** 求 $\\lim_{x \\to \\infty} \\left( \\dfrac{x+1}{x-1} \\right)^{x}$。\n\n**思路分析**：底数 $\\to 1$、指数 $\\to \\infty$，是 $1^\\infty$ 型。把底数改写成 $1 + \\alpha$，凑 $\\alpha \\cdot$ 指数。\n\n**详细解答**：\n\n$\\dfrac{x+1}{x-1} = \\dfrac{x-1+2}{x-1} = 1 + \\dfrac{2}{x-1}, \\qquad \\alpha = \\dfrac{2}{x-1} \\to 0$\n\n于是\n\n$\\lim_{x \\to \\infty} \\left(1 + \\dfrac{2}{x-1}\\right)^x = \\exp\\left( \\lim_{x \\to \\infty} \\dfrac{2x}{x-1} \\right) = e^{2}$\n\n**方法总结**：$1^\\infty$ 型三步走——写成 $1+\\alpha$、算 $\\lim \\alpha\\beta$、写 $e$ 的相应次幂。$\\alpha\\beta$ 的极限通常是一个常数。\n\n**【例 1.1-2】（★★，经典）** 求 $\\lim_{x \\to 1} (1 - x)\\tan\\dfrac{\\pi x}{2}$。\n\n**思路分析**：$x \\to 1$ 时 $\\tan\\dfrac{\\pi x}{2} \\to \\infty$，是 $0 \\cdot \\infty$ 型。**换元 $t = 1 - x \\to 0$**，用诱导公式把 $\\tan$ 化为 $\\cot$，再凑标准形。\n\n**详细解答**：令 $t = 1 - x$，则 $x \\to 1 \\Leftrightarrow t \\to 0$，\n\n$\\tan\\dfrac{\\pi x}{2} = \\tan\\left(\\dfrac{\\pi}{2} - \\dfrac{\\pi t}{2}\\right) = \\cot\\dfrac{\\pi t}{2} = \\dfrac{\\cos \\frac{\\pi t}{2}}{\\sin \\frac{\\pi t}{2}}$\n\n于是\n\n$(1-x)\\tan\\dfrac{\\pi x}{2} = t \\cdot \\dfrac{\\cos \\frac{\\pi t}{2}}{\\sin \\frac{\\pi t}{2}} = \\dfrac{\\frac{\\pi t}{2}}{\\sin \\frac{\\pi t}{2}} \\cdot \\cos\\dfrac{\\pi t}{2} \\cdot \\dfrac{2}{\\pi} \\longrightarrow 1 \\cdot 1 \\cdot \\dfrac{2}{\\pi} = \\dfrac{2}{\\pi}$\n\n**方法总结**：极限点不在 $0$ 时，**先换元移到 $0$**；三角函数用诱导公式化为 $\\dfrac{\\sin t}{t}$ 结构。"},"1.2":{"id":"1.2","name":"等价无穷小替换（局部线性化思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：求极限时只关心\"主部\"，把复杂无穷小换成等价的简单无穷小。**乘除因子可放心整体替换；加减时替换会丢掉高阶主部，必须谨慎处理**。\n\n**必背等价表（$x \\to 0$）**：\n\n| 一阶                                                                    | 高阶（差式常用）                                                                |\n| --------------------------------------------------------------------- | ----------------------------------------------------------------------- |\n| $\\sin x \\sim x$，$\\tan x \\sim x$，$\\arcsin x \\sim x$，$\\arctan x \\sim x$ | $x - \\sin x \\sim \\dfrac{x^3}{6}$                                        |\n| $\\ln(1+x) \\sim x$，$e^x - 1 \\sim x$，$a^x - 1 \\sim x\\ln a$              | $\\tan x - x \\sim \\dfrac{x^3}{3}$                                        |\n| $1 - \\cos x \\sim \\dfrac{x^2}{2}$                                      | $\\tan x - \\sin x \\sim \\dfrac{x^3}{2}$                                   |\n| $(1+x)^{\\alpha} - 1 \\sim \\alpha x$                                    | $x - \\ln(1+x) \\sim \\dfrac{x^2}{2}$                                      |\n| $\\sqrt{1+x} - 1 \\sim \\dfrac{x}{2}$，$a^x - 1 \\sim x\\ln a$              | $\\arcsin x - x \\sim \\dfrac{x^3}{6}$，$x - \\arctan x \\sim \\dfrac{x^3}{3}$ |\n\n全部等价式在复合下成立：$\\sin(\\text{无穷小}) \\sim (\\text{该无穷小})$。\n\n**加减时的安全法则**：\n\n1. **提取公因子后替换**：如 $\\tan x - \\sin x = \\sin x\\left(\\dfrac{1}{\\cos x} - 1\\right) = \\sin x \\cdot \\dfrac{\\cos x - 1}{\\cos x} \\sim x \\cdot \\dfrac{-x^2/2}{1} = -\\dfrac{x^3}{2}$（取绝对意义下的主部 $\\dfrac{x^3}{2}$）；\n2. **相减不抵消时可替换**：若分子两项不等价，如 $e^x - 1 - \\sin x$（主部分别为 $x + \\frac{x^2}{2}$ 与 $x$，一阶抵消后二阶保留），此时必须用泰勒（见 1.4）；\n3. 记忆口诀：**\"乘除随便换，加减看抵消；抵消就升阶，泰勒来兜底\"**。\n\n**适用信号**：乘除结构中出现 $\\sin$、$\\ln$、$e$、根式等基本无穷小的复合。","examplesMd":"**【例 1.2-1】（★★，经典陷阱题）** 求 $\\lim_{x \\to 0} \\dfrac{\\tan x - \\sin x}{x^3}$。\n\n**思路分析**：若分子中 $\\tan x \\sim x,\\ \\sin x \\sim x$ 直接相减得 $0$，**错**！一阶主部抵消，必须提取因子升阶。\n\n**详细解答**：\n\n$\\tan x - \\sin x = \\sin x \\cdot \\dfrac{1 - \\cos x}{\\cos x} \\sim x \\cdot \\dfrac{\\frac{x^2}{2}}{1} = \\dfrac{x^3}{2}$\n\n（$\\sin x$ 与 $\\dfrac{1}{\\cos x}$ 作为**乘除因子**分别替换为 $x$ 与 $1$，合法。）故原极限 $= \\dfrac{1}{2}$。\n\n**方法总结**：差式先\"因式分解\"，让无穷小以**乘除因子**身份出现，再替换。\n\n**【例 1.2-2】（★★，经典）** 求 $\\lim_{x \\to 0} \\dfrac{e^x - 1 - \\sin x}{x^2}$。\n\n**思路分析**：分子两项 $e^x - 1$ 与 $\\sin x$ **等价**（都 $\\sim x$），直接替换相减得 $0$ 是错误的。处理：把其中一个整体保留，替换另一个——把 $\\sin x$ 换成 $x$（它以整体减项出现但差 $e^x - 1 - x$ 中 $e^x-1$ 与 $x$ 不再等价抵消）：\n\n**详细解答**：\n\n$e^x - 1 - \\sin x = (e^x - 1) - \\sin x \\sim (e^x - 1) - x \\quad \\text{？}$\n\n上式方向的替换需要理由。稳妥做法是提出公共结构：$e^x - 1 - \\sin x = (e^x - 1 - x) + (x - \\sin x)$。于是\n\n$\\lim_{x \\to 0} \\dfrac{e^x - 1 - \\sin x}{x^2} = \\lim_{x \\to 0} \\dfrac{e^x - 1 - x}{x^2} + \\lim_{x \\to 0} \\dfrac{x - \\sin x}{x^2}$\n\n第二项：$x - \\sin x \\sim \\dfrac{x^3}{6}$，除以 $x^2$ 得极限 $0$。第一项（$0/0$，洛必达一次）：\n\n$\\lim_{x \\to 0} \\dfrac{e^x - 1 - x}{x^2} = \\lim_{x \\to 0} \\dfrac{e^x - 1}{2x} = \\lim_{x \\to 0} \\dfrac{x}{2x} = \\dfrac{1}{2}$\n\n故原极限 $= \\dfrac{1}{2} + 0 = \\dfrac{1}{2}$。\n\n**方法总结**：加减式中若两无穷小等价（一阶抵消），**拆项**：$A - B = (A - \\text{公共主部}) + (\\text{公共主部} - B)$，两段分别处理。更系统的工具是泰勒公式（1.4）。"},"1.3":{"id":"1.3","name":"洛必达法则（降阶求导思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：$0/0$ 或 $\\dfrac{\\ast}{\\infty}$ 型未定式中，分子分母同时求导可降低超越性、暴露主部。**它是\"化简工具\"而非\"万能钥匙\"**。\n\n**法则条件（三条全查）**：\n\n1. 极限过程下分子分母同时趋于 $0$ 或同时趋于 $\\infty$（$\\frac{\\ast}{\\infty}$ 型分母趋于 $\\infty$ 即可，分子不管）；\n2. 求导后的极限存在（或为 $\\infty$）；\n3. **数列极限不能直接用**（离散变量无导数），需先转为函数极限并用海涅归结原理（见 2.3）。\n\n**典型失效与循环**：\n\n| 情形             | 例子                                                                              | 处理           |\n| -------------- | ------------------------------------------------------------------------------- | ------------ |\n| 导数比极限不存在但原极限存在 | $\\lim_{x\\to+\\infty}\\dfrac{x+\\sin x}{x}$（导数比 $\\dfrac{1+\\cos x}{1}$ 无极限，原极限 $=1$） | 提因子、夹逼       |\n| 循环型            | $\\lim_{x\\to+\\infty}\\dfrac{e^x + e^{-x}}{e^x - e^{-x}}$ 越洛越循环                    | 同除 $e^x$ 先化简 |\n| 非未定式硬用         | 任何 $\\lim \\dfrac{f}{g}$ 但 $g \\not\\to 0,\\infty$                                   | 先验证型         |\n\n**经验法则**：**先等价替换/化简，再洛必达；每洛一次都重新检查型**。对 $\\infty - \\infty$ 先通分，$0\\cdot\\infty$ 先挪分母。\n\n**适用信号**：$0/0$ 型且分子分母求导后明显变简单（分母是幂函数、多项式时尤其好用）；变限积分型（见定积分专题）。","examplesMd":"**【例 1.3-1】（★，经典）** 求 $\\lim_{x \\to 0} \\dfrac{x - \\ln(1+x)}{x^2}$。\n\n**思路分析**：$0/0$ 型，分母是幂函数，适合洛必达；注意洛完要重新检查型。\n\n**详细解答**：\n\n$\\lim_{x \\to 0} \\dfrac{x - \\ln(1+x)}{x^2} = \\lim_{x \\to 0} \\dfrac{1 - \\frac{1}{1+x}}{2x} = \\lim_{x \\to 0} \\dfrac{\\frac{x}{1+x}}{2x} = \\lim_{x \\to 0} \\dfrac{1}{2(1+x)} = \\dfrac{1}{2}$\n\n第二步已不是未定式（$\\frac{0}{0}$ 化成了 $\\frac{1}{2(1+x)}$ 的代入），及时收手。\n\n**方法总结**：洛必达之后若能约去 $x$，立刻约去并代入；不要机械地洛到底。\n\n**【例 1.3-2】（★★★，经典）** 求 $\\lim_{x \\to 0} \\left( \\dfrac{1}{x^2} - \\cot^2 x \\right)$。\n\n**思路分析**：\\=\\=$\\infty - \\infty$ 型，先通分\\=\\=；通分后分子分母同阶抵消严重，先做因式分解与等价替换，再洛必达收尾。\n\n**详细解答**：通分：\n\n$\\dfrac{1}{x^2} - \\dfrac{\\cos^2 x}{\\sin^2 x} = \\dfrac{\\sin^2 x - x^2\\cos^2 x}{x^2\\sin^2 x} = \\dfrac{(\\sin x - x\\cos x)(\\sin x + x\\cos x)}{x^2\\sin^2 x}$\n\n分母 $x^2 \\sin^2 x \\sim x^4$；后一因子 $\\sin x + x\\cos x = 2x + o(x) \\sim 2x$（一阶不抵消，可放心替换）。前一因子用洛必达（$0/0$）：\n\n$\\lim_{x \\to 0} \\dfrac{\\sin x - x\\cos x}{x^3} = \\lim_{x \\to 0} \\dfrac{\\cos x - \\cos x + x\\sin x}{3x^2} = \\lim_{x \\to 0} \\dfrac{x\\sin x}{3x^2} = \\dfrac{1}{3}$\n\n即 $\\sin x - x\\cos x \\sim \\dfrac{x^3}{3}$。合并：\n\n$\\text{原极限} = \\lim_{x \\to 0} \\dfrac{\\frac{x^3}{3} \\cdot 2x}{x^4} = \\dfrac{2}{3}$\n\n**方法总结**：\\=\\=$\\infty-\\infty$ → 通分 → 因式分解 + 等价替换降到最简 → 必要时洛必达。\\=\\=盲目对通分结果直接洛两次会陷入繁琐计算。"},"1.4":{"id":"1.4","name":"泰勒公式求极限（有限展开定阶思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：等价无穷小替换只保留一阶主部，遇到**加减抵消**就失效；泰勒公式保留到任意有限阶，是\"定阶问题的最终武器\"。思想是**有限展开**：把每个函数展开到\"刚好不抵消的那一阶\"。\n\n**必背麦克劳林展开（带皮亚诺余项）**：\n\n| 函数               | 展开式（按需截断）                                                                     |\n| ---------------- | ----------------------------------------------------------------------------- |\n| $e^x$            | $1 + x + \\dfrac{x^2}{2} + \\dfrac{x^3}{6} + \\cdots + \\dfrac{x^n}{n!} + o(x^n)$ |\n| $\\sin x$         | $x - \\dfrac{x^3}{6} + \\dfrac{x^5}{120} - \\cdots + o(x^{2n})$                  |\n| $\\cos x$         | $1 - \\dfrac{x^2}{2} + \\dfrac{x^4}{24} - \\cdots + o(x^{2n+1})$                 |\n| $\\ln(1+x)$       | $x - \\dfrac{x^2}{2} + \\dfrac{x^3}{3} - \\cdots + o(x^n)$                       |\n| $(1+x)^{\\alpha}$ | $1 + \\alpha x + \\dfrac{\\alpha(\\alpha-1)}{2}x^2 + \\cdots + o(x^n)$             |\n| $\\tan x$         | $x + \\dfrac{x^3}{3} + \\dfrac{2x^5}{15} + o(x^5)$                              |\n| $\\arcsin x$      | $x + \\dfrac{x^3}{6} + o(x^3)$                                                 |\n| $\\arctan x$      | $x - \\dfrac{x^3}{3} + o(x^3)$                                                 |\n\n**展开阶数原则**：\n\n1. **分母是 $x^k$**：分子各项展开到 $k$ 阶为止（多了浪费，少了出错）；\n2. **分子是两个函数之差**：展开到它们首次不抵消的那一阶；\n3. 展开后每项乘开、合并同次幂，剩下的最低次幂项决定极限。\n\n**适用信号**：等价替换后出现 $0/0$ 约不掉；差式中两函数等价；分母阶数 $\\ge 2$；出现 $e$、$\\ln$、三角混合且相互抵消。\n\n**易错警示**：\n\n| 错误                                        | 纠正                                            |\n| ----------------------------------------- | --------------------------------------------- |\n| 展开阶数不够，低阶抵消后误判极限                          | 先估计分母阶数，统一展开到该阶                               |\n| 复合时忘替换内部：$e^{\\sin x}$ 展开要用 $\\sin x$ 的展开代入 | 逐层代入，乘开合并                                     |\n| 余项 $o(x^n)$ 参与运算时随意丢弃                     | 同阶 $o$ 可合并；$o(x^m) \\cdot O(x^k) = o(x^{m+k})$ |","examplesMd":"**【例 1.4-1】（★★，经典）** 求 $\\lim_{x \\to 0} \\dfrac{\\cos x - e^{-x^2/2}}{x^4}$。\n\n**思路分析**：两函数前两阶完全相同（$1 - \\frac{x^2}{2}$），必须展开到 $x^4$ 才见分晓。\n\n**详细解答**：\n\n$\\cos x = 1 - \\dfrac{x^2}{2} + \\dfrac{x^4}{24} + o(x^4), \\qquad e^{-x^2/2} = 1 + \\left(-\\dfrac{x^2}{2}\\right) + \\dfrac{1}{2}\\left(-\\dfrac{x^2}{2}\\right)^2 + o(x^4) = 1 - \\dfrac{x^2}{2} + \\dfrac{x^4}{8} + o(x^4)$\n\n相减：低阶项 $1$、$-\\frac{x^2}{2}$ 全部抵消，\n\n$\\cos x - e^{-x^2/2} = \\left(\\dfrac{1}{24} - \\dfrac{1}{8}\\right)x^4 + o(x^4) = -\\dfrac{x^4}{12} + o(x^4)$\n\n故极限 $= -\\dfrac{1}{12}$。\n\n**方法总结**：==分子是\"A − B\"且一阶、二阶都抵消时，别慌，逐阶升到不抵消为止==。$\\frac{1}{24} - \\frac{1}{8} = -\\frac{1}{12}$。\n\n**【例 1.4-2】（★★★，经典名题）** 求 $\\lim_{x \\to 0} \\dfrac{(1+x)^{1/x} - e + \\dfrac{e}{2}x}{x^2}$。\n\n**思路分析**：$(1+x)^{1/x} = e^{\\frac{1}{x}\\ln(1+x)}$，先把指数 $\\dfrac{1}{x}\\ln(1+x)$ 展开到 $x^2$，再代回 $e^u$ 展开。这是\"复合展开\"的代表作。\n\n**详细解答**：\n\n$\\dfrac{\\ln(1+x)}{x} = \\dfrac{x - \\frac{x^2}{2} + \\frac{x^3}{3} + o(x^3)}{x} = 1 - \\dfrac{x}{2} + \\dfrac{x^2}{3} + o(x^2)$\n\n记 $u = -\\dfrac{x}{2} + \\dfrac{x^2}{3} + o(x^2)$（$u \\to 0$），则\n\n$e^u = 1 + u + \\dfrac{u^2}{2} + o(u^2) = 1 + \\left(-\\dfrac{x}{2} + \\dfrac{x^2}{3}\\right) + \\dfrac{x^2}{8} + o(x^2) = 1 - \\dfrac{x}{2} + \\dfrac{11x^2}{24} + o(x^2)$\n\n（$u^2 = \\frac{x^2}{4} + o(x^2)$，$o(u^2) = o(x^2)$。）于是\n\n$(1+x)^{1/x} = e\\cdot e^{u} = e - \\dfrac{e}{2}x + \\dfrac{11e}{24}x^2 + o(x^2)$\n\n分子 $(1+x)^{1/x} - e + \\frac{e}{2}x = \\dfrac{11e}{24}x^2 + o(x^2)$，故极限 $= \\dfrac{11e}{24}$。\n\n**方法总结**：幂指型先取对数展开指数，再回代 $e^u = 1 + u + \\frac{u^2}{2} + \\cdots$。$\\frac{1}{3} + \\frac{1}{8} = \\frac{11}{24}$ 是本题的记忆点。"},"1.5":{"id":"1.5","name":"夹逼准则（双边估计思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：当函数含有\\*\\*==无法直接处理的振荡因子==\\*\\*\\=\\=（$\\sin\\frac{1}{x}$、$\\cos x^2$、取整 $[x]$）时，把目标函数\"夹\"在两个容易求极限的函数之间：$g(x) \\le f(x) \\le h(x)$ 且 $g, h$ 极限相等，则 $f$ 极限存在且等于该值。\\=\\=\n\n**技术要点**：\n\n1. **有界 × 无穷小 \\= 无穷小**：$\\lvert u(x)\\rvert \\le M$ 且 $v \\to 0 \\Rightarrow uv \\to 0$（夹逼的推论，最常用）；\n2. 常用放缩：$\\lvert \\sin t \\rvert \\le 1$，$\\lvert \\arctan t\\rvert < \\dfrac{\\pi}{2}$，$x - 1 < [x] \\le x$，$0 \\le 1 - \\cos t \\le 2$；\n3. 证明极限**不存在**的反向工具：找两个趋于极限点的子列，函数值趋于不同数（与海涅归结呼应，见 2.3、2.7）。\n\n**适用信号**：$\\sin\\frac{1}{x}$、$\\cos\\frac1x$、$[x]$、$\\operatorname{sgn}$ 等振荡/跳变因子乘无穷小；绝对值结构。\n\n**易错警示**：\n\n| 错误                                    | 纠正                           |\n| ------------------------------------- | ---------------------------- |\n| 认为 $\\lim_{x\\to 0}\\sin\\frac1x$ \"等于某个数\" | 它不存在，但 $x\\sin\\frac1x \\to 0$  |\n| 夹逼两边不相等就放弃                            | 放缩精度不够，需改进估计（常见于 n 项和，见 2.1） |\n| 忽略单侧性（$x \\to 0^+$ 与 $x \\to 0^-$）      | 含 $\\frac1x$、$\\ln x$ 时先分侧     |","examplesMd":"**【例 1.5-1】（★★，概念经典）** 求 $\\lim_{x \\to 0} x^2\\sin\\dfrac{1}{x}$，并说明 $\\lim_{x \\to 0}\\sin\\dfrac{1}{x}$ 是否存在。\n\n**思路分析**：振荡因子乘无穷小，用\"有界 × 无穷小\"。\n\n**详细解答**：\n\n$0 \\le \\left\\lvert x^2 \\sin\\dfrac{1}{x} \\right\\rvert \\le x^2 \\to 0 \\implies \\lim_{x \\to 0} x^2\\sin\\dfrac{1}{x} = 0$\n\n而 $\\lim_{x\\to 0}\\sin\\frac1x$ 不存在：取 $x_n = \\dfrac{1}{2n\\pi + \\pi/2} \\to 0$，$\\sin\\dfrac{1}{x_n} = 1$；取 $y_n = \\dfrac{1}{2n\\pi} \\to 0$，$\\sin\\dfrac1{y_n} = 0$。两子列极限不同，故极限不存在。\n\n**方法总结**：同一表达式里\"振荡因子\"既可能被无穷小压住（乘法），也可能直接导致极限不存在（单独出现）。分清它的\"身份\"。\n\n**【例 1.5-2】（★★）** 求 $\\lim_{x \\to 0} \\dfrac{x^2\\cos\\frac{1}{x} + \\sin x}{x}$。\n\n**思路分析**：拆成两项（<span style=\"color:#e53935\">极限存在才能拆</span>）：第一项夹逼，第二项等价替换。\n\n**详细解答**：\n\n$\\left\\lvert \\dfrac{x^2\\cos\\frac1x}{x} \\right\\rvert = \\left\\lvert x\\cos\\dfrac1x \\right\\rvert \\le \\lvert x\\rvert \\to 0$\n\n而 $\\dfrac{\\sin x}{x} \\to 1$。两项极限分别存在，故和的极限 $= 0 + 1 = 1$。\n\n**方法总结**：**拆项的前提是每项极限都存在**。本题若写成 $\\dfrac{x^2\\cos(1/x)}{x} = x\\cos\\frac1x$ 再\"约掉\"，本质就是夹逼。"},"1.6":{"id":"1.6","name":"幂指型未定式（e 化思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：一切幂指函数统一 e 化：\n\n$u(x)^{v(x)} = e^{v(x)\\ln u(x)}, \\qquad \\lim u^v = e^{\\lim v\\ln u} \\ (\\text{要求 } u > 0)$\n\n三种未定式的处理：\n\n| 类型         | 典型形态                                       | 化解后                                                            |\n| ---------- | ------------------------------------------ | -------------------------------------------------------------- |\n| $1^\\infty$ | $\\left(\\dfrac{\\ln(1+x)}{x}\\right)^{1/x}$ 等 | $v\\ln u = v(u-1)\\cdot\\dfrac{\\ln u}{u - 1}$，用 $\\ln(1+t) \\sim t$ |\n| $0^0$      | $x^{\\sin x}$、$(\\ln x)^x$ 等                 | $v \\ln u$ 是 $0\\cdot\\infty$ 型，挪分母                               |\n| $\\infty^0$ | $(n!)^?$、$x^{1/x}$ 等                       | 同上，重点算 $\\dfrac{\\ln u}{1/v}$                                    |\n\n**$1^\\infty$ 快捷式**（最常用）：若 $u \\to 1$，$v \\to \\infty$，则\n\n$\\lim u^v = e^{\\lim v(u - 1)}$\n\n（依据：$\\ln u = \\ln(1 + (u-1)) \\sim u - 1$。）\n\n**注意**：\n\n1. 底数必须为正（$x \\to 0^-$ 时 $x^x$ 无意义），先明确定义域与单侧极限；\n2. 底数不趋于 1 时不能用快捷式，老老实实算 $\\lim v \\ln u$。","examplesMd":"**【例 1.6-1】（★★，经典）** 求 $\\lim_{x \\to 0^+} x^{\\sin x}$。\n\n**思路分析**：$0^0$ 型。e 化后 $\\sin x \\ln x$ 是 $0 \\cdot \\infty$，凑成 $\\dfrac{\\ln x}{1/\\sin x}$ 用洛必达，或直接用标准极限 $x\\ln x \\to 0$。\n\n**详细解答**：\n\n$x^{\\sin x} = e^{\\sin x \\ln x}, \\qquad \\sin x\\ln x = \\dfrac{\\sin x}{x} \\cdot x\\ln x \\to 1 \\cdot 0 = 0$\n\n（标准极限 $\\lim_{x\\to0^+} x\\ln x = \\lim_{x \\to 0^+}\\dfrac{\\ln x}{1/x} \\overset{\\text{洛}}{=} \\lim\\dfrac{1/x}{-1/x^2} = -x \\to 0$。）故极限 $= e^0 = 1$。\n\n**方法总结**：记住三个标准极限 \\=\\=$x\\ln x \\to 0$、$x^x \\to 1$（$x \\to 0^+$）、$x^{1/x} \\to 1$（$x \\to +\\infty$）\\=\\=，多数幂指题是它们的变形。\n\n**【例 1.6-2】（★★，经典）** 求 $\\lim_{x \\to 0}(\\cos x)^{1/x^2}$。\n\n**思路分析**：$1^\\infty$ 型，用快捷式 $\\lim u^v = e^{\\lim v(u-1)}$。\n\n**详细解答**：\n\n$\\lim_{x \\to 0} \\dfrac{\\cos x - 1}{x^2} = \\lim_{x \\to 0} \\dfrac{-\\frac{x^2}{2}}{x^2} = -\\dfrac{1}{2}$\n\n故极限 $= e^{-1/2}$。（对照练 1.1-3 的 $(\\cos 3x)^{1/x^2} = e^{-9/2}$：系数平方式放大。）\n\n**方法总结**：$1^\\infty$ 快捷式把幂指题化成\"求一个普通极限\"，该极限往往就是等价替换/泰勒的练兵场。"},"1.7":{"id":"1.7","name":"导数定义求极限（凑定义思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：题目只说\"$f$ 在 $x_0$ 可导\"（抽象函数）时，**唯一合法的导数信息使用方式就是凑定义**：\n\n$f'(x_0) = \\lim_{h \\to 0} \\dfrac{f(x_0 + h) - f(x_0)}{h}$\n\n**两条铁律**：\n\n1. **抽象函数禁止洛必达**——洛必达需要对 $f$ 本身求导，条件不够；\n2. **导数信息只能用一次**——若极限式中出现两处 $f$ 的增量，都用 $f'(x_0)$ 代替时，相当于对 $f$ 用了\"两次导数信息\"，一般只能在最终合并为一个定义式时合法。例如\n\n$\\lim_{h\\to0}\\dfrac{f(x_0+h) - f(x_0-h)}{2h} = f'(x_0)$\n\n合法（加减 $f(x_0)$ 拆成两个定义式之和，各自用一次，系数 $+\\frac12, +\\frac12$ 合计仍是一个信息）——但若极限式中 $f'(x_0)$ 需要用两次以上（如二阶差商除以 $h$ 一次方），就必须假设 $f''(x_0)$ 存在。\n\n**凑定义三步**：加减 $f(x_0)$ → 把增量比拼成 $\\dfrac{f(x_0 + \\text{无穷小}) - f(x_0)}{\\text{无穷小}}$ 的倍数 → 用复合极限（内层无穷小 $\\to 0$）。\n\n**适用信号**：极限式中出现抽象 $f$、只给 $f$ 在一点可导/连续、极限式形如 $\\dfrac{f(\\varphi(x)) - f(\\psi(x))}{g(x)}$。","examplesMd":"**【例 1.7-1】（★★，经典）** 设 $f(0) = 0$，$f'(0) = 2$，求 $\\lim_{x \\to 0} \\dfrac{f(1 - \\cos x)}{x^2}$。\n\n**思路分析**：自变量增量是 $1 - \\cos x \\to 0$，正好凑定义。\n\n**详细解答**：加减 $f(0)$（注意 $f(0) = 0$ 已给）：\n\n$\\dfrac{f(1 - \\cos x) - f(0)}{x^2} = \\dfrac{f(0 + (1-\\cos x)) - f(0)}{1 - \\cos x} \\cdot \\dfrac{1 - \\cos x}{x^2}$\n\n第一个因子：内层 $1 - \\cos x \\to 0$，由导数定义（复合：$t = 1 - \\cos x \\to 0^+$，右极限；见下方注）趋于 $f'(0)$；第二个因子用等价替换 $\\to \\dfrac12$。故极限 $= 2 \\times \\dfrac{1}{2} = 1$。\n\n**注（严谨性）**：$1 - \\cos x \\to 0^+$ 只是单侧趋于，严格说用到的是右导数。若题目只给 $f'(0)$（双侧存在），则右导数 $= f'(0)$，无需担心；但若某题增量只从一侧趋于且仅知单侧可导，需单独声明。本题默认 $f'(0)$ 存在，故结论成立。\n\n**方法总结**：**\"增量提出作分母\"** 是凑定义的标准动作：$\\dfrac{f(x_0+t) - f(x_0)}{g(x)} = \\dfrac{f(x_0+t)-f(x_0)}{t} \\cdot \\dfrac{t}{g(x)}$。\n\n**【例 1.7-2】（★★★，经典二题组）** 设 $f'(x_0)$ 存在，(1) 求 $\\lim_{h\\to0}\\dfrac{f(x_0+h) + f(x_0-h) - 2f(x_0)}{h}$；(2) 若进一步 $f''(x_0)$ 存在，求上式除以 $h^2$ 的极限。\n\n**思路分析**：(1) 加减 $f(x_0)$ 拆成两个一阶定义式；(2) 二阶差商本质是 $f''(x_0)$ 的定义变体，用洛必达（对 $h$ 求导时 $f'$ 在 $x_0$ 邻域需存在——由 $f''(x_0)$ 存在保证）或凑二阶定义。\n\n**详细解答**：\n\n(1)\n\n$\\dfrac{f(x_0+h) + f(x_0-h) - 2f(x_0)}{h} = \\dfrac{f(x_0+h)-f(x_0)}{h} - \\dfrac{f(x_0-h)-f(x_0)}{-h}\\cdot(-1)$\n\n更清楚地写：\n\n$= \\dfrac{f(x_0+h)-f(x_0)}{h} + \\dfrac{f(x_0-h)-f(x_0)}{h} = A(h) - B(-h)$\n\n其中 $A(h) = \\dfrac{f(x_0+h)-f(x_0)}{h} \\to f'(x_0)$，$\\dfrac{f(x_0-h)-f(x_0)}{h} = -\\dfrac{f(x_0+(-h))-f(x_0)}{-h} \\to -f'(x_0)$。两项之和 $\\to f'(x_0) - f'(x_0) = 0$。\n\n(2) 记 $G(h) = f(x_0+h)+f(x_0-h)-2f(x_0)$，$G(h) \\to 0$，且 $f''(x_0)$ 存在意味着 $f'$ 在 $x_0$ 的邻域存在。对 $\\dfrac{G(h)}{h^2}$（$0/0$）用洛必达：\n\n$\\lim_{h\\to0}\\dfrac{G'(h)}{2h} = \\lim_{h\\to0}\\dfrac{f'(x_0+h) - f'(x_0-h)}{2h} = \\dfrac12\\lim_{h\\to0}\\left[\\dfrac{f'(x_0+h)-f'(x_0)}{h} + \\dfrac{f'(x_0)-f'(x_0-h)}{h}\\right]$\n\n两个方括号内分别趋于 $f''(x_0)$（第二个方括号即 $\\dfrac{f'(x_0+(-h))-f'(x_0)}{-h}$ 的定义式），故极限 $= \\dfrac{1}{2}\\cdot 2f''(x_0) = f''(x_0)$。\n\n**方法总结**：对称差商 $\\dfrac{f(x_0+h)+f(x_0-h)-2f(x_0)}{h^2} \\to f''(x_0)$（需 $f''(x_0)$ 存在）。只知 $f'$ 存在时除以 $h$，得 $0$。**阶数与导数信息必须匹配**。"},"1.8":{"id":"1.8","name":"无穷小阶的比较与定参数（泰勒系数对比思想）","part":"函数极限","book":"一元微分","teachMd":"**核心思想**：\n\n1. **比阶**：$\\lim\\dfrac{f(x)}{g(x)} = c \\ne 0$ 则同阶；$= 0$ 则 $f$ 是高阶；$= 1$ 则等价。本质是泰勒展开的首项系数之比。\n2. **定参数**：\"极限存在（且有限）$\\Rightarrow$ 分子的低次幂系数必须全部抵消为零\"——把每个参数当作泰勒系数逐一配平。\n\n**定参数操作流程**（以 $\\lim_{x\\to0}\\dfrac{F(x, a, b)}{x^k}$ 存在为例）：\n\n1. 把 $F$ 按泰勒展开（或等价替换）到 $x^k$ 阶；\n2. 令 $x^0, x^1, \\ldots, x^{k-1}$ 的系数分别为零，解出参数；\n3. 若题目还要求极限值，读出 $x^k$ 项系数即可。\n\n**适用信号**：\"确定常数 $a,b$ 使极限存在/使 $f(x)$ 与 $x^k$ 同阶/是高阶无穷小\"；\"当 $x\\to0$ 时 $f$ 是 $x$ 的几阶无穷小\"。\n\n**易错警示**：\n\n| 错误                 | 纠正                                                          |\n| ------------------ | ----------------------------------------------------------- |\n| 参数个数与抵消条件数不匹配就硬解   | 先数清需要抵消到哪一阶（\\= 分母幂次）                                        |\n| 求出参数后不回代验证         | 回代算出剩余首项系数，即极限值                                             |\n| 忘记极限存在还要求\"极限点两侧\"一致 | 展开式是双向的，一般自动满足；含 $\\lvert x\\rvert$、$\\operatorname{sgn}$ 时要分侧 |","examplesMd":"**【例 1.8-1】（★★★，经典）** 已知极限 $\\lim_{x \\to 0}\\dfrac{x - (a + b\\cos x)\\sin x}{x^5}$ 存在且有限，求常数 $a, b$ 并求出极限值。\n\n**思路分析**：分母 5 阶 → 分子的 $x^1, x^3$ 系数必须为零（函数是奇函数结构，偶次幂自动不出现）。用倍角公式展开 $b\\cos x\\sin x$ 最快。\n\n**详细解答**：由 $2\\sin x\\cos x = \\sin 2x$ 得\n\n$(a + b\\cos x)\\sin x = a\\sin x + \\dfrac{b}{2}\\sin 2x$\n\n展开：\n\n$a\\sin x = a\\left(x - \\dfrac{x^3}{6} + \\dfrac{x^5}{120}\\right) + o(x^5), \\qquad \\dfrac{b}{2}\\sin 2x = \\dfrac{b}{2}\\left(2x - \\dfrac{8x^3}{6} + \\dfrac{32x^5}{120}\\right) + o(x^5) = b\\left(x - \\dfrac{4x^3}{3} + \\dfrac{4x^5}{15}\\right) + o(x^5)$\n\n合并：\n\n$(a+b)x - \\left(\\dfrac{a}{6} + \\dfrac{4b}{3}\\right)x^3 + \\left(\\dfrac{a}{120} + \\dfrac{2b}{15}\\right)x^5 + o(x^5)$\n\n分子 $x - (a+b\\cos x)\\sin x$ 的各阶系数为零要求：\n\n$a + b = 1, \\qquad \\dfrac{a}{6} + \\dfrac{4b}{3} = 0 \\implies a + 8b = 0$\n\n解得 $b = -\\dfrac13$，$a = \\dfrac43$。此时 $x^5$ 项系数：\n\n$\\dfrac{a}{120} + \\dfrac{2b}{15} = \\dfrac{1}{90} - \\dfrac{2}{45} = -\\dfrac{1}{30}$\n\n分子 $= x - \\left[x + 0\\cdot x^3 - \\dfrac{1}{30}x^5\\right] + o(x^5) = \\dfrac{1}{30}x^5 + o(x^5)$，故极限值 $= \\dfrac{1}{30}$。\n\n（**系数复核**：$\\frac{b}{2}\\sin 2x$ 的 $x^5$ 系数 $= \\frac{b}{2}\\cdot\\frac{(2x)^5\\text{ 项}}{1} = \\frac{b}{2}\\cdot\\frac{32}{120} = \\frac{2b}{15}$——此处极易误写为 $\\frac{4b}{15}$，本例初稿即错、SymPy 验证后改正，请引以为戒。）\n\n**方法总结**：\\=\\=$\\sin 2x$ 展开比 $\\cos x \\cdot \\sin x$ 直接相乘快得多。参数题的完整答案 \\= 参数 + 极限值两问。\\=\\=\n\n**【例 1.8-2】（★★）** 设当 $x \\to 0$ 时，$e^{x^2} - \\left(1 + ax^2 + bx^4\\right)$ 是比 $x^4$ 高阶的无穷小，求 $a, b$。\n\n**详细解答**：$e^{x^2} = 1 + x^2 + \\dfrac{x^4}{2} + o(x^4)$。要使差为 $o(x^4)$，需 $x^2$、$x^4$ 系数全部配平：$a = 1$，$b = \\dfrac{1}{2}$。（验证：差 $= o(x^4)$ ✓）\n\n**方法总结**：\"比 $x^k$ 高阶\"意味着展开到 $k$ 阶为止全部相等。"},"2.1":{"id":"2.1","name":"夹逼与分段放缩（主部 + 尾项估计思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：n 项和 $S_n = \\sum_{k=1}^{n} a_{n,k}$（每项都依赖 $n$）无法求闭式时，把每一项放缩到\"同一个量级\"：\n\n$n \\cdot (\\text{最小项}) \\le S_n \\le n \\cdot (\\text{最大项})$\n\n若两边的 $n$ 倍极限相等，夹逼成功。关键名言：**\"和式夹逼，抓大放小；<span style=\"color:#e53935\">首尾同阶</span>，两头夹住\"**。\n\n**典型情形**（项数随 $n$ 增多的和式）：\n\n1. 各项介于两个\"好算\"的量之间：$\\sum \\dfrac{1}{\\sqrt{n^2+k}}$ 型；\n2. **最大值筛选**：$\\sqrt[n]{a_1^n + \\cdots + a_m^n} \\to \\max_i a_i$（$m$ 固定，$a_i > 0$）——$n$ 次幂会放大最大者；\n3. 有界量乘无穷小、$0 \\le a_n \\le \\dfrac{1}{n}$ 型直接夹逼。\n\n**与定积分定义（2.5）的分工**：若每项可写成 $f!\\left(\\dfrac{k}{n}\\right)\\cdot\\dfrac1n$ 且 $f$ 可积，优先用定积分定义（精确）；若各项\"不齐整\"（含 $n^2 + k$ 开方等无法统一成 $\\frac kn$ 的结构），用夹逼。","examplesMd":"**【例 2.1-1】（★★，经典）** 求 $\\lim_{n\\to\\infty}\\left( \\dfrac{1}{\\sqrt{n^2+1}} + \\dfrac{1}{\\sqrt{n^2+2}} + \\cdots + \\dfrac{1}{\\sqrt{n^2+n}} \\right)$。\n\n**思路分析**：$n$ 项，每项介于 $\\dfrac{1}{\\sqrt{n^2+n}}$ 与 $\\dfrac{1}{\\sqrt{n^2+1}}$ 之间，整体夹逼。\n\n**详细解答**：\n\n$\\dfrac{n}{\\sqrt{n^2+n}} \\le \\sum_{k=1}^{n}\\dfrac{1}{\\sqrt{n^2+k}} \\le \\dfrac{n}{\\sqrt{n^2+1}}$\n\n两边均 $\\to \\dfrac{n}{\\sqrt{n^2}} = 1$，故由夹逼准则，极限为 $1$。\n\n**方法总结**：分母从 $n^2+1$ 变到 $n^2+n$，相对变化 $\\to 0$，故\"整列同杀\"。**检验**：**<span style=\"color:#e53935\">若分母是 $n + k$（$\\sum \\frac{1}{\\sqrt{n+k}}$），首尾不同阶，夹逼失效，需改用 Stolz（2.4）。</span>**\n\n**【例 2.1-2】（★★，最大值筛选）** 设 $a_1, \\ldots, a_m > 0$，证明 $\\lim_{n\\to\\infty}\\sqrt[n]{a_1^n + a_2^n + \\cdots + a_m^n} = \\max_{1\\le i\\le m} a_i$。\n\n**详细解答**：记 $A = \\max_i a_i$。一方面\n\n$\\sqrt[n]{a_1^n + \\cdots + a_m^n} \\ge \\sqrt[n]{A^n} = A$\n\n另一方面\n\n$\\sqrt[n]{a_1^n + \\cdots + a_m^n} \\le \\sqrt[n]{mA^n} = A\\sqrt[n]{m} \\to A \\cdot 1 = A$\n\n（$\\sqrt[n]{m} \\to 1$，$m$ 固定。）夹逼得极限 $= A$。$\\blacksquare$\n\n**方法总结**：**\"幂和的开 n 次方 → 最大者\"**。推广：$\\sqrt[n]{P(n)} \\to 1$（多项式）、$\\sqrt[n]{n} \\to 1$、$\\dfrac{\\sqrt[n]{n!}}{n} \\to \\dfrac1e$（见 2.4 例 2）。"},"2.2":{"id":"2.2","name":"单调有界准则（递推数列\"先证后取\"思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：递推数列 $x_{n+1} = \\varphi(x_n)$ \\=\\=没有通项公式时，证明收敛的**唯一普适武器**\\=\\=：\n\n> **单调有界准则**：递增有上界（或递减有下界）的数列必收敛。\n\n**操作三部曲**（缺一不可）：\n\n1. **有界性**：数学归纳法证明 $x_n \\in [\\alpha, \\beta]$；\n2. **单调性**：作差 $x_{n+1} - x_n$（或作商、或证 $x_{n+2} - x_n$ 定号——交错振荡型）；\n3. **取极限**：对递推式两边取极限（$\\varphi$ 连续），解不动点方程 $L = \\varphi(L)$，**用有界性排除伪根**。\n\n**不动点预判法（先看后证）**：先解 $L = \\varphi(L)$ 得候选极限，再证 ${x_n}$ 被不动点\"吸住\"：\n\n* 若 $x_1 < L$ 且 $\\varphi(x) > x$ 在 $(x_1, L)$ 上成立 → 递增趋于 $L$；\n* 振荡型（$\\varphi$ 递减）考虑 $x_{n+2} = \\varphi(\\varphi(x_n))$（偶数、奇数子列各自单调）。\n\n**易错警示**：\n\n| 错误                                   | 纠正                    |\n| ------------------------------------ | --------------------- |\n| 只验证 $x_2 > x_1$ 就断言递增                | 必须归纳证明对一切 $n$ 成立      |\n| 取极限解出两个不动点不知道取哪个                     | 由单调性与界确定数列所在区间，选区间内的根 |\n| 交错型（如 $x_{n+1} = 2 + 1/x_n$）直接说\"不单调\" | 看子列：奇偶子列分别单调，趋于同一极限   |","examplesMd":"**【例 2.2-1】（★★，最经典）** 设 $a_1 = \\sqrt2$，$a_{n+1} = \\sqrt{2 + a_n}$，证明 ${a_n}$ 收敛并求极限。\n\n**思路分析**：先猜不动点：$L = \\sqrt{2+L} \\Rightarrow L^2 - L - 2 = 0 \\Rightarrow L = 2$（负根 $-1$ 舍）。再证递增有上界 2。\n\n**详细解答**：\n\n**有界**：归纳证 $a_n < 2$：$a_1 = \\sqrt2 < 2$；若 $a_n < 2$，则 $a_{n+1} = \\sqrt{2 + a_n} < \\sqrt4 = 2$ ✓。\n\n**单调**：归纳证 $a_{n+1} > a_n$：$a_2 = \\sqrt{2+\\sqrt2} > \\sqrt2 = a_1$；若 $a_{n+1} > a_n$，则\n\n$a_{n+2} = \\sqrt{2 + a_{n+1}} > \\sqrt{2 + a_n} = a_{n+1}$\n\n（开方函数单调递增 ✓）。\n\n由单调有界准则 ${a_n}$ 收敛，设极限为 $L \\ge \\sqrt2 > 0$。递推式取极限（$\\sqrt{\\cdot}$ 连续）：$L = \\sqrt{2 + L}$，$L^2 - L - 2 = 0$，$L = 2$ 或 $L = -1$；由 $L \\ge \\sqrt2 > 0$ 得 $\\boxed{L = 2}$。\n\n**方法总结**：归纳证\"上界 + 增\"各一次，注意归纳传递时用 $\\varphi$ 的单调性。本题 $2\\cos\\dfrac{\\pi}{2^{n+1}}$ 是其闭式（三角余弦半角），可自行验证。\n\n**【例 2.2-2】（★★）** 设 $0 < x_1 < 1$，$x_{n+1} = x_n(2 - x_n)$，证明 ${x_n}$ 收敛并求极限。\n\n**思路分析**：递推函数 $\\varphi(x) = x(2-x) = 1 - (1-x)^2$，不动点 $0$ 与 $1$。初值在 $(0,1)$，猜趋于 $1$。配方是关键变形。\n\n**详细解答**：\n\n**有界与单调一步到位**：\n\n$x_{n+1} - x_n = x_n(1 - x_n) > 0 \\quad (\\text{因 } 0 < x_n < 1)$\n\n$x_{n+1} = 1 - (1 - x_n)^2 < 1, \\qquad x_{n+1} > 0$\n\n**归纳**：$0 < x_1 < 1$ 时上述两式表明 $0 < x_{n} < 1$ 且 $x_{n+1} > x_n$ 对一切 $n$ 成立。故 ${x_n}$ 递增有上界 1，收敛。设极限 $L \\in (0, 1]$，取极限：$L = L(2 - L)$，$L(L - 1) = 0$，由 $L \\ge x_1 > 0$ 且递增知 $L \\ge x_1 > 0$；若 $L = 0$ 与 $L \\ge x_1 > 0$ 矛盾，故 $L = 1$。\n\n**方法总结**：当 $x_{n+1} - x_n$ 能直接因式分解为正因子之积时，\"作差法\"比数学归纳传递更简洁。此递推是数值分析中求倒数的牛顿迭代[^anno-2]，收敛速度二阶。"},"2.3":{"id":"2.3","name":"海涅归结原理（化数列为函数极限思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：海涅（Heine）归结原理建立桥梁：\n\n$\\lim_{x\\to x_0} f(x) = A \\iff \\text{对任意数列 } x_n \\to x_0\\ (x_n \\ne x_0),\\ \\lim_{n\\to\\infty} f(x_n) = A$\n\n两个方向各有用途：\n\n1. **正向（化归）**：数列极限 $\\lim f(n)$ 难求时，若相应的函数极限 $\\lim_{x\\to+\\infty} f(x)$ 存在，则数列极限等于它——于是**洛必达、泰勒等连续工具合法进场**；\n2. **反向（证不存在）**：找两个子列趋于不同极限，即可断定极限不存在（已在拔 1.5 用过）。\n\n**典型操作**：\n\n* $n\\left(a^{1/n} - 1\\right) \\to \\ln a$：令 $x = \\frac1n$，化归 $\\dfrac{a^x - 1}{x} \\to \\ln a$（洛必达/等价替换）；\n* 周期函数 + 小增量：$\\tan(\\pi\\sqrt{n^2+1})$，用周期性剥离整数周期，剩 $\\tan(\\pi t_n)$，$t_n \\to 0$，再连续性 + 等价替换。\n\n**注意**：函数极限不存在时数列极限仍可能存在（如 $\\sin\\pi x$ 当 $x\\to\\infty$ 不存在，但 $\\sin\\pi n = 0$）——化归是**充分**捷径，不是必要条件。","examplesMd":"**【例 2.3-1】（★★，经典）** 求 $\\lim_{n\\to\\infty}\\tan!\\left(\\pi\\sqrt{n^2+1}\\right)$。\n\n**思路分析**：$\\tan$ 以 $\\pi$ 为周期，把 $\\sqrt{n^2+1}$ 拆成\"整数部分 $n$ + 小数部分 $t_n$\"，$t_n \\to 0$。\n\n**详细解答**：\n\n$\\sqrt{n^2+1} = n + \\left(\\sqrt{n^2+1} - n\\right), \\qquad t_n := \\sqrt{n^2+1} - n = \\dfrac{1}{\\sqrt{n^2+1}+n} \\to 0$\n\n由周期性 $\\tan(\\pi \\cdot n + \\pi t_n) = \\tan(\\pi t_n)$（$n$ 为整数，$\\pi n$ 是 $\\tan$ 的整周期）：\n\n$\\tan!\\left(\\pi\\sqrt{n^2+1}\\right) = \\tan(\\pi t_n) \\sim \\pi t_n = \\dfrac{\\pi}{\\sqrt{n^2+1}+n} \\to 0$\n\n故极限为 $0$。（用海涅观点看：$t = t_n \\to 0$，$\\dfrac{\\tan(\\pi t)}{t} \\to \\pi$ 是函数极限，数列版自动成立。）\n\n**方法总结**：$\\sqrt{n^2 + c}$、$\\sqrt{n^2+n}$ 中的\"周期剥离\"是竞赛填空高频套路：**先分离整数与小量，再对小量用连续性/等价替换**。对照陷阱：$\\sin(\\pi\\sqrt{n^2+1}) = (-1)^n\\sin(\\pi t_n) \\to 0$ 没问题，但 $n\\sin(\\pi\\sqrt{n^2+1}) = (-1)^n\\pi/2$ **极限不存在**（振荡）。\n\n**【例 2.3-2】（★★，真题风格）** 求 $\\lim_{n\\to\\infty} n^2\\left(e^{1/n} - e^{1/(n+1)}\\right)$。\n\n**思路分析**：同底指数差降阶（方法 1.2 拔高）：$e^a - e^b = e^b(e^{a-b} - 1) \\sim e^b(a-b)$。\n\n**详细解答**：\n\n$e^{1/n} - e^{1/(n+1)} = e^{1/(n+1)}\\left(e^{\\frac1n - \\frac{1}{n+1}} - 1\\right)$\n\n其中\n\n$\\dfrac1n - \\dfrac{1}{n+1} = \\dfrac{1}{n(n+1)} \\to 0, \\qquad e^{\\frac{1}{n(n+1)}} - 1 \\sim \\dfrac{1}{n(n+1)}$\n\n故\n\n$n^2\\left(e^{1/n} - e^{1/(n+1)}\\right) = e^{1/(n+1)}\\cdot n^2\\cdot\\dfrac{e^{\\frac{1}{n(n+1)}} - 1}{\\frac{1}{n(n+1)}}\\cdot\\dfrac{1}{n(n+1)} \\longrightarrow 1 \\cdot 1 \\cdot 1 = 1$\n\n（这里\"指数上的等价替换\"合法性由海涅归结保证：函数极限 $\\lim_{t\\to0}\\dfrac{e^t - 1}{t} = 1$，取 $t_n = \\frac{1}{n(n+1)}$ 即可。）\n\n**方法总结**：$e^a - e^b$ 结构 + 增量 $a - b = \\frac{1}{n(n+1)}$（差分数一阶小量）。变式：$a^x$ 版本 $\\lim n^2(a^{1/n} - a^{1/(n+1)}) = \\ln a$（练 2.3 类似题）。"},"2.4":{"id":"2.4","name":"Stolz 定理（数列版洛必达思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：Stolz 定理是**离散差分版的洛必达**——当 $a_n$（或 $b_n$）本身是**累加量**（前 n 项和、累乘的对数）时，\"整体之比\"的极限由\"增量之比\"决定：\n\n> **定理（$\\frac{\\ast}{\\infty}$ 型）**：设 $b_n$ 严格递增且 $b_n \\to +\\infty$，若\n> $\\lim_{n\\to\\infty}\\dfrac{a_{n+1} - a_n}{b_{n+1} - b_n} = L \\quad (\\text{有限或 } \\pm\\infty)$\n> 则 $\\lim_{n\\to\\infty}\\dfrac{a_n}{b_n} = L$。\n\n> **定理（$\\frac{0}{0}$ 型）**：设 $a_n \\to 0$，$b_n$ 严格递减趋于 $0$，且差比极限为 $L$，则 $\\dfrac{a_n}{b_n} \\to L$。\n\n**适用信号**：\n\n1. $\\dfrac{\\sum_{k=1}^n(\\text{单项})}{n^{p}}$ 型（分子是和式，分母 $n^p \\to \\infty$ 严格递增）——增量 $b_{n+1} - b_n = (n+1)^p - n^p$ 是低一阶多项式，一算就出；\n2. 数列通项含 $n!$、$n$ 次幂结构 → 取对数后分子变累加和，对 $\\dfrac{\\ln x_n}{n}$ 用 Stolz；\n3. 已知 $x_n \\to$ 极限，问算术平均 $\\dfrac{x_1 + \\cdots + x_n}{n}$（Cesàro，见拔高）。\n\n**与洛必达的关系**：分母是连续变量 $x$ 时用洛必达；分母是 $n$（离散）时用 Stolz。二者都是\"化整体比为增量比\"。","examplesMd":"**【例 2.4-1】（★★）** 求 $\\lim_{n\\to\\infty}\\dfrac{1^2 + 2^2 + \\cdots + n^2}{n^3}$。\n\n**思路分析**：分子是累加和（$a_n = \\sum k^2$），分母 $n^3$ 严格递增趋于 $\\infty$，$\\frac{\\ast}{\\infty}$ 型 Stolz 直接套。\n\n**详细解答**：取 $a_n = \\sum_{k=1}^n k^2$，$b_n = n^3$：\n\n$\\lim_{n\\to\\infty}\\dfrac{a_{n+1} - a_n}{b_{n+1} - b_n} = \\lim_{n\\to\\infty}\\dfrac{(n+1)^2}{(n+1)^3 - n^3} = \\lim_{n\\to\\infty}\\dfrac{(n+1)^2}{3n^2 + 3n + 1} = \\dfrac13$\n\n故原极限 $= \\dfrac{1}{3}$。（一般地 $\\dfrac{\\sum k^m}{n^{m+1}} \\to \\dfrac{1}{m+1}$——它也是定积分定义的结论，见 2.5。）\n\n**方法总结**：分母增量 $(n+1)^3 - n^3$ 展开 = $3n^2 + O(n)$，比原分母低一阶，Stolz 一次到位。\n\n**【例 2.4-2】（★★★，经典名题）** 证明 $\\lim_{n\\to\\infty}\\dfrac{\\sqrt[n]{n!}}{n} = \\dfrac{1}{e}$。\n\n**思路分析**：$n!$ 的 n 次根 → 取对数化乘为加：$\\ln\\dfrac{\\sqrt[n]{n!}}{n} = \\dfrac{1}{n}\\sum_{k=1}^n \\ln\\dfrac{k}{n}$。这是\"和式除以 $n$\"，对它用 Stolz。\n\n**详细解答**：记 $a_n = \\sum_{k=1}^n \\ln\\dfrac{k}{n}$（注意 $\\ln\\frac kn$ 依赖 $n$，Stolz 恰能处理这种\"和式通项也随 n 变\"的情形），$b_n = n$：\n\n$a_{n+1} - a_n = \\sum_{k=1}^{n+1}\\ln\\dfrac{k}{n+1} - \\sum_{k=1}^n \\ln\\dfrac{k}{n} = \\ln\\dfrac{n+1}{n+1} + \\sum_{k=1}^{n}\\ln\\dfrac{\\frac{k}{n+1}}{\\frac{k}{n}} = 0 + \\sum_{k=1}^{n}\\ln\\dfrac{n}{n+1}$\n\n$= n\\ln\\dfrac{n}{n+1} = -n\\ln\\left(1 + \\dfrac1n\\right) \\to -1$\n\n而 $b_{n+1} - b_n = 1$，故 $\\lim\\dfrac{a_n}{n} = -1$，于是\n\n$\\lim_{n\\to\\infty}\\dfrac{\\sqrt[n]{n!}}{n} = \\exp\\left(\\lim \\dfrac{a_n}{n}\\right) = e^{-1} = \\dfrac1e \\qquad \\blacksquare$\n\n**方法总结**：**阶乘的 Stolz 处理三步：取对数 → 写成 $\\sum \\ln\\frac{k}{n}$ → 差分翻倍成 $n\\ln\\frac{n}{n+1}$**。结论 $\\sqrt[n]{n!} \\sim \\dfrac ne$ 是竞赛\"渐近估计\"基石（Stirling 公式的粗版）。"},"2.5":{"id":"2.5","name":"定积分定义（和式转积分思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：当 n 项和的**每一项都能统一写成** $f!\\left(\\dfrac{k}{n}\\right)\\cdot\\dfrac1n$ 的形式时，和式就是 $\\int_0^1 f(x),dx$ 的黎曼和：\n\n$\\lim_{n\\to\\infty}\\sum_{k=1}^n f!\\left(\\dfrac{k}{n}\\right)\\cdot\\dfrac{1}{n} = \\int_0^1 f(x),dx \\qquad (f \\text{ 可积即可})$\n\n**识别三要素**：\n\n1. **提出 $\\frac1n$**：和式中凑出因子 $\\frac1n$（相当于 $\\Delta x$）；\n2. **剩余部分是 $\\frac kn$ 的函数**：如 $\\sin\\dfrac{k\\pi}{n} = \\sin\\left(\\pi\\cdot\\dfrac{k}{n}\\right)$ ✓；而 $\\dfrac{1}{\\sqrt{n^2+k}} = \\dfrac{1}{n}\\cdot\\dfrac{1}{\\sqrt{1 + k/n^2}}$ **不是** $\\frac kn$ 的函数（是 $\\frac{k}{n^2}$ 的），只能夹逼（对照例 2.1-1）；\n3. **区间换算**：$\\frac kn \\in (0,1]$，若出现 $\\frac{k}{2n}$ 则积分区间为 $\\left(0, \\frac12\\right)$ 或换元。\n\n**乘积型（n 项积）**：先取对数化积为和：$\\sqrt[n]{\\prod} = \\exp\\left(\\frac1n\\sum \\ln(\\cdot)\\right)$。\n\n**与 2.1 夹逼的判别**：每项\"齐整\"（统一 $f(\\frac kn)$）→ 定积分定义；每项只是\"同阶\"（$n^2 + k$ 型开方）→ 夹逼。","examplesMd":"**【例 2.5-1】（★★，最基本型）** 求 $\\lim_{n\\to\\infty}\\dfrac1n\\left[\\sin\\dfrac{\\pi}{n} + \\sin\\dfrac{2\\pi}{n} + \\cdots + \\sin\\dfrac{n\\pi}{n}\\right]$。\n\n**详细解答**：每项 $\\sin\\dfrac{k\\pi}{n} = \\sin\\left(\\pi\\cdot\\dfrac{k}{n}\\right)$，故\n\n$\\lim_{n\\to\\infty}\\sum_{k=1}^n \\sin\\left(\\pi\\cdot\\dfrac{k}{n}\\right)\\cdot\\dfrac1n = \\int_0^1 \\sin(\\pi x),dx = \\left[-\\dfrac{\\cos\\pi x}{\\pi}\\right]_0^1 = \\dfrac{1 - (-1)}{\\pi} = \\dfrac{2}{\\pi}$\n\n**方法总结**：**\"先提出 $\\frac1n$，再把 $\\frac kn$ 看成连续变量 $x$\"**。区间 $[0,1]$，被积函数保留 $\\pi$ 等系数。\n\n**【例 2.5-2】（★★★，乘积型经典）** 求 $\\lim_{n\\to\\infty}\\dfrac{\\sqrt[n]{(n+1)(n+2)\\cdots(2n)}}{n}$。\n\n**思路分析**：n 项积 → 取对数化成 $\\frac1n\\sum\\ln(\\cdot)$，识别 $\\ln\\left(1 + \\frac kn\\right)$。\n\n**详细解答**：$(n+1)(n+2)\\cdots(2n) = n^n\\prod_{k=1}^n\\left(1 + \\dfrac{k}{n}\\right)$，故\n\n$\\dfrac{\\sqrt[n]{(n+1)(n+2)\\cdots(2n)}}{n} = \\left[\\prod_{k=1}^n\\left(1 + \\dfrac{k}{n}\\right)\\right]^{1/n} = \\exp\\left(\\dfrac1n\\sum_{k=1}^n\\ln\\left(1 + \\dfrac{k}{n}\\right)\\right)$\n\n（$\\dfrac{n+k}{n} = 1 + \\dfrac kn$。）于是\n\n$\\lim \\dfrac1n\\sum_{k=1}^n\\ln\\left(1+\\dfrac{k}{n}\\right) = \\int_0^1\\ln(1+x),dx = \\Big[(1+x)\\ln(1+x) - (1+x)\\Big]_0^1 = 2\\ln2 - 2 + 1 = 2\\ln 2 - 1$\n\n故原极限 $= e^{2\\ln2 - 1} = \\dfrac{4}{e}$。\n\n**方法总结**：乘积型三步：**取对数 → 认出 $f(\\frac kn)$ → 积分**。分部积分算 $\\int\\ln(1+x)$ 是标配计算。"},"2.6":{"id":"2.6","name":"压缩映射与迭代数列（几何速度收敛思想）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：递推 $x_{n+1} = \\varphi(x_n)$ 中，若每一步迭代把\"到目标的距离\"压缩一个固定比例，则数列以**几何级数的速度**收敛：\n\n> **压缩原理**：若存在 $t$ 与常数 $q \\in (0,1)$，使得迭代过程满足 $\\lvert x_{n+1} - t\\rvert \\le q\\lvert x_n - t\\rvert$，则\n> $\\lvert x_n - t\\rvert \\le q^{n-1}\\lvert x_1 - t\\rvert \\to 0$\n\n**建立压缩的两条途径**：\n\n1. **导数法**：若 $x_n$ 全部落入区间 $I$ 且 $\\lvert\\varphi'(x)\\rvert \\le q < 1$ 于 $I$，则由拉格朗日中值定理\n   $\\lvert x_{n+1} - t\\rvert = \\lvert\\varphi(x_n) - \\varphi(t)\\rvert = \\lvert\\varphi'(\\xi)\\rvert\\lvert x_n - t\\rvert \\le q\\lvert x_n - t\\rvert$\n   （$t$ 为不动点 $t = \\varphi(t)$；中值定理见第五部分 5.2。）\n2. **代数法**：直接把 $x_{n+1} - t$ 因式分解出 $(x_n - t)$：如 $x_{n+1} = \\dfrac{1}{2+x_n}$ 与 $t = \\sqrt2 - 1$：\n\n$x_{n+1} - t = \\dfrac{1}{2 + x_n} - \\dfrac{1}{2+t} = \\dfrac{t - x_n}{(2+x_n)(2+t)}$\n\n压缩系数一目了然 $\\le \\dfrac14$。\n\n**与 2.2 的关系**：单调有界证\"收敛\"，压缩映射额外给出\"收敛得多快\"（$q^n$ 速度）；不动点为**重根**时（练 2.2-2 型）压缩退化（$q = 1$），收敛速度骤降为多项式级（见拔高）。\n\n**适用信号**：递推函数 $\\varphi$ 光滑且导数小；题目问\"迭代多少次达到精度\"；问 $\\lim n x_n^2$ 型渐近速度。","examplesMd":"**【例 2.6-1】（★★）** 设 $x_1 = 1$，$x_{n+1} = \\dfrac{1}{2 + x_n}$，证明 ${x_n}$ 收敛并求极限。\n\n**思路分析**：解不动点方程后用**代数法**直接分解出压缩因子。\n\n**详细解答**：不动点：$t = \\dfrac{1}{2+t} \\Rightarrow t^2 + 2t - 1 = 0 \\Rightarrow t = \\sqrt2 - 1$（正根，$t \\approx 0.414$）。\n\n$x_n \\in [\\sqrt2 - 1, 1]$（$x_1 = 1$；$\\frac{1}{2+x}$ 把 $[\\sqrt2-1, 1]$ 映入 $[\\frac13, \\sqrt2-1]$……具体地：$x \\ge \\sqrt2 - 1 \\Rightarrow \\frac1{2+x} \\le \\frac{1}{1+\\sqrt2} = \\sqrt2 - 1$ ✓）。作差分解：\n\n$\\lvert x_{n+1} - t\\rvert = \\left\\lvert\\dfrac{1}{2+x_n} - \\dfrac{1}{2+t}\\right\\rvert = \\dfrac{\\lvert x_n - t\\rvert}{(2+x_n)(2+t)} \\le \\dfrac{\\lvert x_n - t\\rvert}{(2 + \\sqrt2 - 1)(2 + \\sqrt2 - 1)} = \\dfrac{\\lvert x_n - t\\rvert}{(1+\\sqrt2)^2} \\le \\dfrac{1}{4}\\lvert x_n - t\\rvert$\n\n（$2 + x_n \\ge 2 + t = 1 + \\sqrt2 > 2$，故乘积 $> 4$。）递推得 $\\lvert x_n - t\\rvert \\le 4^{-(n-1)}\\lvert x_1 - t\\rvert \\to 0$，故 $x_n \\to \\sqrt2 - 1$。\n\n**方法总结**：**\"分式递推→交叉相减分解\"**：$\\frac1{a + x_n} - \\frac1{a+t} = \\frac{t - x_n}{(a+x_n)(a+t)}$，压缩系数 \\= 分母最小值的倒数。\n\n**【例 2.6-2】（★★，无法求出闭式解的不动点）** 设 $x_1 = 1$，$x_{n+1} = \\cos x_n$，证明 ${x_n}$ 收敛，并说明其极限是哪个方程的根。\n\n**详细解答**：\n\n**不动点存在唯一**：$g(x) = \\cos x - x$ 连续，$g(0) = 1 > 0$，$g(1) = \\cos 1 - 1 < 0$，由零点定理（3.3）存在根 $t \\in (0,1)$；$g'(x) = -\\sin x - 1 < 0$ 严格递减，故根唯一。\n\n**值域**：$x \\in [0, 1] \\Rightarrow \\cos x \\in [\\cos 1, 1] \\subset [0, 1]$，归纳知 $x_n \\in (0, 1]$。\n\n**压缩**：$\\varphi(x) = \\cos x$，$\\lvert\\varphi'(x)\\rvert = \\sin x \\le \\sin 1 \\approx 0.841 < 1$ 于 $[0,1]$。由拉格朗日中值定理：\n\n$\\lvert x_{n+1} - t\\rvert = \\lvert \\varphi(x_n) - \\varphi(t)\\rvert \\le (\\sin 1)\\lvert x_n - t\\rvert$\n\n故 $x_n \\to t$，$t$ 是方程 $\\cos x = x$ 的唯一实根（数值 $t \\approx 0.7391$，无解析表达式）。\n\n**方法总结**：当不动点无闭式时，回答\"收敛于方程 $x = \\cos x$ 的唯一根 + 数值近似\"即可。压缩系数 $q = \\sin 1$ 偏大，收敛偏慢——每迭代一次误差至少缩至 84%。"},"2.7":{"id":"2.7","name":"上下极限与 Cauchy 准则（存在性的精细工具）","part":"数列极限","book":"一元微分","teachMd":"**核心思想**：数列不单调、不收敛时，它的\"极限行为\"由**最大/最小聚点**刻画：\n\n$\\limsup_{n\\to\\infty} x_n = \\lim_{n\\to\\infty}\\sup_{k \\ge n} x_k, \\qquad \\liminf_{n\\to\\infty} x_n = \\lim_{n\\to\\infty}\\inf_{k \\ge n} x_k$\n\n**关键性质**：\n\n1. **收敛判据**：$\\lim x_n$ 存在（含 $\\pm\\infty$ 的情形另论）$\\iff \\limsup x_n = \\liminf x_n$（\\= 该极限）；\n2. 有界数列的 $\\limsup$、$\\liminf$ 总存在（有界数列必有收敛子列——B-W 定理）；\n3. $\\limsup$ 是\"最大的子列极限\"，$\\liminf$ 是\"最小的子列极限\"——**证发散**（找两个子列极限不同）与**证收敛**（上下极限夹相等）都用它。\n\n**Cauchy 准则**（收敛的内在判据，不需预知极限）：\n\n> $x_n$ 收敛 $\\iff$ 任给 $\\varepsilon > 0$，存在 $N$，当 $m, n > N$ 时 $\\lvert x_m - x_n\\rvert < \\varepsilon$。\n\n**用途**：证明**发散**（找一对距离不缩小的项）；证明级数/迭代收敛（相邻差可估时）。\n\n**适用信号**：含 $(-1)^n$、$\\sin n$ 等振荡结构；证明题中\"证明极限存在\"但给不出极限值；需要估计\"聚点集合\"的竞赛证明。","examplesMd":"**【例 2.7-1】（★★）** 求 $x_n = (-1)^n + \\dfrac1n$ 的上极限与下极限，并判断敛散性。\n\n**详细解答**：\n\n$\\limsup_{n\\to\\infty}\\left((-1)^n + \\dfrac1n\\right) = 1 \\quad (\\text{偶子列 } \\to 1), \\qquad \\liminf_{n\\to\\infty}\\left((-1)^n + \\dfrac1n\\right) = -1 \\quad (\\text{奇子列} \\to -1)$\n\n上下极限不相等，故 ${x_n}$ 发散。（$\\frac1n$ 扰动不影响聚点位置。）\n\n**方法总结**：振荡数列的聚点集 \\= 各\"特征子列\"（偶、奇、$4k+1$ 等）的极限全体，$\\limsup/\\liminf$ \\= 其中最大/最小者。\n\n**【例 2.7-2】（★★，Cauchy 准则证发散）** 用 Cauchy 准则证明调和级数部分和 $H_n = 1 + \\dfrac12 + \\cdots + \\dfrac1n$ 发散。\n\n**详细解答**：取 $\\varepsilon_0 = \\dfrac12$。对任意 $N$，取 $n = 2N$，$m = N$（均 $> N - 1$，即 $m, n$ 可任意大）：\n\n$\\lvert H_{2N} - H_N\\rvert = \\dfrac{1}{N+1} + \\dfrac{1}{N+2} + \\cdots + \\dfrac{1}{2N} \\ge N\\cdot\\dfrac{1}{2N} = \\dfrac12 = \\varepsilon_0$\n\n（每项 $\\ge \\frac{1}{2N}$，共 $N$ 项。）Cauchy 条件被破坏，${H_n}$ 发散。$\\blacksquare$\n\n**方法总结**：**\"块估计\"**——尾部取一段 $[m+1, n]$ 估阶。这是证明部分和序列发散的标准动作（注意与拔 2.1 的 $H_n \\sim \\ln n$ 呼应：发散但速度极慢）。"},"3.1":{"id":"3.1","name":"连续性定义与含参讨论（三要素核查思想）","part":"连续与一致连续","book":"一元微分","teachMd":"**核心思想**：$f$ 在 $x_0$ 连续 $\\iff$ 三件事同时成立：\n\n$\\lim_{x\\to x_0} f(x) = f(x_0) \\iff \\text{① } f(x_0) \\text{ 有定义} \\quad \\text{② } \\lim_{x\\to x_0}f(x) \\text{ 存在} \\quad \\text{③ 两者相等}$\n\n**两大题型**：\n\n1. **极限函数的连续性**：$f(x) = \\lim_{n\\to\\infty} F_n(x)$。先按 $x$ 的范围**求出极限的分段表达式**（通常以 $\\lvert x\\rvert < 1$、$=1$、$> 1$ 或 $x$ 与某常数比较分界），再检查分界点。**关键：分界点由\"底数的绝对值是否为 1\"决定**。\n2. **含参连续（反求参数）**：极限值含参数，令\"极限值 \\= 该点函数值\"解参数。\n\n**单侧连续**：定义区间的端点只要求单侧（如 $\\sqrt{x}$ 在 0 处只需右连续）。\n\n**适用信号**：$f(x) = \\lim_{n\\to\\infty}(\\cdot)$；分段函数含待定常数；\"补充定义 $f(x_0) = a$ 使 $f$ 连续\"。","examplesMd":"**【例 3.1-1】（★★，经典）** 讨论 $f(x) = \\lim_{n\\to\\infty}\\dfrac{x^{2n} - 1}{x^{2n} + 1}$ 的连续性。\n\n**思路分析**：$x^{2n} = (x^2)^n$ 的敛散以 $\\lvert x\\rvert = 1$ 为界，分三段求极限。\n\n**详细解答**：\n\n* $\\lvert x\\rvert < 1$：$x^{2n} \\to 0$，$f(x) = \\dfrac{-1}{1} = -1$；\n* $\\lvert x\\rvert = 1$：$x^{2n} = 1$，$f(x) = \\dfrac{0}{2} = 0$；\n* $\\lvert x\\rvert > 1$：分子分母同除 $x^{2n}$，$f(x) = \\dfrac{1 - x^{-2n}}{1 + x^{-2n}} \\to 1$。\n\n即\n\n$f(x) = \\begin{cases} -1, & \\lvert x\\rvert < 1 \\\\ 0, & \\lvert x\\rvert = 1 \\\\ 1, & \\lvert x\\rvert > 1 \\end{cases}$\n\n在 $x = \\pm 1$ 处：左（右）极限为 $\\mp 1 \\ne 0 = f(\\pm1)$，双侧极限都不存在（跳跃），故 $x = \\pm1$ 为跳跃间断点；其余点连续。\n\n**方法总结**：**极限函数题两步走：先\"按 $x$ 分段求极限\"，再\"逐点检查分界点\"**。分界点几乎总在\"底数绝对值 \\= 1\"处。\n\n**【例 3.1-2】（★★，含参）** 设 $f(x) = \\begin{cases} (\\cos x)^{1/x^2}, & x \\ne 0 \\\\ a, & x = 0 \\end{cases}$ 在 $x = 0$ 处连续，求 $a$。\n\n**详细解答**：由方法 1.6（练 1.1-3 的 $e^{-1/2}$ 特例）：\n\n$\\lim_{x\\to0}(\\cos x)^{1/x^2} = e^{-1/2}$\n\n连续要求 $a = e^{-1/2} = \\dfrac{1}{\\sqrt e}$。\n\n**方法总结**：含参连续 \\= \"算极限 + 划等号\"。极限计算回到第一部分方法库。"},"3.2":{"id":"3.2","name":"间断点的判别与分类（左右极限定类思想）","part":"连续与一致连续","book":"一元微分","teachMd":"**核心思想**：间断点分类**只由左右极限的存在性决定**：\n\n| 类别     | 判据                                      | 典型例子                                             |\n| ------ | --------------------------------------- | ------------------------------------------------ |\n| 第一类·可去 | 左右极限存在且相等，但 $\\ne f(x_0)$ 或 $f(x_0)$ 无定义 | $\\dfrac{\\sin x}{x}$ 在 0                          |\n| 第一类·跳跃 | 左右极限存在但不相等                              | $\\operatorname{sgn} x$、$\\left[\\dfrac1x\\right]$ 型 |\n| 第二类·无穷 | 至少一侧极限为 $\\infty$                        | $\\dfrac1x$、$e^{1/x}$（在 $0^+$ 侧）                  |\n| 第二类·振荡 | 至少一侧极限不存在（振荡）                           | $\\sin\\dfrac1x$、$\\cos\\dfrac{2}{x}$                |\n\n**操作流程**：\n\n1. **找嫌疑点**：无定义的点（分母为零、$\\ln$ 的零点、分段点）；\n2. **算左右极限**（分开侧！含 $e^{1/x}$、$\\arctan\\frac1x$ 时两侧天差地别）；\n3. **按表归类**。\n\n**高频对比组**（值得整块记忆）：\n\n| 函数                                            | $x = 0$ 处性态         |\n| --------------------------------------------- | ------------------- |\n| $\\sin\\dfrac1x$                                | 第二类（振荡，有界）          |\n| $x\\sin\\dfrac1x$                               | 可去（极限 0，补充定义后连续）    |\n| $x^2\\sin\\dfrac1x$                             | 可去且补充后**可导**（见 4.1） |\n| $\\dfrac1x\\sin\\dfrac1x$、$\\dfrac{\\sin(1/x)}{x}$ | 第二类（无界振荡）           |","examplesMd":"**【例 3.2-1】（★★）** 求 $f(x) = \\dfrac{x^2 - 1}{x^2 - 3x + 2}$ 的间断点并分类。\n\n**详细解答**：分母 $x^2 - 3x + 2 = (x-1)(x-2)$，嫌疑点 $x = 1, 2$。\n\n**$x = 1$**：约去非零因子（$x \\to 1$ 时 $x - 1 \\to 0$ 但分子也有该因子）：\n\n$\\lim_{x\\to1}\\dfrac{(x-1)(x+1)}{(x-1)(x-2)} = \\lim_{x\\to1}\\dfrac{x+1}{x-2} = \\dfrac{2}{-1} = -2$\n\n左右极限存在且相等 $= -2 \\ne f(1)$（无定义），**可去间断点**（补充 $f(1) = -2$ 即连续）。\n\n**$x = 2$**：分子 $\\to 3 \\ne 0$，分母 $\\to 0$，$\\lim_{x\\to2}\\dfrac{3}{(x-1)(x-2)} = \\infty$，**无穷间断点**（第二类）。\n\n**方法总结**：因式分解后\"**零因子可约 → 可去；不可约（分子非零）→ 无穷**\"。\n\n**【例 3.2-2】（★★，振荡对照）** 讨论下列函数在 $x=0$ 处的间断类型：(1) $\\dfrac{\\sin(1/x)}{x}$；(2) $x\\sin\\dfrac1x$；(3) $\\cos\\dfrac{2}{x}$。\n\n**详细解答**：\n\n(1) 取 $x_n = \\dfrac{1}{2n\\pi + \\pi/2} \\to 0$：函数值 $= \\left(2n\\pi + \\tfrac\\pi2\\right)\\cdot 1 \\to +\\infty$；取 $y_n = \\dfrac{1}{n\\pi}$：值 $= 0$。**无界振荡，第二类间断**。\n\n(2) $\\lvert x\\sin\\frac1x\\rvert \\le \\lvert x\\rvert \\to 0$（夹逼），极限存在 $= 0$，函数在 0 无定义 → **可去间断**。\n\n(3) 取 $x_n = \\dfrac{1}{n\\pi}$：$\\cos 2n\\pi = 1$；取 $y_n = \\dfrac{1}{2n\\pi + \\pi/4}$：$\\cos\\left(\\tfrac\\pi2\\right) = 0$。两个子列极限不同（$1$ 与 $0$），振荡无极限 → **第二类间断**（有界振荡）。\n\n**方法总结**：振荡型判据——**找两个子列，函数值趋向不同**（有界振荡）或无界（无界振荡）。(1) 与 (3) 的区别在\"振幅是否被压制\"。"},"3.3":{"id":"3.3","name":"闭区间上连续函数的性质（零点·介值定理性思想）","part":"连续与一致连续","book":"一元微分","teachMd":"**核心思想**：闭区间 + 连续 \\= \"值域充满\"与\"最值可达\"：\n\n| 定理       | 内容                                                 | 用途          |\n| -------- | -------------------------------------------------- | ----------- |\n| 有界性      | $f \\in C[a,b] \\Rightarrow f$ 有界                    | 存在性铺垫       |\n| 最值定理     | 最值可取到（$\\exists x_{\\min}, x_{\\max}$）                | 费马引理配套（5.7） |\n| **零点定理** | $f(a)f(b) < 0 \\Rightarrow \\exists\\xi,\\ f(\\xi) = 0$ | 证方程有根       |\n| **介值定理** | $f$ 取遍 $[m, M]$ 间一切值                               | 证某值被取到      |\n\n**应用套路**：\n\n1. **方程根存在**：把方程改写为 $F(x) = 0$（移项构造辅助函数），找两个点使 $F$ 异号；\n2. **根的个数**：零点定理给\"至少\"，**单调性给\"至多**\"（$F' > 0$ 或 $F' < 0$），两者夹出\"恰好\"；\n3. **\"取到某个值\"**：目标值 $\\mu$ 满足 $m \\le \\mu \\le M$ 即可（介值定理），或构造差函数 $g = f - (\\text{目标})$ 用零点定理；\n4. **对称/平移结构**（$f(x) = f(x + c)$ 型）：构造差函数 $g(x) = f(x) - f(x+c)$，用\"$g$ 两端点值互为相反数 → 有零点\"。\n\n**易错警示**：闭区间与连续两个条件缺一不可（反例：$\\dfrac1x$ 在 $(0,1)$ 无界；$D(x)$ 处处不满足介值性）。","examplesMd":"**【例 3.3-1】（★★）** 证明方程 $x^3 + x - 1 = 0$ 在 $(0, 1)$ 内恰有一个实根。\n\n**详细解答**：设 $F(x) = x^3 + x - 1$，连续。\n\n**存在性**：$F(0) = -1 < 0$，$F(1) = 1 > 0$，由零点定理存在 $\\xi \\in (0,1)$ 使 $F(\\xi) = 0$。\n\n**唯一性**：$F'(x) = 3x^2 + 1 > 0$，$F$ 严格递增，零点至多一个。\n\n两者合并：恰有一个实根，位于 $(0,1)$。$\\blacksquare$\n\n**方法总结**：**\"存在靠零点定理，唯一靠单调性\"** 是方程根问题的黄金组合。\n\n**【例 3.3-2】（★★★，经典构造）** 设 $f \\in C[0,1]$ 且 $f(0) = f(1)$。证明：存在 $\\xi \\in \\left[0, \\dfrac12\\right]$ 使 $f(\\xi) = f!\\left(\\xi + \\dfrac12\\right)$。\n\n**思路分析**：目标含两点函数值相等 → 构造差函数 $g(x) = f(x) - f\\left(x + \\frac12\\right)$，设法让 $g$ 在区间两端异号。\n\n**详细解答**：$g$ 在 $\\left[0, \\frac12\\right]$ 上连续，且\n\n$g(0) = f(0) - f!\\left(\\tfrac12\\right), \\qquad g!\\left(\\tfrac12\\right) = f!\\left(\\tfrac12\\right) - f(1) = f!\\left(\\tfrac12\\right) - f(0) = -g(0)$\n\n若 $g(0) = 0$，取 $\\xi = 0$ 即可；若 $g(0) \\ne 0$，则 $g(0)\\cdot g\\left(\\frac12\\right) = -g(0)^2 < 0$，由零点定理存在 $\\xi \\in \\left(0, \\frac12\\right)$ 使 $g(\\xi) = 0$，即 $f(\\xi) = f\\left(\\xi + \\frac12\\right)$。$\\blacksquare$\n\n**方法总结**：几何直观——\"环形周长 1 上有两条相距半周的点等高\"。**差函数端点值互为相反数**（$g(b) = -g(a)$）时零点必存在，这是构造题的高频落点。"},"3.4":{"id":"3.4","name":"一致连续（整体 δ 思想）","part":"连续与一致连续","book":"一元微分","teachMd":"**核心思想**：连续是**逐点**性质（$\\delta$ 可依赖点 $x_0$），一致连续是**整体**性质（$\\delta$ 只依赖 $\\varepsilon$）：\n\n$\\forall\\varepsilon > 0,\\ \\exists\\delta > 0,\\ \\forall x, y \\in I:\\ \\lvert x - y\\rvert < \\delta \\Rightarrow \\lvert f(x) - f(y)\\rvert < \\varepsilon$\n\n**否定式（证不一致连续的武器）**：存在 $\\varepsilon_0 > 0$ 及点列 $x_n, y_n \\in I$，$\\lvert x_n - y_n\\rvert \\to 0$ 但 $\\lvert f(x_n) - f(y_n)\\rvert \\ge \\varepsilon_0$。\n\n**判定工具箱**：\n\n| 工具                                                          | 结论                                             |\n| ----------------------------------------------------------- | ---------------------------------------------- |\n| Lipschitz 条件：$\\lvert f(x)-f(y)\\rvert \\le L\\lvert x-y\\rvert$ | $\\Rightarrow$ 一致连续                             |\n| 导数有界：$\\lvert f'\\rvert \\le M$                                | $\\Rightarrow$ Lipschitz（MVT）$\\Rightarrow$ 一致连续 |\n| **Cantor 定理**：$f \\in C[a,b]$（闭区间连续）                         | $\\Rightarrow$ 一致连续                             |\n| 定义区间开/无界时                                                   | Cantor 失效，需单独考察端点与无穷远处                         |\n\n**经典反例清单**（记住构造序列即可）：\n\n| 函数与区间                   | 一致连续？        | 证据序列                                                        |\n| ----------------------- | ------------ | ----------------------------------------------------------- |\n| $\\dfrac1x$，$(0,1)$      | ✗            | $x_n = \\frac1n,\\ y_n = \\frac{1}{n+1}$                       |\n| $x^2$，$[0,+\\infty)$     | ✗            | $x_n = n + \\frac1n,\\ y_n = n$                               |\n| $\\sqrt x$，$[0,+\\infty)$ | ✓            | $\\lvert\\sqrt x - \\sqrt y\\rvert \\le \\sqrt{\\lvert x-y\\rvert}$ |\n| $\\sin\\dfrac1x$，$(0,1)$  | ✗            | 见练 3.4-3                                                    |\n| $\\sin x^2$，$\\mathbb{R}$ | ✗（有界但不一致连续！） | 见练 3.4-1                                                    |\n\n**核心直觉**：不一致连续的根源是**导数无界**（$x^2$、$\\frac1x$）或**无穷远处振荡加速**（$\\sin x^2$）。","examplesMd":"**【例 3.4-1】（★★）** 证明 $f(x) = \\dfrac1x$ 在 $(0, 1)$ 内不一致连续。\n\n**详细解答**：取 $x_n = \\dfrac1n$，$y_n = \\dfrac{1}{n+1}$，则\n\n$\\lvert x_n - y_n\\rvert = \\dfrac{1}{n(n+1)} \\to 0, \\qquad \\left\\lvert f(x_n) - f(y_n)\\right\\rvert = \\left\\lvert n - (n+1)\\right\\rvert = 1 \\ge \\varepsilon_0 := \\dfrac12$\n\n由否定式，$f$ 在 $(0,1)$ 不一致连续。$\\blacksquare$\n\n**方法总结**：**构造序列的诀窍**：在\"陡峭处\"取相邻两点——$\\frac1x$ 在 $0$ 附近陡，取 $\\frac1n$ 与 $\\frac1{n+1}$（横坐标差 $\\sim \\frac1{n^2}$，纵坐标差恒 1）。\n\n**【例 3.4-2】（★★★，一正一反经典对照）** (1) 证明 $f(x) = \\sqrt x$ 在 $[0, +\\infty)$ 上一致连续；(2) 证明 $g(x) = x^2$ 在 $[0, +\\infty)$ 上不一致连续。\n\n**详细解答**：\n\n(1) 对 $0 \\le y \\le x$：\n\n$(\\sqrt x - \\sqrt y)^2 = x + y - 2\\sqrt{xy} \\le x + y - 2y = x - y$\n\n（用了 $y = \\sqrt y\\cdot\\sqrt y \\le \\sqrt{xy}$，因 $y \\le x$。）两边开方：\n\n$\\lvert\\sqrt x - \\sqrt y\\rvert \\le \\sqrt{\\lvert x - y\\rvert}$\n\n任给 $\\varepsilon > 0$，取 $\\delta = \\varepsilon^2$：$\\lvert x - y\\rvert < \\delta \\Rightarrow \\lvert\\sqrt x - \\sqrt y\\rvert < \\varepsilon$。一致连续 ✓。（注意：$f' = \\frac{1}{2\\sqrt x}$ 在 0 处无界——**导数无界不一定不一致连续**，本例是分界线案例。）\n\n(2) 取 $x_n = n + \\dfrac1n$，$y_n = n$：\n\n$\\lvert x_n - y_n\\rvert = \\dfrac1n \\to 0, \\qquad \\lvert x_n^2 - y_n^2\\rvert = \\left(n+\\dfrac1n\\right)^2 - n^2 = 2 + \\dfrac{1}{n^2} \\to 2$\n\n两序列横坐标差趋于 0 而纵坐标差 $\\to 2 \\ge \\varepsilon_0 = 1$，不一致连续。$\\blacksquare$\n\n**方法总结**：(1) 的不等式 $\\lvert\\sqrt x - \\sqrt y\\rvert \\le \\sqrt{\\lvert x - y\\rvert}$ 是\"开方压缩\"；说明 Cantor 定理之外还有**代数不等式**这条路。(2) 的构造在\"无穷远处\"取点——闭区间上它由 Cantor 保证一致连续，**无穷远才是它的病灶**。"},"4.1":{"id":"4.1","name":"导数定义判定可导性（左右导数分侧思想）","part":"可导与微分","book":"一元微分","teachMd":"**核心思想**：可导性判定**永远回到定义**：\n\n$f'(x_0)\\ \\text{存在} \\iff f'_-(x_0) = \\lim_{h\\to0^-}\\dfrac{f(x_0+h) - f(x_0)}{h}\\ \\text{与}\\ f'_+(x_0)\\ \\text{都存在且相等}$\n\n**必考情形与结论**：\n\n| 情形                                     | 结论（$x_0$ 为\"折点\"）                                                                              |\n| -------------------------------------- | -------------------------------------------------------------------------------------------- |\n| 分段函数衔接点                                | 分别求左右导数（**用定义**，不能对两侧公式直接求导取极限）                                                              |\n| $\\lvert x - x_0\\rvert$ 乘光滑因子 $\\varphi$ | 看 $\\varphi(x_0)$：若 $\\varphi(x_0) = 0$ 则折点被\"抹平\"，可导；否则左导 $= -\\varphi(x_0)$，右导 $= \\varphi(x_0)$ |\n| 振荡因子：$x^n\\sin\\frac1x$ 型                | $n \\ge 2$ 可导；$n = 1$ 连续不可导；导函数在 0 连续需 $n \\ge 3$                                              |\n| 极值点 + 可导                               | 费马引理：导数必为 0（5.7）                                                                             |\n\n**\"名人堂\"函数**（必须烂熟于心）：\n\n| 函数                                                                   | 在 $x=0$ 处                  | 意义             |\n| -------------------------------------------------------------------- | -------------------------- | -------------- |\n| $\\lvert x\\rvert$                                                     | 连续不可导                      | 最简折点           |\n| $x\\lvert x\\rvert = \\begin{cases}x^2 & x\\ge0\\\\ -x^2 & x<0\\end{cases}$ | 可导（$f' = 2\\lvert x\\rvert$） | 折点被光滑化         |\n| $x\\sin\\dfrac1x$                                                      | 连续不可导                      | 振荡、可去间断被压住     |\n| $x^2\\sin\\dfrac1x$                                                    | 可导但 $f'$ 在 0 不连续           | **可导 ⇏ 导函数连续** |\n| $x^2D(x)$（Dirichlet）                                                 | 可导（$f'(0)=0$），其余点不连续       | 病态集大成者         |\n\n**易错警示**：分段点求导时，**先验证连续**（不连续必不可导——\"可导必连续\"的逆否），再分别求左右导数；左右导数用**定义算差商**，不是\"左右两侧导函数的极限\"（后者是另一概念，见 4.3）。","examplesMd":"**【例 4.1-1】（★★★，最重要例子）** 设 $f(x) = \\begin{cases} x^2\\sin\\dfrac1x, & x \\ne 0 \\\\ 0, & x = 0\\end{cases}$。求 $f'(x)$，讨论 $f'$ 在 $x = 0$ 处的连续性。\n\n**详细解答**：\n\n**$x \\ne 0$**：求导法则（乘积 + 链式）：\n\n$f'(x) = 2x\\sin\\dfrac1x + x^2\\cos\\dfrac1x\\cdot\\left(-\\dfrac1{x^2}\\right) = 2x\\sin\\dfrac1x - \\cos\\dfrac1x$\n\n**$x = 0$**：只能用定义：\n\n$f'(0) = \\lim_{h\\to0}\\dfrac{h^2\\sin\\frac1h - 0}{h} = \\lim_{h\\to0}h\\sin\\dfrac1h = 0 \\quad (\\text{无穷小}\\times\\text{有界})$\n\n故 $f'(0) = 0$ 存在。\n\n**$f'$ 在 0 的连续性**：考察 $\\lim_{x\\to0}f'(x) = \\lim_{x\\to0}\\left(2x\\sin\\frac1x - \\cos\\frac1x\\right)$。第一项 $\\to 0$；第二项沿 $x_n = \\dfrac{1}{2n\\pi}$ 值为 $-1$、沿 $y_n = \\dfrac{1}{2n\\pi + \\pi/2}$ 值为 $0$，极限不存在。故 $f'$ 在 $x = 0$ 处**不连续**（第二类振荡间断）。\n\n**方法总结**：本例一箭三雕：① 分段点用定义；② \"可导但导函数不连续\"的标准反例；③ 顺带验证了 Darboux 定理（4.6）——$f'$ 虽不连续但有介值性。\n\n**【例 4.1-2】（★★，含参衔接）** 设 $f(x) = \\begin{cases} x^2, & x \\le 1 \\\\ ax + b, & x > 1\\end{cases}$。求 $a, b$ 使 $f$ 在 $x = 1$ 可导。\n\n**详细解答**：可导 $\\Rightarrow$ 连续先行：\n\n$\\lim_{x\\to1^-}f = 1, \\qquad f(1) = 1, \\qquad \\lim_{x\\to1^+}f = a + b \\implies a + b = 1$\n\n左右导数（定义）：\n\n$f'_-(1) = \\lim_{h\\to0^-}\\dfrac{(1+h)^2 - 1}{h} = \\lim_{h\\to0^-}(2 + h) = 2; \\qquad f'_+(1) = \\lim_{h\\to0^+}\\dfrac{a(1+h) + b - 1}{h} = \\lim_{h\\to0^+}\\dfrac{ah + (a + b - 1)}{h} = a$\n\n（用到 $a + b - 1 = 0$。）可导要求 $a = 2$，从而 $b = -1$。\n\n**方法总结**：两个参数两个条件：**连续一个 + 导数相等一个**。$f'_+(1) = a$ 恰是右侧直线的斜率——衔接光滑即\"切线合一\"。"},"4.2":{"id":"4.2","name":"用导数定义求导数与极限（定义即公式思想）","part":"可导与微分","book":"一元微分","teachMd":"**核心思想**：导数定义不仅是判可导的武器，也是**计算工具**。两类场景：\n\n1. **抽象/极限式给出的函数**：$f(x) = (\\text{含极限的结构})$、$f(x) = u(x)v(x)$ 其中只知 $v$ 连续——求 $f'(x_0)$ 时**把定义与等价无穷小结合**：\n   $f'(x_0) = \\lim_{h\\to0}\\dfrac{f(x_0+h) - f(x_0)}{h} = \\lim_{h\\to0}\\dfrac{f(x_0+h)-f(x_0)}{\\varphi(h)}\\cdot\\dfrac{\\varphi(h)}{h}$\n   其中 $\\varphi(h) \\to 0$ 与 $h$ 同阶（如 $\\varphi(h) = e^h - 1$、$\\sin h$、$\\ln(1+h)$）——**\"分母可以换成任何等价无穷小\"**。\n\n2. **具体函数在特殊点**：如 $f(x) = \\prod(x - k)$ 在零点 $x = 0$ 处，用定义一次约去零因子：\n   $f'(0) = \\lim_{x\\to0}\\dfrac{f(x) - f(0)}{x} = \\lim_{x\\to0}(\\text{其余因子}) = \\text{其余因子在 } 0\\text{ 的乘积}$\n\n**适用信号**：\"仅知 $\\varphi$ 连续，求 $(\\varphi\\cdot\\text{已知函数})'$\"；\"求 $f'(0)$ 而 $f$ 是多因子乘积\"；\"求 $\\lim_{x\\to x_0}\\dfrac{f(x) - f(x_0)}{\\psi(x)}$\"（分母不是 $x - x_0$）。","examplesMd":"**【例 4.2-1】（★★，巧算）** 设 $f(x) = x(x-1)(x-2)\\cdots(x-2026)$，求 $f'(0)$。\n\n**详细解答**：用定义（$f(0) = 0$）：\n\n$f'(0) = \\lim_{x\\to0}\\dfrac{f(x)}{x} = \\lim_{x\\to0}(x-1)(x-2)\\cdots(x-2026) = (-1)(-2)\\cdots(-2026)$\n\n$2026$ 个负数相乘，符号为 $( -1)^{2026} = +1$，故\n\n$f'(0) = 2026!$\n\n**方法总结**：零因子用定义**一次性约掉**，比乘积法则展开快得多。同型：$f(x) = x(x+1)(x+2)\\cdots$ 在 $x = -3$ 处的导数（把 $x + 3$ 因子提出来作分母）。\n\n**【例 4.2-2】（★★★，抽象函数 + 等价替换）** 设 $\\varphi$ 在 $x = 0$ 处连续且 $\\varphi(0) = 5$，$f(x) = (e^x - 1)\\varphi(x)$。求 $f'(0)$。\n\n**思路分析**：$\\varphi$ 只有连续性，不能对 $\\varphi$ 求导 $\\Rightarrow$ 乘积法则失效，只能用定义；同时用 $e^h - 1 \\sim h$ 替换分母。\n\n**详细解答**：\n\n$f'(0) = \\lim_{h\\to0}\\dfrac{(e^h - 1)\\varphi(h) - 0}{h} = \\lim_{h\\to0}\\dfrac{e^h - 1}{h}\\cdot\\varphi(h) = 1 \\times \\varphi(0) = 5$\n\n（$\\varphi(h) \\to \\varphi(0)$ 用连续性；$\\frac{e^h-1}{h} \\to 1$。）故 $f'(0) = 5$。\n\n**方法总结**：**\"把可求导的部分吸进差商，不可导的部分靠连续性送极限\"**。凡是\"已知 $\\varphi$ 连续 + $\\varphi$ 乘一个 $x_0$ 处为 0 的光滑函数\"结构，导数值 = 光滑因子导数值 $\\times\\ \\varphi(x_0)$。"},"4.3":{"id":"4.3","name":"连续、可导、可微的关系（概念辨析思想）","part":"可导与微分","book":"一元微分","teachMd":"**核心关系链**（一元情形）：\n\n$\\boxed{\\text{可微} \\iff \\text{可导} \\implies \\text{连续}}$\n\n一元函数\"可微 \\= 可导\"（$dy = f'(x_0),dx$），这是**一元独有的红利**，多元不再成立。\n\n**常见逆命题全部为假**，反例速查：\n\n| 命题                                     | 真/假           | 反例                                                                |\n| -------------------------------------- | ------------- | ----------------------------------------------------------------- |\n| 可导 $\\Rightarrow$ 连续                    | 真             | （定理）                                                              |\n| 连续 $\\Rightarrow$ 可导                    | 假             | $\\lvert x\\rvert$ 在 0                                              |\n| 可导 $\\Rightarrow f'$ 连续                 | 假             | $x^2\\sin\\frac1x$                                                  |\n| $f'$ 极限存在 $\\Rightarrow$ 可导且相等          | **真**（导数极限定理） | 见例 4.3-1                                                          |\n| $\\lvert f\\rvert$ 可导 $\\Rightarrow f$ 可导 | 假             | $f = -\\lvert x\\rvert$ 在 0：$\\lvert f\\rvert = \\lvert x\\rvert$? 注意方向 |\n\n**导数极限定理**（单向桥梁，衔接\"表达式求导\"与\"定义求导\"）：\n\n> 若 $f$ 在 $x_0$ 连续，在去心邻域可导，且 $\\lim_{x\\to x_0}f'(x) = A$ 存在，则 $f'(x_0) = A$。\n\n**微分的计算**：$dy = f'(x)dx$；**近似计算**：$f(x_0 + \\Delta x) \\approx f(x_0) + f'(x_0)\\Delta x$，误差用二阶导（泰勒）估计。\n\n**适用信号**：判断题/概念多选题；分段点可导性（\"导函数极限存在则直接下结论\"）；近似计算填空。","examplesMd":"**【例 4.3-1】（★★★，导数极限定理及其证明）** 设 $f$ 在 $x_0$ 处连续，在某去心邻域内可导，且 $\\lim_{x\\to x_0}f'(x) = A$。证明 $f$ 在 $x_0$ 可导且 $f'(x_0) = A$。\n\n**详细解答**：考察差商（$0/0$ 型，分子连续趋于 $f(x_0)$，分母 $\\to 0$）：\n\n$\\dfrac{f(x) - f(x_0)}{x - x_0} \\xrightarrow{\\ \\text{洛必达}\\ } \\lim_{x\\to x_0}f'(x) = A$\n\n洛必达合法性：分子分母都可导、都趋于 0（分子用 $f$ 在 $x_0$ 连续）、导数比极限存在。故 $f'(x_0) = \\lim_{x\\to x_0}\\dfrac{f(x)-f(x_0)}{x-x_0} = A$。$\\blacksquare$\n\n**应用示例**：$f(x) = \\begin{cases}x^2, & x \\le 1\\\\ ax + b, & x > 1\\end{cases}$ 型问题中，若已由连续性定出 $a + b = 1$，再要求可导，本定理允许用 $\\lim_{x\\to1^-}2x = 2$ 与 $\\lim_{x\\to1^+}a$ 相等直接得 $a = 2$——**避免重算差商**（例 4.1-2 的另一解法）。\n\n**注意**：定理要求\"$f$ 在 $x_0$ **连续**\"为前提！反例：$f(x) = \\operatorname{sgn}x$，$f'(x) = 0$（$x \\ne 0$），$\\lim f' = 0$，但 $f$ 在 0 不连续故不可导，$f'(0) \\ne 0$。\n\n**【例 4.3-2】（★★，辨析：单侧导数 vs 导函数单侧极限）** 举反例说明：\"$f'_+(x_0)$ 存在\"与\"$\\lim_{x\\to x_0^+}f'(x)$ 存在\"互不蕴含。\n\n**详细解答**：\n\n**方向一：单侧导数存在，导函数单侧极限不存在**。取 $f(x) = \\begin{cases}x^2\\sin\\dfrac1x, & x\\ne0\\\\ 0,& x=0\\end{cases}$（例 4.1-1）。则 $f'_+(0) = \\lim_{h\\to0^+}h\\sin\\frac1h = 0$ 存在；但 $x > 0$ 时 $f'(x) = 2x\\sin\\frac1x - \\cos\\frac1x$，沿 $x_n = \\dfrac{1}{2n\\pi}$ 值 $\\to -1$、沿 $y_n = \\dfrac{1}{2n\\pi+\\pi/2}$ 值 $\\to 0$，右极限不存在。\n\n**方向二：导函数单侧极限存在，单侧导数不存在**。取 $f(x) = \\begin{cases}\\arctan\\dfrac1x, & x \\ne 0\\\\ 0, & x = 0\\end{cases}$。则 $x \\ne 0$ 时\n\n$f'(x) = \\dfrac{-\\frac{1}{x^2}}{1 + \\frac{1}{x^2}} = \\dfrac{-1}{1 + x^2} \\to -1 \\quad (x \\to 0,\\ \\text{双侧皆然})$\n\n但 $f$ 在 $0$ 处不连续（右极限 $\\frac\\pi2 \\ne f(0)$），当然不可导；直接看右差商：$\\dfra
