c{\\arctan\\frac1h - 0}{h} \\to +\\infty$，$f'_+(0)$ 不存在。\n\n**方法总结**：两个量\"互不蕴含\"，沟通它们的正是**导数极限定理——需要补上\"$f$ 在 $x_0$ 连续\"这座桥**：连续 + $\\lim f' = A$ $\\Rightarrow$ $f'(x_0) = A$。方向二的反例恰好通过破坏连续性击穿定理，同时说明定理条件缺一不可。含 $\\arctan\\frac1x$、$e^{1/x}$ 的分段函数就是为\"单侧行为分裂\"而生的零件。"},"4.4":{"id":"4.4","name":"各类求导法则综合（结构识别思想）","part":"可导与微分","book":"一元微分","teachMd":"**核心思想**：拿到 $y = y(x)$，先**识别结构**再选法则：\n\n| 结构                       | 法则                                      | 关键公式                                                                        |\n| ------------------------ | --------------------------------------- | --------------------------------------------------------------------------- |\n| 幂指 $u^v$、多因子积/商          | **对数求导**：$\\ln y = v\\ln u$，两边求导          | $\\dfrac{y'}{y} = (\\ln y)'$                                                  |\n| 隐函数 $F(x,y) = 0$         | 两边对 $x$ 求导，$y$ 视为 $y(x)$（链式带 $y'$）      | $y' = -\\dfrac{F_x}{F_y}$                                                    |\n| 参数式 $x = x(t), y = y(t)$ | $\\dfrac{dy}{dx} = \\dfrac{y'(t)}{x'(t)}$ | $\\dfrac{d^2y}{dx^2} = \\dfrac{\\left(y'/x'\\right)'_t}{x'(t)}$（**除以 $x'$ 别忘**） |\n| 反函数 $x = x(y)$           | $x'(y) = \\dfrac{1}{y'(x)}$              | $x''(y) = -\\dfrac{y''}{(y')^3}$                                             |\n| 抽象复合 $f(u(x))$           | 链式，逐层剥                                  | $[f(u(x))]' = f'(u)u'(x)$                                                   |\n\n**易错警示**：\n\n| 错误                                | 纠正                                                                       |\n| --------------------------------- | ------------------------------------------------------------------------ |\n| 参数式二阶导写成 $\\dfrac{y''(t)}{x''(t)}$ | $\\dfrac{d^2y}{dx^2} = \\dfrac{d}{dt}!\\left(\\dfrac{y'}{x'}\\right)\\Big/ x'$ |\n| 隐函数求导后不代点求 $y'$ 的具体值              | 先代点（$x$、$y$ 值）再解 $y'$，避免求 $y''$ 时代数爆炸                                    |\n| $u^v$ 直接 $(u^v)' = v u^{v-1}$     | 错！必须 e 化或对数求导                                                            |","examplesMd":"**【例 4.4-1】（★★，隐函数）** 求星形线 $x^{2/3} + y^{2/3} = a^{2/3}$（$a > 0$）上任一点处的 $\\dfrac{dy}{dx}$。\n\n**详细解答**：两边对 $x$ 求导（$y = y(x)$）：\n\n$\\dfrac23 x^{-1/3} + \\dfrac23 y^{-1/3}y' = 0 \\implies y' = -\\dfrac{x^{-1/3}}{y^{-1/3}} = -\\left(\\dfrac{y}{x}\\right)^{1/3}$\n\n（要求 $xy \\ne 0$；四个尖点处切线竖直，不可导。）\n\n**方法总结**：隐函数求导口诀：**\"对 x 求导，见 y 带 y'\"**。结果中允许保留 $y$（代点时再把 $(x,y)$ 代入）。\n\n**【例 4.4-2】（★★，参数式）** 摆线 $x = a(t - \\sin t)$，$y = a(1 - \\cos t)$。求 $y'$、$y''$（用 $t$ 表示）。\n\n**详细解答**：\n\n$\\dfrac{dx}{dt} = a(1 - \\cos t), \\qquad \\dfrac{dy}{dt} = a\\sin t$\n\n$y' = \\dfrac{dy/dt}{dx/dt} = \\dfrac{\\sin t}{1 - \\cos t} = \\dfrac{2\\sin\\frac t2\\cos\\frac t2}{2\\sin^2\\frac t2} = \\cot\\dfrac t2$\n\n二阶导（**对 $t$ 再求导后除以 $x'$**）：\n\n$y'' = \\dfrac{\\dfrac{d}{dt}\\left(\\cot\\frac t2\\right)}{a(1-\\cos t)} = \\dfrac{-\\frac12\\csc^2\\frac t2}{2a\\sin^2\\frac t2} = -\\dfrac{1}{4a\\sin^4\\frac t2}$\n\n**方法总结**：$\\dfrac{dy}{dx}$ 是 $t$ 的函数，**继续对 $x$ 求导 = 对 $t$ 求导再除以 $\\frac{dx}{dt}$**。半角化简 $\\sin t = 2\\sin\\frac t2\\cos\\frac t2$、$1 - \\cos t = 2\\sin^2\\frac t2$ 是摆线的标配动作。"},"4.5":{"id":"4.5","name":"高阶导数（归纳·莱布尼茨·泰勒系数三件套）","part":"可导与微分","book":"一元微分","teachMd":"**核心思想**：求 $y^{(n)}$ 有三条路，按结构选用：\n\n| 方法             | 适用结构                                      | 操作                                                            |\n| -------------- | ----------------------------------------- | ------------------------------------------------------------- |\n| **归纳递推**       | $x\\ln x$、$\\dfrac{e^x}{x}$ 等低次幂因子          | 先求 $y'$、$y''$，猜规律，数学归纳证明                                      |\n| **莱布尼茨公式**     | $(\\text{低次多项式})\\times(\\text{易求 n 阶导的函数})$ | $(uv)^{(n)} = \\sum_{k=0}^n C_n^k u^{(k)}v^{(n-k)}$；多项式只有有限项非零 |\n| **泰勒系数法（幂级数）** | 求 $f^{(n)}(x_0)$，特别是 $x_0 = 0$            | $f(x) = \\sum a_k(x-x_0)^k \\Rightarrow f^{(n)}(x_0) = n!,a_n$  |\n\n**预处理技巧（先变形再求导）**：\n\n1. 有理函数 → **部分分式**：$\\dfrac{1}{x^2-3x+2} = \\dfrac{1}{x-2} - \\dfrac{1}{x-1}$，套 $\\left(\\dfrac{1}{x-a}\\right)^{(n)} = \\dfrac{(-1)^n n!}{(x-a)^{n+1}}$；\n2. 三角降幂：$\\sin^2 x = \\dfrac{1-\\cos 2x}{2}$；\n3. 复数技巧：$e^x\\cos x = \\mathrm{Re},e^{(1+i)x}$，$e^{(1+i)x}$ 求导每乘一次 $(1+i) = \\sqrt2 e^{i\\pi/4}$。\n\n**必背基本公式**：\n\n$\\left(e^{ax}\\right)^{(n)} = a^ne^{ax},\\quad \\left(\\sin ax\\right)^{(n)} = a^n\\sin!\\left(ax + \\tfrac{n\\pi}2\\right),\\quad \\left(\\dfrac1{x-a}\\right)^{(n)} = \\dfrac{(-1)^nn!}{(x-a)^{n+1}},\\quad \\left(\\ln(1+x)\\right)^{(n)} = \\dfrac{(-1)^{n-1}(n-1)!}{(1+x)^n}$","examplesMd":"**【例 4.5-1】（★★，莱布尼茨）** 设 $y = x^2e^x$，求 $y^{(n)}$（$n \\ge 2$）。\n\n**详细解答**：取 $u = x^2$（三次求导后归零），$v = e^x$：\n\n$y^{(n)} = C_n^0 x^2e^x + C_n^1(2x)e^x + C_n^2(2)e^x = e^x\\left[x^2 + 2nx + n(n-1)\\right]$\n\n（$u' = 2x$，$u'' = 2$，$u^{(k)} = 0\\ (k\\ge3)$。）验证 $n = 2$：$y'' = e^x(x^2 + 4x + 2)$，直接求导 $y' = (x^2+2x)e^x$，$y'' = (2x+2)e^x + (x^2+2x)e^x = e^x(x^2+4x+2)$ ✓。\n\n**方法总结**：**\"低次多项式放前面，高阶导易求的放后面，三项封顶\"**。\n\n**【例 4.5-2】（★★，部分分式）** 设 $y = \\dfrac{1}{x^2 - 3x + 2}$，求 $y^{(n)}$。\n\n**详细解答**：分解：\n\n$\\dfrac{1}{(x-1)(x-2)} = \\dfrac{1}{x-2} - \\dfrac{1}{x-1}$\n\n套公式：\n\n$y^{(n)} = \\dfrac{(-1)^n n!}{(x-2)^{n+1}} - \\dfrac{(-1)^n n!}{(x-1)^{n+1}} = (-1)^n n!\\left[\\dfrac{1}{(x-2)^{n+1}} - \\dfrac{1}{(x-1)^{n+1}}\\right]$\n\n**方法总结**：**\"有理函数求高阶导，部分分式是第一步\"**。分母二次不可分解时（如 $x^2+1$）用三角/复数换元。"},"4.6":{"id":"4.6","name":"导函数的性质（Darboux 介值思想）","part":"可导与微分","book":"一元微分","teachMd":"**核心思想**：导函数**可以不连续，但一定具有介值性**——这是 Darboux 定理，被称为\"导数版介值定理\"：\n\n> **Darboux 定理**：设 $f$ 在 $[a,b]$ 上可导（端点单侧导数），则 $f'$ 取到介于 $f'(a)$ 与 $f'(b)$ 之间的**一切值**。\n\n**三大推论**：\n\n1. 若 $f'$ 在某点取正值、另一点取负值，则存在导数为零的点（ Rolle 的推广——不需要 $f$ 连续端点相等等条件）；\n2. $f'$ 在区间上**无第一类间断点**（跳跃、可去都不可能；间断只能是振荡型）；\n3. $f' \\ne 0$ 处处 $\\Rightarrow f'$ 定号 $\\Rightarrow f$ 严格单调。\n\n**适用信号**：题目涉及 $f'$ 的符号/零点但 $f'$ 不连续；\"导数不可能有跳跃间断点\"类概念题；由导数异号证函数有极值点。","examplesMd":"**【例 4.6-1】（★★★，Darboux 定理的证明）** 设 $f$ 在 $[a,b]$ 上可导，$f'(a) < c < f'(b)$。证明：存在 $\\xi \\in (a,b)$ 使 $f'(\\xi) = c$。\n\n**详细解答**：令 $g(x) = f(x) - cx$，则 $g$ 在 $[a,b]$ 上可导（故连续），且 $g'(a) = f'(a) - c < 0$，$g'(b) = f'(b) - c > 0$。\n\n**第一步：最小值不在端点**。由 $g'(a) < 0$（右导数），存在 $x_1 \\in (a, b)$ 使\n\n$\\dfrac{g(x_1) - g(a)}{x_1 - a} < 0 \\implies g(x_1) < g(a)$\n\n由 $g'(b) > 0$（左导数），存在 $x_2 \\in (a, b)$ 使 $\\dfrac{g(x_2) - g(b)}{x_2 - b} < 0$（分母为负）$\\implies g(x_2) < g(b)$。\n\n**第二步：内部最小值 + 费马引理**。$g$ 连续，在闭区间 $[a,b]$ 上取到最小值；由上，$a$、$b$ 都不是最小值点，故最小值点 $\\xi \\in (a,b)$。由费马引理（可导的极值点导数为零）：$g'(\\xi) = 0$，即 $f'(\\xi) = c$。$\\blacksquare$\n\n**方法总结**：证明骨架是\"**辅助函数 + 最值跑进内部 + 费马引理**\"——与罗尔定理的证明（5.1）同源，可对照记忆。\n\n**【例 4.6-2】（★★★）** 证明：导函数没有第一类间断点。即：若 $f$ 在 $x_0$ 的邻域内可导（含 $x_0$），且 $\\lim_{x\\to x_0}f'(x)$ 存在，则 $f'$ 在 $x_0$ 连续（极限必等于 $f'(x_0)$）。\n\n**详细解答**：对 $x < x_0$（$f$ 在 $[x, x_0]$ 上连续、$(x, x_0)$ 内可导），由拉格朗日中值定理（5.2），存在 $\\xi(x) \\in (x, x_0)$ 使\n\n$\\dfrac{f(x) - f(x_0)}{x - x_0} = f'(\\xi(x))$\n\n令 $x \\to x_0^-$，则 $\\xi(x) \\to x_0^-$，由条件 $\\lim_{x\\to x_0}f'(x) = A$：\n\n$f'_-(x_0) = \\lim_{x\\to x_0^-}\\dfrac{f(x)-f(x_0)}{x-x_0} = \\lim_{x\\to x_0^-}f'(\\xi(x)) = A$\n\n同理 $f'_+(x_0) = A$。而 $f$ 在 $x_0$ 可导，左右导数都等于 $f'(x_0)$，故\n\n$\\lim_{x\\to x_0}f'(x) = A = f'(x_0)$\n\n即 $f'$ 在 $x_0$ 连续。**因此导函数若有间断，只能是左右极限不存在的第二类间断（振荡型）**。$\\blacksquare$\n\n**方法总结**：证明工具是\"差商 \\= 中值点的导数\"（拉格朗日公式移项），这正是**导数极限定理**（例 4.3-1）的中值式证法，比洛必达证法更本质。"},"5.1":{"id":"5.1","name":"罗尔定理与辅助函数构造（乘因子化归思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**罗尔定理**：$f \\in C[a,b]$、在 $(a,b)$ 可导、$f(a) = f(b)$ $\\Rightarrow$ $\\exists\\xi\\in(a,b): f'(\\xi) = 0$。\n\n**核心思想**：要证\"$\\exists\\xi: H(\\xi, f(\\xi), f'(\\xi)) = 0$\"，设法找到 $F(x)$ 使 $F' = \\mu(x)\\cdot H$（$\\mu \\ne 0$ 的因子不影响零点），且 $F$ 在端点等值，对 $F$ 用罗尔。\n\n**构造四法（按使用频率）**：\n\n| 方法                        | 目标结论形态                   | 辅助函数                                                    |\n| ------------------------- | ------------------------ | ------------------------------------------------------- |\n| **① 乘 $e^{G}$ 因子（微分方程法）** | $f' + \\varphi(x)f = 0$ 型 | $F = f,e^{\\int\\varphi}$：常见 $e^x, e^{x^2}, e^{-x}$       |\n| **② 乘多项式因子**              | $x f' + k f = 0$ 型       | $F = x^kf$（$k=1$：$F=xf$；$f'=\\dfrac{f}{x}$ 型用 $F = f/x$） |\n| **③ 商型（Wronski 式）**       | $f'g - fg' = 0$ 型        | $F = \\dfrac fg$                                         |\n| **④ 待定指数/常数配凑**           | 端点值不相等但成比例               | 先设 $F = e^{\\lambda x}f(x)$，用端点条件定 $\\lambda$             |\n\n**构造流程（微分方程反推法，万能起手）**：\n\n1. 把结论中的 $\\xi$ 换成 $x$，写成微分方程 $f' + \\varphi(x)f = \\psi(x)$；\n2. 解出积分因子 $\\mu(x) = e^{\\int\\varphi}$；\n3. $F = \\mu\\cdot(f - \\text{特解相关项})$，验证 $F$ 端点等值（不等则调整常数/加修正项）。\n\n**易错警示**：构造完必须**逐一验证罗尔三条件**（闭连续、开可导、端点等值），缺一不可；$\\mu(x)$ 在区间上不得为零（如 $F = f/x$ 需区间不含 0，即 $ab > 0$）。","examplesMd":"**【例 5.1-1】（★★，最基本构造）** 设 $f \\in C[a,b]$，在 $(a,b)$ 内可导，且 $f(a) = f(b) = 0$。证明：存在 $\\xi \\in (a,b)$ 使 $f'(\\xi) + f(\\xi) = 0$。\n\n**思路分析**：目标 $f' + f = 0$ 是ODE $f' = -f$，其解 $f = Ce^{-x}$，所以 $e^xf$ 是常数——构造 $F(x) = e^xf(x)$。\n\n**详细解答**：令 $F(x) = e^xf(x)$。$F$ 在 $[a,b]$ 连续、$(a,b)$ 可导，且\n\n$F(a) = e^af(a) = 0, \\qquad F(b) = e^bf(b) = 0$\n\n由罗尔定理，存在 $\\xi \\in (a,b)$ 使 $F'(\\xi) = 0$。而\n\n$F'(x) = e^x\\left(f'(x) + f(x)\\right)$\n\n$e^\\xi \\ne 0$，故 $f'(\\xi) + f(\\xi) = 0$。$\\blacksquare$\n\n**方法总结**：**\"看到 $f' + \\varphi f$，就乘 $e^{\\int\\varphi}$\"**。$\\varphi = 1$ 乘 $e^x$，$\\varphi = 2x$ 乘 $e^{x^2}$，$\\varphi = -1$ 乘 $e^{-x}$。\n\n**【例 5.1-2】（★★）** 设 $f \\in C[0,1]$，在 $(0,1)$ 内可导，$f(0) = f(1) = 0$。证明：存在 $\\xi \\in (0,1)$ 使 $\\xi f'(\\xi) + f(\\xi) = 0$。\n\n**思路分析**：目标 $\\xi f' + f = 0$。把 $\\xi$ 换成 $x$：$xf'(x) + f(x) = (xf(x))'$——构造 $F = xf$。\n\n**详细解答**：令 $F(x) = xf(x)$。$F$ 在 $[0,1]$ 连续、$(0,1)$ 可导，$F(0) = 0$，$F(1) = f(1) = 0$。由罗尔定理存在 $\\xi \\in (0,1)$ 使\n\n$F'(\\xi) = \\xi f'(\\xi) + f(\\xi) = 0 \\qquad \\blacksquare$\n\n**方法总结**：ODE 视角：$xf' + f = 0 \\iff (xf)' = 0$，通解 $xf = C$。**\"乘 $x$\"与\"乘 $x$ 的幂\"是最廉价的积分因子**。"},"5.2":{"id":"5.2","name":"拉格朗日中值定理与双中值问题（增量转导数思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**拉格朗日中值定理**：$f \\in C[a,b]$、$(a,b)$ 可导 $\\Rightarrow$\n\n$\\exists\\xi\\in(a,b):\\qquad f(b) - f(a) = f'(\\xi)(b - a)$\n\n**两大用途**：\n\n1. **不等式**：对 $\\lvert f'\\rvert$ 的上界估计（$M$）得 $\\lvert f(b) - f(a)\\rvert \\le M\\lvert b-a\\rvert$（Lipschitz 型）；\n2. **等式/极限**：把增量比换成某点导数。\n\n**双中值问题（CMC 高频）**：要证存在**两个不同**的点 $\\xi \\ne \\eta$ 满足某关系，标准动作是**区间分段**：\n\n> 取分点 $c$（常取中点 $c = \\frac{a+b}2$），在 $[a,c]$ 与 $[c,b]$ 上分别用中值定理，得 $\\xi\\in(a,c)$、$\\eta\\in(c,b)$，**自动不同**；再把两式按结论需要的方向组合（相加、相乘、相比）。\n\n**适用信号**：结论含两个中值点；结论是 $\\lvert f(x) - f(y)\\rvert \\le \\cdots$ 型不等式；\"至少存在一点\"型且端点无相等可用（罗尔用不上）。","examplesMd":"**【例 5.2-1】（★）** 证明：对任意实数 $a, b$，$\\lvert\\sin a - \\sin b\\rvert \\le \\lvert a - b\\rvert$。\n\n**详细解答**：若 $a = b$ 显然。设 $a < b$，$f(x) = \\sin x$ 在 $[a,b]$ 上满足拉格朗日条件，存在 $\\xi\\in(a,b)$：\n\n$\\sin b - \\sin a = \\cos\\xi,(b - a)$\n\n两边取绝对值，$\\lvert\\cos\\xi\\rvert \\le 1$：\n\n$\\lvert\\sin b - \\sin a\\rvert \\le \\lvert b - a\\rvert \\qquad \\blacksquare$\n\n**方法总结**：**\"导数有界 ⇒ 增量受控\"**。同类一秒出答案：$\\lvert\\arctan a - \\arctan b\\rvert \\le \\lvert a-b\\rvert$（$f' = \\frac1{1+x^2} \\le 1$）、$\\lvert\\ln(1+x) - \\ln(1+y)\\rvert \\le \\lvert x - y\\rvert$（$x,y > -1$）。\n\n**【例 5.2-2】（★★★，双中值入门）** 设 $f \\in C[a,b]$，$(a,b)$ 内可导，且 $f(a) = f(b)$。证明：存在不同的 $\\xi, \\eta \\in (a,b)$，使 $f'(\\xi) + f'(\\eta) = 0$。\n\n**思路分析**：一个罗尔只能给一个点；要两个点，**取中点分段**，各段用拉格朗日。\n\n**详细解答**：记 $m = \\dfrac{a+b}{2}$。在 $[a, m]$、$[m, b]$ 上分别用拉格朗日中值定理：\n\n$f(m) - f(a) = f'(\\xi),(m - a), \\qquad \\xi\\in(a,m)$\n$f(b) - f(m) = f'(\\eta),(b - m), \\qquad \\eta\\in(m,b)$\n\n由 $f(a) = f(b)$，两式相加：\n\n$0 = f(b) - f(a) = f'(\\xi)(m-a) + f'(\\eta)(b-m) = \\left[f'(\\xi) + f'(\\eta)\\right]\\cdot\\dfrac{b-a}{2}$\n\n（$m - a = b - m$ 是两段相加能合并的关键。）故 $f'(\\xi) + f'(\\eta) = 0$，且 $\\xi < m < \\eta$ 必不同。$\\blacksquare$\n\n**方法总结**：**中点分段 + 等长合并**。若两端点值不等（$f(b) - f(a) = \\Delta$），同样的推导给出 $f'(\\xi) + f'(\\eta) = \\dfrac{2\\Delta}{b-a}$（练 5.2-2 正是 $\\Delta = 1$、$[0,1]$ 的版本）。"},"5.3":{"id":"5.3","name":"柯西中值定理（双函数增量比思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**柯西中值定理**：$f, g\\in C[a,b]$、$(a,b)$ 内可导且 $g'(x)\\ne 0$，则\n\n$\\exists\\xi\\in(a,b):\\qquad \\dfrac{f(b) - f(a)}{g(b) - g(a)} = \\dfrac{f'(\\xi)}{g'(\\xi)}$\n\n**核心用法**：\n\n1. **比值型结论**：结论可整理成 $\\dfrac{f(b)-f(a)}{\\text{某函数增量}}$ 的形状时，选 $g$ 为\"分母的母函数\"（结论含 $\\ln\\dfrac ba$ 选 $g = \\ln x$；含 $b^2 - a^2$ 选 $g = x^2$；含 $b^3 - a^3$ 选 $g = x^3$；含 $e^b - e^a$ 选 $g = e^x$）；\n2. **与拉格朗日组合成双中值**：同一增量 $f(b) - f(a)$ 分别用两种定理表达，联立消去增量（见例 5.3-2）。\n\n**易错警示**：\n\n* 柯西**不是**\"分子分母分别拉格朗日\"——两个 $\\xi$ 一般不同点，直接相比会引入两个点；柯西的威力恰在于**同一个 $\\xi$**；\n* $g'(x) \\ne 0$ 需要验证（往往由 $g$ 严格单调保证，如 $g = x^n$ 于正区间）。","examplesMd":"**【例 5.3-1】（★★，经典）** 设 $0 < a < b$，$f\\in C[a,b]$，$(a,b)$ 内可导。证明：存在 $\\xi\\in(a,b)$ 使\n\n$f(b) - f(a) = \\xi f'(\\xi)\\ln\\dfrac ba$\n\n**思路分析**：结论变形为 $\\dfrac{f(b)-f(a)}{\\ln b - \\ln a} = \\dfrac{f'(\\xi)}{1/\\xi}$——分母是 $\\ln x$ 的增量，选 $g = \\ln x$。\n\n**详细解答**：取 $g(x) = \\ln x$：$g'(x) = \\dfrac1x \\ne 0$ 于 $(a,b)$（$a>0$），$g(b) - g(a) = \\ln b - \\ln a = \\ln\\frac ba \\ne 0$。由柯西中值定理，存在 $\\xi\\in(a,b)$：\n\n$\\dfrac{f(b) - f(a)}{\\ln b - \\ln a} = \\dfrac{f'(\\xi)}{1/\\xi} = \\xi f'(\\xi)$\n\n整理即 $f(b) - f(a) = \\xi f'(\\xi)\\ln\\dfrac ba$。$\\blacksquare$\n\n**方法总结**：**\"对数平均\"** $\\dfrac{f(b)-f(a)}{\\ln g(b)-\\ln g(a)}$ 型问题一律选 $g = \\ln$。几何直观：把 $f$ 看作 $\\ln x$ 的函数再拉格朗日。\n\n**【例 5.3-2】（★★★，柯西 + 拉格朗日组合）** 设 $0 < a < b$，$f\\in C[a,b]$，$(a,b)$ 内可导。证明：存在 $\\xi, \\eta\\in(a,b)$，使得\n\n$3\\eta^2 f'(\\xi) = \\left(a^2 + ab + b^2\\right)f'(\\eta)$\n\n**思路分析**：结论有 $3\\eta^2$（$x^3$ 的导数）与 $a^2+ab+b^2 = \\dfrac{b^3-a^3}{b-a}$（立方差分解）——**两套增量表达的指纹**：拉格朗日给 $f'(\\xi)(b-a)$，柯西（$g=x^3$）给 $\\dfrac{f'(\\eta)}{3\\eta^2}$，都等于 $f(b)-f(a)$。\n\n**详细解答**：\n\n**拉格朗日**：存在 $\\xi\\in(a,b)$：\n\n$f(b) - f(a) = f'(\\xi)(b - a)$\n\n**柯西**（$g(x) = x^3$，$g'(x) = 3x^2 \\ne 0$ 于 $(a,b)$）：存在 $\\eta\\in(a,b)$：\n\n$\\dfrac{f(b) - f(a)}{b^3 - a^3} = \\dfrac{f'(\\eta)}{3\\eta^2} \\implies f(b) - f(a) = \\dfrac{f'(\\eta)}{3\\eta^2},(b^3 - a^3)$\n\n**联立消去 $f(b) - f(a)$**：\n\n$f'(\\xi)(b - a) = \\dfrac{f'(\\eta)}{3\\eta^2}(b-a)\\left(a^2 + ab + b^2\\right)$\n\n约去 $b - a \\ne 0$，得 $3\\eta^2f'(\\xi) = (a^2+ab+b^2)f'(\\eta)$。$\\blacksquare$\n\n**方法总结**：**\"同一增量、两种表达、联立消元\"** 是双中值问题的通用模板。识题指纹：结论中同时出现\"一次增量结构（$a^2+ab+b^2$ 等 $g$ 的增量因子）\"与\"$g'$ 在中值点的值（$3\\eta^2$）\"。（注：两定理在不同表达式中的中值点自动记为 $\\xi,\\eta$；本题不要求二者不同，若要求不同需分段处理并调整常数。）"},"5.4":{"id":"5.4","name":"泰勒公式在证明中的应用（展开点选取思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**泰勒定理（拉格朗日余项）**：$f$ 在 $x_0$ 的邻域内有 $n+1$ 阶导数，则\n\n$f(x) = f(x_0) + f'(x_0)(x - x_0) + \\cdots + \\dfrac{f^{(n)}(x_0)}{n!}(x-x_0)^n + \\dfrac{f^{(n+1)}(\\xi)}{(n+1)!}(x - x_0)^{n+1}$\n\n其中 $\\xi$ 介于 $x_0$ 与 $x$ 之间。**证明题只用拉格朗日余项**（皮亚诺余项只管极限）。\n\n**展开点选取原则（本题型的灵魂）**：\n\n| 展开点                               | 何时选          | 白捡的好处                     |\n| --------------------------------- | ------------ | ------------------------- |\n| **函数值/导数值已知的点**（端点、中点、$f = 0$ 的点） | 结论含 $f$ 的具体值 | 展开式中对应项消失                 |\n| **极值点 $x_0$**                     | 题给\"最值/极值\"    | $f'(x_0) = 0$（费马引理），一阶项消失 |\n| **中值点**（结论含 $f''(\\xi)$）           | 要证存在性        | $\\xi$ 由定理自动给出             |\n\n**组合技巧**：\n\n1. **同点展开、两方向**：在 $x_0$ 处分别向左右端点展开，**相加可消去 $f'(x_0)$**（$(x_0 - a)$ 与 $(b - x_0)$ 幂次相同时），**加权相加**可消去任意比例的项；\n2. **展开阶数**：结论含 $f^{(n)}$ 就展到 $n - 1$ 阶带 $n$ 阶余项；\n3. **\"至少一点 $\\ge$ 常数\"** 的结论来自\"两点函数值之和 $\\le$ 常数 $\\Rightarrow$ 至少一个 $\\le$ 一半\"的抽屉原理。","examplesMd":"**【例 5.4-1】（★★★，经典中的经典）** 设 $f$ 在 $[0,1]$ 上二阶可导，$f(0) = f(1) = 0$，$f!\\left(\\frac12\\right) = 1$。证明：存在 $\\xi\\in(0,1)$ 使 $f''(\\xi) \\le -8$。\n\n**思路分析**：结论含 $f''$ → 展到一阶带二阶余项。展开点选 $\\frac12$（函数值已知），向两端展开，**相加消去 $f'!\\left(\\frac12\\right)$**。\n\n**详细解答**：在 $x_0 = \\frac12$ 处展开（拉格朗日余项）：\n\n$f(0) = f!\\left(\\tfrac12\\right) + f'!\\left(\\tfrac12\\right)!\\left(0 - \\tfrac12\\right) + \\dfrac{f''(\\xi_0)}{2}\\left(0 - \\tfrac12\\right)^2, \\qquad \\xi_0\\in\\left(0, \\tfrac12\\right)$\n\n$f(1) = f!\\left(\\tfrac12\\right) + f'!\\left(\\tfrac12\\right)!\\left(1 - \\tfrac12\\right) + \\dfrac{f''(\\xi_1)}{2}\\left(1 - \\tfrac12\\right)^2, \\qquad \\xi_1\\in\\left(\\tfrac12, 1\\right)$\n\n代入 $f(0) = f(1) = 0$、$f!\\left(\\frac12\\right) = 1$：\n\n$0 = 1 - \\dfrac{f'(\\frac12)}{2} + \\dfrac{f''(\\xi_0)}{8}, \\qquad 0 = 1 + \\dfrac{f'(\\frac12)}{2} + \\dfrac{f''(\\xi_1)}{8}$\n\n**相加**（$f'!\\left(\\frac12\\right)$ 项恰反号抵消）：\n\n$0 = 2 + \\dfrac{f''(\\xi_0) + f''(\\xi_1)}{8} \\implies f''(\\xi_0) + f''(\\xi_1) = -16$\n\n两个数之和为 $-16$，至少一个 $\\le -8$，记之为 $\\xi$，即 $f''(\\xi)\\le -8$。$\\blacksquare$\n\n**方法总结**：**\"中点展开 + 相加消一阶项 + 抽屉原理\"** 三连。把 $f(\\frac12) = 1$ 换成\"$f$ 在内部取到最小值 $-1$\"得对偶版本 $f''(\\xi) \\ge 8$（拔 5.4 处理一般区间版本）。\n\n**【例 5.4-2】（★★★）** 设 $f$ 在 $[0,1]$ 上二阶可导，$f(0) = f(1) = 0$，且 $\\lvert f''(x)\\rvert \\le M$。证明：$\\lvert f'(x)\\rvert \\le \\dfrac{M}{2}\\left[x^2 + (1-x)^2\\right]$。\n\n**思路分析**：要估计**任意点 $x$ 处的 $f'(x)$** → 在 $x$ 处展开，向两端点 0 和 1 展开，两式**相减**消去 $f(x)$，解出 $f'(x)$。\n\n**详细解答**：在任意 $x\\in(0,1)$ 处展开：\n\n$0 = f(0) = f(x) - xf'(x) + \\dfrac{f''(\\xi_1)}{2}x^2 \\qquad (\\mathrm{A})$\n\n$0 = f(1) = f(x) + (1-x)f'(x) + \\dfrac{f''(\\xi_2)}{2}(1-x)^2 \\qquad (\\mathrm{B})$\n\n$(\\mathrm{B}) - (\\mathrm{A})$（$f(x)$ 消去）：\n\n$0 = f'(x) + \\dfrac{f''(\\xi_2)(1-x)^2 - f''(\\xi_1)x^2}{2} \\implies f'(x) = \\dfrac{f''(\\xi_1)x^2 - f''(\\xi_2)(1-x)^2}{2}$\n\n取绝对值并用 $\\lvert f''\\rvert\\le M$：\n\n$\\lvert f'(x)\\rvert \\le \\dfrac{M}{2}\\left[x^2 + (1-x)^2\\right] \\le \\dfrac{M}{2} \\qquad \\blacksquare$\n\n（末步用 $x^2 + (1-x)^2 = 2\\left(x - \\frac12\\right)^2 + \\frac12 \\le 1$ 于 $[0,1]$；特别地 $\\lvert f'(\\frac12)\\rvert\\le\\frac M4$。）\n\n**方法总结**：**\"在任意点展开 + 两式相减\"** 用于估计导数值；与例 5.4-1 的\"在中点展开 + 相加\"对偶记忆：**消谁就加减谁**。"},"5.5":{"id":"5.5","name":"单调性与不等式证明（构造函数思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**核心思想**：把不等式 **移项成一个函数的符号问题**，用单调性 + 端点值判定：\n\n> **标准流程**：证 $g(x) > h(x)$ 于 $(a, b)$：\n>\n> 1. 令 $F(x) = g(x) - h(x)$（**已含端点信息时优先**）；\n> 2. 求 $F'$：若 $F' > 0$ 则 $F$ 递增；\n> 3. 检查 $F(a) \\ge 0$（或 $\\lim_{x\\to a^+}F \\ge 0$）→ $F(x) > 0$ 于 $(a,b)$。\n\n**进阶技巧**：\n\n1. **一阶不够看二阶**：$F'$ 符号不明时，对 $F'$ 重复流程（递归定号），常配合 $F(a) = F'(a) = 0$ 的\"起点连零\"结构；\n2. **比值法**：证 $\\dfrac{f(x)}{g(x)}$ 的单调性（5.3 拔高），适合乘积型不等式；\n3. **凹凸性（Jensen）**：$\\dfrac{f(x)+f(y)}{2}$ 与 $f!\\left(\\dfrac{x+y}{2}\\right)$ 比较，二阶导定凹凸；\n4. **基础不等式链（一切对数不等式的引擎，务必先证后用）**：\n\n$\\dfrac{x}{1+x} < \\ln(1+x) < x \\qquad (x > 0,\\ \\text{见练 5.2-3 与练 5.5-2})$\n\n**适用信号**：\"证明当 $x\\in(\\cdot)$ 时 $f(x) > g(x)$\"；\"比较两个均值\"；\"证数列不等式\"（对 $n$ 用函数单调性）。","examplesMd":"**【例 5.5-1】（★★★，Jordan 不等式）** 证明：当 $0 < x < \\dfrac\\pi2$ 时，$\\dfrac{2}{\\pi} < \\dfrac{\\sin x}{x} < 1$。\n\n**思路分析**：右边是 $\\sin x < x$（基本）。左边：证 $F(x) = \\dfrac{\\sin x}{x}$ 在 $\\left(0, \\frac\\pi2\\right]$ 上**严格递减**，则 $F(x) > F!\\left(\\frac\\pi2\\right) = \\frac2\\pi$。\n\n**详细解答**：\n\n$F'(x) = \\dfrac{x\\cos x - \\sin x}{x^2}$\n\n分母 $> 0$；分子 $= \\cos x,(x - \\tan x)$（$\\cos x > 0$ 于 $\\left(0,\\frac\\pi2\\right)$）。考察 $u(x) = \\tan x - x$：$u'(x) = \\sec^2x - 1 = \\tan^2x > 0$，故 $u$ 严格递增，$u(x) > u(0) = 0$，即 $\\tan x > x$。于是分子 $< 0$，$F$ 严格递减。\n\n$\\lim_{x\\to0^+}F(x) = 1 > \\dfrac{\\sin x}{x} > F!\\left(\\dfrac\\pi2\\right) = \\dfrac{2}{\\pi} \\qquad \\blacksquare$\n\n**方法总结**：**\"证 sin x / x 单调\"的钥匙是 tan x > x，而它一行导数（$\\tan^2 x > 0$）搞定**。Jordan 不等式是众多竞赛题的引理（如估计积分、证 $\\sin x$ 的下界）。\n\n**【例 5.5-2】（★★，Young 不等式 / 加权均值）** 设 $x, y > 0$，$\\alpha\\in(0,1)$。证明：$x^{\\alpha}y^{1-\\alpha} \\le \\alpha x + (1-\\alpha)y$。\n\n**思路分析**：固定 $y$，把左边移到右边构造 $g(x)$，找最小值点。\n\n**详细解答**：令 $g(x) = \\alpha x + (1-\\alpha)y - x^{\\alpha}y^{1-\\alpha}$（$x>0$）。\n\n$g'(x) = \\alpha - \\alpha x^{\\alpha-1}y^{1-\\alpha} = \\alpha\\left[1 - \\left(\\dfrac{y}{x}\\right)^{1-\\alpha}\\right]$\n\n$g'(x) = 0 \\iff x = y$；$x < y$ 时 $g' < 0$，$x > y$ 时 $g' > 0$。故 $x = y$ 是唯一极小值点，$g(y) = \\alpha y + (1-\\alpha)y - y = 0$ 为最小值，$g(x)\\ge0$。$\\blacksquare$\n\n**方法总结**：\\*\\*\"凹函数切线在上方\"\\*\\*的实例（$e$ 的凹性）：加权几何平均 $\\le$ 加权算术平均。取 $\\alpha = \\frac12$ 得 $\\sqrt{xy}\\le\\frac{x+y}2$。它是 Young 不等式、Hölder 不等式（多元微积分/级数专题）的源头。"},"5.6":{"id":"5.6","name":"极值、最值与方程根个数（临界点扫描思想）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**核心思想**：极值与根的个数问题都归结为**扫描全部临界点、按符号分区**：\n\n**求极值流程**：\n\n1. 找**全部临界点**：$f'(x) = 0$ 的解 **及 $f'$ 不存在的点**（含 $\\lvert\\cdot\\rvert$ 折点、$x^{2/3}$ 型尖点）；\n2. 每个临界点用**一阶导数变号**判定（左右分区符号）或二阶导数符号（$f'(x_0)=0,\\ f''(x_0)>0 \\Rightarrow$ 极小）；\n3. 不可导点单独用定义/连续性讨论（$x^{2/3}(x-1)$ 在 $0$ 处导数为 $\\infty$ 但有极大值）。\n\n**方程根个数流程（$F(x) = 0$）**：\n\n1. 求 $F'$ 的临界点，把定义域切成若干**严格单调区间**；\n2. 每个单调区间上：**两端点函数值异号（含 $\\pm\\infty$）⇒ 恰一根**（存在靠零点定理，唯一靠严格单调）；\n3. 参数问题：临界点处的函数值（极大/极小值）含参数，比较它与 0 的关系分情况。\n\n**易错警示**：\n\n| 错误                      | 纠正                                    |\n| ----------------------- | ------------------------------------- |\n| 只找 $f' = 0$ 的点，漏掉不可导临界点 | $x^{2/3}$、$\\lvert x\\rvert$ 型尖点也是极值嫌疑点 |\n| 忘看 $\\pm\\infty$ 端的极限趋势   | 根的个数依赖\"两端走势\"（$F(\\pm\\infty)$ 的符号）      |\n| 参数讨论漏掉相切的临界情况           | 单调区间最值恰好为 0 的\"切线情形\"单独列出               |","examplesMd":"**【例 5.6-1】（★★，含不可导临界点）** 求 $f(x) = x^{2/3}(x - 1)$ 的极值。\n\n**详细解答**：\n\n$f'(x) = \\dfrac23x^{-1/3}(x-1) + x^{2/3} = \\dfrac{2(x-1) + 3x}{3x^{1/3}} = \\dfrac{5x - 2}{3x^{1/3}}$\n\n临界点：$x = \\dfrac25$（$f' = 0$）与 $x = 0$（$f'$ 不存在，尖点）。\n\n**符号表**：\n\n| 区间       | $(-\\infty, 0)$ | $(0, \\frac25)$ | $(\\frac25, +\\infty)$ |\n| -------- | -------------- | -------------- | -------------------- |\n| $f'$ 的符号 | $+$（负/负）       | $-$（负/正）       | $+$                  |\n| $f$      | 递增             | 递减             | 递增                   |\n\n故 $x = 0$ 为**极大值点**，$f(0) = 0$；$x = \\dfrac25$ 为**极小值点**，\n\n$f!\\left(\\dfrac25\\right) = \\left(\\dfrac25\\right)^{2/3}\\left(-\\dfrac35\\right) = -\\dfrac35\\sqrt[3]{\\dfrac{4}{25}} \\approx -0.326$\n\n**方法总结**：分数幂函数 $x^{2/3}$ 在 0 处导数为 $+\\infty$（单侧），不可导但连续——**尖点完全可能是极值点**。符号表是\"分区间定号\"的防错工具。\n\n**【例 5.6-2】（★★，参数讨论经典）** 就参数 $a > 0$ 讨论方程 $\\ln x = ax$ 的实根个数。\n\n**详细解答**：设 $g(x) = \\ln x - ax$（$x > 0$），$g'(x) = \\dfrac1x - a$，唯一临界点 $x = \\dfrac1a$（极大值点，因 $g'$ 由正变负）。\n\n$g!\\left(\\dfrac1a\\right) = \\ln\\dfrac1a - 1 = -\\ln a - 1$\n\n端点趋势：$g(0^+) = -\\infty$，$g(+\\infty) = -\\infty$（$-ax$ 主导）。极大值决定一切：\n\n| 条件             | $g!\\left(\\frac1a\\right)$ | 根的个数                 |\n| -------------- | ------------------------ | -------------------- |\n| $a < \\dfrac1e$ | $> 0$                    | 2 个（两侧各一，严格单调保证各恰一个） |\n| $a = \\dfrac1e$ | $= 0$                    | 1 个（$x = e$，切触）      |\n| $a > \\dfrac1e$ | $< 0$                    | 0 个                  |\n\n**方法总结**：**\"唯一极值 + 两端同趋 $-\\infty$ ⇒ 极大值与 0 的三态比较\"** 是参数方程根问题的标准模型。答题时务必说明每个区间\"恰一根\"的理由（严格单调 + 零点定理）。"},"5.7":{"id":"5.7","name":"综合存在性问题（费马引理与最值介值组合拳）","part":"微分中值定理与导数应用","book":"一元微分","teachMd":"**核心思想**：当罗尔/拉格朗日的\"端点条件\"都不具备时，存在性结论往往藏在**最值**与**介值**的组合里：\n\n| 武器                   | 适用信号                                       |\n| -------------------- | ------------------------------------------ |\n| **费马引理**：可导的极值点导数为零  | \"最值/极值在内部取到\"的论证（反证端点、比较端点值）                |\n| **最值定理 + 介值定理**（3.3） | \"存在点取到某值\"                                  |\n| **泰勒在极值点展开**（5.4）    | 极值点处 $f' = 0$ 白捡，展开降一阶                     |\n| **多个中值定理联立**         | 结论含 $e^\\xi$、$f(\\eta) + f'(\\eta)$ 等\"复合中值\"结构 |\n\n**\"最值在内部\"的两种推法**：\n\n1. 端点函数值被内部某点超过（则最大值点不在端点）；\n2. 单侧导数异号（$f'(a) < 0 < f'(b)$）则最小值点在内部。","examplesMd":"**【例 5.7-1】（★★★，经典）** 设 $f$ 在 $[a,b]$ 上二阶可导，$f'(a) = f'(b) = 0$。证明：存在 $\\xi\\in(a,b)$ 使\n\n$\\lvert f''(\\xi)\\rvert \\ge \\dfrac{4,\\lvert f(b) - f(a)\\rvert}{(b-a)^2}$\n\n**思路分析**：两个端点导数为零——**在两端点展开、在中点赋值**，两式相减消去 $f(m)$。\n\n**详细解答**：记 $m = \\dfrac{a+b}2$。在 $a$、$b$ 两点分别展开（$f'(a) = f'(b) = 0$，一阶项消失）：\n\n$f(m) = f(a) + \\dfrac{f''(\\xi_1)}{2}\\left(\\dfrac{b-a}{2}\\right)^2 = f(a) + \\dfrac{f''(\\xi_1)(b-a)^2}{8}, \\qquad \\xi_1\\in(a,m)$\n\n$f(m) = f(b) + \\dfrac{f''(\\xi_2)}{2}\\left(\\dfrac{b-a}{2}\\right)^2 = f(b) + \\dfrac{f''(\\xi_2)(b-a)^2}{8}, \\qquad \\xi_2\\in(m,b)$\n\n相减：\n\n$f(b) - f(a) = \\dfrac{\\left[f''(\\xi_1) - f''(\\xi_2)\\right](b-a)^2}{8}$\n\n$\\dfrac{4\\lvert f(b)-f(a)\\rvert}{(b-a)^2} = \\dfrac{\\lvert f''(\\xi_1) - f''(\\xi_2)\\rvert}{2} \\le \\dfrac{\\lvert f''(\\xi_1)\\rvert + \\lvert f''(\\xi_2)\\rvert}{2} \\le \\max_{[a,b]}\\lvert f''\\rvert$\n\n故存在 $\\xi$ 使 $\\lvert f''(\\xi)\\rvert \\ge \\dfrac{4\\lvert f(b)-f(a)\\rvert}{(b-a)^2}$。$\\blacksquare$\n\n**方法总结**：**\"双端展开 + 中点桥接\"**：一阶项为零是端点条件的红利，中点让两式的二阶项系数相同从而相减干净。常数 4 不能再大（$f = $ 顶点在 $m$ 的二次函数逼近取等）。\n\n**【例 5.7-2】（★★★，最值论证巧题）** 设 $f\\in C[a,b]$，且对任意 $x\\in[a,b]$，存在 $y\\in[a,b]$ 使 $\\lvert f(y)\\rvert \\le \\dfrac12\\lvert f(x)\\rvert$。证明：存在 $\\xi\\in[a,b]$ 使 $f(\\xi) = 0$。\n\n**详细解答**：$\\lvert f\\rvert$ 在 $[a,b]$ 上连续，由最值定理在某点 $x_0$ 取到最小值 $m_0 = \\lvert f(x_0)\\rvert$。\n\n对该 $x_0$ 使用题设：存在 $y\\in[a,b]$ 使 $\\lvert f(y)\\rvert \\le \\dfrac12\\lvert f(x_0)\\rvert = \\dfrac{m_0}{2}$。但 $m_0$ 是最小值，$m_0 \\le \\lvert f(y)\\rvert$。串联：\n\n$m_0 \\le \\lvert f(y)\\rvert \\le \\dfrac{m_0}{2} \\implies m_0 \\le 0 \\implies m_0 = 0$\n\n即 $\\lvert f(x_0)\\rvert = 0$，取 $\\xi = x_0$ 即 $f(\\xi) = 0$。$\\blacksquare$\n\n**方法总结**：**\"最小值 + 压缩条件自吞噬\"**：把条件套在最小值点上，条件中的 $y$ 不能比最小值更小，被迫归零。这是\"最值点代入法\"的典范（同型：证明有界数列存在最值点满足某不等式时取等）。"}}},"一元积分":{"key":"一元积分","title":"一元积分学习题集（不定积分·定积分·变限积分·反常积分·应用与证明）— CMC 全国大学生数学竞赛备战笔记","introMd":"> **适用对象**：CMC 非数学类（A 类）考生；考研数学一/二想冲高分者同样适用。\n> **覆盖范围**：不定积分全套计算方法、定积分计算（对称性·区间再现·华里士）、变限积分、反常积分（含 Γ/B 函数）、几何物理应用与积分等式不等式证明。\n> **组织方式**：按**方法技巧思想**分类，共 5 部分 29 类；每类结构：思想方法讲解 → 例题精讲（2 道）→ 练习题（3 道）→ 拔高题（1 道）→ 小节末统一详解（练习与拔高**先做题，再到小节末对照详解**）。\n> **配套资料**：建议与姊妹篇《一元微分学习题集\\_CMC备战笔记》（积分的上游：极限与求导）及《不定积分专题\\_CMC备战笔记》《定积分专题\\_CMC备战笔记》配合使用——笔记看\"懂\"，习题集练\"熟\"。","freqMd":"### 出题频率速览（CMC 非数学类初赛）\n\n| 考点                        | 频率     | 常见形式                        |\n| ------------------------- | ------ | --------------------------- |\n| 定积分计算（对称性、区间再现、分部点火）      | ⭐⭐⭐⭐⭐ | 几乎每年必考：填空计算主力，解答题里的\"硬通货\"    |\n| 变限积分（求导、极限、单调性）           | ⭐⭐⭐⭐⭐ | 填空高频；常与洛必达、不等式、方程结合         |\n| 定积分定义求和式极限                | ⭐⭐⭐⭐  | 填空常客（$\\sum$ 形式），与数列极限交叉出题   |\n| 积分不等式与积分中值定理证明            | ⭐⭐⭐⭐  | 解答大题主战场之一（构造、放缩、Schwarz）    |\n| 反常积分敛散性判别与计算              | ⭐⭐⭐   | 填空为主；含参数判敛偶成解答题            |\n| 不定积分计算技巧                  | ⭐⭐⭐   | 填空偶考；更多作为其他题目的底层工具出现       |\n| 面积、体积、弧长等几何应用             | ⭐⭐⭐   | 填空与解答均见；极坐标面积、旋转体是常客       |\n| Γ/B 函数、递推与积分估计综合          | ⭐⭐    | 偶考，初赛压轴与决赛风格               |","openTree":{"raw":"看到积分题（第一步先分清：求原函数？算数值？限上带变量？无穷限/瑕点？还是几何物理与证明？）\n├── 不定积分（没有积分限，结果是个函数）\n│    ├── 有 f(g(x))·g'(x) 的复合雏形 → 凑微分，整体代入（1.1）\n│    ├── 含 √(a²−x²)、√(a²+x²)、√(x²−a²) → 三角代换去根号（1.2）\n│    ├── 两因子分属\"反、对、幂、指、弦\"不同类 → 分部积分，靠前的是 u（1.3）\n│    ├── 有理函数 P(x)/Q(x) → 部分分式分解（1.4）\n│    ├── sin x、cos x 的有理式 → 先试配偶/降幂（1.8），卡死才万能代换（1.5）\n│    ├── 含一次根式 √(ax+b)、√((x−a)(b−x)) → 根式代换 / 欧拉代换（1.6）\n│    └── 积分自己转一圈重现，或带 I_n → 分部递推 + 回代解方程（1.7）\n├── 定积分（数字限，结果是个数）\n│    ├── 原函数是 e^{−x²}、(sin x)/x 等\"积不出\"型 → 放弃 N–L，改对称/再现/几何（2.1）\n│    ├── 区间关于原点对称 → 奇偶性拆分；周期函数 → 平移截断（2.2）\n│    ├── 上下限互为镜像、或含 f(a+b−x) 结构 → 区间再现（2.3）\n│    ├── sinⁿx、cosⁿx、xⁿeˣ 幂结构 → 分部 + 华里士点火（2.4）\n│    └── 区间内有分段点、|·|、max/min、[x] → 先拆区间再逐段算（2.6）\n├── n 项和的极限，每项含 1/n 与 k/n → 凑成 ∑ f(k/n)·(1/n) 用定积分定义（2.5）\n├── 积分限上带变量 x（变限积分）\n│    ├── 求 d/dx → 变限积分求导法则，上限复合要链式（3.1）\n│    ├── 求 0/0 或 ∞/∞ 极限 → 洛必达 + 等价替换（3.2）\n│    └── 问单调、极值、凹凸，或解含积分的方程 → 求导画像（3.3）/ 求导脱限（3.4）\n├── 积分限含 ∞ 或区间内有瑕点（反常积分）\n│    ├── 只问敛散 → 比较判别法 / p 判别，抓大头定阶（4.1）\n│    ├── 含参数 p、α → 临界指数扫描，分段讨论（4.4）\n│    ├── 要算数值 → 对称性、区间再现的推广（4.2）\n│    └── 出现 n!、Γ 形或 ∫sinᵐ、cosᵐ → Γ/B 函数（4.3）\n└── 几何量、物理量、证明题\n     ├── 面积（直角/极坐标）→ 5.1；旋转体、侧面积 → 5.2（圆盘 vs 柱壳）；弧长、曲率 → 5.3\n     ├── 变力做功、水压力、质心 → 微元法（5.4）\n     ├── 结论形如 ∃ξ: f(ξ)=积分平均值，或 ∫=f(ξ)g(ξ) → 积分中值定理（5.5）\n     └── 积分不等式、估计、抽象存在性 → 构造函数 / Schwarz（5.6）、放缩组合（5.7）","roots":[{"t":"看到积分题（第一步先分清：求原函数？算数值？限上带变量？无穷限/瑕点？还是几何物理与证明？）","k":[{"t":"不定积分（没有积分限，结果是个函数）","k":[{"t":"有 f(g(x))·g'(x) 的复合雏形 → 凑微分，整体代入（1.1）","k":[],"r":[]},{"t":"含 √(a²−x²)、√(a²+x²)、√(x²−a²) → 三角代换去根号（1.2）","k":[],"r":[]},{"t":"两因子分属\"反、对、幂、指、弦\"不同类 → 分部积分，靠前的是 u（1.3）","k":[],"r":[]},{"t":"有理函数 P(x)/Q(x) → 部分分式分解（1.4）","k":[],"r":[]},{"t":"sin x、cos x 的有理式 → 先试配偶/降幂（1.8），卡死才万能代换（1.5）","k":[],"r":[]},{"t":"含一次根式 √(ax+b)、√((x−a)(b−x)) → 根式代换 / 欧拉代换（1.6）","k":[],"r":[]},{"t":"积分自己转一圈重现，或带 I_n → 分部递推 + 回代解方程（1.7）","k":[],"r":[]}],"r":[]},{"t":"定积分
