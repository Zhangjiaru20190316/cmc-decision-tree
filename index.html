:"含参数 p、q 全范围分类 → 判敛总表 + 临界细判（5.1）","k":[],"r":[]},{"t":"定误差小数位 / 证和的范围 → 余项估计（5.2）","k":[],"r":[]},{"t":"递推数列判敛求和 / 极限化级数 → 单调有界 + 收敛速度（5.3）","k":[],"r":[]}],"r":[]}],"r":[]}],"stats":{"markers":27,"nodes":28}},"parts":["数项级数判敛：七类方法","幂级数：五类方法","数项级数求和：两类方法","傅里叶级数：三类方法","综合与压轴：三类方法"],"methods":{"1.1":{"id":"1.1","name":"收敛必要条件与级数性质（排除思想）","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：$\\lim\\limits_{n\\to\\infty}u_n=0$ 是 $\\sum u_n$ 收敛的**必要条件**——只能用来**证发散**（通项不趋零一票否决），绝不能用来证收敛（调和级数 $\\sum\\dfrac1n$ 通项趋零却发散）。CMC 用它做两件事：秒杀\"伪装成要判敛其实通项不趋零\"的题；以及配合极限计算（抓大头、取对数、Taylor 展开算通项极限）。\n\n**必背性质清单**（级数三性质 + 两条判敛通道）：\n\n1. **线性**：$\\sum a_n$、$\\sum b_n$ 都收敛 $\\Rightarrow$ $\\sum(\\lambda a_n+\\mu b_n)$ 收敛；**收敛 + 发散 = 发散**（反证即得）；发散 + 发散**不定**；\n2. **去有限项**：加上、去掉或改变有限项不改变敛散性（改变和）；\n3. **加括号**：收敛级数任意加括号仍收敛且和不变；**逆否命题**——若某加括号方式后发散，则原级数发散。<span style=\"color:#e53935\">**加括号后收敛推不出原级数收敛**：$(1-1)+(1-1)+\\cdots$ 收敛于 $0$，但 $1-1+1-1+\\cdots$ 发散</span>；\n4. **部分和通道**：$\\sum u_n$ 收敛 $\\iff$ 部分和数列 $S_n$ 收敛；**正项级数** $\\sum u_n$ 收敛 $\\iff$ $S_n$ 有上界；\n5. **柯西准则**（1.7 拔高题的工具）：$\\forall\\varepsilon>0$，$\\exists N$，当 $m>n\\ge N$ 时 $\\Big\\lvert\\sum\\limits_{k=n+1}^{m}u_k\\Big\\rvert<\\varepsilon$。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------| ---------------------------------------------------|\n|\"通项趋于 0，所以收敛\"|必要非充分，$\\sum 1/n$ 反例常驻|\n|通项极限没算准就下结论|$u_n\\to0$ 与 $u_n\\to c\\neq0$ 与 $u_n$ 振荡三种结局都要算清|\n|由加括号级数收敛推原级数收敛|只有\"去括号仍收敛\"类条件（如 1.5 交错递减）才允许|","examplesMd":" **【例 1.1-1】（★★，经典）**  判断下列级数的敛散性：\n\n(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{\\left(1+\\dfrac1n\\right)^{n^{2}}}{e^{n}}$；　(2) $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}\\dfrac{n}{n+1}$。\n\n**思路分析**：两题都不必动判别法——先算通项极限。(1) 幂指结构取对数 + Taylor；(2) 绝对值直接趋 1。\n\n**详细解答**：\n\n(1) $n^{2}\\ln\\left(1+\\dfrac1n\\right)=n^{2}\\left(\\dfrac1n-\\dfrac{1}{2n^{2}}+O\\left(\\dfrac1{n^{3}}\\right)\\right)=n-\\dfrac12+O\\left(\\dfrac1n\\right)$，故\n\n$\\left(1+\\dfrac1n\\right)^{n^{2}}=e^{\\,n-\\frac12+O(\\frac1n)}\\ \\Longrightarrow\\ u_n=e^{-\\frac12+O(\\frac1n)}\\longrightarrow e^{-\\frac12}\\neq0$\n\n通项不趋于 0，**发散**。\n\n(2) $\\Big\\lvert u_n\\Big\\rvert=\\dfrac{n}{n+1}\\longrightarrow1\\neq0$，通项不趋于 0（且子列交替趋 $\\pm1$），**发散**。\n\n**检验**：(1) 取 $n=100$：$\\left(1.01\\right)^{10000}/e^{100}=e^{10000\\ln1.01-100}\\approx e^{-0.5}$ ✓ 与 $e^{-1/2}\\approx0.607$ 吻合。\n\n**方法总结**：==判敛第 0 步永远是算通项极限==；幂指型通项取对数后用 Taylor 展开，指数上\"常数残留\"（本题的 $-1/2$）决定通项极限非零。\n\n **【例 1.1-2】（★★，概念辨析）**  判断下列命题真假，真者给证明，假者举反例：\n\n(1) 若 $\\sum a_n$ 收敛、$\\sum b_n$ 发散，则 $\\sum(a_n+b_n)$ 发散；(2) 若 $\\sum a_n$、$\\sum b_n$ 都发散，则 $\\sum(a_n+b_n)$ 发散；(3) 若 $\\sum a_n$ 收敛、$\\sum b_n$ 发散，则 $\\sum a_nb_n$ 发散。\n\n**思路分析**：(1) 反证；(2)(3) 造反例对——正反两例说明\"不定\"。\n\n**详细解答**：\n\n(1) **真**。若 $\\sum(a_n+b_n)$ 收敛，则 $\\sum b_n=\\sum[(a_n+b_n)-a_n]$ 为两收敛级数之差，收敛，矛盾。\n\n(2) **假**。$a_n=\\dfrac1n$，$b_n=-\\dfrac1n$：两级数都发散，但 $\\sum(a_n+b_n)=\\sum0$ 收敛。（又 $a_n=b_n=\\dfrac1n$ 时和发散——敛散**不定**。）\n\n(3) **假**。取 $a_n=\\dfrac{(-1)^n}{n}$（收敛），$b_n=(-1)^n$（发散）：$a_nb_n=\\dfrac1n$，$\\sum a_nb_n$ 发散；但取 $b_n\\equiv1$（发散）：$a_nb_n=a_n$，$\\sum a_nb_n$ 收敛——**敛散不定**。\n\n**方法总结**：==收敛 ± 发散 = 发散；发散 ∘ 发散与\"收敛 × 发散\"一律不定==，概念题就考\"哪个组合是死的、哪个是活的\"。"},"1.2":{"id":"1.2","name":"比较判别法与抓大头（尺度思想）——主攻","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：正项级数判敛的\"尺子\"只有两把——$p$-级数 $\\sum\\dfrac1{n^p}$（收敛 $\\iff p>1$）与等比级数 $\\sum q^n$（收敛 $\\iff|q|<1$）。一切具体级数判敛，本质都是**定阶**：把通项与尺子比出阶数。两个提速动作：\n\n1. **抓大头**：分子分母各找\"最大项\"，多项之和的阶由最大项决定——$\\dfrac{2n^{2}+n}{n^{7/2}+5}$ 抓成 $\\dfrac{2}{n^{3/2}}$；\n2. **等价替换**（极限形式比较判别法）：若 $u_n\\sim v_n$（$n\\to\\infty$），则 $\\sum u_n$ 与 $\\sum v_n$ 同敛散。替换素材全部来自 Taylor：$e^{1/n}-1\\sim\\dfrac1n$、$1-\\cos\\dfrac1{\\sqrt n}\\sim\\dfrac{1}{2n}$、$\\ln\\left(1+\\dfrac1n\\right)\\sim\\dfrac1n$。\n\n**必背尺度表**：\n\n|尺子|通项形式|收敛条件|\n| --------| ----------| --------------------------|\n|$p$-级数|$\\dfrac1{n^p}$|$p>1$|\n|对数尺|$\\dfrac{1}{n\\ln^{q}n}$（$n\\ge2$）|$q>1$（1.3 积分判别法证明）|\n|等比尺|$q^{n}$|$\\lvert q\\rvert<1$|\n|阶乘尺|$\\dfrac{1}{n!}$、$\\dfrac{n!}{n^n}$|恒收敛（阶乘压倒一切幂）|\n\n**==极限形式的精细用法==**​==：==​==$\\lim\\dfrac{u_n}{v_n}=l$==​==——==​==$0<l<\\infty$== ==同敛散；==​==$l=0$== ==时\"==​==$v$== ==收== ==$\\Rightarrow u$== ==收\"；==​==$l=+\\infty$== ==时\"==​==$v$== ==散== ==$\\Rightarrow u$== ==散\"。==​==$l=0$== ==== **==不能==**​==由== ==$v$== ==散推== ==$u$== ==散。==\n\n**勘误式复盘（重要）** ——等价替换滥用到**加减结构**：\n\n> 错误：判 $\\sum\\left(\\sqrt{n+1}-\\sqrt n\\right)$：由 $\\sqrt{n+1}\\sim\\sqrt n$ 得\"差 $\\sim0$\"，以为通项是更高阶无穷小，随便判收敛。  \n> 错因：等价替换只对**乘除因子**合法；两个同阶量相减会**升阶**，必须先有理化/用 Taylor 把差算出来。  \n> 纠正：$\\sqrt{n+1}-\\sqrt n=\\dfrac{1}{\\sqrt{n+1}+\\sqrt n}\\sim\\dfrac{1}{2\\sqrt n}$，与 $\\sum\\dfrac{1}{\\sqrt n}$ 同发散——级数**发散**（部分和就是 $S_n=\\sqrt{n+1}-1\\to\\infty$，双重印证）。CMC 把这种\"差结构\"埋在通项里是保留节目，见例 1.2-2(3)。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------| ------------------------------------------------|\n|加减结构直接等价替换|先有理化 / Taylor 展开，算出差的真阶|\n|$\\lim u_n/v_n=0$ 就下\"同敛散\"|同敛散需 $0<l<\\infty$；$l=0$ 只能单向推|\n|分子分母各自抓大头后忘比大小|抓完立对比值（或与 $p$-级数比对），落到\"和谁同阶\"|","examplesMd":" **【例 1.2-1】（★★，经典）**  判断敛散性：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n+\\ln n}$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{2n^{2}+n}{n^{7/2}+5}$；　(3) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n^{1+\\frac1n}}$。\n\n**思路分析**：三题都是抓大头定阶：(1) 分母 $n$ 主导；(2) 两边各抓最大项；(3) 指数 $1+\\dfrac1n$ 中的 $\\dfrac1n$ 是\"纸老虎\"。\n\n**详细解答**：\n\n(1) $\\lim\\limits_{n\\to\\infty}\\dfrac{1/(n+\\ln n)}{1/n}=\\lim\\dfrac{n}{n+\\ln n}=1$，与调和级数同敛散，**发散**。\n\n(2) $\\lim\\limits_{n\\to\\infty}\\dfrac{(2n^{2}+n)/(n^{7/2}+5)}{1/n^{3/2}}=\\lim\\dfrac{(2n^{2}+n)n^{3/2}}{n^{7/2}+5}=\\lim\\dfrac{2n^{7/2}+n^{5/2}}{n^{7/2}+5}=2$，与 $\\sum\\dfrac1{n^{3/2}}$ 同敛散，**收敛**。\n\n(3) $\\dfrac{1}{n^{1+1/n}}=\\dfrac{1}{n\\cdot n^{1/n}}$，而 $n^{1/n}=e^{\\frac{\\ln n}{n}}\\to e^{0}=1$，故 $\\lim\\dfrac{u_n}{1/n}=1$，与 $\\sum\\dfrac1n$ 同敛散，**发散**。\n\n**检验**：(3) $n=1000$：$n^{1/n}=1.0069$，$u_n\\approx\\dfrac{1}{1.0069n}$，确与 $\\dfrac1n$ 同阶 ✓。\n\n**方法总结**：==抓大头三步：分子抓最大、分母抓最大、落尺定阶==；指数上的 $\\dfrac1n$、$\\dfrac{\\ln n}{n}$ 等小扰动先取对数化为 $e^{o(1)}\\to1$。\n\n **【例 1.2-2】（★★，真题风格）**  判断敛散性：(1) $\\sum\\limits_{n=1}^{\\infty}\\left(e^{1/n^{2}}-1\\right)$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\left(1-\\cos\\dfrac{1}{\\sqrt n}\\right)$；　(3) $\\sum\\limits_{n=1}^{\\infty}\\left(\\dfrac1n-\\sin\\dfrac1n\\right)$。\n\n**思路分析**：Taylor 等价替换三连。(1)(2) 是乘除型直接替换；(3) 是**差结构**，必须展开到下一阶。\n\n**详细解答**：\n\n(1) $e^{1/n^{2}}-1\\sim\\dfrac{1}{n^{2}}$，与 $\\sum\\dfrac1{n^2}$ 同敛散，**收敛**。\n\n(2) $1-\\cos\\dfrac{1}{\\sqrt n}\\sim\\dfrac{1}{2n}$，与 $\\sum\\dfrac1n$ 同敛散，**发散**——外形\"像收敛\"（$1-\\cos$ 是小量）但阶只有 $n^{-1}$，是经典陷阱。\n\n(3) $\\sin\\dfrac1n=\\dfrac1n-\\dfrac{1}{6n^{3}}+O\\left(\\dfrac1{n^5}\\right)$，故\n\n$\\dfrac1n-\\sin\\dfrac1n=\\dfrac{1}{6n^{3}}+O\\left(\\dfrac1{n^5}\\right)\\sim\\dfrac{1}{6n^{3}}$\n\n与 $\\sum\\dfrac1{n^3}$ 同敛散，**收敛**。\n\n**检验**：(3) $n=10$：$\\dfrac1{10}-\\sin0.1=0.1-0.0998334=1.666\\times10^{-4}$，而 $\\dfrac{1}{6n^3}=\\dfrac16\\times10^{-3}=1.667\\times10^{-4}$ ✓。\n\n**方法总结**：==差结构必 Taylor 到相消后首项==：$x-\\sin x\\sim\\dfrac{x^3}6$、$\\tan x-\\sin x\\sim\\dfrac{x^3}2$、$e^x-1-x\\sim\\dfrac{x^2}2$、$\\ln(1+x)-x\\sim-\\dfrac{x^2}2$——这四组是判敛替换的高频弹药。"},"1.3":{"id":"1.3","name":"比值·根值·积分三工具（工具箱思想）","part":"数项级数判敛","book":"无穷级数","teachMd":"**起步动作（课内基本功，速过）** ：d'Alembert 比值 $\\lim\\dfrac{u_{n+1}}{u_n}=\\rho$：$\\rho<1$ 收敛、$\\rho>1$ 发散（此时通项必不趋零）；Cauchy 根值 $\\lim\\sqrt[n]{u_n}=\\rho$ 同理；积分判别法：$f$ 在 $[N,+\\infty)$ 非负递减，则 $\\sum f(n)$ 与 $\\int_N^{+\\infty}f(x)dx$ 同敛散。\n\n**核心思想（竞赛关注三点）** ：\n\n1. **认脸**：含 $n!$、$a^n$、$n^n$ → 比值/根值；含 $\\ln n$、$n$ 次幂对数 → 积分判别；通项是幂的比值 → 抓大头（1.2）；\n2. **$\\rho=1$** **失效的善后**：失效不等于信息作废——比值**恒大于 1** 依然说明通项单调不趋零（见例 1.3-2），失效后回 1.2 比阶或 1.4 放缩；\n3. **根值强于比值**：比值极限存在 ⟹ 根值极限存在且相等（几何平均原理，拔 1.3），反之不然——比值振荡而根值从容给答案的题只认根值。\n\n**必背速查**：\n\n|通项特征|首选|例子与结果|\n| ----------| -----------------------| ------------------------|\n|$\\dfrac{n!}{n^n}$、$\\dfrac{a^n}{n!}$|比值|$\\sum\\dfrac{2^nn!}{n^n}$：$\\rho=\\dfrac2e<1$ 收敛|\n|$\\left(\\dfrac{\\ln n}{n}\\right)^{n}$、$\\left(a_n\\right)^{n}$|根值|$\\lim\\dfrac{\\ln n}{n}=0<1$ 收敛|\n|$\\dfrac{1}{n\\ln^{q}n}$|积分|$q>1$ 收敛，$q\\le1$ 发散|\n|$\\left(1+\\dfrac1n\\right)^{n^2}e^{-n}$|比值失效→根值/Taylor|通项 $\\to e^{-\\frac12}\\neq0$ 发散（例 1.1-1）|\n\n**易错警示**：\n\n|错误|纠正|\n| ---------------------------| ---------------------------------------------|\n|$\\rho=1$ 时宣判\"无法判断就猜发散\"|失效后回比阶/积分/放缩，结论两可|\n|积分判别法忘记验证\"递减\"|条件不满足时结论可以完全错（构造振荡反例）|\n|对 $\\sum\\dfrac{1}{n^{1+\\frac1n}}$ 用比值|幂扰动型用抓大头（例 1.2-1(3)），比值恒失效|","examplesMd":" **【例 1.3-1】（★★，经典）**  判断敛散性：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(n!)^{2}}{(2n)!}$；　(2) $\\sum\\limits_{n=2}^{\\infty}\\left(\\dfrac{\\ln n}{n}\\right)^{n}$；　(3) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{n^{n}}{n!}$。\n\n**思路分析**：(1)(3) 阶乘结构比值；(2) 整体 $n$ 次幂根值。\n\n**详细解答**：\n\n(1) $\\dfrac{u_{n+1}}{u_n}=\\dfrac{\\left((n+1)!\\right)^{2}(2n)!}{(n!)^{2}(2n+2)!}=\\dfrac{(n+1)^{2}}{(2n+2)(2n+1)}=\\dfrac{n+1}{2(2n+1)}\\longrightarrow\\dfrac14<1$，**收敛**。\n\n(2) $\\sqrt[n]{u_n}=\\dfrac{\\ln n}{n}\\longrightarrow0<1$，**收敛**。\n\n(3) $\\dfrac{u_{n+1}}{u_n}=\\dfrac{(n+1)^{n+1}\\,n!}{n^{n}(n+1)!}=\\left(1+\\dfrac1n\\right)^{n}\\longrightarrow e>1$，此时通项不趋于 0，**发散**。\n\n**检验**：(1) $n=10$：$\\dfrac{11}{2\\times21}=\\dfrac{11}{42}\\approx0.26$，与 $\\dfrac14$ 接近 ✓。\n\n**方法总结**：==阶乘比值约干净、==​==$n$== ==次幂找根值==；$\\rho>1$ 的发散是\"通项不趋零\"的发散，卷面最好补一句\"$u_n\\not\\to0$\"。\n\n **【例 1.3-2】（★★★，经典陷阱题）**  判断 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{e^{n}n!}{n^{n}}$ 的敛散性。\n\n**思路分析**：比值极限恰为 $1$（$e$ 撞 $e$）——失效。但**比值本身**恒大于 1：$\\left(1+\\dfrac1n\\right)^{n}$ 严格递增趋于 $e$，故每一步 $\\dfrac{u_{n+1}}{u_n}=\\dfrac{e}{\\left(1+\\frac1n\\right)^{n}}>1$。\n\n**详细解答**：$u_1=e>0$，而 $u_{n+1}>u_n$ 对一切 $n$ 成立，故 $u_n\\ge u_1=e>0$，通项不趋于 0，级数**发散**。\n\n（Stirling 公式印证：$n!\\sim\\sqrt{2\\pi n}\\left(\\dfrac ne\\right)^{n}$，故 $u_n\\sim\\sqrt{2\\pi n}\\to+\\infty$——通项不但不趋零，还趋于无穷。）\n\n**检验**：$u_5=\\dfrac{e^5\\cdot120}{3125}\\approx e^5\\times0.0384\\approx5.68$，$u_{10}=\\dfrac{e^{10}\\cdot3628800}{10^{10}}\\approx e^{10}\\times3.6\\times10^{-4}\\approx7.97$——确实在递增 ✓。\n\n**方法总结**：==比值极限为 1 时，比值不等式仍是硬信息==：恒 $>1$ ⟹ 正项通项单调增 ⟹ 不趋零 ⟹ 发散。这是\"$\\rho=1$ 失效\"的标准善后动作之一。"},"1.4":{"id":"1.4","name":"放缩比较与构造论证（CMC 大题核心）","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：CMC 判敛大题的通项往往**不能直接比阶**（分母含 $\\sin n$、含抽象 $a_n$、含差结构），标准动作是**放缩出可比较的上下界**：要证收敛，把 $u_n$ 放大到某个收敛尺子上；要证发散，把 $u_n$ 压小到发散尺子上。==放缩方向由目标决定：证收敛往上放，证发散往下压==。\n\n**必背放缩库**：\n\n1. $\\ln(1+x)\\le x$（$x>-1$）；$\\dfrac{x}{1+x}\\le\\ln(1+x)\\le x$（$x>-1$）——双向；\n2. $\\dfrac{1}{\\sqrt{n+1}+\\sqrt n}=\\sqrt{n+1}-\\sqrt n$——有理化升阶 $2$；\n3. $\\sin x\\le x$、$1-\\cos x\\le\\dfrac{x^2}2$；\n4. $n\\le2^{n}$（幂压倒多项）、$n!\\ge\\left(\\dfrac n2\\right)^{n/2}$（后一半因子每个 $\\ge\\dfrac n2$）；\n5. **抽象恒等式**：$\\dfrac{a}{1+a}\\le\\min(a,1)$；$\\dfrac{a}{1+n^{2}a}<\\dfrac{1}{n^{2}}$（$a>0$，分母放大）。\n\n**易错警示**：\n\n|错误|纠正|\n| ----------------------------------| --------------------------------|\n|证收敛却往下压（$u_n\\ge v_n$，$v$ 收敛无用于 $u$）|方向对准目标：收上传下发|\n|放缩只对部分 $n$ 成立|加\"当 $n\\ge N$ 时\"，有限项不影响敛散|\n|分母含 $\\sin n$ 视为\"麻烦\"|$\\lvert\\sin n\\rvert\\le1$ 直接进分母/分子放缩，不是障碍|","examplesMd":" **【例 1.4-1】（★★，经典）**  判断敛散性：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{\\sqrt{n+1}-\\sqrt n}{n}$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\ln\\left(1+\\dfrac1n\\right)$。\n\n**思路分析**：(1) 有理化后放缩；(2) 双向不等式 $\\dfrac{x}{1+x}\\le\\ln(1+x)$ 向下压。\n\n**详细解答**：\n\n(1) $u_n=\\dfrac{1}{n\\left(\\sqrt{n+1}+\\sqrt n\\right)}\\le\\dfrac{1}{n\\cdot2\\sqrt n}=\\dfrac{1}{2n^{3/2}}$，与 $\\sum\\dfrac1{n^{3/2}}$ 比较，**收敛**。\n\n(2) $\\ln\\left(1+\\dfrac1n\\right)\\ge\\dfrac{\\frac1n}{1+\\frac1n}=\\dfrac{1}{n+1}$（放缩库 1 的左半，$x=\\dfrac1n$），而 $\\sum\\dfrac1{n+1}$ 发散，故**发散**。（顺带：$S_n=\\ln(n+1)\\to+\\infty$，部分和直接验证。）\n\n**检验**：(1) $n=100$：$u_n=\\dfrac{10.0499-10}{100}=4.99\\times10^{-4}$，$\\dfrac{1}{2n^{3/2}}=\\dfrac1{2000}=5\\times10^{-4}$，确实压在下界上方且贴合 ✓。\n\n**方法总结**：==有理化、对数不等式、幂压制是放缩三大件==；证发散时\"压到调和级数一族\"是第一反射。\n\n **【例 1.4-2】（★★★，真题风格）**  设 $a_n>0$。(1) 若 $\\sum a_n$ 发散，证明 $\\sum\\dfrac{a_n}{1+a_n}$ 发散；(2) 证明无论 $\\sum a_n$ 敛散如何，$\\sum\\dfrac{a_n}{1+n^{2}a_n}$ 总收敛。\n\n**思路分析**：抽象分母型。两问共用同一观察：$\\dfrac{a}{1+a}$ 与 $\\dfrac{a}{1+n^2a}$ 的分母\"谁在主导\"分段讨论。\n\n**详细解答**：\n\n(1) 分两段。设 $A=\\{n: a_n>1\\}$。若 $A$ 无限，则 $n\\in A$ 时 $\\dfrac{a_n}{1+a_n}>\\dfrac{a_n}{2a_n}=\\dfrac12$，通项不趋零，发散；若 $A$ 有限，则 $n$ 充分大时 $a_n\\le1$，$\\dfrac{a_n}{1+a_n}\\ge\\dfrac{a_n}{2}$，与发散的 $\\sum a_n$ 比较，发散。∎\n\n(2) $\\dfrac{a_n}{1+n^{2}a_n}<\\dfrac{a_n}{n^{2}a_n}=\\dfrac{1}{n^{2}}$（分母丢掉常数 $1$ 只会放大分母），与 $\\sum\\dfrac1{n^2}$ 比较，**恒收敛**。∎\n\n**检验**（具体化）：$a_n\\equiv1$（$\\sum a_n$ 发散）：$\\sum\\dfrac12$ 发散 ✓、$\\sum\\dfrac{1}{1+n^2}$ 收敛 ✓；$a_n=\\dfrac1{n^2}$：$\\sum\\dfrac{a_n}{1+a_n}\\sim\\sum\\dfrac1{n^2}$ 收敛——此时(1)的结论\"若发散\"前提不成立，两问自洽。\n\n**方法总结**：==抽象分母== ==$\\dfrac{a}{1+\\square}$==​==：证发散压分母（==​==$a$== ==小则分母== ==$\\approx1$==​==），证收敛抬分母（==​==$\\square$== ==大则整体== ==$\\le\\dfrac1\\square$==​==）==。这是 CMC 与考研共同的\"概念型大题\"模板。"},"1.5":{"id":"1.5","name":"交错级数与莱布尼茨（单调验证思想）——主攻","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：莱布尼茨判别法：$u_n$ **单调递减**趋于 $0$ ⟹ $\\sum(-1)^{n-1}u_n$ 收敛，且余项满足 $\\lvert r_n\\rvert\\le u_{n+1}$、和 $S$ 介于相邻两个部分和之间（偶数部分和递增、奇数部分和递减夹逼）。竞赛考的从来不是定理本身，而是**单调性这一关怎么过**：\n\n|验证 $u_n\\downarrow$ 的三招|操作|例|\n| --------------| ------------------------------| ----|\n|① 比差|$u_n-u_{n+1}\\ge0$（通分/有理化）|$u_n=\\dfrac{n}{n^2+1}$|\n|② 比商|$\\dfrac{u_{n+1}}{u_n}\\le1$（正项）|$u_n=\\dfrac{n!}{n^n}$|\n|③ 连续化|令 $f(x)$ 使 $f(n)=u_n$，求 $f'(x)<0$（只需对 $x\\ge N$ 成立）|$u_n=\\dfrac{\\ln(n+1)}{n}$、$u_n=n^{1/n}-1$|\n\n两个保命细节：**单调只需从某项起成立**（有限项不影响敛散）；**==$u_n\\to0$**== ==== **==与==** ==== **==$u_n\\downarrow0$**== ==== **==缺一不可==**——$u_n\\to0$ 但不单调时莱布尼茨失效，级数可能发散（构造 $u_{2k}=u_{2k-1}=\\dfrac{1}{\\sqrt k}$ 之类使 $\\sum(-1)^nu_n$ 发散是决赛级反例）。\n\n**与绝对收敛的接线**：交错级数判敛标准流程是\"先判绝对（$\\sum u_n$ 比阶/三工具）→ 不绝对再莱布尼茨 → 得条件收敛\"，完整模板见 1.6。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------| ----------------------------------|\n|只验证 $u_n\\to0$ 就写\"由莱布尼茨收敛\"|单调性必须显式验证（三招之一）|\n|单调性从头验不到位就放弃|只需 $n\\ge N$ 后单调，卷面写\"当 $n$ 充分大\"|\n|余项估计写成 $\\lvert r_n\\rvert\\le u_n$|是 $\\le u_{n+1}$（从第 $n+1$ 项开始截断）|","examplesMd":" **【例 1.5-1】（★★，真题风格）**  讨论 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(-1)^{n}}{n+\\ln n}$ 的敛散性（发散 / 条件收敛 / 绝对收敛三选一）。\n\n**思路分析**：绝对值 $\\sim\\dfrac1n$ 不绝对收敛；莱布尼茨两条件逐条验证——单调用连续化招。\n\n**详细解答**：**绝对值**：$\\dfrac{1}{n+\\ln n}\\sim\\dfrac1n$（抓大头，1.2），$\\sum\\dfrac1{n+\\ln n}$ 发散，不绝对收敛。\n\n**交错**：$u_n=\\dfrac{1}{n+\\ln n}\\to0$；令 $f(x)=\\dfrac{1}{x+\\ln x}$，$f'(x)=-\\dfrac{1+\\frac1x}{(x+\\ln x)^{2}}<0$（$x\\ge1$），$u_n$ 递减。由莱布尼茨判别法收敛。\n\n**结论**：条件收敛。\n\n**检验**：$u_1=1$，$u_2=\\dfrac{1}{2+0.693}=0.370$，$u_3=\\dfrac{1}{3+1.099}=0.244$——递减 ✓。\n\n**方法总结**：==三选一流程：绝对值比阶 → 莱布尼茨 → 报\"条件收敛\"==；分母 $n+\\ln n$ 型单调性交给 $f'(x)$，一步到位。\n\n **【例 1.5-2】（★★，经典）**  讨论 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}\\left(\\sqrt{n+1}-\\sqrt n\\right)$ 的敛散性。\n\n**思路分析**：通项有理化后是 $\\dfrac{1}{\\sqrt{n+1}+\\sqrt n}$——绝对值 $\\sim\\dfrac{1}{2\\sqrt n}$ 发散；单调性显然（分母递增）。\n\n**详细解答**：$u_n=\\sqrt{n+1}-\\sqrt n=\\dfrac{1}{\\sqrt{n+1}+\\sqrt n}$ 单调递减趋于 $0$，莱布尼茨 ⟹ 收敛；而 $\\sum u_n\\sim\\sum\\dfrac{1}{2\\sqrt n}$ 发散。**条件收敛**。\n\n**方法总结**：与例 1.5-1 同框架但通项需先**有理化显形**——差结构（1.2 勘误复盘）在交错级数里再现：先化成商，单调与阶同时现形。"},"1.6":{"id":"1.6","name":"绝对收敛与条件收敛（二分矩阵思想）——主攻","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：变号级数的\"二分法\"：$\\sum|u_n|$ 收敛 ⟹ $\\sum u_n$ 收敛（称绝对收敛；证明：$0\\le u_n^{+},u_n^{-}\\le|u_n|$，而 $u_n=u_n^{+}-u_n^{-}$，正负部分别比较判敛）。$\\sum u_n$ 收敛而 $\\sum|u_n|$ 发散称条件收敛。三态之间**没有暗道**：\n\n|命题|真假|依据 / 反例|\n| ------------------------------------------| ------------| ------------------------|\n|绝对收敛 ⟹ 收敛|✔|正负部分解|\n|收敛 ⟹ 绝对收敛|✘|$\\sum\\dfrac{(-1)^{n}}{n}$ 条件收敛|\n|$\\sum\\lvert u_n\\rvert$ 发散 ⟹ $\\sum u_n$ 发散|✘|同上反例|\n|条件收敛 ⟹ 正项子级数、负项子级数都发散|✔|拔 1.6 证明|\n|绝对收敛 ⟹ 任意重排后仍收敛且和不变|✔（速览）|Riemann 重排定理的正面|\n|条件收敛级数可重排成任意和 / 发散|✔（速览）|Riemann 重排定理|\n\n**必背条件收敛样板库**（$0<p\\le1$）：$\\sum\\dfrac{(-1)^{n-1}}{n^{p}}$、$\\sum\\dfrac{\\sin n}{n}$、$\\sum\\dfrac{\\cos n}{n}$（1.7）、$\\sum(-1)^{n}\\left(n^{1/n}-1\\right)$。\n\n**卷面二分流程**（与 1.5 衔接）：第 1 步判 $\\sum|u_n|$（正项全套：抓大头/三工具/放缩）→ 收敛则报绝对收敛；发散则第 2 步验莱布尼茨/狄利克雷 → 收敛报条件收敛；再不行第 3 步查通项（可能根本发散）。\n\n**易错警示**：\n\n|错误|纠正|\n| --------------------------| --------------------------------------------|\n|\"$\\sum u_n$ 收敛，故 $\\sum u_n^{2}$ 收敛\"|不一定：$u_n=\\dfrac{(-1)^n}{\\sqrt n}$ 时 $\\sum u_n^2=\\sum\\dfrac1n$ 发散（例 1.6-2）|\n|条件收敛级数随意拆项分组|拆成 $\\sum u^{+}-\\sum u^{-}$ 时两个都发散，\"∞−∞\"非法（拔 1.6）|\n|把 $\\sum|u_n|","examplesMd":" **【例 1.6-1】（★★，经典）**  完整讨论 $\\sum\\limits_{n=1}^{\\infty}(-1)^{n}\\dfrac{n}{n^{2}+1}$ 的敛散性。\n\n**思路分析**：标准二分流程的示范题。\n\n**详细解答**：**第 1 步（绝对）** ：$\\Big\\lvert u_n\\Big\\rvert=\\dfrac{n}{n^{2}+1}\\sim\\dfrac1n$，$\\sum\\dfrac{n}{n^2+1}$ 发散，不绝对收敛。\n\n**第 2 步（交错）** ：$u_n=\\dfrac{n}{n^{2}+1}\\to0$；连续化 $f(x)=\\dfrac{x}{x^{2}+1}$，$f'(x)=\\dfrac{1-x^{2}}{(x^{2}+1)^{2}}<0$（$x>1$），自第 2 项起递减。莱布尼茨 ⟹ 收敛。\n\n**结论**：条件收敛。\n\n**检验**：数值抽验部分和逼近：$S_{10}\\approx-0.221$，$S_{11}\\approx0.213$……和落在相邻部分和之间振荡收窄 ✓（莱布尼茨余项性质）。\n\n**方法总结**：==二分流程一步不跳：绝对判别 → 莱布尼茨 → 结论三选一==，卷面缺第 1 步是最常见扣分点。\n\n **【例 1.6-2】（★★★，概念经典）**  设 $\\sum u_n$ 条件收敛。判断\"$\\sum u_n^{2}$ 必发散\"与\"$\\sum u_n^{2}$ 必收敛\"哪个成立，或都不成立。\n\n**思路分析**：条件收敛只保证 $u_n\\to0$ 与变号结构，$u_n^{2}$ 的阶可以在 $\\dfrac1n$ 两侧横跳——两头造例。\n\n**详细解答**：**都不成立**。\n\n发散例：$u_n=\\dfrac{(-1)^n}{\\sqrt n}$——$\\sum u_n$ 条件收敛（莱布尼茨 + $\\sum\\dfrac{1}{\\sqrt n}$ 发散），而 $\\sum u_n^{2}=\\sum\\dfrac1n$ 发散。\n\n收敛例：$u_n=\\dfrac{(-1)^{n}}{\\sqrt n\\,\\ln n}$（$n\\ge2$）——绝对值 $\\sum\\dfrac{1}{\\sqrt n\\ln n}$：与 $\\dfrac1n$ 比阶 $\\lim\\dfrac{1/(\\sqrt n\\ln n)}{1/n}=\\lim\\dfrac{\\sqrt n}{\\ln n}=+\\infty$，比调和还大，发散；交错：$u_n=\\dfrac{1}{\\sqrt n\\ln n}\\to0$ 且递减（$f(x)=\\dfrac{1}{\\sqrt x\\ln x}$，两项因子都递减），莱布尼茨收敛——条件收敛。而 $\\sum u_n^{2}=\\sum\\dfrac{1}{n\\ln^{2}n}$ 由积分判别法**收敛**。\n\n**方法总结**：==条件收敛对== ==$\\sum u_n^2$== ==零约束==：$u_n=\\dfrac{(-1)^n}{n^{1/2}}$ 与 $u_n=\\dfrac{(-1)^n}{n^{1/2}\\ln n}$ 一散一收，分界就在于平方后是否还压着 $\\dfrac{1}{n\\ln^q n}$ 尺子。概念题\"必\"字当头先找反例对。"},"1.7":{"id":"1.7","name":"狄利克雷与阿贝尔判别法（分部求和思想）","part":"数项级数判敛","book":"无穷级数","teachMd":"**核心思想**：莱布尼茨管不住的变号级数（因子不是 $(-1)^n$ 而是 $\\sin n$、$\\cos nx$ 等\"部分和有界\"的振荡因子），交给**分部求和（Abel 变换）** ：\n\n- **狄利克雷判别法**：$\\sum a_n$ 的部分和**有界**，$b_n$ **单调趋于 0** ⟹ $\\sum a_nb_n$ 收敛；\n- **阿贝尔判别法**：$\\sum a_n$ **收敛**，$b_n$ **单调有界** ⟹ $\\sum a_nb_n$ 收敛。\n\n龙头应用：$\\sum\\dfrac{\\sin nx}{n}$、$\\sum\\dfrac{\\cos nx}{n}$（$x\\ne2k\\pi$）收敛——==\"振荡因子有界 + 单调小量\"的黄金组合。==\n\n**必背工具**（三角部分和公式，$x\\ne2m\\pi$）：\n\n$\\sum_{k=1}^{n}\\sin kx=\\dfrac{\\sin\\frac{nx}{2}\\sin\\frac{(n+1)x}{2}}{\\sin\\frac x2}\\qquad\\Rightarrow\\qquad\\Big\\lvert\\sum_{k=1}^{n}\\sin kx\\Big\\rvert\\le\\dfrac{1}{\\Big\\lvert\\sin\\frac x2\\Big\\rvert}$\n\n（推导：乘 $2\\sin\\dfrac x2$ 后积化和差裂项相消；$\\sum\\cos kx=\\dfrac{\\sin\\frac{nx}{2}\\cos\\frac{(n+1)x}{2}}{\\sin\\frac x2}$ 同理。）\n\n**二级必背**（本方法的招牌转化）：$\\lvert\\sin n\\rvert\\ge\\sin^{2}n=\\dfrac{1-\\cos2n}{2}$——把\"绝对值不好估\"化成\"常数项 + 可收敛振荡项\"，是判断 $\\sum\\dfrac{\\lvert\\sin n\\rvert}{n}$ 发散的钥匙（例 1.7-1）。\n\n**易错警示**：\n\n|错误|纠正|\n| --------------------------| ------------------------------------------------------|\n|对 $\\sum\\dfrac{\\sin n}{n}$ 用比值/根值|振荡因子让比值无极限，工具直接失效，换 D&A|\n|部分和有界写成\"通项有界\"|判别法要的是**部分和** $A_n$ 有界，比通段强得多|\n|$x=2k\\pi$ 时仍套公式|$\\sin\\dfrac x2=0$ 公式失效，此时级数为 $\\sum\\dfrac0n=0$ 平凡收敛（$\\cos$ 情形则成调和发散）|","examplesMd":" **【例 1.7-1】（★★★，经典名题）**  证明 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{\\sin n}{n}$ 条件收敛。\n\n**思路分析**：收敛用狄利克雷（$x=1$）；非绝对用 $\\lvert\\sin n\\rvert\\ge\\sin^{2}n$ 降幂转化。\n\n**详细解答**：**收敛**：$\\sum\\limits_{k=1}^{n}\\sin k=\\dfrac{\\sin\\frac n2\\sin\\frac{n+1}2}{\\sin\\frac12}$，故部分和满足 $\\lvert A_n\\rvert\\le\\dfrac{1}{\\sin\\frac12}\\approx2.09$ 有界；$b_n=\\dfrac1n$ 单调趋 $0$。狄利克雷 ⟹ 收敛。\n\n**不绝对**：$\\lvert\\sin n\\rvert\\ge\\sin^{2}n=\\dfrac{1-\\cos2n}{2}$，故\n\n$\\sum\\dfrac{\\lvert\\sin n\\rvert}{n}\\ge\\dfrac12\\sum\\dfrac1n-\\dfrac12\\sum\\dfrac{\\cos2n}{n}$\n\n$\\sum\\dfrac{\\cos2n}{n}$ 收敛（狄利克雷：$\\sum_{k\\le n}\\cos2k=\\dfrac{\\sin n\\cos(n+1)}{\\sin1}$ 有界，$\\dfrac1n\\downarrow0$），$\\sum\\dfrac1n$ 发散，右端 $\\to+\\infty$，故 $\\sum\\dfrac{\\lvert\\sin n\\rvert}{n}$ 发散。\n\n**结论**：条件收敛。∎\n\n**检验**：数值抽验：$\\sum\\dfrac{\\sin n}{n}$ 前 20 项部分和 $\\approx1.07$（真实和 $\\dfrac{\\pi-1}{2}\\approx1.0708$，由 $\\sum\\dfrac{\\sin nx}{n}=\\dfrac{\\pi-x}{2}$，$0<x<2\\pi$ 取 $x=1$ ✓——4.1 傅里叶收获同款结论）。\n\n**方法总结**：==振荡因子查部分和有界，配单调小量即收敛==；判非绝对用 $\\sin^{2}$ 降幂拆\"调和 − 收敛项\"。此题是\"看起来只能背结论、其实全程可推导\"的典范。\n\n **【例 1.7-2】（★★★，竞赛风格）**  讨论 $\\sum\\limits_{n=2}^{\\infty}\\dfrac{\\sin n}{\\ln n}$ 的敛散性。\n\n**思路分析**：与例 1.7-1 只换了小量 $\\dfrac1n\\to\\dfrac{1}{\\ln n}$——单调性仍在（趋零更慢），狄利克雷照用；非绝对的论证也要跟着换尺子。\n\n**详细解答**：**收敛**：$\\dfrac{1}{\\ln n}$ 单调递减趋于 $0$，$\\sum\\sin n$ 部分和有界，狄利克雷 ⟹ 收敛。\n\n**不绝对**：$\\dfrac{\\lvert\\sin n\\rvert}{\\ln n}\\ge\\dfrac{\\sin^{2}n}{\\ln n}=\\dfrac{1}{2\\ln n}-\\dfrac{\\cos2n}{2\\ln n}$；$\\sum\\dfrac{\\cos2n}{\\ln n}$ 仍由狄利克雷收敛（$\\dfrac1{\\ln n}\\downarrow0$），而 $\\sum\\dfrac{1}{2\\ln n}$ 发散（通项比 $\\dfrac1n$ 还大：$\\lim\\dfrac{1/\\ln n}{1/n}=+\\infty$）。故绝对值级数发散。\n\n**结论**：条件收敛。\n\n**方法总结**：小量换成 $\\dfrac{1}{\\ln n}$、$\\dfrac{1}{\\ln\\ln n}$ 等慢单调序列，套路纹丝不动——==判别法的核心是\"单调趋零\"四字，趋零速度无关紧要==（速度只影响收敛快慢，5.2 余项估计才关心速度）。"},"2.1":{"id":"2.1","name":"收敛半径与收敛域（端点单独讨论思想）","part":"幂级数","book":"无穷级数","teachMd":"**起步动作（课内基本功，速过）** ：$R=\\lim\\limits_{n\\to\\infty}\\Big\\lvert\\dfrac{a_n}{a_{n+1}}\\Big\\rvert$（或 $R=\\dfrac{1}{\\lim\\sqrt[n]{\\lvert a_n\\rvert}}$，极限为 $0/+\\infty$ 时 $R=+\\infty/0$）；收敛区间 $\\left(-R,R\\right)$，**收敛域 = 收敛区间 +**  **逐个验证后的端点**<span data-type=\"text\" style=\"color: var(--b3-font-color8);\">。</span>\n\n**核心思想（竞赛关注四个变形）** ：\n\n1. **缺项级数**（如只含 $x^{2n}$、$x^{3n}$）：公式法失效，改对**通项整体**用比值/根值：$\\lim\\Big\\lvert\\dfrac{u_{n+1}(x)}{u_n(x)}\\Big\\rvert<1$ 解出 $x$ 的范围；\n2. **平移型** $\\sum a_n(x-x_0)^n$：收敛区间以 $x_0$ 为中心，$R$ 照算；\n3. **端点生死判定**：代入后是数项级数，回第一部分全套判敛（莱布尼茨、$p$-级数、抓大头）；含阶乘/组合数的端点用 **Stirling 公式** $n!\\sim\\sqrt{2\\pi n}\\left(\\dfrac ne\\right)^{n}$ 定通项极限；\n4. **相邻运算传递**：逐项求导、逐项积分后 $R$ 不变，但**端点敛散可能改变**（$\\sum\\dfrac{x^{n}}{n}$ 求导后 $\\sum x^{n-1}$，$x=-1$ 由收敛变发散）。\n\n**易错警示**：\n\n|错误|纠正|\n| -------------------------------| --------------------------------------|\n|缺项级数硬套 $a_n/a_{n+1}$（隔项比值错位）|对通项 $u_n(x)$ 整体做比值|\n|端点不代、收敛域写成开区间|收敛域必含端点讨论，哪怕结论是开区间|\n|端点含 $n!$ 干瞪眼|Stirling 一发定通项极限（例 2.1-1）|\n|$R=0$、$R=+\\infty$ 忘记单独表述|这两个特例要专门写一句|","examplesMd":" **【例 2.1-1】（★★★，经典）**  求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(2n)!}{(n!)^{2}}x^{n}$ 的收敛域。\n\n**思路分析**：$a_n=\\dfrac{(2n)!}{(n!)^2}$ 是组合数 $\\binom{2n}{n}$，比值精确可算；端点用 Stirling。\n\n**详细解答**：$\\dfrac{a_n}{a_{n+1}}=\\dfrac{(2n)!\\,\\left((n+1)!\\right)^{2}}{(2n+2)!\\,(n!)^{2}}=\\dfrac{(n+1)^{2}}{(2n+2)(2n+1)}=\\dfrac{n+1}{2(2n+1)}\\longrightarrow\\dfrac14$\n\n故 $R=\\dfrac14$。**端点** $x=\\pm\\dfrac14$：由 Stirling，$\\dfrac{(2n)!}{(n!)^{2}}\\sim\\dfrac{4^{n}}{\\sqrt{\\pi n}}$，故 $u_n\\left(\\pm\\dfrac14\\right)\\sim\\dfrac{(\\pm1)^{n}}{\\sqrt{\\pi n}}$，绝对值趋于 $0$ 但 $\\sum\\dfrac{1}{\\sqrt{\\pi n}}$ 发散——两端都**发散**。\n\n**收敛域**：$\\left(-\\dfrac14,\\dfrac14\\right)$。\n\n**检验**：$\\dfrac{a_{10}}{a_{11}}=\\dfrac{11}{2\\times21}=\\dfrac{11}{42}\\approx0.262$，逼近 $\\dfrac14$ ✓；$a_n/4^{n}$：$n=5$ 时 $\\binom{10}{5}/4^5=252/1024\\approx0.246$，$1/\\sqrt{\\pi\\cdot5}\\approx0.252$ ✓ Stirling 渐近吻合。\n\n**方法总结**：==组合数系数先算相邻比值，端点 Stirling 定生死==；$\\binom{2n}{n}\\sim\\dfrac{4^{n}}{\\sqrt{\\pi n}}$ 本身值得背下（2.4 拔高 arcsin 展开复用）。\n\n **【例 2.1-2】（★★，真题风格）**  求收敛域：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{n\\,x^{2n}}{2^{n}}$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(x+1)^{n}}{n\\cdot3^{n}}$。\n\n**思路分析**：(1) 缺项（只含偶次幂）→ 通项整体比值；(2) 平移型 + 端点一收一散。\n\n**详细解答**：\n\n(1) $\\Big\\lvert\\dfrac{u_{n+1}}{u_n}\\Big\\rvert=\\dfrac{(n+1)\\lvert x\\rvert^{2n+2}}{2^{n+1}}\\cdot\\dfrac{2^{n}}{n\\lvert x\\rvert^{2n}}=\\dfrac{n+1}{n}\\cdot\\dfrac{\\lvert x\\rvert^{2}}{2}\\longrightarrow\\dfrac{\\lvert x\\rvert^{2}}{2}$，要求 $<1$ 得 $\\lvert x\\rvert<\\sqrt2$，$R=\\sqrt2$。端点 $x=\\pm\\sqrt2$：$u_n=n\\to\\infty$ 通项不趋零，均发散。收敛域 $\\left(-\\sqrt2,\\sqrt2\\right)$。\n\n(2) 中心 $x_0=-1$，$R=\\lim\\dfrac{n\\cdot3^{n}}{(n+1)3^{n+1}}=\\dfrac13\\cdot\\lim\\dfrac{n}{n+1}=\\dfrac13$，即 $-4<x<2$。端点：$x=-4$：$\\sum\\dfrac{(-1)^{n}}{n}$ 收敛（莱布尼茨）；$x=2$：$\\sum\\dfrac1n$ 发散。收敛域 $\\left[-4,2\\right)$。\n\n**检验**：(2) 在 $x=-4$ 处级数 $\\sum\\dfrac{(-3)^{n}}{n\\cdot3^{n}}=\\sum\\dfrac{(-1)^n}{n}$ ✓；在 $x=2$ 处 $\\sum\\dfrac{3^{n}}{n\\cdot3^{n}}=\\sum\\dfrac1n$ ✓。\n\n**方法总结**：==缺项整体比、平移先定心；端点逐个回数项判敛==，一收一散是最常见的\"埋分点\"。"},"2.2":{"id":"2.2","name":"和函数两招：先导后积与先积后导（还原思想）——主攻","part":"幂级数","book":"无穷级数","teachMd":"**核心思想**：一切和函数问题的终点都是**还原成几何级数** $\\sum t^{n}=\\dfrac{1}{1-t}$（$|t|<1$）。通项里多出来的系数用求导/积分消去：\n\n|通项特征|动作|原理|\n| -------------| ---------------------------------| ------------------------------|\n|含 $n$（$nx^{n-1}$、$n^2x^n$…）|**先求导后积分**：$S(x)=\\int_0^x S'(t)dt$|求导把 $n$ 变 $1$、$x^{n}$ 降次，向 $\\sum x^{n}$ 靠拢|\n|含 $\\dfrac1n$、$\\dfrac{1}{2n+1}$|**先积分后求导**：积分一次消掉分母 $n$|$\\int_0^x t^{n-1}dt=\\dfrac{x^{n}}{n}$|\n|混合（$\\dfrac{n}{n+1}$、$\\dfrac{1}{n(n+1)}$）|**拆分**：部分分式/假分式化为上两类之和|线性性|\n\n**两个必守细节**：积分还原时**定常数** **$S(0)$**（丢常数是最普遍失分点）；和函数在**收敛域上连续**，端点值用极限代（Abel 定理，3.2 正式陈述）。\n\n**必背基本和函数表**（$|x|<1$，端点单独记）：\n\n|级数|和函数|端点补充|\n| ------| --------| ------------|\n|$\\sum\\limits_{n\\ge0}x^{n}$|$\\dfrac{1}{1-x}$|——|\n|$\\sum\\limits_{n\\ge1}nx^{n}$|$\\dfrac{x}{(1-x)^{2}}$|——|\n|$\\sum\\limits_{n\\ge1}n^{2}x^{n}$|$\\dfrac{x(1+x)}{(1-x)^{3}}$|——|\n|$\\sum\\limits_{n\\ge1}\\dfrac{x^{n}}{n}$|$-\\ln(1-x)$|$x=-1$ 收敛，值 $-\\ln2$|\n|$\\sum\\limits_{n\\ge1}(-1)^{n-1}\\dfrac{x^{n}}{n}$|$\\ln(1+x)$|$x=1$ 收敛，值 $\\ln2$|\n|$\\sum\\limits_{n\\ge0}(-1)^{n}\\dfrac{x^{2n+1}}{2n+1}$|$\\arctan x$|$x=\\pm1$ 收敛，值 $\\pm\\dfrac\\pi4$|\n|$\\sum\\limits_{n\\ge0}\\dfrac{x^{n}}{n!}$、$\\sum\\dfrac{(-1)^nx^{2n+1}}{(2n+1)!}$、$\\sum\\dfrac{(-1)^nx^{2n}}{(2n)!}$|$e^{x}$、$\\sin x$、$\\cos x$|全 $\\mathbb{R}$|\n\n**勘误式复盘（重要）** ——先导后积丢常数 / 丢定义域：\n\n> 错误：求 $S(x)=\\sum\\limits_{n\\ge1}\\dfrac{x^{n+1}}{n}$：两边求导 $S'(x)=\\sum x^{n}=\\dfrac{1}{1-x}$，直接写 $S(x)=-\\ln(1-x)$。  \n> 错因一：积分\"丢了下限\"——$S(x)=S(0)+\\int_0^x\\dfrac{dt}{1-t}$，而 $S(0)=0$；丢常数后误差恰好是 $S(0)$。错因二：$S'=1/(1-x)$ 只在 $|x|<1$ 成立，结论不能越过收敛域写。  \n> 纠正：$S(x)=\\int_0^{x}\\dfrac{dt}{1-t}=-\\ln(1-x)$，$x\\in[-1,1)$。（本题 $S(0)=0$ 与 $-\\ln(1-x)$ 在 $x=0$ 的值巧合一致，但流程里的\"$S(0)$ 检查\"一步不可省——换一题就是 2 分。）\n\n**易错警示**：\n\n|错误|纠正|\n| ----------------| ----------------------------------------------|\n|还原后忘代 $S(0)$|求导丢信息，积分必须用初值缝回|\n|把 $\\sum\\dfrac{x^{2n+1}}{2n+1}$ 当 $\\arctan x$|分母 $2n+1$ 对应 $\\sum x^{2n}=\\dfrac{1}{1-x^{2}}$，和是 $\\dfrac12\\ln\\dfrac{1+x}{1-x}$——**符号与分母要逐一核对**（练 2.2-2）|\n|只写 $(-1,1)$ 不给端点|端点收敛时用 Abel 极限补值，是解答题的完整版|","examplesMd":" **【例 2.2-1】（★★，经典）**  求 $\\sum\\limits_{n=1}^{\\infty}n(n+1)x^{n}$ 的和函数（$|x|<1$）。\n\n**思路分析**：系数 $n(n+1)$ 配幂次 $x^{n}$，恰是 $\\sum x^{n+1}$ 求导两次再补一个因子 $x$ 的产物：$n(n+1)x^{n}=x\\cdot\\left(x^{n+1}\\right)''$，故 $S(x)=x\\left(\\sum x^{n+1}\\right)''$。\n\n**详细解答**：记 $g(x)=\\sum\\limits_{n\\ge1}x^{n+1}=\\dfrac{x^{2}}{1-x}$（$|x|<1$）。逐项求导两次：\n\n$g''(x)=\\sum_{n\\ge1}n(n+1)x^{n-1}\\ \\Longrightarrow\\ S(x)=x\\,g''(x)$\n\n直接求导：$g'(x)=\\dfrac{2x(1-x)+x^{2}}{(1-x)^{2}}=\\dfrac{2x-x^{2}}{(1-x)^{2}}$，$g''(x)=\\dfrac{(2-2x)(1-x)^{2}+(2x-x^{2})\\cdot2(1-x)}{(1-x)^{4}}=\\dfrac{2}{(1-x)^{3}}$\n\n故 $S(x)=\\dfrac{2x}{(1-x)^{3}}$（$|x|<1$）。\n\n**检验**：由 $\\dfrac{1}{(1-x)^{3}}=\\sum\\binom{n+2}{2}x^{n}$，得 $\\dfrac{2x}{(1-x)^{3}}=2\\sum\\binom{n+2}{2}x^{n+1}$，故 $x^{m}$（$m\\ge1$）系数 $=2\\binom{m+1}{2}=m(m+1)$：$x^{1}$ 系数 $2$ ✓，$x^{2}$ 系数 $6$ ✓。\n\n**方法总结**：==$n(n+1)$== ==配== ==$x^{n}$== === 对== ==$\\sum x^{n+1}$== ==求导两次再乘== ==$x$==；同理 $n(n-1)$ 配 $x^{n-2}$ 直接是二阶导。**先写\"求导对应表\"再动笔**，系数与幂次一一对齐。\n\n **【例 2.2-2】（★★，真题风格）**  求 $S(x)=\\sum\\limits_{n=1}^{\\infty}\\dfrac{x^{n}}{n}$ 的和函数并给收敛域，进而求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(-1)^{n}}{n}$。\n\n**思路分析**：含 $\\dfrac1n$ → 先求导消分母（求导后成几何），再积分回。\n\n**详细解答**：收敛域 $[-1,1)$（$R=1$；$x=1$ 调和发散，$x=-1$ 莱布尼茨收敛）。当 $|x|<1$：\n\n$S'(x)=\\sum_{n\\ge1}x^{n-1}=\\dfrac{1}{1-x},\\qquad S(0)=0$\n\n$S(x)=\\int_{0}^{x}\\dfrac{dt}{1-t}=-\\ln(1-x)$\n\n$x=-1$ 处级数收敛，由 Abel 定理（和函数在收敛域上左连续）：\n\n$\\sum_{n\\ge1}\\dfrac{(-1)^{n}}{n}=S(-1)=\\lim_{x\\to-1^{+}}\\left[-\\ln(1-x)\\right]=-\\ln2$\n\n**检验**：数值：$\\sum\\dfrac{(-1)^n}{n}=-0.6931$，$-\\ln2=-0.6931$ ✓。\n\n**方法总结**：==含== ==$\\frac1n$==​==：求导成几何、积分回对数；端点值 = 和函数在该点的（单侧）极限==。$\\ln2=\\sum\\dfrac{(-1)^{n-1}}{n}$ 是本书第一次收割它，3.2 将从幂级数角度重演。"},"2.3":{"id":"2.3","name":"和函数进阶：差分消元·微分方程·母函数（方程化思想）——主攻","part":"幂级数","book":"无穷级数","teachMd":"**核心思想**：通项带\"组合结构\"（$H_n$、递推系数、双阶乘）时，两招还原不够用，升维打击：\n\n1. **错位相减（差分消元）** ：对 $S(x)$ 乘 $(1-x)$ 或移位相减，系数的**差分**现形（$H_n-H_{n-1}=\\dfrac1n$）——离散版的\"分部求和\"；\n2. **微分方程法**：把 $S'$、$S$ 用级数系数**对齐幂次**（$\\sum a_nx^{n}$ 与 $\\sum a_{n-1}x^{n-1}$ 同乘 $x$ 移位），得到 $S$ 满足的 ODE，带初值解出（解 ODE 的基本功见《微分方程习题集》）；\n3. **母函数法**：数列 $\\{a_n\\}$ 满足**线性递推**时，$\\sum a_nx^{n}$ 整体代递推式，得 $S$ 的代数方程——递推自动消失。\n\n **\"积不出\"预案**：若 $S'(x)$ 是 $e^{x^{2}}$、$\\dfrac{\\sin x}{x}$ 类无初等原函数，和函数就**保留定积分形式** $S(x)=\\int_0^{x}S'(t)dt$——这不是偷懒，是唯一正确答案；数值与估值再走级数（2.5、5.2）。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------------| --------------------------------------|\n|移位相减时指数对不齐|写出两边 $x^{n}$ 的系数恒等式再比，不凭感觉|\n|微分方程法丢初值|$S(0)=a_0$ 必代入定常数|\n|递推题忘记验证收敛域内代数运算合法|先定 $R$，方程在 $|","examplesMd":" **【例 2.3-1】（★★★，经典名题）**  求 $S(x)=\\sum\\limits_{n=1}^{\\infty}H_nx^{n}$（$H_n=1+\\dfrac12+\\cdots+\\dfrac1n$，$|x|<1$）。\n\n**思路分析**：系数的差分 $H_n-H_{n-1}=\\dfrac1n$ 干净——$(1-x)S(x)$ 的系数正是这个差分。\n\n**详细解答**：\n\n$(1-x)S(x)=\\sum_{n\\ge1}H_nx^{n}-\\sum_{n\\ge1}H_nx^{n+1}=H_1x+\\sum_{n\\ge2}\\left(H_n-H_{n-1}\\right)x^{n}=x+\\sum_{n\\ge2}\\dfrac{x^{n}}{n}=\\sum_{n\\ge1}\\dfrac{x^{n}}{n}=-\\ln(1-x)$\n\n故 $S(x)=\\dfrac{-\\ln(1-x)}{1-x}$（$|x|<1$）。\n\n**检验**：系数核对：$x$ 系数 $H_1=1$：$\\left[-\\ln(1-x)\\right](1+x+\\cdots)$ 的 $x$ 系数 $=1$ ✓；$x^{2}$ 系数应为 $H_2=\\dfrac32$：$1+\\dfrac12=\\dfrac32$ ✓。\n\n**方法总结**：==系数有漂亮差分 → 乘== ==$(1-x)$== ==做错位相减==；结果 $\\sum H_nx^{n}=\\dfrac{-\\ln(1-x)}{1-x}$ 值得直接背（与拔 2.1 的 $H_n$ 收敛域呼应）。\n\n **【例 2.3-2】（★★★，真题风格）**  求 $S(x)=\\sum\\limits_{n=0}^{\\infty}\\dfrac{x^{2n+1}}{n!\\,(2n+1)}$，并给出 $\\displaystyle\\int_{0}^{1}e^{x^{2}}dx$ 的级数表示与三位有效数字近似。\n\n**思路分析**：先求导：$S'(x)=\\sum\\dfrac{x^{2n}}{n!}=e^{x^{2}}$——原函数积不出，保留积分形式；数值用原级数本身。\n\n**详细解答**：比值法易得 $R=+\\infty$。逐项求导：\n\n$S'(x)=\\sum_{n\\ge0}\\dfrac{(2n+1)x^{2n}}{n!(2n+1)}=\\sum_{n\\ge0}\\dfrac{x^{2n}}{n!}=e^{x^{2}},\\qquad S(0)=0$\n\n故 $S(x)=\\displaystyle\\int_{0}^{x}e^{t^{2}}dt$（保留积分形式）。取 $x=1$：\n\n$\\int_{0}^{1}e^{x^{2}}dx=\\sum_{n=0}^{\\infty}\\dfrac{1}{n!(2n+1)}=1+\\dfrac13+\\dfrac1{10}+\\dfrac1{42}+\\dfrac1{216}+\\cdots\\approx1.4627$\n\n**检验**：部分和 $1+0.3333+0.1+0.0238+0.00463+0.000757\\approx1.4625$，下一项量级 $10^{-4}$，真值 $\\approx1.46265$ ✓（数值积分印证）。\n\n**方法总结**：==\"积不出\"三步：求导化已知、积分留形式、数值回级数==。$e^{x^{2}}$、$e^{-x^{2}}$、$\\dfrac{\\sin x}{x}$、$\\dfrac{e^x}{x}$ 的积分全部此路办理，是 CMC 与多元积分学\"积不出\"主题的级数版。"},"2.4":{"id":"2.4","name":"函数展开为幂级数（间接展开思想）","part":"幂级数","book":"无穷级数","teachMd":"**核心思想**：直接展开（硬算 $f^{(n)}(x_0)$）只用于证明题；一切实用展开走**间接法**：从五大母函数出发，经四则运算、逐项求导、逐项积分、复合代换抵达目标。\n\n**必背五大展开**（$x_0=0$，收敛域必背）：\n\n|函数|展开式|收敛域|\n| ------| --------| -----------|\n|$e^{x}$|$\\sum\\dfrac{x^{n}}{n!}$|$\\mathbb{R}$|\n|$\\sin x$ / $\\cos x$|$\\sum(-1)^{n}\\dfrac{x^{2n+1}}{(2n+1)!}$ / $\\sum(-1)^{n}\\dfrac{x^{2n}}{(2n)!}$|$\\mathbb{R}$|\n|$\\dfrac{1}{1-x}$|$\\sum x^{n}$|$(-1,1)$|\n|$\\ln(1+x)$|$\\sum(-1)^{n-1}\\dfrac{x^{n}}{n}$|$(-1,1]$|\n|$(1+x)^{\\alpha}$|$1+\\sum\\limits_{n\\ge1}\\dfrac{\\alpha(\\alpha-1)\\cdots(\\alpha-n+1)}{n!}x^{n}$|$(-1,1)$，端点视 $\\alpha$|\n\n**转化套路表**：\n\n|目标|动作|\n| ----------------| --------------------------|\n|有理分式|部分分式拆成 $\\dfrac{c}{1-kx}$ 型，套 $\\sum(kx)^{n}$|\n|$\\ln$（多项真因子）|拆因式化为 $\\ln(1\\pm kx)$ 相加减|\n|$\\arctan$、$\\arcsin$ 型|求导一次→幂级数→积分回|\n|$\\sqrt{1+x}$ 型|二项级数 $\\alpha=\\dfrac12$|\n|$f(x^{2})$、$f(2x)$ 等|复合换元，收敛域跟着伸缩|\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------| ------------------------------------------|\n|展开后不给收敛域|展开式必须配收敛域；端点要验（例 2.4-2）|\n|$\\dfrac{1}{x-a}$ 型直接套 $\\sum x^{n}$|先提常数化为 $\\dfrac{-1/a}{1-x/a}$，收敛域 $|\n|逐项积分后端点随手写开|积分改善端点收敛（$\\ln(1+x)$ 在 $x=1$ 收敛），要重验|","examplesMd":" **【例 2.4-1】（★★，经典）**  将 $f(x)=\\dfrac{1}{x^{2}-3x+2}$ 展开为 $x$ 的幂级数。\n\n**思路分析**：部分分式 + 两把几何尺。  \n\n**详细解答**：$x^{2}-3x+2=(x-1)(x-2)$，$\\dfrac{1}{(x-1)(x-2)}=\\dfrac{-1}{1-x}+\\dfrac{1}{x-2}$：\n\n$\\dfrac{1}{x-1}\\cdot(-1)=\\dfrac{1}{1-x}=\\sum_{n\\ge0}x^{n};\\qquad \\dfrac{1}{x-2}=-\\dfrac12\\cdot\\dfrac{1}{1-\\frac x2}=-\\dfrac12\\sum_{n\\ge0}\\left(\\dfrac x2\\right)^{n}$\n\n$f(x)=\\sum_{n\\ge0}x^{n}-\\dfrac12\\sum_{n\\ge0}\\dfrac{x^{n}}{2^{n}}=\\sum_{n=0}^{\\infty}\\left(1-\\dfrac{1}{2^{n+1}}\\right)x^{n},\\qquad |x|<1$\n\n（两收敛域 $(-1,1)\\cap(-2,2)=(-1,1$）。）\n\n**检验**：$x=0$：系数 $1-\\dfrac12=\\dfrac12=f(0)$ ✓；$x=0.5$：级数 $\\sum\\left(1-2^{-n-1}\\right)0.5^{n}=\\dfrac{1}{0.5}-\\dfrac12\\cdot\\dfrac{1}{1-0.25}=2-\\dfrac23=\\dfrac43$，直接算 $f(0.5)=\\dfrac{1}{0.25-1.5+2}=\\dfrac{1}{0.75}=\\dfrac43$ ✓。\n\n**方法总结**：==有理函数展开三板斧：部分分式 → 母函数== ==$\\dfrac{1}{1-t}$== ==→ 收敛域取交集==；在 $x_0\\neq0$ 处展开时先换元 $t=x-x_0$。\n\n **【例 2.4-2】（★★★，巧题）**  将 $f(x)=\\ln\\left(1+x+x^{2}\\right)$ 展开为 $x$ 的幂级数，并给出收敛域。\n\n**思路分析**：$1+x+x^{2}$ 在实数上无零点，但 $(1-x)\\left(1+x+x^{2}\\right)=1-x^{3}$——**先拆对数**，化成两个 $\\ln(1-t)$。\n\n**详细解答**：$\\ln\\left(1+x+x^{2}\\right)=\\ln\\dfrac{1-x^{3}}{1-x}=\\ln\\left(1-x^{3}\\right)-\\ln(1-x)$\n\n$=-\\sum_{n\\ge1}\\dfrac{x^{3n}}{n}+\\sum_{n\\ge1}\\dfrac{x^{n}}{n}=\\sum_{n=1}^{\\infty}\\dfrac{x^{n}-x^{3n}}{n}\\qquad(|x|<1)$\n\n**端点**：$x=1$：合并通项为 $\\dfrac{1-\\mathbf{1}_{3\\mid n}}{n}$（$\\mathbf{1}_{3\\mid n}$ 在 $3\\mid n$ 时取 $1$），部分和 $\\sum_{n\\le N}\\dfrac{1-\\mathbf{1}_{3\\mid n}}{n}\\ge\\dfrac23\\sum_{n\\le N}\\dfrac1n\\to+\\infty$，**发散**——不能拆回 $\\sum\\dfrac{x^n}{n}-\\sum\\dfrac{x^{3n}}{n}$ 逐个判（两个都发散，\"发散 − 发散\"非法），端点必须看合并通项本身。$x=-1$：$(-1)^{3n}=(-1)^{n}$，合并通项 $\\dfrac{(-1)^n-(-1)^n}{n}\\equiv0$，级数收敛且和为 $0=f(-1)=\\ln1$ ✓。\n\n**收敛域** $[-1,1)$。\n\n**检验**：$x=\\dfrac12$：$f\\left(\\dfrac12\\right)=\\ln\\left(1+\\dfrac12+\\dfrac14\\right)=\\ln\\dfrac74\\approx0.5596$；级数 $\\sum\\dfrac{0.5^{n}-0.5^{3n}}{n}$：$n=1$：$0.375$，$n=2$：$\\approx0.1172$，$n=3$：$\\approx0.0410$，$n=4$：$\\approx0.0156$，$n=5$：$\\approx0.0062$，$n=6$：$\\approx0.0026$，前 6 项和 $\\approx0.5576$，尾项 $\\approx0.002$，合计 $\\approx0.5596$ ✓。\n\n**方法总结**：==$1+x+\\cdots+x^{m-1}=\\dfrac{1-x^{m}}{1-x}$== ==是对数展开的万能钥匙==（$m=3$ 本题、$m=2$ 即 $\\ln(1+x)$ 本身）；端点判敛永远回到**通项/部分和本身**，不许拆成两个发散级数再合并。"},"2.5":{"id":"2.5","name":"泰勒展开的三种应用（局部逼近思想）","part":"幂级数","book":"无穷级数","teachMd":"**核心思想**：泰勒级数不只是展开，是**万能局部坐标**：CMC 常考三种用法——\n\n1. **求** **$f^{(n)}(x_0)$**：展开式中 $x^{n}$ 的系数 $=\\dfrac{f^{(n)}(x_0)}{n!}$——比连续求导 $n$ 次快一个数量级；\n2. **求极限**：展开到\"分子分母首个不相消阶\"，比洛必达连刷快且不易错（一元微分学同款思想的级数版）；\n3. **近似计算与估值**：交错级数余项 $\\lvert r_n\\rvert\\le$ 首个舍弃项；正项级数放缩余项（5.2 展开）。\n\n**速查**：常用麦克劳林系数（$e^{x}$、$\\sin$、$\\cos$、$\\ln(1+x)$、$(1+x)^{\\alpha}$、$e^{x^{2}}$、$\\cos\\dfrac{1}{\\sqrt n}$ 型已在 1.2 大量演练）。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------------| ---------------------------------------|\n|求 $f^{(n)}(0)$ 时系数忘乘 $n!$|$f^{(n)}(0)=n!\\times$ 系数|\n|求极限展开阶数不够（首项相消为零）|展开到分母阶数再停，相消后看次阶|\n|交错近似\"四舍五入\"随意报位数|误差 < 首个舍弃项，报出位数要由它担保|","examplesMd":" **【例 2.5-1】（★★，经典）**  设 $f(x)=e^{x^{2}}$，求 $f^{(n)}(0)$。\n\n**思路分析**：$e^{x^{2}}=\\sum\\dfrac{x^{2n}}{n!}$ 只有偶次幂——奇数阶全为零。\n\n**详细解答**：$e^{x^{2}}=\\sum\\limits_{n=0}^{\\infty}\\dfrac{x^{2n}}{n!}$，$x^{2n}$ 的系数为 $\\dfrac{1}{n!}=\\dfrac{f^{(2n)}(0)}{(2n)!}$，故\n\n$f^{(2n)}(0)=\\dfrac{(2n)!}{n!},\\qquad f^{(2n+1)}(0)=0$\n\n如 $f^{(4)}(0)=\\dfrac{24}{2}=12$，$f^{(6)}(0)=\\dfrac{720}{6}=120$。\n\n**检验**：$f''=（e^{x^2}(1+2x^2))'=e^{x^{2}}\\left(4x^{3}+6x\\right)$，$f^{(3)}(0)=0$ ✓；$f^{(4)}(0)$ 用乘积展开验证 $=12$ ✓。\n\n**方法总结**：==奇偶结构先看幂次奇偶，系数乘== ==$n!$== ==即得==；$x\\sin x$、$x\\ln(1+x)$、$\\cos x^{2}$ 同款办理。\n\n **【例 2.5-2】（★★，真题风格）**  求 $\\lim\\limits_{x\\to0}\\dfrac{e^{x}+e^{-x}-2-x^{2}}{x^{4}}$。\n\n**思路分析**：分子偶函数，展开到 $x^{4}$：$e^{\\pm x}$ 相加时奇次项自动消。\n\n**详细解答**：$e^{x}+e^{-x}=2\\left(1+\\dfrac{x^{2}}{2}+\\dfrac{x^{4}}{24}+O(x^{6})\\right)=2+x^{2}+\\dfrac{x^{4}}{12}+O(x^{6})$\n\n$\\lim_{x\\to0}\\dfrac{e^{x}+e^{-x}-2-x^{2}}{x^{4}}=\\lim\\dfrac{\\frac{x^{4}}{12}+O(x^{6})}{x^{4}}=\\dfrac{1}{12}$\n\n**检验**：数值 $x=0.1$：分子 $=2.00200017-2-0.01=1.667\\times10^{-6}$，$x^{4}=10^{-4}$，比值 $0.01667\\approx\\dfrac1{12}$ ✓。\n\n**方法总结**：==展开阶数 = 分母阶数，相消结构（偶/奇对称）先利用==；本题洛必达需连刷四次且每步复合求导，级数法一步到位。"},"3.1":{"id":"3.1","name":"部分和法与裂项（消元思想）","part":"数项级数求和","book":"无穷级数","teachMd":"**核心思想**：直接算 $S_n$ 再取极限。能用此法的通项都有\"**可消解结构**\"：\n\n|结构|裂项公式|例|\n| ------------| -----------| -------------|\n|相邻分式|$\\dfrac{1}{n(n+k)}=\\dfrac1k\\left(\\dfrac1n-\\dfrac{1}{n+k}\\right)$|$\\sum\\dfrac1{(2n-1)(2n+1)}=\\dfrac12$|\n|三连分式|$\\dfrac{1}{n(n+1)(n+2)}=\\dfrac12\\left[\\dfrac{1}{n(n+1)}-\\dfrac{1}{(n+1)(n+2)}\\right]$|和为 $\\dfrac14$|\n|平方差结构|$\\dfrac{2n+1}{n^{2}(n+1)^{2}}=\\dfrac{1}{n^{2}}-\\dfrac{1}{(n+1)^{2}}$|和为 $1$|\n|根式|$\\dfrac{1}{\\sqrt n+\\sqrt{n+1}}=\\sqrt{n+1}-\\sqrt n$|发散（和 $\\to\\infty$）|\n|阶乘多项式|$\\dfrac{n^{2}+n+1}{n!}=\\dfrac{1}{(n-2)!}+\\dfrac{2}{(n-1)!}+\\dfrac1{n!}$|归拢到 $e$|\n|差比数列|$S_n=\\sum kq^{k-1}$ 错位相减|$\\sum\\dfrac{n}{2^{n}}=2$|\n|反三角|$\\arctan\\dfrac{1}{n^{2}+n+1}=\\arctan(n+1)-\\arctan n$|和为 $\\dfrac\\pi4$|\n\n**操作要点**：裂项后**写前 2–3 项验证相消模式**再取极限；阶乘多项式用 $n^{2}=n(n-1)+n$ 拆成 $\\dfrac{1}{(n-2)!}$ 族归拢 $e$；裂项也能证发散（$S_n$ 显形发散，如根式行）。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------| ------------------------------------|\n|裂项系数配平错（差一个 $k$ 倍）|裂完取 $n=1$ 代入数值核对|\n|相消模式凭想象|永远写 $S_2,S_3$ 显形，确认\"留下头、消掉肚\"|\n|差比数列忘记 $S_n-qS_n$ 的边界项|错位相减后核对首尾项|","examplesMd":" **【例 3.1-1】（★★，经典）**  求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{n^{2}+n+1}{n!}$。\n\n**思路分析**：阶乘分母 + 多项式分子——拆成阶乘\"标准零件\"，全部归拢到 $e$。\n\n**详细解答**：$n^{2}+n+1=\\left[n(n-1)+2n\\right]+1$，故\n\n$\\sum_{n\\ge1}\\dfrac{n(n-1)}{n!}=\\sum_{n\\ge2}\\dfrac{1}{(n-2)!}=e,\\qquad 2\\sum_{n\\ge1}\\dfrac{n}{n!}=2\\sum_{n\\ge1}\\dfrac{1}{(n-1)!}=2e,\\qquad \\sum_{n\\ge1}\\dfrac{1}{n!}=e-1$\n\n合计 $S=e+2e+\\left(e-1\\right)=4e-1$。\n\n**检验**：部分和 $S_5\\approx9.800$，尾段 $\\sum_{n\\ge6}\\dfrac{\\sim n^2}{n!}\\approx0.073$，$4e-1=9.873$ ✓。\n\n**方法总结**：==阶乘分母求和：\"多项式拆阶乘零件 + 归拢== ==$e$==​==\"==；零件库：$\\dfrac{n}{n!}=\\dfrac{1}{(n-1)!}$、$\\dfrac{n(n-1)}{n!}=\\dfrac{1}{(n-2)!}$、$\\dfrac{n(n-1)(n-2)}{n!}=\\dfrac{1}{(n-3)!}$。\n\n **【例 3.1-2】（★★，真题风格）**  求下列级数的和：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{(2n-1)(2n+1)}$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n(n+1)(n+2)}$；　(3) 判断 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{\\sqrt n+\\sqrt{n+1}}$ 的敛散并求部分和表达式。\n\n**思路分析**：三连裂项全家福——注意 (3) 裂开后部分和显形发散。\n\n**详细解答**：\n\n(1) $\\dfrac{1}{(2n-1)(2n+1)}=\\dfrac12\\left(\\dfrac{1}{2n-1}-\\dfrac{1}{2n+1}\\right)$，$S_n=\\dfrac12\\left(1-\\dfrac{1}{2n+1}\\right)\\to\\dfrac12$。\n\n(2) $\\dfrac{1}{n(n+1)(n+2)}=\\dfrac12\\left[\\dfrac{1}{n(n+1)}-\\dfrac{1}{(n+1)(n+2)}\\right]$，$S_n=\\dfrac12\\left[\\dfrac12-\\dfrac{1}{(n+1)(n+2)}\\right]\\to\\dfrac14$。\n\n(3) $\\dfrac{1}{\\sqrt n+\\sqrt{n+1}}=\\sqrt{n+1}-\\sqrt n$，$S_n=\\sqrt{n+1}-1\\to+\\infty$，**发散**。\n\n**检验**：(1) $S_3=\\dfrac12\\left(1-\\dfrac17\\right)=\\dfrac37\\approx0.4286$，直接加前三项 $\\dfrac13+\\dfrac1{15}+\\dfrac1{35}=0.3333+0.0667+0.0286=0.4286$ ✓。\n\n**方法总结**：==裂项三步：配系数（代入首项验证）→ 写== ==$S_n$== ==显形 → 取极限==；\"裂项后显形为 $\\sqrt{n+1}-1$ 型无界量\"是裂项法判发散的招牌。"},"3.2":{"id":"3.2","name":"构造幂级数法求和（母函数思想）——主攻","part":"数项级数求和","book":"无穷级数","teachMd":"**核心思想**：数项级数 $\\sum a_n$ 的和，藏在一个**辅助幂级数** $S(x)=\\sum a_nx^{n}$（或 $\\sum a_nx^{n-1}$）在特定点的值里：\n\n$\\sum_{n}a_n\\ \\xleftarrow{\\quad x=x_0\\text{ 代值}\\quad}\\ S(x)=\\sum_{n}a_nx^{n}\\ \\xleftarrow{\\quad\\text{逐项求导/积分/方程}\\quad}\\ \\text{初等函数}$\n\n构造原则：**通项里的** **$n^{k}$**​ **、**​**$\\dfrac1n$**​ **、组合数、**​**$q^{n}$**​ **、**​**$(-1)^n$** **各自提示辅助级数的形状**（如 $\\sum\\dfrac{n^{2}}{2^{n}}$ 配 $S(x)=\\sum n^{2}x^{n}$ 在 $x=\\dfrac12$；$\\sum\\dfrac{(-1)^{n-1}}{n}$ 配 $\\ln(1+x)$ 在 $x=1$）。\n\n**端点代值的合法性——Abel 定理（必背）** ：若 $\\sum a_n$ 收敛，则 $\\lim\\limits_{x\\to1^{-}}\\sum a_nx^{n}=\\sum a_n$。——所以只要数项级数本身收敛，就算 $x_0=1$ 在收敛区间端点上，也能用\"左极限\"安全代值。这是 2.2 表中端点补值的理论根据，也是本方法的名字里\"Abel 代值\"的含义。\n\n**操作四步**：① 选型（按通项结构配 $S(x)$）→ ② 在收敛区间内求出 $S(x)$（2.2/2.3 全套）→ ③ 检查 $x_0$ 落在收敛域内（端点收敛则用 Abel）→ ④ 代值。\n\n**易错警示**：\n\n|错误|纠正|\n| -----------------------------| -------------------------------------------------|\n|$x_0$ 在收敛域外硬代（$\\sum\\dfrac1n$ 代 $x=1$）|先验端点敛散：发散则此法对该级数失效（和确为 $+\\infty$）|\n|辅助级数选错幂次（$x^{n-1}$ 与 $x^{n}$ 混）|写出首项核对：$n$ 从几起、$x_0^{\\,n}$ 还是 $x_0^{\\,n-1}$|\n|代值前不化简 $S(x)$|先化成初等闭式再代，数值稳定性与卷面分双收益|","examplesMd":" **【例 3.2-1】（★★，真题风格）**  求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{n^{2}}{2^{n}}$。\n\n**思路分析**：含 $n^{2}$ 与 $2^{n}$——配 $S(x)=\\sum n^{2}x^{n}$（必背表已有闭式），$x=\\dfrac12$ 在收敛域内。\n\n**详细解答**：$S(x)=\\sum\\limits_{n\\ge1}n^{2}x^{n}=\\dfrac{x(1+x)}{(1-x)^{3}}$（$|x|<1$，练 2.2-1）。$x=\\dfrac12\\in(-1,1)$：\n\n$S\\left(\\dfrac12\\right)=\\dfrac{\\dfrac12\\cdot\\dfrac32}{\\left(\\dfrac12\\right)^{3}}=\\dfrac{\\dfrac34}{\\dfrac18}=6$\n\n**检验**：直接加：$0.5+1+1.125+1+0.781+0.563+0.383+\\cdots$ 前 7 项 $5.352$，尾 $\\approx0.65$，$\\to6$ ✓。\n\n**方法总结**：==$n^{k}$== ==遇== ==$q^{n}$==​==：闭式代值一步完成==；三大闭式（$\\sum nx^{n}$、$\\sum n^{2}x^{n}$、$\\sum\\dfrac{x^n}{n}$）要形成条件反射。\n\n **【例 3.2-2】（★★★，经典）**  求：(1) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n\\,2^{n}}$；　(2) $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(-1)^{n-1}}{n}$。\n\n**思路分析**：都指向对数型 $S(x)=-\\ln(1-x)$ / $\\ln(1+x)$；(2) 的代值点 $x=1$ 恰在端点——Abel 定理上场。\n\n**详细解答**：\n\n(1) 取 $S(x)=\\sum\\dfrac{x^{n}}{n}=-\\ln(1-x)$（$[-1,1)$），$x=\\dfrac12$：$S=-\\ln\\dfrac12=\\ln2$。\n\n(2) 取 $T(x)=\\sum(-1)^{n-1}\\dfrac{x^{n}}{n}=\\ln(1+x)$（$(-1,1]$）。数项级数 $\\sum\\dfrac{(-1)^{n-1}}{n}$ 本身收敛（莱布尼茨），由 **Abel 定理**：\n\n$\\sum_{n\\ge1}\\dfrac{(-1)^{n-1}}{n}=\\lim_{x\\to1^{-}}\\ln(1+x)=\\ln2$\n\n**检验**：(1) $0.5+0.125+0.0417+0.0156+\\cdots=0.6931=\\ln2$ ✓；(2) $1-0.5+0.333-0.25+\\cdots\\to0.693$ ✓。\n\n**方法总结**：==端点收敛 + Abel 定理 = 安全代值==；(1)(2) 同收 $\\ln2$ 并非巧合：$\\sum\\dfrac{x^n}{n}$ 在 $x=-\\dfrac12$ 处即 (2) 的\"半速版\"。凡答案 $\\ln2$、$\\dfrac\\pi4$、$e$、$\\ln\\dfrac32$ 的级数，先想幂级数源。"},"4.1":{"id":"4.1","name":"系数计算与狄利克雷收敛定理（左右极限平均思想）——主攻","part":"傅里叶级数","book":"无穷级数","teachMd":"**核心思想**：系数计算是体力活（分部积分 + 华里士公式，见《一元积分学习题集》），**收敛定理才是得分点**——狄利克雷定理：$f$ 在 $[-\\pi,\\pi]$ 上分段单调（或一个周期内有限个极值）、只有有限个第一类间断点，则其傅里叶级数处处收敛，且\n\n$S(x)=\\begin{cases}f(x),&x\\text{ 为连续点}\\\\[4pt] \\dfrac{f(x^{-})+f(x^{+})}{2},&x\\text{ 为间断点}\\end{cases}\\qquad S(\\pm\\pi)=\\dfrac{f\\left(-\\pi^{+}\\right)+f\\left(\\pi^{-}\\right)}{2}$\n\n<span style=\"color:#e53935\">**头号考点**：间断点与端点处 $S(x)\\ne f(x)$，取**左右极限的平均**；端点 $x=\\pm\\pi$ 要用**周期延拓后**的左极限（即 $-\\pi$ 的右极限）来配对</span>。\n\n**必背成果表**（填空直接引用，$-\\pi<x<\\pi$）：\n\n|函数|傅里叶级数|收获（特殊点取值）|\n| ------| ------------| --------------------|\n|$x$|$2\\sum\\limits_{n\\ge1}\\dfrac{(-1)^{n+1}}{n}\\sin nx$|——|\n|$x^{2}$|$\\dfrac{\\pi^{2}}{3}+4\\sum\\limits_{n\\ge1}\\dfrac{(-1)^{n}}{n^{2}}\\cos nx$|$\\sum\\dfrac1{n^2}=\\dfrac{\\pi^2}6$，$\\sum\\dfrac{(-1)^{n-1}}{n^2}=\\dfrac{\\pi^2}{12}$|\n|$\\lvert x\\rvert$|$\\dfrac{\\pi}{2}-\\dfrac4\\pi\\sum\\limits_{k\\ge1}\\dfrac{\\cos(2k-1)x}{(2k-1)^{2}}$|$\\sum\\dfrac{1}{(2k-1)^{2}}=\\dfrac{\\pi^{2}}8$|\n\n**易错警示**：\n\n|错误|纠正|\n| ----------------------| ------------------------------------------------|\n|在间断点写 $S=f$|取 $\\dfrac{f(x^-)+f(x^+)}2$，先画延拓草图找跳变|\n|$S(\\pi)$ 用 $f(\\pi)$|用 $\\dfrac{f(\\pi^-)+f(-\\pi^+)}2$（周期拼接处最易跳变）|\n|把狄利克雷条件当充要|它是充分条件；\"满足条件 ⟹ 收敛\"，逆命题不成立|","examplesMd":" **【例 4.1-1】（★★，经典）**  设 $f(x)=x$（$-\\pi<x\\le\\pi$），以 $2\\pi$ 为周期延拓。写出其傅里叶级数，并求 $S(0)$、$S\\left(\\dfrac\\pi2\\right)$、$S(\\pi)$、$S\\left(\\dfrac{3\\pi}{2}\\right)$。\n\n**思路分析**：奇函数只含正弦；$x=\\pi$ 与 $x=\\dfrac{3\\pi}2$ 是延拓后的跳变点，先画锯齿草图。\n\n**详细解答**：$b_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}x\\sin nx\\,dx=\\dfrac2\\pi\\left[-\\dfrac{x\\cos nx}{n}+\\dfrac{\\sin nx}{n^{2}}\\right]_0^{\\pi}=\\dfrac{2(-1)^{n+1}}{n}$，故\n\n$x=2\\sum_{n=1}^{\\infty}\\dfrac{(-1)^{n+1}}{n}\\sin nx\\qquad(-\\pi<x<\\pi)$\n\n$S(0)=0=f(0)$（连续点）；$S\\left(\\dfrac\\pi2\\right)=\\dfrac\\pi2$（连续点）；$S(\\pi)=\\dfrac{f(\\pi^-)+f(-\\pi^+)}{2}=\\dfrac{\\pi+(-\\pi)}{2}=0$；$S\\left(\\dfrac{3\\pi}{2}\\right)=S\\left(-\\dfrac{\\pi}{2}\\right)=-\\dfrac{\\pi}{2}$（周期性 + 连续点）。\n\n**检验**：$x=\\dfrac\\pi2$：$2\\sum\\dfrac{(-1)^{n+1}}{n}\\sin\\dfrac{n\\pi}2=2\\left(1-\\dfrac13+\\dfrac15-\\cdots\\right)=2\\cdot\\dfrac\\pi4=\\dfrac\\pi2$ ✓（顺带重演 Gregory 级数）。\n\n**方法总结**：==求== ==$S(x_0)$== ==三问：连续点？代== ==$f$==​==；间断点？取平均；端点？用周期配对==。锯齿函数的跳变点（奇数倍 $\\pi$）全取 $0$。\n\n **【例 4.1-2】（★★，真题风格）**  设 $f(x)=x^{2}$（$-\\pi\\le x\\le\\pi$），以 $2\\pi$ 周期延拓。(1) 写出其傅里叶级数；(2) 由此求 $\\sum\\dfrac1{n^{2}}$ 与 $\\sum\\dfrac{(-1)^{n-1}}{n^{2}}$。\n\n**思路分析**：偶函数只含余弦；$f(-\\pi)=f(\\pi)$ 周期拼接无跳变，级数在端点也收敛到 $f$——两端点都是\"收获点\"。\n\n**详细解答**：$a_0=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}x^{2}dx=\\dfrac{2\\pi^{2}}{3}$；$a_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}x^{2}\\cos nx\\,dx=\\dfrac2\\pi\\left[\\dfrac{x^{2}\\sin nx}{n}+\\dfrac{2x\\cos nx}{n^{2}}-\\dfrac{2\\sin nx}{n^{3}}\\right]_0^{\\pi}=\\dfrac{4(-1)^{n}}{n^{2}}$。故\n\n$x^{2}=\\dfrac{\\pi^{2}}{3}+4\\sum_{n=1}^{\\infty}\\dfrac{(-1)^{n}}{n^{2}}\\cos nx\\qquad(-\\pi\\le x\\le\\pi)$\n\n(2) 取 $x=\\pi$：$\\pi^{2}=\\dfrac{\\pi^{2}}3+4\\sum\\dfrac{1}{n^{2}}\\Rightarrow\\sum\\dfrac1{n^{2}}=\\dfrac{\\pi^{2}}6$；取 $x=0$：$0=\\dfrac{\\pi^{2}}3+4\\sum\\dfrac{(-1)^{n}}{n^{2}}\\Rightarrow\\sum\\dfrac{(-1)^{n-1}}{n^{2}}=\\dfrac{\\pi^{2}}{12}$。\n\n**检验**：$\\sum\\dfrac{(-1)^{n-1}}{n^{2}}$ 部分和按莱布尼茨振荡夹逼：$1,\\ 0.75,\\ 0.8611,\\ 0.7986,\\ 0.8386,\\ 0.8108,\\ 0.8312,\\ 0.8156,\\cdots$ 收敛中心 $\\approx0.822$，与 $\\dfrac{\\pi^{2}}{12}\\approx0.8225$ 吻合 ✓。\n\n**方法总结**：==$f(-\\pi)=f(\\pi)$== ==时端点无跳变，两个端点 + 原点都是取值收获点==；\"一个展开吃三个级数\"是傅里叶法求和的标准姿势。"},"4.2":{"id":"4.2","name":"正弦级数与余弦级数（延拓思想）","part":"傅里叶级数","book":"无穷级数","teachMd":"**核心思想**：$[0,\\pi]$（或 $[0,l]$）上定义的函数没有天然奇偶——**由你选择延拓方式**：\n\n|延拓|级数类型|系数公式（$[0,\\pi]$）|端点值|\n| ---------------| ----------| --------------| -----------------------------------|\n|奇延拓（补 $f(-x)=-f(x)$）|正弦级数|$b_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}f\\sin nx\\,dx$|$S(0)=S(\\pi)=0$（若 $f(0^{+})\\ne0$，端点即间断点，取平均归零）|\n|偶延拓（补 $f(-x)=f(x)$）|余弦级数|$a_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}f\\cos nx\\,dx$|端点一般连续，$S=f$|\n\n（$[0,l]$ 上把 $z=\\dfrac{\\pi x}{l}$ 换元即可；系数前缀变 $\\dfrac2l$，频率变 $\\dfrac{n\\pi x}{l}$。）\n\n**选择策略**：题目指定\"正弦/余弦\"照办；自选时**哪个系数好算选哪个**（$f$ 奇对称性强选正弦）。展开式只在 $(0,\\pi)$ 内等于 $f$，端点与外侧看延拓后的和函数。\n\n**易错警示**：\n\n|错误|纠正|\n| ------------------------------| ----------------------------------------|\n|两种延拓的级数在 $(0,\\pi)$ 内\"和不同\"|内部和相同（都等于 $f$），端点/外侧才分道|\n|奇延拓后在 $x=0$ 写 $S=f(0)$|奇延拓在 $x=0$ 有 $S(0)=0$，$f(0)\\ne0$ 时即间断|\n|$[0,l]$ 公式照抄 $\\dfrac2\\pi$|前缀 $\\dfrac2l$、频率 $\\dfrac{n\\pi}{l}$，两处都换|","examplesMd":" **【例 4.2-1】（★★，经典）**  将 $f(x)=x$（$0\\le x\\le\\pi$）分别展开为正弦级数与余弦级数。\n\n**思路分析**：正弦延拓即例 4.1-1 的锯齿（系数照抄）；余弦延拓是新计算——偶延拓后无跳变，端点也收敛到 $f$。\n\n**详细解答**：**正弦**：$b_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}x\\sin nx\\,dx=\\dfrac{2(-1)^{n+1}}{n}$（例 4.1-1 已算）：\n\n$x=2\\sum_{n\\ge1}\\dfrac{(-1)^{n+1}}{n}\\sin nx\\qquad(0<x<\\pi)$\n\n**余弦**：$a_0=\\pi$，$a_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}x\\cos nx\\,dx=\\dfrac2\\pi\\cdot\\dfrac{(-1)^{n}-1}{n^{2}}$（奇 $n$ 给 $-\\dfrac{4}{\\pi n^{2}}$，偶 $n$ 给 $0$）：\n\n$x=\\dfrac{\\pi}{2}-\\dfrac{4}{\\pi}\\sum_{k=1}^{\\infty}\\dfrac{\\cos(2k-1)x}{(2k-1)^{2}}\\qquad(0\\le x\\le\\pi)$\n\n**检验**：余弦式取 $x=\\dfrac\\pi2$：$\\dfrac\\pi2=\\dfrac\\pi2-\\dfrac4\\pi\\sum\\dfrac{\\cos(2k-1)\\frac\\pi2}{(2k-1)^2}$，而 $\\cos\\dfrac{(2k-1)\\pi}{2}=0$ 恒成立——两边自动相等（该点无收获，换 $x=0$ 验：$0=\\dfrac\\pi2-\\dfrac4\\pi\\sum\\dfrac1{(2k-1)^2}\\Rightarrow\\sum=\\dfrac{\\pi^2}8$ ✓ 与练 4.1-1 一致）。\n\n**方法总结**：==同一函数、两种延拓、两个级数，==​==$(0,\\pi)$== ==内殊途同归==；正弦级数端点归零、余弦级数端点保值，这一差异正是 4.1 收敛定理的应用题。\n\n **【例 4.2-2】（★★★，经典）**  将 $f(x)=x(\\pi-x)$（$0\\le x\\le\\pi$）展开为正弦级数，并求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{(-1)^{n-1}}{(2n-1)^{3}}$。\n\n**思路分析**：多项式乘正弦用两次分部积分；收获点选 $x=\\dfrac\\pi2$（让 $\\sin$ 取 $\\pm1$）。\n\n**详细解答**：$b_n=\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}\\left(\\pi x-x^{2}\\right)\\sin nx\\,dx$。分部积分（详算见检验）得 $b_n=\\dfrac{4\\left(1-(-1)^{n}\\right)}{\\pi n^{3}}$：偶 $n$ 为 $0$，奇 $n=2k-1$ 为 $\\dfrac{8}{\\pi(2k-1)^{3}}$：\n\n$x(\\pi-x)=\\dfrac{8}{\\pi}\\sum_{k=1}^{\\infty}\\dfrac{\\sin(2k-1)x}{(2k-1)^{3}}\\qquad(0\\le x\\le\\pi)$\n\n取 $x=\\dfrac{\\pi}{2}$：$\\dfrac{\\pi^{2}}{4}=\\dfrac8\\pi\\sum\\dfrac{\\sin\\frac{(2k-1)\\pi}{2}}{(2k-1)^{3}}=\\dfrac8\\pi\\sum\\dfrac{(-1)^{k-1}}{(2k-1)^{3}}$，故\n\n$\\sum_{k=1}^{\\infty}\\dfrac{(-1)^{k-1}}{(2k-1)^{3}}=\\dfrac{\\pi^{3}}{32}$\n\n**检验**（系数计算）：$\\displaystyle\\int_0^{\\pi}x^{2}\\sin nx\\,dx=\\left[-\\dfrac{x^{2}\\cos nx}{n}\\right]_0^{\\pi}+\\dfrac2n\\displaystyle\\int_0^{\\pi}x\\cos nx\\,dx=-\\dfrac{\\pi^{2}(-1)^{n}}{n}+\\dfrac2n\\cdot\\dfrac{(-1)^{n}-1}{n^{2}}$；$\\displaystyle\\int_0^{\\pi}\\pi x\\sin nx\\,dx=\\pi\\cdot\\dfrac{\\pi(-1)^{n+1}}{n}=-\\dfrac{\\pi^{2}(-1)^{n}}{n}$；相减：$\\left(\\pi x-x^{2}\\right)$ 的积分 $=\\dfrac{2\\left(1-(-1)^{n}\\right)}{n^{3}}$，$b_n=\\dfrac{2}{\\pi}\\times$该值 $=\\dfrac{4\\left(1-(-1)^{n}\\right)}{\\pi n^{3}}$ ✓ 与正文一致。数值：$1-\\dfrac1{27}+\\dfrac1{125}-\\cdots=0.9691$，$\\dfrac{\\pi^3}{32}=0.9689$ ✓。\n\n**方法总结**：==收获点反着选：让== ==$\\sin$== ==变== ==$\\pm1$== ==取== ==$x=\\dfrac\\pi2$==​==，让== ==$\\cos$== ==变== ==$\\pm1$== ==取== ==$x=0,\\pi$==；三次方分母的级数和（$\\dfrac{\\pi^3}{32}$）是三次题的招牌答案。"},"4.3":{"id":"4.3","name":"傅里叶级数求和与 Parseval（取值点思想）","part":"傅里叶级数","book":"无穷级数","teachMd":"**核心思想**：4.1–4.2 的\"收获点\"技术系统化 + **Parseval 等式**（闭合第二个维度——取值点给不出平方和时它来收）：\n\n$\\dfrac{1}{\\pi}\\displaystyle\\int_{-\\pi}^{\\pi}f^{2}(x)\\,dx=\\dfrac{a_0^{2}}{2}+\\sum_{n=1}^{\\infty}\\left(a_n^{2}+b_n^{2}\\right)$\n\n（正弦/余弦级数在 $[0,\\pi]$ 的版本：$\\dfrac2\\pi\\displaystyle\\int_0^{\\pi}f^{2}dx=\\sum b_n^{2}$ 或 $\\dfrac{a_0^{2}}{2}+\\sum a_n^{2}$。）\n\n**必背成果总表**（全部由标准展开取值/Parseval 收割，填空可直接引）：\n\n|级数|和|来源|\n| ------| ----| -------------|\n|$\\sum\\dfrac1{n^{2}}$|$\\dfrac{\\pi^{2}}{6}$|$x^{2}$ 展开 @ $x=\\pi$|\n|$\\sum\\dfrac{1}{(2k-1)^{2}}$|$\\dfrac{\\pi^{2}}{8}$|$\\lvert x\\rvert$ 展开 @ $x=0$|\n|$\\sum\\dfrac{(-1)^{n-1}}{n^{2}}$|$\\dfrac{\\pi^{2}}{12}$|$x^{2}$ 展开 @ $x=0$|\n|$\\sum\\dfrac{1}{(2k-1)^{4}}$|$\\dfrac{\\pi^{4}}{96}$|$\\lvert x\\rvert$ + Parseval|\n|$\\sum\\dfrac1{n^{4}}$|$\\dfrac{\\pi^{4}}{90}$|$x^{2}$ + Parseval|\n|$\\sum\\dfrac{(-1)^{n-1}}{(2k-1)^{3}}$|$\\dfrac{\\pi^{3}}{32}$|$x(\\pi-x)$ @ $x=\\dfrac\\pi2$|\n|$\\sum\\dfrac{1}{4n^{2}-1}$|$\\dfrac12$|$\\lvert\\sin x\\rvert$ @ $x=0$|\n\n**易错警示**：\n\n|错误|纠正|\n| -----------------------| --------------------------------------|\n|Parseval 记成 $\\dfrac{a_0^2}{4}$|是 $\\dfrac{a_0^{2}}{2}$（$a_0/2$ 是常数项，平方平均后系数翻倍）|\n|取值点选在间断点还代 $f$|先查该点级数收敛到谁（4.1）|\n|奇函数套含 $a_0$ 的公式|奇函数 $a_n=0$，直接用 $\\dfrac2\\pi\\int f^2=\\sum b_n^2$|","examplesMd":" **【例 4.3-1】（★★，经典）**  利用 $x^{2}$ 的傅里叶展开求 $\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n^{4}}$。\n\n**思路分析**：取值点已榨干（例 4.1-2），$\\dfrac1{n^4}$ 要靠 Parseval——$a_n=\\dfrac{4(-1)^n}{n^2}$ 平方后正好 $\\dfrac{16}{n^4}$。\n\n**详细解答**：对 $f=x^{2}$：$a_0=\\dfrac{2\\pi^{2}}{3}$，$a_n=\\dfrac{4(-1)^{n}}{n^{2}}$，$b_n=0$。左端 $\\dfrac1\\pi\\displaystyle\\int_{-\\pi}^{\\pi}x^{4}dx=\\dfrac1\\pi\\cdot\\dfrac{2\\pi^{5}}{5}=\\dfrac{2\\pi^{4}}{5}$。Parseval：\n\n$\\dfrac{2\\pi^{4}}{5}=\\dfrac{1}{2}\\left(\\dfrac{2\\pi^{2}}{3}\\right)^{2}+\\sum_{n\\ge1}\\dfrac{16}{n^{4}}=\\dfrac{2\\pi^{4}}{9}+16\\sum\\dfrac{1}{n^{4}}$\n\n$\\sum_{n=1}^{\\infty}\\dfrac{1}{n^{4}}=\\dfrac{1}{16}\\left(\\dfrac{2\\pi^{4}}{5}-\\dfrac{2\\pi^{4}}{9}\\right)=\\dfrac{1}{16}\\cdot\\dfrac{8\\pi^{4}}{45}=\\dfrac{\\pi^{4}}{90}$\n\n**检验**：$\\sum n^{-4}=1+0.0625+0.0123+0.0039+\\cdots\\approx1.0823$，$\\dfrac{\\pi^4}{90}=1.0823$ ✓。\n\n**方法总结**：==取值点给\"线性信息\"（==​==$\\sum\\dfrac{(\\pm1)^n}{n^k}$==​==），Parseval 给\"平方信息\"（==​==$\\sum\\dfrac1{n^{2k}}$==​==）==——先取值后 Parseval，一个展开吃两代级数。\n\n **【例 4.3-2】（★★★，经典）**  由 $\\lvert x\\rvert$ 的展开与 Parseval 求 $\\sum\\limits_{k=1}^{\\infty}\\dfrac{1}{(2k-1)^{4}}$。\n\n**思路分析**：$a_{2k-1}=-\\dfrac{4}{\\pi(2k-1)^{2}}$，平方后只剩奇数四次方——正中靶心。\n\n**详细解答**：$f=|x|$：$a_0=\\pi$，$a_{2k}=0$，$a_{2k-1}=-\\dfrac{4}{\\pi(2k-1)^{2}}$，$b_n=0$。左端 $\\dfrac1\\pi\\displaystyle\\int_{-\\pi}^{\\pi}x^{2}dx=\\dfrac{2\\pi^{2}}{3}$。Parseval：\n\n$\\dfrac{2\\pi^{2}}{3}=\\dfrac{\\pi^{2}}{2}+\\dfrac{16}{\\pi^{2}}\\sum_{k\\ge1}\\dfrac{1}{(2k-1)^{4}}$\n\n$\\sum_{k=1}^{\\infty}\\dfrac{1}{(2k-1)^{4}}=\\dfrac{\\pi^{2}}{16}\\left(\\dfrac{2\\pi^{2}}{3}-\\dfrac{\\pi^{2}}{2}\\right)=\\dfrac{\\pi^{2}}{16}\\cdot\\dfrac{\\pi^{2}}{6}=\\dfrac{\\pi^{4}}{96}$\n\n**检验**：与 $\\sum\\dfrac1{n^{4}}=\\dfrac{\\pi^{4}}{90}$ 交叉验证：奇偶分拆 $\\sum_{odd}=\\left(1-\\dfrac1{16}\\right)\\dfrac{\\pi^4}{90}=\\dfrac{15}{16}\\cdot\\dfrac{\\pi^4}{90}=\\dfrac{\\pi^4}{96}$ ✓✓ 两路完全咬合。\n\n**方法总结**：==Parseval 是\"能量守恒\"：函数的== ==$L^2$== ==能量 = 各谐波能量之和==；本题与例 4.3-1 的互验展示了它作为\"第二代求和机\"的威力。"},"5.1":{"id":"5.1","name":"含参数级数的判敛综合（分类讨论思想）","part":"综合与压轴","book":"无穷级数","teachMd":"**核心思想**：参数（$p$、$q$、$\\alpha$…）扫过全实轴，敛散性分区——**临界值**（分界参数）必须单独细判，常用莱布尼茨或精抓大头。标准流程：\n\n1. 用**根值/比值**一刀切出\"绝对收敛区\"与\"发散区\"（通项不趋零）；\n2. 剩下临界带（$\\rho=1$ 那一圈）用**比阶/积分判别**细分；\n3. 变号级数在\"不绝对\"区逐段用**莱布尼茨/狄利克雷**判条件收敛；\n4. 卷面以**敛散表**收尾（绝对收敛 / 条件收敛 / 发散各是哪些参数值）。\n\n**必背判敛总表**（分类题的地基，全部已在前文证明）：\n\n|级数|绝对收敛|条件收敛|发散|\n| ------| -----------| ----------| ----------|\n|$\\sum\\dfrac1{n^{p}}$|$p>1$|——|$p\\le1$|\n|$\\sum\\dfrac{1}{n\\ln^{q}n}$（$n\\ge2$）|$q>1$|——|$q\\le1$|\n|$\\sum n^{\\alpha}\\beta^{n}$（$\\beta>0$）|$\\beta<1$（任意 $\\alpha$）|——|$\\beta>1$；$\\beta=1$ 时看 $\\sum n^{\\alpha}$|\n|$\\sum\\dfrac{(-1)^{n}}{n^{p}}$|$p>1$|$0<p\\le1$|$p\\le0$|\n\n**易错警示**：\n\n|错误|纠正|\n| ----------------------------------| --------------------------------------------|\n|临界值漏判或与邻区混写|分类结论表里临界值单独一行，不\"并入\"|\n|全程只判绝对敛散，忘了条件收敛带|变号级数必走 1.6 二分流程|\n|用比值判 $\\sum\\dfrac{1}{n^{p}}$（恒 $\\rho=1$）|幂尺型用比阶，指数型才用比值——工具先认脸|","examplesMd":" **【例 5.1-1】（★★，经典）**  讨论 $\\sum\\limits_{n=1}^{\\infty}n^{\\alpha}\\beta^{n}$（$\\alpha\\in\\mathbb{R}$，$\\beta>0$）的敛散性。\n\n**思路分析**：幂 × 指数——根值一刀切开，临界 $\\beta=1$ 退化为 $p$-级数。\n\n**详细解答**：$\\sqrt[n]{n^{\\alpha}\\beta^{n}}=\\beta\\cdot n^{\\alpha/n}\\to\\beta$。\n\n- $\\beta<1$：根值判别，**收敛**（绝对）——对一切 $\\alpha$；\n- $\\beta>1$：通项绝对值 $\\to+\\infty$，**发散**；\n- $\\beta=1$：级数为 $\\sum n^{\\alpha}$：$\\alpha<-1$ **收敛**；$\\alpha\\ge-1$ **发散**（$\\alpha=-1$ 调和级数，$\\alpha>-1$ 通项不趋零）。\n\n**检验**：$\\alpha=-100$、$\\beta=2$：通项 $n^{-100}2^{n}\\to\\infty$ 发散 ✓（指数压倒幂，与结论一致）。\n\n**方法总结**：==幂与指数的较量只看== ==$\\beta$== ==与== ==$1$==​==；==​==$\\beta=1$== ==时才轮到== ==$\\alpha$== ==说话==。此表是 5.1 拔高全分类的两块积木之一。\n\n **【例 5.1-2】（★★，真题风格）**  讨论 $\\sum\\limits_{n=2}^{\\infty}\\dfrac{1}{n\\ln^{q}n}$（$q\\in\\mathbb{R}$）的敛散性，并给出双层对数变式的判别准则。\n\n**思路分析**：对数尺——积分判别法主场。\n\n**详细解答**：$f(x)=\\dfrac{1}{x\\ln^{q}x}$ 在 $x\\ge3$ 正、连续、递减（$q$ 任意时最终递减：对 $q<0$ 它 $=\\dfrac{\\ln^{|q|}x}{x}$，$x>e^{|q|}$ 后递减）。换元 $t=\\ln x$：\n\n$\\int_{2}^{+\\infty}\\dfrac{dx}{x\\ln^{q}x}=\\int_{\\ln2}^{+\\infty}\\dfrac{dt}{t^{q}}\\ \\text{收敛}\\iff q>1$\n\n故 $q>1$ **收敛**，$q\\le1$ **发散**。\n\n**双层对数变式**：$\\sum\\limits_{n\\ge3}\\dfrac{1}{n\\ln n\\left(\\ln\\ln n\\right)^{q}}$ 收敛 $\\iff q>1$（再换元 $s=\\ln\\ln x$，同一逻辑再套一层）——\"**最外层对数的幂决定一切**\"。\n\n**检验**：$q=1$：$\\int_{\\ln2}^{\\infty}\\dfrac{dt}{t}=\\infty$ ✓；$q=2$：$\\dfrac{1}{\\ln2}$ 有限 ✓。\n\n**方法总结**：==对数尺积分判别是唯一正路，\"每层对数都只是换元\"==；$q$ 的临界永远在 $1$。"},"5.2":{"id":"5.2","name":"部分和估计与级数不等式（余项估计思想）","part":"综合与压轴","book":"无穷级数","teachMd":"**核心思想**：定量级数观——不仅问\"收不收\"，还问\"**收得多快、和被夹在哪**\"。工具箱：\n\n1. **交错级数余项**：$\\lvert S-S_n\\rvert\\le u_{n+1}$（莱布尼茨的赠品，1.5）；\n2. **正项级数积分余项**：$f$ 递减时 $\\displaystyle\\int_{n+1}^{\\infty}f\\le\\sum_{k>n}f(k)\\le\\int_{n}^{\\infty}f$；\n3. **裂项上下界**：$\\dfrac{1}{n^{2}}<\\dfrac{1}{n^{2}-\\frac14}=\\dfrac{1}{n-\\frac12}-\\dfrac{1}{n+\\frac12}$（构造 telescope 上界，例 5.2-2）；\n4. **夹逼定小数位**：$S_n\\le S\\le S_n+\\text{余项}$，余项 $<\\dfrac12\\times10^{-k}$ 时可定 $k$ 位小数。\n\n**适用信号**：题目出现\"误差小于 $\\varepsilon$\"\"至少取多少项\"\"证明 $\\sum$ 介于某两数之间\"\"定和的小数位\"。\n\n**易错警示**：\n\n|错误|纠正|\n| ---------------------------| -------------------------------------|\n|正项级数也用\"首项估计\"|只有**交错递减**才有 $\\lvert r_n\\rvert\\le u_{n+1}$；正项用积分/裂项余项|\n|积分余项上下限弄反|$f$ 递减时 $\\sum_{k=n+1}^{\\infty}f(k)\\le\\int_n^{\\infty}f$（每个 $f(k)\\le\\int_{k-1}^{k}f$）|\n|\"至 $k$ 位小数\"与\"误差 $<10^{-k}$\"混同|定 $k$ 位小数需误差 $<\\dfrac12\\cdot10^{-k}$（防四舍五入翻转）|","examplesMd":" **【例 5.2-1】（★★，经典）**  用级数计算 $1-\\dfrac{1}{2!}+\\dfrac{1}{3!}-\\cdots$ 的近似值，使误差小于 $10^{-3}$，并指出该级数的精确和。\n\n**思路分析**：交错递减——首项估计直接定项数。\n\n**详细解答**：$u_n=\\dfrac1{n!}$，$\\lvert r_n\\rvert\\le\\dfrac{1}{(n+1)!}$。要 $\\dfrac{1}{(n+1)!}<10^{-3}$：$(n+1)!\\ge5040=7!$，取 $n+1=7$，即**求和到** **$n=6$**：\n\n$S\\approx1-\\dfrac12+\\dfrac16-\\dfrac1{24}+\\dfrac1{120}-\\dfrac1{720}=0.63194$\n\n精确和：$e^{-1}=\\sum\\limits_{n\\ge0}\\dfrac{(-1)^{n}}{n!}$，故原级数 $=1-e^{-1}\\approx0.63212$；实际误差 $0.63212-0.63194=0.00018<\\dfrac1{5040}=0.000198$ ✓ 估计成立。\n\n**方法总结**：==交错级数定项数：解== ==$\\dfrac{1}{(n+1)!}<\\varepsilon$== ==即止==；顺手认出\"精确和\"（$1-\\dfrac1e$）是加分的第二问常见形态。\n\n **【例 5.2-2】（★★★，巧题）**  证明：$\\sum\\limits_{n=1}^{\\infty}\\dfrac{1}{n^{2}}<\\dfrac{5}{3}$。\n\n**思路分析**：直接积分余项给不出这么紧的界（$\\sum\\dfrac1{n^2}\\approx1.645$，$\\dfrac53\\approx1.667$，只差 $0.022$）——构造 telescope 上界。\n\n**详细解答**：$n\\ge2$ 时 $\\dfrac{1}{n^{2}}<\\dfrac{1}{n^{2}-\\frac14}=\\dfrac{1}{\\left(n-\\frac12\\right)\\left(n+\\frac12\\right)}=\\dfrac{1}{n-\\frac12}-\\dfrac{1}{n+\\frac12}$，故\n\n$\\sum_{n=1}^{\\infty}\\dfrac{1}{n^{2}}=1+\\sum_{n\\ge2}\\dfrac{1}{n^{2}}<1+\\sum_{n\\ge2}\\left(\\dfrac{1}{n-\\frac12}-\\dfrac{1}{n+\\frac12}\\right)=1+\\dfrac{1}{2-\\frac12}=1+\\dfrac23=\\dfrac53\\qquad\\blacksquare$\n\n**检验**：真值 $\\zeta(2)=\\dfrac{\\pi^{2}}{6}\\approx1.6449<1.6667$ ✓，且间隙仅 $0.022$——界是\"紧\"的。\n\n**方法总结**：==$\\dfrac{1}{n^2}$== ==的紧上界靠平移裂项== ==$\\dfrac{1}{n^2-\\frac14}$==；同款思想给 $\\dfrac{1}{n^2}$ 的紧下界：$\\dfrac1{n^2}>\\dfrac{1}{n(n+1)}=\\dfrac1n-\\dfrac1{n+1}$（练 5.2-1 用）。"},"5.3":{"id":"5.3","name":"递推数列与级数联动（收敛速度思想）","part":"综合与压轴","book":"无穷级数","teachMd":"**核心思想**：级数与数列靠两个恒等式互相转化：**$\\sum\\left(a_{n+1}-a_n\\right)=\\lim a_n-a_1$**（级数 = 增量总和）与**部分和 = 数列**。递推数列 $a_{n+1}=f(a_n)$ 判敛联动级数的标准三步：\n\n1. **证收敛**：单调有界（或压缩），得极限 $L$（解 $L=f(L)$）；\n2. **定速度**：$a_{n+1}-L=f(a_n)-f(L)=f'(\\xi)\\left(a_n-L\\right)$（拉格朗日），$\\lvert f'(L)\\rvert<1$ ⟹ 几何速度 $\\lvert a_n-L\\rvert\\lesssim q^{n}$；\n3. **判级数**：$\\sum\\left(a_n-L\\right)$ 的敛散由速度定阶（几何 ⟹ 绝对收敛；$f'(L)=0$ 的**平方收敛**更快）。\n\n**适用信号**：题目同时出现递推式与 $\\sum a_n$ / $\\sum(a_n-L)$ / $\\lim$ 与 $n^k$ 乘积。\n\n**易错警示**：\n\n|错误|纠正|\n| ----------------------------| ---------------------------------------------------|\n|不先证 $a_n\\to L$ 就对递推式\"取极限\"|取极限合法的前提是极限存在，先单调有界/压缩|\n|把 $\\sum(a_n-L)$ 当正项级数|$a_n-L$ 可能变号，判敛回二分流程（通常绝对收敛直接收工）|\n|速度估计一步跳到\"几何\"|用拉格朗日把 $f'(\\xi)$ 控制在 $\\lvert f'(L)\\rvert+\\varepsilon<q<1$，写清 $n\\ge N$|","examplesMd":" **【例 5.3-1】（★★，真题风格）**  设 $a_1=\\sqrt2$，$a_{n+1}=\\sqrt{2+a_n}$。判断 $\\sum\\limits_{n=1}^{\\infty}\\left(2-a_n\\right)$ 与 $\\sum\\limits_{n=1}^{\\infty}\\left(2-a_n\\right)^{2}$ 的敛散性。\n\n**思路分析**：三步走：极限 $L=2$（$2=\\sqrt4$）；速度用有理化 + 分母下界。\n\n**详细解答**：**收敛与极限**：归纳 $a_n<2$：$a_1=\\sqrt2<2$；$a_n<2\\Rightarrow a_{n+1}=\\sqrt{2+a_n}<\\sqrt4=2$。单调增：$a_{n+1}>a_n\\iff 2+a_n>a_n^{2}\\iff\\left(a_n-2\\right)\\left(a_n+1\\right)<0\\iff a_n<2$ ✓。递增有上界，$a_n\\to L=\\sqrt{2+L}$，$L=2$。\n\n**速度**：$2-a_{n+1}=\\dfrac{2-a_n}{\\sqrt{2+a_n}+2}\\le\\dfrac{2-a_n}{2+\\sqrt2}=q\\left(2-a_n\\right)$，其中 $q=\\dfrac{1}{2+\\sqrt2}\\approx0.293<1$。故 $0<2-a_n\\le q^{n-1}\\left(2-\\sqrt2\\right)$，几何衰减。\n\n**判级数**：$\\sum\\left(2-a_n\\right)$：正项 + 几何上界 ⟹ **收敛**；$\\sum\\left(2-a_n\\right)^{2}$：上界 $Cq^{2n}$ 更快 ⟹ **收敛**。\n\n**检验**：$2-a_1=0.586$，$2-a_2=2-\\sqrt{3.414}=0.153$，比值 $0.26\\approx q$ ✓。\n\n**方法总结**：==递推判敛三板斧：极限、有理化出相邻差、分母下界出压缩比==；一旦 $\\lvert a_n-L\\rvert\\le Cq^{n}$，一切衍生级数自动绝对收敛。\n\n **【例 5.3-2】（★★，经典）**  求 $\\lim\\limits_{n\\to\\infty}\\left(\\dfrac{1}{n+1}+\\dfrac{1}{n+2}+\\cdots+\\dfrac{1}{2n}\\right)$。\n\n**思路分析**：和式即 $H_{2n}-H_n$——欧拉常数（拔 5.2）一步收割；也可夹逼。\n\n**详细解答**：$H_{2n}-H_n=\\left[\\ln(2n)+\\gamma+o(1)\\right]-\\left[\\ln n+\\gamma+o(1)\\right]=\\ln2+o(1)$，故极限为 $\\ln2$。\n\n（夹逼复核：$n\\cdot\\dfrac{1}{2n}\\le\\sum\\limits_{k=1}^{n}\\dfrac1{n+k}\\le n\\cdot\\dfrac1n$ 只给 $[\\tfrac12,1]$；更细的放缩 $\\dfrac1{n+k}\\ge\\int_{n+k}^{n+k+1}\\dfrac{dx}{x}$ 给 $\\ge\\ln\\dfrac{2n+1}{n+1}\\to\\ln2$，上界同理 $\\le\\ln\\dfrac{2n}{n}\\to\\ln2$ ✓ 两法一致。）\n\n**方法总结**：==调和和式的极限 = 欧拉常数差的恒等式==；凡见 $\\sum_{k=n+1}^{mn}\\dfrac1k$，答案即 $\\ln m$。"}}}},"tricks":{"title":"解题技巧总汇（跨章节通用方法）— CMC 全国大学生数学竞赛备战笔记","introMd":"> **适用对象**：CMC 非数学类（A 类）考生；考研数学一/二冲高分者同样适用。\n> **本册定位**：跨章节的**方法层**总汇。同一个技巧（如分段估计）会同时出现在极限、定积分、级数、曲面积分里——专题笔记教你\"懂\"某一章，习题集帮你\"熟\"某一科，本册负责把它们\"串通\"：看到题面特征，先想到思想，再落到章节。\n> **组织方式**：六部分 20 类技巧，每类固定五段：**核心思想 → 适用信号 → 标准动作 → 示意题（至多 1 道，骨架式题解）→ 易错警示**，末尾注明与已有笔记的关联。\n> **配套资料**：《第一章_极限专题》《定积分专题》等专题笔记，六本习题集，`真题下载/`（第 11–17 届）。","openTree":{"raw":"看到题目\n├─ 极限 / 积分 / 级数的估计问题\n│   ├─ 整体夹不住、某点\"坏\"（峰值/零点/端点） ──────────→ 技巧1 分段估计（挖邻域）\n│   ├─ 含 fⁿ、max、根号 n 次方 ───────────────────────→ 技巧2 峰值邻域（集中紧）\n│   ├─ n 项和、被积函数单调 ──────────────────────────→ 技巧3 夹逼 / 技巧19 定阶工具\n│   └─ 调和级数、ln、对数增长 ────────────────────────→ 技巧5 二进分割\n├─ 二进制 / 进位 / 2ⁿ 结构\n│   ├─ {2ⁿx}、数位、构造奇怪的小数 ───────────────────→ 技巧6 二进制数位构造\n│   ├─ xₙ₊₁ = xₙ²−2、嵌套根号、cos ───────────────────→ 技巧7 倍角代换\n│   ├─ 存在性证明（找零点/找点列） ─────────────
