lta = \\varepsilon/2$。合并即得。"},{"title":"真题对拍","md":"**第十四届初赛·非数学类·四**：证明 $\\displaystyle\\int_0^\\pi \\frac{x\\sin^4 nx}{\\sin^2 x}\\,dx$ 有 $n^2$ 型上界。结构完全同款，三步复合：\n\n1. **对称合并消权重**（技巧 10）：$x \\to \\pi - x$ 配对，把权重 $x$ 消成常数 $\\pi$；\n2. **挖零点邻域**：在 $x=0$（分母 $\\sin x$ 的零点）处截断，取分界 $x = \\frac{1}{2n}$；\n3. **分段用不同上界**：近零点段用 $|\\sin nx| \\le n\\sin x$（归纳可证），远段用 Jordan 型下界 $\\sin x \\ge \\dfrac{2x}{\\pi}$。\n\n> 事实上该积分精确值为 $\\dfrac{n\\pi^2}{4}$（正交性可证，数值已验证）——上界不紧没关系，竞赛要的是\"可证的界\"。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| $\\sin^n x \\le 1$ 直接积分，得 $\\pi/2$ 夹不住 | 上界卡在坏点 → 必须挖邻域 |\n| $\\delta$ 取得依赖 $n$ | $\\delta$ 只能依赖 $\\varepsilon$，与 $n$ 无关 |\n| 先令 $n \\to \\infty$ 再积分（逐项取极限） | 非一致收敛不可穿；先分段再各自处理 |\n| 分段后忘了\"合并\"一步的 $\\varepsilon/2 + \\varepsilon/2$ | 每段预算要在开头就分配好 |"},{"title":"关联与出处","md":"《第一章_极限专题》§四（区间型/数列型分段两版母题）；《定积分专题》§7.2（积分版\"挖邻域\"完整证明）；《一元积分学习题集》\"分段估计 + 令 $\\varepsilon \\to 0$ 收网\"。\n\n---"}]},"2":{"id":"2","name":"峰值邻域与\"集中紧\"（$n$ 次幂放大思想）","family":"先分后合：估计的结构化拆分（4 类）","secs":[{"title":"核心思想","md":"$n$ 次幂会\"放大\"函数在最大值点附近的贡献、把其余部分\"压扁\"。所以含 $f^n$ 的积分，主贡献全部来自 $\\{\\,f \\approx \\max f\\,\\}$ 的小邻域——把\"峰值邻域\"与\"外部\"分开估计（本质是技巧 1 的特例，但识别信号不同）。"},{"title":"适用信号","md":"- $\\displaystyle\\lim_{n\\to\\infty}\\sqrt[n]{\\int_a^b f(x)^n\\,dx}$ 型（答案就是 $\\max f$）；\n- $\\int f^n$ 的渐近阶、$\\|f\\|_{L^n} \\to \\|f\\|_\\infty$ 类命题；\n- 被积函数在一点取最大、其余处衰减。"},{"title":"标准动作","md":"1. 设 $M = \\max f$ 在 $x_0$ 取得，取 $x_0$ 的 $\\delta$ 邻域；\n2. **下界**（证 $\\ge M$）：邻域内 $f \\ge M - \\varepsilon'$，故 $\\sqrt[n]{\\int f^n} \\ge (M-\\varepsilon')\\cdot(\\text{长度})^{1/n} \\to M-\\varepsilon'$；\n3. **上界**（证 $\\le M$）：整体 $f \\le M$，长度 $(b-a)^{1/n} \\to 1$；\n4. 令 $\\varepsilon' \\to 0$ 收网。"},{"title":"示意题（★，经典）","md":"设 $f(x) = x(2-x)$，求 $\\displaystyle\\lim_{n\\to\\infty}\\left(\\int_0^1 x^n f(x)\\,dx\\right)^{1/n}$。\n\n**骨架**：$\\max_{[0,1]} f = f(1) = 1$。上界：$x^n f \\le x^n \\cdot 1$，故积分 $\\le \\dfrac{1}{n+1}$，$n$ 次根 $\\to 1$；下界：$[1-\\delta, 1]$ 上 $f \\ge 1 - 2\\delta$，积分 $\\ge \\delta(1-2\\delta)^n$，$n$ 次根 $\\ge (1-2\\delta)\\delta^{1/n} \\to 1-2\\delta$；令 $\\delta \\to 0$。答案 $= 1$。\n（数值验证：$n = 200$ 时闭式 $\\dfrac{2}{n+2}-\\dfrac{1}{n+3}$ 的 $n$ 次根 $= 0.9738 \\to 1$ ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 下界不会做，只证了一半 | 下界必须用\"峰值邻域内 $f$ 接近 $M$\"，配合长度$^{1/n} \\to 1$ |\n| 忘了区间长度也要开 $n$ 次根 | $\\int \\ge \\delta \\cdot m^n \\Rightarrow$ 根 $\\ge m\\,\\delta^{1/n}$，$\\delta^{1/n} \\to 1$ 是关键 |\n| 最大值在多个点取到时只看一个 | 无妨：只需一个峰值邻域做下界 |"},{"title":"关联与出处","md":"《定积分专题》§7.2 思想提炼与例 12.6（$\\lim\\sqrt[n]{\\int f^n} = \\max f$）；《一元积分学习题集》\"峰值定根极限是一类通用引理\"。\n\n---"}]},"3":{"id":"3","name":"夹逼与两端逼近（\"上下界同源\"思想）","family":"先分后合：估计的结构化拆分（4 类）","secs":[{"title":"核心思想","md":"当精确计算困难时，构造**结构相同、仅差一个单调放缩**的上下两个量，逼出极限。与技巧 1 的区别：夹逼处理\"整体单调可放缩\"，分段估计处理\"局部坏点\"。"},{"title":"适用信号","md":"- $n$ 项和 $\\sum_{k=1}^n g\\!\\left(\\dfrac{k}{n}\\right)\\cdot\\dfrac1n$ 型（定积分定义的信号）；\n- 和式中每项可统一放缩 $\\dfrac{n}{\\sqrt{n^2+n}} \\le \\sum \\le \\dfrac{n}{\\sqrt{n^2+1}}$ 这类\"分子分母同结构\"；\n- 上下界表达式形式一致、极限相同。"},{"title":"标准动作","md":"1. 对每一项做**同方向、同结构**的放缩（通常是把 $k$ 换成 $1$ 或 $n$）；\n2. 两端化成相同的初等表达式；\n3. 两端极限相同 → 收网。"},{"title":"示意题（★★，竞赛风格）","md":"求 $\\displaystyle\\lim_{n\\to\\infty}\\sum_{k=1}^n \\frac{1}{\\sqrt{n^2+k}}$。\n\n**骨架**：\n$\n\\frac{n}{\\sqrt{n^2+n}} \\;=\\; \\sum_{k=1}^n \\frac{1}{\\sqrt{n^2+n}} \\;\\le\\; \\sum_{k=1}^n \\frac{1}{\\sqrt{n^2+k}} \\;\\le\\; \\sum_{k=1}^n \\frac{1}{\\sqrt{n^2+1}} \\;=\\; \\frac{n}{\\sqrt{n^2+1}},\n$\n两端均 $\\to 1$，故极限 $= 1$。（数值验证：$n = 5000$ 时 $0.99995$ ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 上下界极限不同就硬夹 | 先检查放缩是否可以更紧（如取 $\\sqrt{n^2 + k}$ 与 $\\sqrt{n^2+k-1}$ 的单调性） |\n| 把 $\\frac{1}{\\sqrt{n^2+k}}$ 等价成 $\\frac1n$ 后逐项相加 | 等价替换在**求和内部**要小心：本题主部 $n \\cdot \\frac1n = 1$，修正项 $\\sum \\frac{k}{2n^3}$ 也恰好可估，但更稳妥的做法就是整体夹逼 |\n| 和式含 $\\frac{k}{n}$ 的函数值结构时硬算 | 那是定积分定义信号（技巧 17），不是夹逼 |"},{"title":"关联与出处","md":"《第一章_极限专题》§3.1–3.2、§十五速查表\"n 项求和 → Stolz 或分段估计\"；《一元微分学习题集》夹逼类方法。\n\n---"}]},"4":{"id":"4","name":"抓大头定阶与等价量（\"主导项\"思想）","family":"先分后合：估计的结构化拆分（4 类）","secs":[{"title":"核心思想","md":"任何复杂表达式在极限过程中只被**最高阶（或最低阶）的那一项**主导。先定阶、再判敛/求极限，把\"计算题\"变成\"识别题\"。"},{"title":"适用信号","md":"- 级数判敛：通项是多个量的和/差/复合；\n- 极限式中出现 $n^{1/n}$、$a^{n}$、$n!$、$\\ln n$ 等混合；\n- 需要快速判断\"谁增长快\"。"},{"title":"标准动作","md":"1. 列出各候选项的阶：$(\\ln n)^p \\ll n^\\varepsilon \\ll a^n \\ll n! \\ll n^n$；\n2. 复合结构拆开：如 $n^{1/n} = e^{(\\ln n)/n} = 1 + \\dfrac{\\ln n}{n} + O\\!\\left(\\dfrac{\\ln^2 n}{n^2}\\right)$；\n3. 用主导项替换整个通项，判敛或求极限。"},{"title":"示意题（★★，经典）","md":"判断 $\\sum_{n\\ge 2} \\left(\\sqrt[n]{n} - 1\\right)$ 的敛散性。\n\n**骨架**：$\\sqrt[n]{n} - 1 = e^{(\\ln n)/n} - 1 \\sim \\dfrac{\\ln n}{n}$（$x \\to 0$ 时 $e^x - 1 \\sim x$）。而 $\\sum \\dfrac{\\ln n}{n}$ 发散（积分判别：$\\displaystyle\\int_2^\\infty \\frac{\\ln x}{x}dx = +\\infty$；或用技巧 5 的二进分组）。故原级数发散。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 对**差** $a_n - b_n$ 分别等价替换 | 差的等价要展开到相消后的第一阶（Taylor 到足够多项） |\n| 认为 $\\ln n$ 增长慢就可以扔 | $\\sum \\frac{1}{n\\ln n}$ 仍发散：慢不等于可忽略 |\n| 阶的排序记错 | 背口诀：**幂慢于指，指慢于阶乘，阶乘慢于 $n^n$；对数比任何正幂都慢** |"},{"title":"关联与出处","md":"《无穷级数习题集》方法 1.2（比较判别法\"抓大头\"定阶）、1.5（阶估计与等价量判敛）；《第一章_极限专题》§3.4（Taylor 求极限）。\n\n***"}]},"5":{"id":"5","name":"二进分割估计（dyadic decomposition，\"倍增分桶\"思想）","family":"二进制与倍增族（5 类）——本笔记重点补齐","secs":[{"title":"核心思想","md":"把 $[1, \\infty)$（或求和指标）按 $[2^k, 2^{k+1})$ 分桶。桶内用**最小值下界 / 最大值上界**统一放缩，桶间变成一个关于 $k$ 的和——**把\"对 $n$ 的估计\"降为\"对 $\\ln n$ 的估计\"**，增长快慢立判。"},{"title":"适用信号","md":"- 调和级数、$\\sum \\frac{1}{n \\ln n}$ 这类\"积分判别法边缘\"的级数；\n- 需要证 $H_n$ 与 $\\ln n$ 同阶（$H_n = \\ln n + O(1)$，欧拉常数的来源）；\n- 任何\"整体放缩丢失太多精度\"的正项级数估计。"},{"title":"标准动作","md":"1. 分桶：$n \\in [2^k, 2^{k+1})$，桶长 $2^k$；\n2. 桶内放缩（以 $a_n = \\frac{1}{n}$ 为例）：\n   $\\text{桶和} = \\sum_{n=2^k}^{2^{k+1}-1}\\frac1n \\;\\ge\\; 2^k \\cdot \\frac{1}{2^{k+1}} = \\frac12, \\qquad \\text{桶和} \\;\\le\\; 2^k\\cdot\\frac{1}{2^k} = 1;$\n3. 桶间求和：前 $m$ 桶总计 $\\frac{m}{2} \\le H_{2^m} \\le m$，即 $H_{2^m}$ 与 $m = \\log_2 2^m$ 同阶；\n4. 得结论：$H_n \\to \\infty$ 且 $H_n = \\Theta(\\ln n)$（更精细：$H_n \\le 1 + \\ln n$，由积分比较）。"},{"title":"示意题（★★，经典难题）","md":"证明 $\\displaystyle\\sum_{n=2}^{\\infty} \\frac{1}{n \\ln n}$ 发散。\n\n**骨架**：考察桶 $[2^k, 2^{k+1})$（$k \\ge 1$），桶内 $\\dfrac{1}{n \\ln n} \\ge \\dfrac{1}{2^{k+1} \\ln 2^{k+1}}$，故\n\n$\n\\text{桶和} \\;\\ge\\; 2^k \\cdot \\frac{1}{2^{k+1}(k+1)\\ln 2} \\;=\\; \\frac{1}{2\\ln 2}\\cdot\\frac{1}{k+1}.\n$\n\n而 $\\sum_k \\frac{1}{k+1}$ 发散，故原级数发散。（数值验证：桶 $[2^8, 2^9)$ 的实际和 $= 0.11798 \\ge$ 下界 $0.08015$ ✓）\n\n**对照**：同样分桶可得 $H_{2^m} - \\frac m2 \\ge 1$（数值：$m = 10$ 时 $= 2.51$，$m = 15$ 时 $= 3.47$ ✓），以及积分比较 $H_n \\le 1 + \\ln n$（数值：$n = 1000$ 时 $7.486 \\le 7.908$ ✓）。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 桶内用最大值做**下**界 | 下界用桶内最小值（桶最右端点），方向别反 |\n| 分桶起点从 $n = 1$ 开始 | $\\ln 1 = 0$ 无意义，从 $n \\ge 2$ 起算，不影响敛散 |\n| 认为该技巧只能证发散 | 同一分桶把上界收紧后也能证**收敛**（每桶和 $\\le 2^{-\\varepsilon k}$ 型衰减即收敛），如 $\\sum \\frac{1}{n \\ln^2 n}$ |\n| 与积分判别法混用条件 | 二进分桶是积分判别法的**离散替身**：考场忘了 $\\int \\frac{dx}{x\\ln x}$ 时用它救场 |"},{"title":"关联与出处","md":"《无穷级数习题集》方法 1.4（积分判别法）、5.5（欧拉常数与渐近估计）；《第一章_极限专题》§十二（压缩映射证 $\\sum \\frac1n - \\ln n$ 收敛，即欧拉常数）。\n\n---"}]},"6":{"id":"6","name":"二进制数位构造与移位（\"表数改写\"思想）","family":"二进制与倍增族（5 类）——本笔记重点补齐","secs":[{"title":"核心思想","md":"$x \\in [0,1]$ 的二进制展开 $x = \\sum_k \\varepsilon_k 2^{-k}$（$\\varepsilon_k \\in \\{0,1\\}$）是一个**可控的自由度仓库**：想要什么性质的小数，就按二进制数位\"编程\"。核心机制是**移位**：$\\{2x\\}$ 等于把 $x$ 的二进制表示左移一位再扔掉整数部分——乘 $2^n$ = 左移 $n$ 位。"},{"title":"适用信号","md":"- 题目问\"是否存在 / 构造一个 $x$，使得 $\\{2^n x\\}$（或小数位数）具有某种行为\"；\n- 需要构造极限不存在、上下极限不同、稠密、远离某值的点列；\n- 与\"第 $k$ 位数字\"有关的存在性命题。"},{"title":"标准动作","md":"1. 把目标性质翻译成\"数位条件\"（如\"$\\{2^n x\\}$ 常回零\" = \"$x$ 的第 $n$ 位之后常出现长串 0\"）；\n2. 选稀疏位置放 1：典型取 $x = \\sum_{j} 2^{-k_j}$，$k_j$ 增长极快（如 $k_j = j!$）；\n3. 验证：乘 $2^{k_J}$ 后，前 $J$ 项变整数，余项是**极小的尾和** $\\sum_{j > J} 2^{k_J - k_j}$；\n4. 由尾和 $\\to 0$ 读出子列行为，配合\"整数部分奇偶\"控制相邻移位。"},{"title":"示意题（★★★，竞赛风格）","md":"设 $x = \\sum_{j=1}^{\\infty} 2^{-j!}$（无理数）。证明：数列 $\\{2^{j!} x\\}$ 与 $\\{2^{j!-1} x\\}$ 分别趋于 $0$ 与 $\\dfrac12$，从而 $\\{2^n x\\}$ 发散。\n\n**骨架**：固定 $J$，\n\n$\n2^{J!} x = \\underbrace{\\sum_{j\\le J} 2^{J!-j!}}_{\\text{整数} \\,N_J} + \\underbrace{\\sum_{j > J} 2^{J!-j!}}_{\\text{尾项 } r_J}, \\qquad 0 < r_J \\le 2^{J!-(J+1)!}\\left(1 + \\tfrac12 + \\cdots\\right) = 2\\cdot 2^{-J\\cdot J!} \\to 0.\n$\n\n故 $\\{2^{J!}x\\} = r_J \\to 0$。再看 $2^{J!-1}x = \\dfrac{N_J + r_J}{2}$：$N_J$ 为**奇数**（$j = J$ 项贡献 $2^0 = 1$，$j < J$ 项均为偶数次幂），所以 $\\{2^{J!-1}x\\} = \\dfrac{1 + r_J}{2} \\to \\dfrac12$。两个子列极限不同，$\\{2^n x\\}$ 发散。\n（数值验证：$J = 5$ 时 $\\{2^{J!}x\\} = 0.00000000$，$\\{2^{J!-1}x\\} = 0.50000000$ ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 尾和估不出来就放弃 | 稀疏指标（$j!$）保证 $k_{J+1} - k_J \\to \\infty$，尾和 $\\le 2 \\cdot 2^{-(k_{J+1}-k_J)}$，一步几何级数 |\n| 忘记二进制展开的不唯一性（$0.0111\\ldots = 0.1$） | 构造时避开\"全 1 尾巴\"：稀疏放 1 天然避开；证明里可约定取非终止展开 |\n| 把 $\\{2^n x\\}$ 与 $(2^n x) \\bmod$ 混淆 | $\\{\\cdot\\}$ 是取小数部分；移位后整数部分的奇偶决定除以 2 后落点，本例的 $\\frac12$ 正来自奇偶 |\n| 想直接构造\"稠密\"的 $x$ | 稠密需要每个有限 0-1 串都出现（Champernowne 型构造），难度高一档，CMC 非数学类考\"子列极限不同\"已足够 |"},{"title":"关联与出处","md":"《第一章_极限专题》§十一（上下极限，与本技巧配合判发散）；数位构造在已有笔记中无覆盖，本节为新增。\n\n---"}]},"7":{"id":"7","name":"倍增递推与倍角代换（\"翻倍加速\"思想）","family":"二进制与倍增族（5 类）——本笔记重点补齐","secs":[{"title":"核心思想","md":"两大倍增结构：①**嵌套根号** $x_{n+1} = \\sqrt{2 + x_n}$ 与 ②**平方递推** $x_{n+1} = x_n^2 - 2$ 都能用 $x_n = 2\\cos\\theta_n$ 显式解出，且每迭代一步 $\\theta$ 翻倍：$\\theta_{n+1} = 2\\theta_n$（半角公式 $2\\cos\\frac\\theta2 = \\sqrt{2 + 2\\cos\\theta}$；倍角公式 $2\\cos 2\\theta = (2\\cos\\theta)^2 - 2$）。递推的\"隐蔽周期 / 收敛速度\"全部由 $2^n\\theta$ 的行为读出。"},{"title":"适用信号","md":"- 递推式中出现 $x_n^2 - 2$、$\\sqrt{2 + x_n}$、$\\sqrt{2 \\pm x_n}$；\n- 初值落在 $[-2, 2]$（或根号型落在 $[0,2]$），提示可写成 $2\\cos\\theta$；\n- 求 $x_n$ 的闭式、或 $n^p(2 - x_n)$ 型收敛速度。"},{"title":"标准动作","md":"1. 令 $x_1 = 2\\cos\\theta$（要求 $|x_1| \\le 2$；根号型 $x_1 = 2\\cos\\frac\\theta2$ 之类按半角凑）；\n2. 归纳验证 $x_n = 2\\cos(2^{n-1}\\theta)$（平方型）或 $x_n = 2\\cos(\\theta/2^{n-1})$（根号型）；\n3. 收敛性、极限、速度全部转成三角函数的 Taylor 展开：\n   - 根号型：$2 - x_n = 2\\left(1 - \\cos\\frac{\\theta}{2^{n-1}}\\right) \\sim \\frac{\\theta^2}{4^{n-1}}$，即 $4^n(2 - x_n)$ 有非零极限；\n   - 平方型：$\\theta$ 含 $\\pi$ 的有理倍时 $x_n$ 周期或终归周期；否则 $\\{2^n\\theta\\}$ 的行为决定一切（连到技巧 6）。"},{"title":"示意题（★★★，经典名题）","md":"设 $x_1 = \\sqrt2$，$x_{n+1} = \\sqrt{2 + x_n}$。求 $\\displaystyle\\lim_{n\\to\\infty} 4^n(2 - x_n)$。\n\n**骨架**：归纳可证 $x_n = 2\\cos\\dfrac{\\pi}{2^{n+1}}$（$x_1 = 2\\cos\\frac\\pi4 = \\sqrt2$ ✓，代入半角公式递推成立）。于是\n\n$\n4^n(2 - x_n) = 4^n \\cdot 2\\left(1 - \\cos\\frac{\\pi}{2^{n+1}}\\right) = 4^n\\left(\\frac{\\pi^2}{4^{n+1}} + O(4^{-2n})\\right) \\;\\longrightarrow\\; \\frac{\\pi^2}{4}.\n$\n\n（数值验证：$n = 8$ 时 $4^n(2-x_n) = 2.467393$，$\\pi^2/4 = 2.467401$ ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 只会单调有界求极限 $= 2$，速度题卡死 | 速度题必走倍角闭式：$1 - \\cos t \\sim t^2/2$ 给出精确阶 |\n| 平方型递推初值 $\\lvert x_1\\rvert  > 2$ 也硬套 $\\cos$ | $\\lvert x_1\\rvert  > 2$ 时写 $x_1 = t + t^{-1}$（$t = 2\\cosh$ 型），得 $x_n = t^{2^{n-1}} + t^{-2^{n-1}}$ 爆炸增长 |\n| 倍角后忘检查 $\\theta$ 与 $\\pi$ 的可公度性 | 平方型的周期 / 发散分界全在这里：$\\theta/\\pi$ 有理 → 周期，无理 → 一般发散（可结合技巧 6 构造特殊无理例外） |\n| 把 $4^n$ 误记为 $2^n$ | 每步误差平方级收缩 $\\Rightarrow$ 速度是 $4^{-n}$ 级，不是 $2^{-n}$ |"},{"title":"关联与出处","md":"《第一章_极限专题》§八（迭代数列趋向速度三大模型）、§九（三角换元与连锁消去——同为\"三角显式化\"思想）；《微分方程习题集》5.4（与变限积分、级数的综合）。\n\n---"}]},"8":{"id":"8","name":"二分法与区间套（\"折半逼近\"思想）","family":"二进制与倍增族（5 类）——本笔记重点补齐","secs":[{"title":"核心思想","md":"存在性证明造不出具体的点时，**用算法构造点列**：每一步把区间折半并保留\"目标性质\"所在的一半，得到长度 $\\to 0$ 的闭区间套，套出唯一的点。它是介值定理、零点定理的\"构造性版本\"，也是技巧 6 中\"数位\"的几何影子（每次二分 = 写下一位二进制）。"},{"title":"适用信号","md":"- \"证明存在 $\\xi$，使得 $f(\\xi) = \\cdots$\"且方程解不显式；\n- 需要同时满足**两个条件**的点（每次二分按优先级保一个条件，用区间套保另一个）；\n- 证明某个不动点 / 某条曲线与直线的交点存在。"},{"title":"标准动作","md":"1. 找初始区间 $[a_0, b_0]$，两端\"目标量\"分居上下（如 $g(a_0) < 0 < g(b_0)$）；\n2. 取中点 $c$，判断 $g(c)$ 的符号，保留异号的一半为 $[a_{n+1}, b_{n+1}]$；\n3. $b_n - a_n = 2^{-n}(b_0 - a_0) \\to 0$，由区间套定理得唯一点 $\\xi$；\n4. 由 $g(a_n), g(b_n)$ 异号 + 连续性 + 极限，得 $g(\\xi) = 0$。"},{"title":"示意题（★，概念经典）","md":"证明：任何连续函数 $f$ 若满足 $f(0) < 0 < f(1)$，则存在 $\\xi \\in (0,1)$ 使 $f(\\xi) = 0$。\n\n**骨架**：如上四步。要点在**书写规范**：$|f(a_n)| \\le M_n \\to 0$ 型的界要交代（或直接用 $f(a_n) < 0 < f(b_n)$ 取极限）。这是送分题，但它是\"存在 $\\xi$ 使得 $f'(\\xi) = g(\\xi)$\"类题的底层构造（先用二分/介值找到辅助函数的变号点，再用罗尔）。\n\n> **真题对拍**：第十三届初赛·非数学类·补赛·二：证明 $f(x) = -1 + \\frac12\\left(\\frac{1}{x+1} + \\frac{1}{1-x^2}\\right)\\int_{-1}^{x}|x - t|e^{-t^2}dt$ 在 $(-1, 1)$ 内**恰有两个**零点——\"恰有\"= 两个方向的介值（找两个变号区间）+ 单调性排除第三个，是介值 + 单调的标准搭配。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 只证存在不证唯一（题目要\"恰有\"） | \"恰有\"必须补单调性 / 符号分析把零点个数封顶 |\n| 二分保留的一半选错条件 | 双条件题里：主条件用二分保，副条件用初始区间整体满足来保 |\n| 把区间套定理用在开区间上 | 必须闭区间套；开区间只能得柯西列再加完备性 |\n| 循环论证（先用了零点存在再构造） | 二分是**证明**介值的手段；若考试允许直接引用介值定理，就别绕这一步浪费时间 |"},{"title":"关联与出处","md":"《第一章_极限专题》§十四（闭区间上连续函数性质、根的存在性）；《一元微分学习题集》介值定理类方法。\n\n---"}]},"9":{"id":"9","name":"展开逼近与尾项控制（\"截断 + 丢尾\"思想）","family":"二进制与倍增族（5 类）——本笔记重点补齐","secs":[{"title":"核心思想","md":"把目标数按**收敛极快的级数**展开（如 $e = \\sum \\frac{1}{k!}$），截断前 $n$ 项得到\"整数 + 极小尾项\"的分解：主部结构清晰、尾项一放就小。这是判无理性、求 $\\sin(2\\pi e\\, n!)$ 型极限、证超越性倾向命题的万能起手。"},{"title":"适用信号","md":"- 题面出现 $e$、$n!\\,e$、$\\sum \\frac{1}{k!}$、$\\cosh 1$ 等\"阶乘分母\"结构；\n- 要证某数是无理数（分数逼近太好的矛盾）；\n- 要分析 $n! \\cdot \\alpha$ 的小数部分行为。"},{"title":"标准动作","md":"1. 写出快速收敛展开：$e\\cdot n! = \\sum_{k=0}^{n}\\dfrac{n!}{k!} + \\sum_{k=n+1}^{\\infty}\\dfrac{n!}{k!}$；\n2. **主部是整数**：$k \\le n$ 时 $\\frac{n!}{k!}$ 均为整数；\n3. **尾项放缩**：\n   $0 < r_n = \\frac{1}{n+1} + \\frac{1}{(n+1)(n+2)} + \\cdots < \\frac{1}{n+1}\\left(1 + \\frac{1}{n+1} + \\frac{1}{(n+1)^2} + \\cdots\\right) < \\frac{2}{n};$\n4. 由 $r_n \\to 0$ 读出一切：$\\{e\\, n!\\} \\to 0$，$\\sin(2\\pi e\\, n!) \\to 0$，$e$ 无理。"},{"title":"示意题（★★，经典名题）","md":"求 $\\displaystyle\\lim_{n\\to\\infty} \\sin\\left(2\\pi e\\, n!\\right)$。\n\n**骨架**：如上分解，$e\\,n! = $ 整数 $+ r_n$，$0 < r_n < \\frac{2}{n}$。故 $\\sin(2\\pi e\\,n!) = \\sin(2\\pi r_n) \\sim 2\\pi r_n \\to 0$。\n（数值验证：$n = 15$ 时 $\\{e \\cdot n!\\} = 0.0664 \\to 0$，正弦值 $0.405 \\to 0$ ✓，速度 $\\sim \\frac{2\\pi}{n}$）\n\n**副产品——$e$ 无理**：若 $e = \\frac{p}{q}$，则 $q!\\,e$ 为整数，但 $q!\\,e = $ 整数 $+\\,r_q$，$0 < r_q < \\frac{2}{q} \\le 1$，矛盾。"},{"title":"真题对拍","md":"**第十四届初赛·非数学类·六**：设正项级数 $\\sum a_n$ 收敛，证明存在收敛的正项级数 $\\sum b_n$，使 $\\lim\\limits_{n\\to\\infty}\\dfrac{a_n}{b_n} = 0$。\n\n**骨架**（尾项 + 裂项构造）：令 $S_n = \\sum_{k=n}^{\\infty} a_k$（收敛级数的尾项，$S_n \\downarrow 0$），取\n\n$\nb_n = \\sqrt{S_n} - \\sqrt{S_{n+1}} = \\frac{S_n - S_{n+1}}{\\sqrt{S_n} + \\sqrt{S_{n+1}}} = \\frac{a_n}{\\sqrt{S_n} + \\sqrt{S_{n+1}}} > 0.\n$\n\n则 $\\sum b_n$ 裂项 telescoping 收敛于 $\\sqrt{S_1}$，且 $\\dfrac{a_n}{b_n} = \\sqrt{S_n} + \\sqrt{S_{n+1}} \\to 0$。（数值验证：取 $a_k = \\frac1{k^2}$，$N = 2\\times10^5$ 时 $\\frac{a_N}{b_N} = 4.2\\times10^{-3} \\to 0$ ✓。官方解答用的是子列构造法，此处的尾项开根构造更简洁，两法均可。）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 尾项只估第一项 $\\frac{1}{n+1}$ | 后面还有一串，要用几何级数统一罩住（公比 $\\frac{1}{n+1}$） |\n| 直接写 $\\sin(2\\pi e n!) \\to \\sin(0) = 0$ 而不分解 | 必须先证 $\\{e n!\\} \\to 0$；\"内层无极限就不能穿\"同技巧 1 的警示 |\n| 判无理时取 $q!$ 仍是\"整 + 尾\"就收工 | 矛盾必须落在\"整数严格介于 0 和 1 之间\"，即还要证 $0 < r_q < 1$ |\n| 把技巧用到 $\\pi$ 上 | $\\pi$ 没有阶乘分母的快速展开，此法失效——用对工具对象 |"},{"title":"关联与出处","md":"《无穷级数习题集》方法 1.1（通项趋于零）、5.5（渐近估计综合）；《第一章_极限专题》§3.2（等价无穷小）；本节为新增覆盖。\n\n***"}]},"10":{"id":"10","name":"区间再现与共轭配对（\"变量对合\"思想）","family":"对称与配对（3 类）","secs":[{"title":"核心思想","md":"换元 $x \\mapsto a + b - x$（区间再现）或 $x \\mapsto \\dfrac1x$（倒代换的共轭）、$x \\mapsto \\frac\\pi2 - x$（sin/cos 互换）后，积分**值不变**但**被积函数改变**。原式与换元式相加 / 相减，可以把权重 $x$、不对称因子消掉。"},{"title":"适用信号","md":"- 积分限 $[0, \\pi]$、$[a, b]$、$[0, +\\infty)$，被积函数含**单个** $x$ 的权重或 $\\ln$；\n- $f(\\sin x)$ 型（关于 $\\frac\\pi2$ 对称）；\n- 广义积分两端（0 与 $\\infty$）结构互补（倒代换信号）。"},{"title":"标准动作","md":"1. 写出 $I = \\int_a^b f(x)\\,dx$，再做换元 $x \\to a+b-x$ 得 $I = \\int_a^b f(a+b-x)\\,dx$；\n2. 两式相加：$2I = \\int_a^b [f(x) + f(a+b-x)]\\,dx$，和式往往可化简；\n3. 特例背熟：\n   $\\int_0^\\pi x\\,f(\\sin x)\\,dx = \\frac{\\pi}{2}\\int_0^\\pi f(\\sin x)\\,dx;$\n4. 遇 $\\ln$ + 倒代换：$x \\to \\frac1x$ 把 $\\ln x$ 变 $-\\ln x$，实现\"自我抵消\"（见技巧 16 示意题）。"},{"title":"示意题（★★，经典名题）","md":"计算 $\\displaystyle I = \\int_0^\\pi \\frac{x \\sin x}{1 + \\cos^2 x}\\,dx$。\n\n**骨架**：$x \\to \\pi - x$：\n$\nI = \\int_0^\\pi \\frac{(\\pi - x)\\sin x}{1 + \\cos^2 x}\\,dx \\;\\Longrightarrow\\; 2I = \\pi\\int_0^\\pi \\frac{\\sin x}{1+\\cos^2 x}\\,dx = \\pi\\left[-\\arctan(\\cos x)\\right]_0^\\pi = \\frac{\\pi^2}{2},\n$\n故 $I = \\dfrac{\\pi^2}{4}$。（数值验证：$2.46740110$ ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 换元后忘记积分限反转要换回 | $x \\to \\pi - x$ 是自反换元，直接写\"值不变\"即可，别把限写错 |\n| $f(\\cos x)$ 也套 $x \\to \\pi - x$ 消权重 | $\\cos(\\pi - x) = -\\cos x$ 不对称！$f(\\cos x)$ 的权重消解需要 $x \\to$ 其他对合或分部积分 |\n| 只会相加不会相减 | 配对相**减**用于奇性抵消（如 $\\ln\\frac{\\sin x}{\\cos x}$ 配对出 0） |"},{"title":"关联与出处","md":"《定积分专题》§6.3（区间再现公式★）、§6.5（关于中点对称的函数）；《一元积分学习题集》方法 2.3。\n\n---"}]},"11":{"id":"11","name":"奇偶与轮换对称（\"地位平等求和\"思想）","family":"对称与配对（3 类）","secs":[{"title":"核心思想","md":"当积分区域（或求和指标集）在变量的**置换下不变**，而积分值与变量名无关时，$\\int x^4$、$\\int y^4$、$\\int z^4$ 全相等——**不知道每个的值，却能求出它们的和**。未知系数通过轮换被\"平均\"掉。"},{"title":"适用信号","md":"- 多元积分：区域是球 / 圆 / 正方形，被积函数是齐次多项式且系数成组出现；\n- 真题里\"系数 $a_1, \\ldots, a_6$ 未知，求积分\"——**必是轮换消元**；\n- 一元场景：$f$ 奇 / 偶 + 区域对称 → 一眼定值（0 或加倍）。"},{"title":"标准动作","md":"1. 查区域对称性：关于坐标面 / 坐标轴 / 变量置换不变？\n2. 查函数奇偶 / 轮换地位：$x^4, y^4, z^4$ 在球面上地位相同；\n3. 用\"总量守恒\"列方程：在单位球面 $S$ 上，$(x^2+y^2+z^2)^2 = 1$ 积分得\n   $3A + 6B = 4\\pi, \\qquad A = \\iint_S x^4\\,dS,\\ B = \\iint_S x^2 y^2\\,dS;$\n4. 解出组合值（不需要单个值！）。"},{"title":"示意题（★★★，真题）","md":"**第十三届初赛·非数学类·四**：$f(x,y,z) = a_1x^4 + a_2y^4 + a_3z^4 + 3a_4x^2y^2 + 3a_5y^2z^2 + 3a_6x^2z^2$（四次齐次），计算 $\\iint_S f\\,dS$，$S: x^2 + y^2 + z^2 = 1$。\n\n**骨架**：轮换对称下 $\\iint_S x^4 dS = \\iint_S y^4 dS = \\iint_S z^4 dS = A$，三个交叉项也相等 $= B$。在 $S$ 上恒有 $\\sum x^4 + 2\\sum x^2y^2 = (x^2+y^2+z^2)^2 = 1$，积分得 $3A + 6B = \\iint_S dS = 4\\pi$。再由 $\\iint_S x^2\\,dS = \\frac{4\\pi}{3}$（对称三等分）且 $x^2(x^2+y^2+z^2) = x^2$ 给出 $A + 2B = \\frac{4\\pi}{3}$——两个方程其实同解，**还需独立值** $A = \\frac{4\\pi}{5}$（参数化球面或查对称矩）。于是\n\n$\n\\iint_S f\\,dS = (a_1 + a_2 + a_3)\\frac{4\\pi}{5} + 3(a_4 + a_5 + a_6)\\frac{4\\pi}{15} = \\frac{4\\pi}{5}\\sum_{i=1}^{6} a_i.\n$\n\n六个未知系数只以**总和**出现——这就是轮换对称的威力。（蒙特卡洛验证：随机系数下 $6.5328$ vs 理论 $6.5345$，MC 精度内一致 ✓；$A = 4\\pi/5$、$B = 4\\pi/15$ 均已数值验证 ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 区域对称就看函数奇偶，反之只看一个 | 必须**双查**：区域对称 + 函数奇偶，缺一不可 |\n| 轮换三等分用在 $\\iint x^2y^2$ 上 | $\\iint_S x^2 dS$ 可三等分（因 $x^2 + y^2 + z^2$ 守恒），但交叉项要另列方程 |\n| 二重积分忘了\"轮换 ≠ 奇偶消零\" | 轮换给**等值**，奇偶给**零或加倍**，两套动作别混 |"},{"title":"关联与出处","md":"《多元积分学习题集》方法 1.4（对称性双查）、1.7（轮换对称性专题）；《定积分专题》§6.1（奇偶性）。\n\n---"}]},"12":{"id":"12","name":"平移与周期化（\"化归到主周期\"思想）","family":"对称与配对（3 类）","secs":[{"title":"核心思想","md":"周期函数在长区间上的积分 = 整数个主周期 + 余段；主周期内部再平移截断到 $[0, \\frac\\pi2]$（点火区间）。所有 $\\sin^n\\cos^n$、$|\\sin x|$、傅里叶相关计算都先走这一步。"},{"title":"适用信号","md":"- 积分限长（$[0, n\\pi]$、$[0, 2n\\pi]$）且被积函数周期；\n- $\\sin^n x \\cos^n x$ 混合幂 → 平移到 $[0, \\frac\\pi2]$ 用 Wallis；\n- 含 $[x]$（取整）的积分：按周期 / 按整数分段。"},{"title":"标准动作","md":"1. 周期 $T$：$\\int_0^{nT + r} = n\\int_0^T + \\int_0^r$；\n2. 对称截断：$\\int_0^{\\pi/2} \\sin^n = \\int_0^{\\pi/2}\\cos^n$，全区间 $= 2\\int_0^{\\pi/2}$（视奇偶）；\n3. 取整函数出现：分 $[k, k+1)$ 逐段，段内 $[x] = k$ 常数。\n\n> **真题对拍**：第十二届初赛·非数学类·六：$f(n)$ 定义为一列含取整函数 $[x+1]$ 的余弦积分之和，证明 $f(n)$ 等于 $n$ 的全部因子（含 $1$ 和 $n$）之和，并求 $f(2021)$。机制与本技巧完全同款：出现 $[x+1]$ 就按单位区间 $[k-1, k)$ 分段，段内取整为常数 $k$，积分化为 $\\sum_k \\cos\\frac{2\\pi n k}{m}$ 型的**余弦和**，再用\"单位根求和 = 因子筛选\"（$m \\mid n$ 时整和、否则相消）筛出因子。答案 $f(2021) = \\sigma(2021) = (1+43)(1+47) = 2112$（$2021 = 43 \\times 47$）。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 余段 $\\int_0^r$ 直接扔掉 | 余段必须保留估计或恰好算出；判敛题里余段统一放缩 |\n| 点火公式奇偶记错（$\\int_0^{\\pi/2}\\sin^n$ 奇幂不含 $\\pi$） | 奇幂终点是 $1$ 或因子积，偶幂终点含 $\\frac\\pi2$；已详表于《定积分专题》§7 |\n| $\\lvert \\sin x\\rvert $ 周期记成 $2\\pi$ | $\\lvert \\sin\\rvert $、$\\lvert \\cos\\rvert $ 周期是 $\\pi$，主周期积分为 $2$ |"},{"title":"关联与出处","md":"《定积分专题》§6.2（周期性）、§6.4（三角函数系正交性）、§7.1（Wallis 积分递推）；《多元积分学习题集》方法 1.5（分块处理：绝对值 / max / 取整）。\n\n***"}]},"13":{"id":"13","name":"辅助函数构造（\"结论反推原函数\"思想）","family":"构造与存在（3 类）","secs":[{"title":"核心思想","md":"要证 $\\exists\\, \\xi: F(\\xi) = 0$（或 $= c$），把 $\\xi$ 换成变量 $x$，**将结论改写为某函数的零点 / 罗尔点**。构造方向：结论像\"减法\"就原函数相减；像\"乘积\"就找两个拉格朗日斜率相乘；含 $e^x$、$\\sin x$ 乘子就找积分因子型原函数。"},{"title":"适用信号","md":"- 结论含 $f(\\xi)$、$f'(\\xi)$、$\\xi$ 的混合等式；\n- 出现 $[1 + f'(\\xi)]$、$\\frac{f'(\\xi)}{g'(\\xi)}$ 之类的**斜率结构**；\n- 两个中值点 $\\xi \\ne \\eta$ 的乘积 / 和差等式。"},{"title":"标准动作","md":"1. 把结论移项成 $G(\\xi) = 0$ 型；\n2. 识别**斜率结构**：$\\frac{f(b)-f(a)}{b-a}$ 是拉格朗日的签名——把目标等式凑成两个斜率的关系；\n3. 构造 $F$ 使罗尔 / 介值可用；常用速查：\n\n| 结论形状 | 构造 | 依据 |\n| ---- | ---- | ---- |\n| $f(\\xi) = 2 - 3\\xi$ 型 | $F = f(x) - 2 + 3x$，验 $F$ 两端异号 | 介值定理 |\n| $f'(\\xi)g(\\xi) + f(\\xi)g'(\\xi) = 0$ | $F = f\\,g$ | 罗尔 |\n| $f'(\\xi) = -\\lambda f(\\xi)$ | $F = e^{\\lambda x} f$ | 罗尔 |\n| $[1+f'(\\xi)][1+f'(\\eta)] = 4$ | 分两段各用拉格朗日 | 斜率配对 |\n| $\\frac{f'(\\xi)}{f(\\xi)} = \\frac1\\xi$ 型 | $F = f(x)/x$ | 罗尔（对数导数签名） |"},{"title":"示意题（★★，真题）","md":"**第十二届初赛·非数学类·三**：$f \\in C[0,1]$，在 $(0,1)$ 可导，$f(0) = 0$，$f(1) = 1$。证明：(1) 存在 $x_0 \\in (0,1)$ 使 $f(x_0) = 2 - 3x_0$；(2) 存在 $\\xi \\ne \\eta \\in (0,1)$ 使 $[1 + f'(\\xi)][1 + f'(\\eta)] = 4$。\n\n**骨架**：\n(1) $F(x) = f(x) + 3x - 2$，$F(0) = -2 < 0$，$F(1) = 2 > 0$，介值得 $x_0$。\n(2) 以同一个 $x_0$ 为分点，两段拉格朗日：\n$\nf'(\\xi) = \\frac{f(x_0) - f(0)}{x_0} = \\frac{2 - 3x_0}{x_0}, \\qquad f'(\\eta) = \\frac{f(1) - f(x_0)}{1 - x_0} = \\frac{3x_0 - 1}{1 - x_0},\n$\n$\n[1 + f'(\\xi)] = \\frac{2(1 - x_0)}{x_0}, \\qquad [1 + f'(\\eta)] = \\frac{2x_0}{1 - x_0}, \\qquad \\text{乘积} = 4. \\;\\blacksquare\n$\n（要点：第 (1) 问构造的 $x_0$ 正是第 (2) 问的分点——**命题人递的刀要用在下一问**。代数展开已逐步验证 ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| (2) 中 $\\xi, \\eta$ 取自同一区间 | 同区间两斜率相同乘积失控；分点割开才有两个自由度 |\n| 构造的 $F$ 两端同号就放弃 | 换分点 / 换构造（如改用最值点、变限积分端点） |\n| 忘验证 $F$ 连续（可导）条件 | 介值只要连续；罗尔要闭连续开可导——逐条交代 |"},{"title":"关联与出处","md":"《一元微分学习题集》中值定理构造类方法；《定积分专题》§4.4（含变限积分的中值证明：辅助函数 = 变限积分）。\n\n---"}]},"14":{"id":"14","name":"递推不动点与压缩映射（\"先猜后证\"思想）","family":"构造与存在（3 类）","secs":[{"title":"核心思想","md":"$x_{n+1} = f(x_n)$ 型：**不动点 $x^* = f(x^*)$ 就是极限的候选**（前提 $f$ 连续）。证明用两条路：① 单调有界（$f$ 在区间上保序 + 初值与不动点位置关系）；② 压缩映射（$|f'| \\le q < 1$）。求速度再叠加 Stolz / 等价量（技巧 17、19）。"},{"title":"适用信号","md":"- 题给递推式 + \"证明收敛并求极限\"；\n- 递推含平方 / 分式结构（可解出显式线性化时更佳）；\n- 已知极限求 $n^p(x_n - x^*)$ 型速度。"},{"title":"标准动作","md":"1. 解不动点方程 $x = f(x)$ 得候选 $x^*$（注意舍去负根 / 域外根）；\n2. 证收敛：作差 $x_{n+1} - x^* = f(x_n) - f(x^*)$，用中值 / 代数恒等式化为 $(x_n - x^*)\\cdot(\\text{压缩因子})$；\n3. 代入 $x_n \\to x^*$ 取极限（此步**必须** $f$ 连续）；\n4. 变形技巧速查：\n\n| 递推形状 | 动作 |\n| ---- | ---- |\n| $x_{n+1} = \\frac{x_n^2 + c}{2x_n}$ 型（均值迭代） | 令 $y_n = x_n + \\alpha$ 凑成 $\\frac12(y_n + \\frac{k}{y_n})$，上下界夹 $y^* = \\sqrt k$ |\n| $a_{n+1} = (n+1)(a_n + 1)$ 型（带 $n$ 的线性递推） | **两边除以 $(n+1)!$** 化为 $b_{n+1} = b_n + \\frac{1}{n!}$（叠和） |\n| $x_{n+1} = \\ln(1 + x_n)$ 型（慢收敛） | 极限为 0；速度用 Stolz：$\\lim \\frac{1/n}{1/x_n}$ 倒过来求 $\\lim n x_n$ |\n| $x_{n+1} = x_n^2 - 2$ 型 | 见技巧 7 倍角代换 |"},{"title":"示意题（★★，真题）","md":"**第十三届初赛·非数学类·二**：$x_1 = 2021$，$x_n^2 - 2(x_n + 1)x_{n+1} + 2021 = 0$。证明 $\\{x_n\\}$ 收敛并求极限。\n\n**骨架**：解出 $x_{n+1} = \\dfrac{x_n^2 + 2021}{2(x_n + 1)}$。令 $y_n = x_n + 1 > 0$，则\n\n$\ny_{n+1} = \\frac{y_n^2 + 2022}{2 y_n} = \\frac12\\left(y_n + \\frac{2022}{y_n}\\right).\n$\n\n$y_1 = 2022 > \\sqrt{2022}$。当 $y_n > \\sqrt{2022}$ 时：$\\dfrac{2022}{y_n} < \\sqrt{2022} < y_n$，故 $y_{n+1}$ 介于两者之间——单调递减且有下界，收敛。设 $y_n \\to A \\ge \\sqrt{2022} > 0$，迭代式取极限得 $A = \\frac12(A + \\frac{2022}{A})$，解得 $A = \\sqrt{2022}$。故\n\n$\n\\lim x_n = \\sqrt{2022} - 1.\n$\n\n（数值验证：迭代 200 步 $x_{200} = 43.966654311834$，$\\sqrt{2022} - 1 = 43.966654311834$ ✓。本质是 $\\sqrt{2022}$ 的牛顿迭代 / 均值迭代。）"},{"title":"真题一页纸（同类速览）","md":"| 真题 | 递推 | 极限 | 关键动作 |\n| ---- | ---- | ---- | ---- |\n| 第十三届初赛·非数学类·二 | $x_{n+1} = \\frac{x_n^2 + 2021}{2(x_n+1)}$ | $\\sqrt{2022} - 1$ | 平移凑均值迭代 |\n| 第十三届初赛·非数学类·补赛·填空1 | $x_n = \\ln(1 + x_{n-1})$，$x_0 = 1$ | $\\lim n x_n = 2$ | Stolz + $\\ln(1+t) = t - \\frac{t^2}2 + o$（数值：$n = 10^6$ 时 $nx_n = 2.000005$ ✓） |\n| 第十二届初赛·非数学类·二 | $a_1 = 1$，$a_{n+1} = (n+1)(a_n + 1)$ | $\\lim \\frac{n!}{a_n} = \\frac1e$ | 除以阶乘线性化：$\\frac{a_{n+1}}{(n+1)!} = \\frac{a_n}{n!} + \\frac{1}{n!} \\Rightarrow \\frac{a_n}{n!} = \\sum_{k=0}^{n-1}\\frac{1}{k!} \\to e$（数值 ✓） |"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 不先证收敛就直接\"两边取极限\" | 取极限合法性的前提是极限存在——单调有界 / 压缩至少证一个 |\n| 压缩系数 $q = 1$ 或依赖 $n$ 时仍用压缩映射 | 必须 $q < 1$ 与 $n$ 无关；临界时改用单调有界 |\n| 不动点方程解出多个根不筛选 | 用初始位置 + 保序性选根 |\n| 忘记 $f$ 连续这一步 | $x_n \\to x^*,\\ f$ 连续 $\\Rightarrow f(x^*) = x^*$，写明依据 |"},{"title":"关联与出处","md":"《第一章_极限专题》§八（迭代数列万能套路与三大模型）、§十二（压缩映射定理）；《无穷级数习题集》方法 5.4（递推数列与级数联动）。\n\n---"}]},"15":{"id":"15","name":"反例构造三板斧（\"分段·振荡·稀疏\"思想）","family":"构造与存在（3 类）","secs":[{"title":"核心思想","md":"概念辨析题（连续 / 可导 / 可积 / 一致收敛的反例矩阵）的构造只有三个母题：**分段**（分段点出问题）、**振荡**（频率或振幅失控）、**稀疏尖峰**（坏行为集中在极小的集合上）。所有经典反例都是这三板斧的叠加。"},{"title":"适用信号","md":"- \"证明或否定：……\"——先判断真伪再决定证 / 反例；\n- 概念关系的方向问题（可导 ⇒ 连续？连续 ⇒ 可积？一致收敛 ⇒ 逐点收敛？）。"},{"title":"标准动作（三板斧模板）","md":"1. **分段斧**：函数在一点改定义 / 分段拼接，破坏该点的性质（如 $f = x\\sin\\frac1x$ 类在 0 处的定义）；\n2. **振荡斧**：$x^k \\sin\\frac{1}{x^m}$ 家族——$k$ 控制连续 / 可导，$m$ 控制导数有界性；\n3. **稀疏斧**：坏行为放窄尖峰（高度 1、宽度 $2^{-n}$），总和有限 → 不影响可积性但破坏逐点行为（一致收敛反例的标准造法）。\n\n**家族速查表**（$f_{k,m}(x) = x^k\\sin\\frac{1}{x^m}$，$f(0) = 0$）：\n\n| $k$ 与 $m$ | 连续性 | 可导性 | $f'$ 有界性 |\n| ---- | ---- | ---- | ---- |\n| $k = 1, m = 1$ | ✓ 连续 | ✓ 可导 | ✗ $f' = \\sin\\frac1{x^2}\\cdot$振荡 + 无界项 |\n| $k = 2, m = 1$ | ✓ | ✓ | ✓ 有界 |\n| $k = 2, m = 2$ | ✓ | ✓ | ✗ 无界（$f' \\approx \\frac{-2\\cos(x^{-2})}{x}$） |"},{"title":"示意题（★★，概念经典）","md":"构造 $f$：在 $(-1, 1)$ 处处可导，但 $f'$ 在任何含 $0$ 的区间上无界。\n\n**骨架**：取 $f(x) = x^2\\sin\\dfrac{1}{x^2}$（$f(0) = 0$）。$x \\neq 0$ 处显然可导；$x = 0$ 处 $\\left|\\frac{f(x) - f(0)}{x}\\right| \\le |x| \\to 0$，故 $f'(0) = 0$，处处可导。但\n\n$\nf'(x) = 2x\\sin\\frac{1}{x^2} - \\frac{2}{x}\\cos\\frac{1}{x^2}, \\qquad x \\neq 0,\n$\n\n沿 $x_k = \\dfrac{1}{\\sqrt{2k\\pi}}$（此时 $\\cos\\frac1{x_k^2} = 1$）有 $f'(x_k) \\le -\\frac{2}{x_k} + 2x_k \\to -\\infty$，无界。\n（数值验证：$x = 0.01$ 时 $|f'| = 190.4$，随 $x \\to 0$ 爆炸 ✓）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 说\"$f$ 可导则 $f'$ 有界\" | 上例即反例；可导只保证逐点存在 |\n| 反例造了但忘验证\"该有的性质\" | 三步验证齐全：该有的（可导）逐条验，不要的（无界）取点列显示 |\n| 振荡函数在 0 点定义漏写 | 必须**显式定义** $f(0) = 0$，否则函数都没定义完 |"},{"title":"关联与出处","md":"《微分学专题》（连续可导概念）；《多元微分学习题集》方法 2.3（连续 / 偏导 / 可微关系反例矩阵）；《无穷级数习题集》方法 2.2（一致收敛反例：稀疏尖峰造法）。\n\n***"}]},"16":{"id":"16","name":"换元标准化（\"搬到标准区间 / 标准形\"思想）","family":"转化与化归（3 类）","secs":[{"title":"核心思想","md":"怪结构背后往往是标准结构。**倒代换** $x \\to \\frac1x$（对数变号、$[0,\\infty)$ 自反）、**三角代换**（去根号）、**伸缩平移**（任意区间 → $[0,1]$）都是把题目搬到公式库里现成的那一页。"},{"title":"适用信号","md":"- 积分区域 $[1, +\\infty)$ 或 $[0, +\\infty)$，被积函数含 $\\ln x$、$\\frac1x$；\n- 根号 $\\sqrt{a^2 - x^2}$、$\\sqrt{x^2 + a^2}$、$\\sqrt{x^2 - a^2}$ 三件套；\n- 区间 $[a, b]$ 一般、想套 $[0, 1]$ 上的结论。"},{"title":"标准动作","md":"1. 识别结构 → 选对合换元（倒代换最常被忘：它把 $\\ln$ 变号实现自我抵消）；\n2. 换元要**单调可微**、$dx$ 与限同步换（定理条件交代）；\n3. 原式与换元式**相加**（不是替换）：技巧 10 与本技巧常联动。"},{"title":"示意题（★★，经典）","md":"计算 $\\displaystyle I = \\int_0^{+\\infty} \\frac{\\ln x}{1 + x^2}\\,dx$。\n\n**骨架**：倒代换 $x = \\frac1t$（$dx = -\\frac{dt}{t^2}$，限 $0^+ \\leftrightarrow +\\infty$ 自反）：\n\n$\nI = \\int_0^{+\\infty} \\frac{\\ln \\frac1t}{1 + \\frac{1}{t^2}} \\cdot \\frac{dt}{t^2} = -\\int_0^{+\\infty} \\frac{\\ln t}{1 + t^2}\\,dt = -I \\;\\Longrightarrow\\; I = 0.\n$\n\n（数值验证：$\\pm$ 两段相消，$|I| < 10^{-15}$ ✓。同法可得 $\\int_0^1 \\frac{\\ln x}{1+x^2}dx = -\\int_1^\\infty \\cdots$，进一步 $\\int_0^1 \\frac{\\ln x}{1 - x^2}$ 类发散 / 收敛的判定。）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 倒代换后限不翻转 | $x: 0 \\to \\infty$ 对应 $t: \\infty \\to 0$，负号与翻转要配套 |\n| 广义积分直接倒代换不验收敛 | 先证收敛（如分段 + 比较），再允许换元；本题两段分别条件收敛，配对解读 |\n| 三角代换忘回代 / 忘限 | 新变量 $\\theta$ 的限必须与 $x$ 的限一一对应 |"},{"title":"关联与出处","md":"《不定积分专题》（第二类换元与三角代换）；《一元积分学习题集》方法 1.2、1.6（三角 / 无理代换）；《定积分专题》§5.1。\n\n---"}]},"17":{"id":"17","name":"离散 ↔ 连续互化（\"和式即积分，差分即导数\"思想）","family":"转化与化归（3 类）","secs":[{"title":"核心思想","md":"$n$ 项和与积分是一枚硬币：$\\sum_{k=1}^n \\frac1n g(\\frac kn) \\to \\int_0^1 g$；$\\frac{a_{n+1} - a_n}{1}$ 是 $a_n$ 的\"导数\"（Stolz 定理 = 洛必达的离散版）。两边来回搬，哪边好算去哪边。"},{"title":"适用信号","md":"- 和式呈 $\\sum g(\\frac kn)\\frac1n$ 精确结构（或可凑出）；\n- $\\frac{a_n}{b_n}$ 型数列极限，$b_n$ 单调趋于无穷（Stolz）；\n- 已知 $f$ 的积分性质、要证和的性质（或反之）。"},{"title":"标准动作","md":"1. **凑 $\\frac1n$**：把 $\\sum$ 中的 $n$ 拆成 $\\frac{k}{n}$ 的函数 + $\\frac1n$ 因子；\n2. Stolz（$\\frac{*}{\\infty}$ 型）：$\\lim \\frac{a_n}{b_n} = \\lim \\frac{a_{n+1} - a_n}{b_{n+1} - b_n}$（$b_n \\uparrow \\infty$，右极限存在）；\n3. 差分视角：递推 $x_{n+1} - x_n \\approx$ \"导数\"，配 Taylor 展开定阶（技巧 14 速度题的引擎）。"},{"title":"示意题（★★，经典）","md":"求 $\\displaystyle\\lim_{n\\to\\infty}\\sum_{k=1}^n \\frac{k}{n^2 + k^2}$。\n\n**骨架**：提因子凑结构：\n\n$\n\\sum_{k=1}^n \\frac{k}{n^2 + k^2} = \\frac1n \\sum_{k=1}^n \\frac{\\frac{k}{n}}{1 + \\left(\\frac{k}{n}\\right)^2} \\;\\longrightarrow\\; \\int_0^1 \\frac{x}{1 + x^2}\\,dx = \\frac12\\ln 2.\n$\n\n（数值验证：$n = 10^4$ 时和 $= 0.346599$，$\\frac{\\ln 2}{2} = 0.346574$ ✓。）\n\n**Stolz 对照**（真题·第十三届初赛·非数学类·补赛·填空1）：$x_n = \\ln(1 + x_{n-1})$ 时 $\\lim n x_n$：对 $\\frac{1/n}{1/x_n}$ 用 Stolz 化为 $\\lim \\frac{x_n - x_{n+1}}{x_n x_{n+1}}$，再 Taylor $\\ln(1+t) - t \\sim -\\frac{t^2}{2}$ 收网得 $2$（见技巧 14 一页纸）。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 和式不是精确 $\\frac kn$ 结构硬套定积分定义 | 先提 $\\frac1n$ 检验；残余项要么 $\\to 0$ 要么单独处理（可能要夹逼，技巧 3） |\n| Stolz 逆用 / 忘验 $b_n$ 严格单调增无穷 | Stolz 是单向的；$b_n = n$ 最常用 |\n| 端点 $k$ 从 0 起还是 1 起 | 影响的是\"左端点矩形\"与函数值零点，逐项核对一个 $n$ 即可 |"},{"title":"关联与出处","md":"《第一章_极限专题》§七（Stolz 定理与\"化求和为单项\"）；《一元积分学习题集》方法 2.5（定积分定义求和式极限）；《无穷级数习题集》5.3（级数与积分综合）。\n\n---"}]},"18":{"id":"18","name":"幂级数与生成函数（\"把数列装进函数\"思想）","family":"转化与化归（3 类）","secs":[{"title":"核心思想","md":"数项级数 $\\sum a_n$ 难求时，装进 $\\sum a_n x^n$：函数方程（求导 / 积分 / 微分方程）解出 $S(x)$，再令 $x \\to$ 特殊值。递推数列同理——母函数把递推变成代数。"},{"title":"适用信号","md":"- $\\sum \\frac{1}{n\\,2^n}$、$\\sum \\frac{n^2}{2^n}$ 型\"分母带 $c^n$\"——**天然自带收敛半径 1，可令 $x = \\frac12$**；\n- 递推数列要求通项 / 组合计数；\n- 已知 $f$ 的泰勒展开反求 $\\sum a_n$（如 $\\frac{1}{1-x},\\ \\ln(1+x),\\ e^x$）。"},{"title":"标准动作","md":"1. 照搬通项造 $S(x) = \\sum a_n x^n$（含 $2^{-n}$ 就直接令 $x = \\frac12$ 想）；\n2. 逐项求导 / 积分调整系数（区间内必一致收敛，合法）；\n3. 解出闭式，代特殊值；\n4. 验收敛域端点（$x = 1$ 处的合法性单独讨论）。"},{"title":"示意题（★，经典）","md":"求 $\\displaystyle\\sum_{n=1}^{\\infty} \\frac{1}{n \\cdot 2^n}$。\n\n**骨架**：令 $S(x) = \\sum_{n\\ge1} \\frac{x^n}{n}$（$|x| < 1$），则 $S'(x) = \\sum x^{n-1} = \\frac{1}{1-x}$，$S(x) = -\\ln(1 - x)$。令 $x = \\frac12$：\n\n$\n\\sum_{n=1}^\\infty \\frac{1}{n\\cdot 2^n} = -\\ln\\frac12 = \\ln 2.\n$\n\n（数值验证：部分和 $0.69314718 = \\ln 2$ ✓。）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 令 $x = 1$（或端点）不验收敛 | 端点处幂级数可能发散 / 条件收敛，单独判 |\n| 逐项求导说\"显然可以\" | 引用\"幂级数在收敛区间**内部**可逐项求导\"——内部二字是合法性来源 |\n| 组合递推忘设初值对应项 | 母函数法最后用初值定常数，漏一步全错 |"},{"title":"关联与出处","md":"《无穷级数习题集》方法 3.4（构造幂级数求数项级数和）、3.5（微分方程法）；B 站笔记《幂级数收敛域与和函数》《逐项可积性与展开》。\n\n***"}]},"19":{"id":"19","name":"Taylor 定阶与 Stirling / Wallis（\"标准渐近展开\"思想）","family":"渐近工具箱（2 类）","secs":[{"title":"核心思想","md":"三个必背渐近式给出所有常见量的精确阶：\n\n$\nn! \\sim \\sqrt{2\\pi n}\\left(\\frac{n}{e}\\right)^n \\ (\\text{Stirling}), \\qquad \\frac{(2n-1)!!}{(2n)!!} \\sim \\frac{1}{\\sqrt{\\pi n}} \\ (\\text{Wallis 精度}), \\qquad 1 - \\cos t \\sim \\frac{t^2}{2}.\n$\n\nTaylor 展开负责\"相消后看第一阶\"——差的等价必须展开到不消的那一阶。"},{"title":"适用信号","md":"- 极限含 $n!$、$(n!)^{1/n}$、$n^n$、双阶乘比；\n- $\\sqrt{\\ }$ 与 $\\sqrt{\\ }$ 的差、$\\sin$ 与角的差（相消结构）。"},{"title":"标准动作","md":"1. 识别阶乘 / 连乘 → Stirling（指数型）或 Wallis（双阶乘）；\n2. 识别相消差 → Taylor 到第一个非零阶；\n3. 开 $n$ 次方先取对数：$\\sqrt[n]{\\frac{n!}{n^n}} \\Rightarrow \\frac1n\\ln\\frac{n!}{n^n} = \\frac{\\ln n! - n\\ln n}{n}$。"},{"title":"示意题（★★，经典）","md":"求 $\\displaystyle\\lim_{n\\to\\infty}\\left(\\frac{n!}{n^n}\\right)^{1/n}$。\n\n**骨架**：取对数 + Stirling：$\\ln n! = n\\ln n - n + O(\\ln n)$，故\n\n$\n\\frac{\\ln n! - n \\ln n}{n} = -1 + O\\!\\left(\\frac{\\ln n}{n}\\right) \\to -1 \\;\\Longrightarrow\\; \\text{原极限} = e^{-1}.\n$\n\n（数值验证：$n = 200$ 时 $0.3745 \\to 1/e = 0.3679$ ✓，收敛慢正是 $O(\\frac{\\ln n}{n})$ 尾项的体现。）"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| Stirling 写成 $n! \\approx (n/e)^n$ 漏根号因子 | 开 $n$ 次方时根号因子贡献 $(2\\pi n)^{1/2n} \\to 1$ 不影响——但要**知道它为何可扔** |\n| 差的等价只展一阶 | 例：$\\sin x - x \\sim -\\frac{x^3}{6}$，展到 1 阶会得 0 |\n| Wallis 双阶乘的常数记错 | $\\sqrt{n}\\,\\frac{(2n-1)!!}{(2n)!!} \\to \\frac{1}{\\sqrt\\pi}$（推导与勘误见《定积分专题》§7.3） |"},{"title":"关联与出处","md":"《第一章_极限专题》§五（Wallis）、§六（Stirling）；《定积分专题》§7.3–7.6（双阶乘精确双侧估计 + 勘误 + Stirling）。\n\n---"}]},"20":{"id":"20","name":"上下极限与子列（\"先抓聚点再定生死\"思想）","family":"渐近工具箱（2 类）","secs":[{"title":"核心思想","md":"极限不存在 ≠ 没有规律。$\\limsup / \\liminf$ 永远存在（广义），且**相等 ⇔ 极限存在**。振荡数列先看两个\"聚点端点\"，证明存在性存疑时用上下极限封口（Bolzano–Weierstrass 子列）。"},{"title":"适用信号","md":"- 含 $(−1)^n$、$\\sin n$、$\\{2^n x\\}$ 的振荡结构；\n- \"证明极限存在并求值\"，但单调性证不出 → 转证 $\\limsup = \\liminf$；\n- 递推不单调，需找两个子列分别收敛（技巧 6、7 的收尾工具）。"},{"title":"标准动作","md":"1. 定义回放：$\\limsup a_n = \\lim_{n}\\max_{k \\ge n} a_k = \\inf_n \\sup_{k\\ge n} a_k$；\n2. 抓两个特殊子列（偶足标 / 奇足标，或 $n = j!$ 型稀疏足标）分别求极限；\n3. 证任何子列的极限都夹在这两个值之间（或证上极限 ≤ 下极限）；\n4. 相等收网。"},{"title":"示意题（★★，经典）","md":"设 $a_n = \\left(1 + \\dfrac1n\\right)^{n + (-1)^n}$，判断 $\\{a_n\\}$ 是否收敛。\n\n**骨架**：\n\n$\na_n = \\left(1 + \\frac1n\\right)^n \\cdot \\left(1 + \\frac1n\\right)^{(-1)^n}, \\qquad \\left(1 + \\frac1n\\right)^n \\to e, \\qquad \\left(1 + \\frac1n\\right)^{(-1)^n} \\to 1,\n$\n\n故 $a_n \\to e$——振荡指数 $(−1)^n$ 被 $\\left(1 + \\frac1n\\right) \\to 1$ 的底数**吸收**。\n（数值验证：$n = 200$ 时 $2.7251$、$n = 201$ 时 $2.6981$，一上一下夹逼 $e = 2.7183$ ✓。）\n\n**对照**（若振荡不被吸收）：$b_n = \\left(1 + \\frac{1}{n + (-1)^n}\\right)^n$ 型上下极限不同、发散——与技巧 6 的 $\\{2^n x\\}$ 同属\"子列分家\"判发散家族。"},{"title":"易错警示","md":"| 错误 | 纠正 |\n| ---- | ---- |\n| 直接断言\"振荡所以发散\" | 先看振荡幅度是否被别的趋于 1 / 0 的因子吸收（本例即被吸收） |\n| 上下极限只会取偶奇子列 | 偶奇只是最常用的；稀疏子列（$j!$）常给出真正的 limsup/liminf |\n| 用 $\\limsup a_n b_n \\le \\limsup a_n \\limsup b_n$ 时 $b_n$ 不非负 | 运算不等式需要非负（或有界 + 符号控制） |"},{"title":"关联与出处","md":"《第一章_极限专题》§十一（上下极限技巧）、§十三.4（上下极限视角的推广）。\n\n***\n\n# 收尾：信号 → 技巧速查总表与备考建议\n\n## 20 类技巧速查表（考前最后一页）\n\n| 题型信号 | 首选技巧 | 关键动作 | 头号陷阱 |\n| ---- | ---- | ---- | ---- |\n| 整体夹不住、峰值/端点/零点坏 | 1 分段估计 | 挖 $\\delta$ 邻域，段内各用有界 / 衰减 | $\\delta$ 依赖了 $n$ |\n| $\\sqrt[n]{\\int f^n}$、$\\max f$ | 2 峰值邻域 | 邻域下界 + 整体上界，长度开 $n$ 次根 | 忘了 $\\delta^{1/n} \\to 1$ |\n| n 项和、每项可同构放缩 | 3 夹逼 | 上下界同结构，两端同极限 | 等价替换用在求和内部 |\n| 通项混合多种无穷大/小 | 4 抓大头定阶 | 对数<幂<指<阶乘<$n^n$，主导项替换 | 差的等价展开不够阶 |\n| 调和、$\\frac{1}{n\\ln n}$、$H_n$ 阶 | 5 二进分割 | 按 $[2^k, 2^{k+1})$ 分桶 | 下界方向用反 |\n| $\\{2^n x\\}$、构造特殊小数 | 6 数位构造 | 稀疏放 1（$j!$ 位），尾和几何罩住 | 二进制不唯一性 |\n| $x_{n+1} = x_n^2 - 2$、嵌套根号 | 7 倍角代换 | $x_n = 2\\cos(2^n\\theta)$ / $2\\cos\\frac{\\theta}{2^n}$ | $\\lvert x_1\\rvert >2$ 要换 $\\cosh$ 型 |\n| 存在 ξ、双条件找点 | 8 二分区间套 | 折半保性质，长度 $2^{-n}$ 收口 | \"恰有\"没补单调封顶 |\n| $e\\,n!$、判无理、$\\sum \\frac1{k!}$ | 9 展开逼近 | 整数主部 + 尾项 $< \\frac2n$ | 尾项只用第一项 |\n| 含 $x$ 权重、$f(\\sin x)$、$[0,\\infty)$ 配 $\\ln$ | 10 区间再现/倒代换 | $x \\mapsto a+b-x$ 或 $\\frac1x$ 后相加 | $f(\\cos x)$ 不对称 |\n| 球/圆对称、系数未知齐次式 | 11 奇偶轮换 | 地位等值 + 总量守恒方程 | 轮换≠奇偶消零 |\n| 长区间周期函数、取整 $[x]$ | 12 平移周期化 | 整周期倍数 + 余段；取整分段 | $\\lvert \\sin\\rvert $ 周期是 $\\pi$ |\n| 结论含 $f(\\xi)$、斜率结构 | 13 辅助函数 | 结论移项造 $F$，介值/罗尔/拉格朗日 | $\\xi,\\eta$ 未分区间 |\n| $x_{n+1} = f(x_n)$ | 14 不动点 | 先解不动点，单调有界/压缩二选一 | 不证收敛就取极限 |\n| 证伪、概念方向问题 | 15 反例三板斧 | 分段 / 振荡 $x^k\\sin\\frac1{x^m}$ / 稀疏尖峰 | 漏验\"该有\"的性质 |\n| $[0,\\infty)$ + $\\ln$ + $\\frac1x$ | 16 换元标准化 | 倒代换后与原式相加 | 换元不验收敛 |\n| $\\sum g(\\frac kn)\\frac1n$、$\\frac{a_n}{n}$ | 17 离散连续互化 | 凑 $\\frac1n$ / Stolz 差分 | Stolz 逆用 |\n| $\\sum \\frac{c_n}{2^n}$、递推通项 | 18 幂级数生成 | 造 $S(x)$，微积分加工，代特殊值 | 端点不验敛 |\n| $n!$、$n^n$、双阶乘、相消差 | 19 定阶工具箱 | Stirling / Wallis / Taylor 到非零阶 | 差只展一阶 |\n| $(−1)^n$、$\\sin n$、极限存疑 | 20 上下极限 | 子列分家，证 limsup = liminf | 振荡被底数吸收与否 |\n\n## 备考建议\n\n1. **刷题顺序**：先过本册决策树（开篇 §3），再按\"一 → 六\"顺序读正文；每类技巧回看关联出处里对应的专题笔记 / 习题集方法编号，形成\"总册定位 → 分册深挖\"的动线。\n2. **使用方式**：真题训练时，每做完一道就在 20 行速查表上给对应技巧打勾；连续两套真题没触发的技巧降优先级，反复触发的（分段估计、辅助函数、递推不动点、对称配对是历届高频）回分册重刷。\n3. **错题归档**：错题按**技巧编号**归档复盘，而不是按章节——同一技巧在极限、积分、级数里的错法往往同源。\n4. **考前策略**：初赛填空题高频落在技巧 3、4、17、19（计算与识别类）；解答大题与压轴高频落在技巧 1、2、13、14（估计与构造类）+ 技巧 11、12（对称类）。考前最后一晚只看速查表 + 易错警示列。\n5. **二进制族的定位**：技巧 5–9 是本册新增覆盖（已有笔记空白），真题中多以\"隐藏骨架\"出现（如分桶估计藏在级数压轴、倍角藏在递推压轴）——不必单独刷专题，但要在决策树上能认出信号。\n\n***\n\n*全书统计：六部分 20 类技巧，示意题 20 道，另附真题对拍 9 处（第十二届·二/三/六，第十三届·二/四，第十三届补赛·二与填空1，第十四届·四/六，均与本地真题原文核对），全部数值结果经 Python 验证。*\n\n*真题配合建议：`真题下载/` 目录中第十二、十三、十四届非数学类 md 可直接阅读，其余届别 md 转换损坏，建议对照 PDF 原文使用。*"}]}}}};

(function(){

/* ================= 基础索引 ================= */
const M = DATA.main, BOOKS = DATA.books, TRICKS = DATA.tricks;

const BOOK_ORDER = ['一元微分','一元积分','多元微分','多元积分','微分方程','无穷级数'];

/* ================= 迷你 Markdown 渲染 ================= */
function inlineMd(s){
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_,c)=>{ codes.push(c); return '\u0001'+(codes.length-1)+'\u0001'; });
  // 链接
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_,txt,url)=> makeLink(txt,url));
  t = t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t = t.replace(/==([^=]+)==/g,'<mark>$1</mark>');
  t = t.replace(/(^|[\s（(；;，。])\*([^*\n]{1,60}?)\*(?=$|[\s，。；）)])/g,'$1<i>$2</i>');
  t = t.replace(/\u0001(\d+)\u0001/g,(_,i)=>'<code>'+codes[+i]+'</code>');
  return t;
}
function makeLink(txt,url){
  if(url.startsWith('#/')) return '<a href="'+esc(url)+'">'+txt+'</a>';
  const m = url.match(/([^\/]+)\.md#方法-(\d+)(\d+)/) || url.match(/([^\/]+)\.md/);
  if(m){
    const file = m[1];
    let book = null;
    BOOK_ORDER.forEach(b=>{ if(file.indexOf(b)===0 || file.indexOf(b)>=0) book=b; });
    if(book && m[2]!==undefined && m[3]!==undefined){
      const id = m[2]+'.'+m[3];
      if(methodExists(book,id)) return '<a href="#/method/'+book+'/'+id+'">'+txt+'</a>';
    }
    if(book) return '<a href="#/book/'+book+'">'+txt+'</a>';
  }
  return '<span class="ext" title="原笔记链接：'+esc(url)+'">'+txt+' ↗</span>';
}

/* 引用链接化：题型 X.Y / [册别名[ 方法]] X.Y / 方法 X.Y / 技巧 N → 应用内链接（单次扫描防双重包裹） */
function refLinkify(md, ctx){
  ctx = ctx || {};
  let s = md;
  s = s.replace(/题型\s*(\d+\.\d+)/g, (full,id)=> M.types[id] ? '['+full+'](#/type/'+id+')' : full);
  s = s.replace(/(一元微分|一元微|一元积分|一元积|多元微分|多元微|多元积分|多元积|微分方程|无穷级数|级数)\s*(?:方法\s*)?(\d+)\.(\d+)|(?<![一-龥])方法\s*(\d+)\.(\d+)/g,
    (full,a,x,y,b,c)=>{
      const book = (a ? resolveAlias(a) : null) || ctx.book || BLOCK_BOOK[ctx.block];
      const id = a ? x+'.'+y : b+'.'+c;
      if(book && methodExists(book,id)) return '['+full+'](#/method/'+book+'/'+id+')';
      return full;
    });
  s = s.replace(/技巧\s*(\d+)/g, (full,n)=> TRICKS.items[n] ? '['+full+'](#/trick/'+n+')' : full);
  return s;
}

function mdHtml(md, ctx){
  if(!md) return '';
  md = refLinkify(md, ctx||{});
  const lines = md.split('\n');
  let out = [], i = 0;
  const flushP = buf => { if(buf.length){ out.push('<p>'+buf.map(inlineMd).join('<br>')+'</p>'); buf.length=0; } };
  let buf = [];
  while(i < lines.length){
    const L = lines[i];
    if(/^```/.test(L)){
      flushP(buf);
      let code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre class="ascii">'+esc(code.join('\n'))+'</pre>');
      continue;
    }
    if(/^\|/.test(L.trim())){
      flushP(buf);
      let rows=[]; 
      while(i<lines.length && /^\|/.test(lines[i].trim())){ rows.push(lines[i].trim()); i++; }
      out.push(tableHtml(rows));
      continue;
    }
    const hm = L.match(/^(#{3,5})\s+(.*)$/);
    if(hm){ flushP(buf); const lv = Math.min(hm[1].length,5); out.push('<h'+lv+'>'+inlineMd(hm[2])+'</h'+lv+'>'); i++; continue; }
    if(/^(\*\*\*|---)\s*$/.test(L.trim())){ flushP(buf); out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(L)){
      flushP(buf);
      let q=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote><p>'+q.map(inlineMd).join('<br>')+'</p></blockquote>');
      continue;
    }
    if(/^[-*]\s+/.test(L)){
      flushP(buf);
      let items=[];
      while(i<lines.length && /^[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^[-*]\s+/,'')); i++; }
      out.push('<ul>'+items.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ul>');
      continue;
    }
    if(/^\d+[.、]\s+/.test(L)){
      flushP(buf);
      let items=[];
      while(i<lines.length && /^\d+[.、]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\d+[.、]\s+/,'')); i++; }
      out.push('<ol>'+items.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</ol>');
      continue;
    }
    if(!L.trim()){ flushP(buf); i++; continue; }
    buf.push(L); i++;
  }
  flushP(buf);
  return out.join('\n');
}

/* ================= 交互树渲染 ================= */
function refChips(refs, ctx){
  const chips = [];
  (refs||[]).forEach(r=>{
    if(r.k==='type' && M.types[r.id]) chips.push('<a class="chip t" href="#/type/'+r.id+'">题型 '+r.id+'</a>');
    else if(r.k==='method'){
      const book = resolveAlias(r.book) || ctx.book || BLOCK_BOOK[ctx.block];
      if(book && methodExists(book,r.id)) chips.push('<a class="chip m" href="#/method/'+book+'/'+r.id+'">'+book+' '+r.id+'</a>');
      else chips.push('<span class="chip ghost">'+esc((r.book&&r.book!=='分册'?r.book+' ':'')+'方法 '+r.id)+'</span>');
    }
    else if(r.k==='trick' && TRICKS.items[r.id]) chips.push('<a class="chip k" href="#/trick/'+r.id+'">技巧 '+r.id+'</a>');
  });
  return chips.length ? '<span class="trefs">'+chips.join('')+'</span>' : '';
}
function nodeHtml(n, depth, ctx){
  const hasKids = n.k && n.k.length;
  const lines = String(n.t).split('\n');
  const label = lines.map((l,j)=> j===0
    ? '<span class="tline">'+inlineMd(l)+'</span>'
    : '<span class="tline cont">'+inlineMd(l)+'</span>').join('');
  const row = '<div class="trow'+(hasKids?' clickable':'')+'">'
    + (hasKids ? '<span class="tw">▶</span>' : '<span class="leafdot"></span>')
    + '<span class="tt">'+label+refChips(n.r,ctx)+'</span></div>';
  const kids = hasKids ? '<div class="tkids">'+n.k.map(c=>nodeHtml(c,depth+1,ctx)).join('')+'</div>' : '';
  return '<div class="tnode'+(hasKids && depth<=0 ? ' open':'')+'"'+(hasKids?' data-haskids="1"':'')+'>'+row+kids+'</div>';
}
function renderTree(tr, ctx, opts){
  opts = opts||{};
  if(!tr || !tr.roots || !tr.roots.length) return '';
  const roots = tr.roots;
  // 若根是单一起点行，把起点行作为 root 徽章
  let headHtml = '', forest = roots;
  if(roots.length===1 && roots[0].k && roots[0].k.length){
    headHtml = '<div class="trroot">🎯 '+inlineMd(roots[0].t.replace(/\n/g,' '))+'</div>';
    forest = roots[0].k;
  }
  const itreeId = 'it'+Math.random().toString(36).slice(2,8);
  let h = '<div class="treebox" id="'+itreeId+'">';
  h += '<div class="toolbar">'
    + '<button class="tbtn on" data-v="i">交互树</button>'
    + (tr.raw ? '<button class="tbtn" data-v="r">原书视图</button>' : '')
    + '<span style="flex:1"></span>'
    + '<button class="tbtn" data-act="open">展开全部</button>'
    + '<button class="tbtn" data-act="close">收起</button></div>';
  h += '<div class="twrap"><div class="itree">'+headHtml+forest.map(n=>nodeHtml(n,0,ctx)).join('')+'</div>';
  h += (tr.raw ? '<pre class="ascii" style="display:none">'+esc(tr.raw)+'</pre>' : '')+'</div></div>';
  return h;
}
function bindTree(rootEl){
  rootEl.querySelectorAll('.treebox').forEach(box=>{
    box.querySelectorAll('.trow.clickable').forEach(row=>{
      row.addEventListener('click', e=>{
        if(e.target.closest('a.chip')) return;
        row.parentElement.classList.toggle('open');
      });
    });
    box.querySelectorAll('.toolbar .tbtn[data-v]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const inter = btn.dataset.v==='i';
        const it = box.querySelector('.itree'), pe = box.querySelector('pre.ascii');
        if(it) it.style.display = inter?'':'none';
        if(pe) pe.style.display = inter?'none':'';
        box.querySelectorAll('.tbtn[data-v]').forEach(b=>b.classList.toggle('on', b===btn));
      });
    });
    box.querySelectorAll('.toolbar .tbtn[data-act]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        box.querySelectorAll('.tnode[data-haskids]').forEach(n=>n.classList.toggle('open', btn.dataset.act==='open'));
      });
    });
  });
}

    +'<div class="callout warn">公式依赖联网加载 KaTeX 渲染；离线打开时公式以 LaTeX 原文显示，其余功能不受影响。练习题/拔高题详解未纳入本页，仍在原册。</div>';
}

/* ================= 路由 ================= */
function route(){
  const raw = location.hash.replace(/^#\/?/,'') || 'home';
  const parts = raw.split('/').map(decodeURIComponent);
  try{
    switch(parts[0]){
      case 'home': vHome(); break;
      case 'branch': vBranch(parts[1]); break;
      case 'block': vBlock(parts[1]); break;
      case 'type': vType(parts[1]); break;
      case 'book': vBook(parts[1]); break;
      case 'method': vMethod(parts[1], parts[2]); break;
      case 'tricks': vTricks(); break;
      case 'trick': vTrick(parts[1]); break;
      case 'quick': vQuick(); break;
      case 'strategy': vStrategy(); break;
      case 'about': vAbout(); break;
      default: location.hash = '#/home';
    }
  }catch(e){
    app.innerHTML = '<div class="card"><b>渲染出错：</b>'+esc(e.message)+'</div>';
    console.error(e);
  }
  window.scrollTo(0,0);
  tryMath();
}
window.addEventListener('hashchange', route);

/* ================= KaTeX ================= */
window.__tryMath = function(){
  if(!window.renderMathInElement) return;
  try{
    renderMathInElement(app, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false, ignoredTags:['script','noscript','style','textarea','pre','code']
    });
  }catch(e){}
};
function tryMath(){ window.__tryMath(); }

/* ================= 搜索 ================= */
const IDX = [];
TYPE_ORDER.forEach(id=>{
  const T = M.types[id], q = quickById[id];
  IDX.push({kind:'题型', title:'题型 '+id+' '+T.name, sub:(q?q.cells[1]+' ｜ '+q.cells[2]:stripMd(T.signals).slice(0,60)), href:'#/type/'+id, text:(T.name+' '+T.signals+' '+(q?q.cells.join(' '):'')+' '+(T.actions||''))});
});
BOOK_ORDER.forEach(b=>methodKeys(b).forEach(mid=>{
  const Mm = BOOKS[b].methods[mid];
  IDX.push({kind:'方法', title:b+' · 方法 '+mid+' '+Mm.name, sub:Mm.part||'', href:'#/method/'+b+'/'+mid, text:(Mm.name+' '+Mm.teachMd.slice(0,400))});
}));
Object.keys(TRICKS.items).forEach(n=>{
  const K = TRICKS.items[n];
  const idea = (K.secs.find(s=>/核心思想/.test(s.title))||{}).md||'';
  IDX.push({kind:'技巧', title:'技巧 '+n+' '+K.name, sub:stripMd(idea).slice(0,60), href:'#/trick/'+n, text:(K.name+' '+idea.slice(0,300))});
});
const qEl = document.getElementById('q'), qrEl = document.getElementById('qresults');
function doSearch(v){
  v = v.trim().toLowerCase();
  if(!v){ qrEl.style.display='none'; return; }
  const hits = IDX.map(it=>{
    const hay = (it.title+' '+it.sub+' '+stripMd(it.text)).toLowerCase();
    let score = -1;
    if(it.title.toLowerCase().indexOf(v)>=0) score = 100 - it.title.length*0.1;
    else { const i2 = hay.indexOf(v); if(i2>=0) score = 50 - i2*0.01; }
    return {it, score};
  }).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score).slice(0,14);
  if(!hits.length){ qrEl.innerHTML='<div class="qr-group">无匹配结果</div>'; qrEl.style.display='block'; return; }
  const groups = {};
  hits.forEach(x=>{ (groups[x.it.kind]=groups[x.it.kind]||[]).push(x.it); });
  qrEl.innerHTML = Object.entries(groups).map(([k,items])=>
    '<div class="qr-group">'+k+'</div>'+items.map(it=>'<a class="qr-item" href="'+it.href+'"><b>'+esc(it.title)+'</b><span class="qr-sub">'+esc(it.sub)+'</span></a>').join('')
  ).join('');
  qrEl.style.display='block';
}
qEl.addEventListener('input', ()=>doSearch(qEl.value));
qEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const first = qrEl.querySelector('a.qr-item'); if(first){ location.hash = first.getAttribute('href').slice(1); qEl.value=''; qrEl.style.display='none'; qEl.blur(); } }
  if(e.key==='Escape'){ qrEl.style.display='none'; qEl.blur(); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('#searchbox')) qrEl.style.display='none'; });

/* ================= 主题 ================= */
const themebtn = document.getElementById('themebtn');
function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  themebtn.textContent = dark ? '☀️' : '🌙';
  try{ localStorage.setItem('dtree-theme', dark?'d':'l'); }catch(e){}
}
themebtn.addEventListener('click', ()=>applyTheme(!document.documentElement.classList.contains('dark')));
let savedTheme='l'; try{ savedTheme = localStorage.getItem('dtree-theme')||'l'; }catch(e){}
applyTheme(savedTheme==='d');

/* ================= 页脚与启动 ================= */
document.getElementById('foot').innerHTML =
  '题型方法决策树交互版 · '+DATA.meta.counts.types+' 题型 / '+DATA.meta.counts.methods+' 方法 / '+DATA.meta.counts.tricks+' 技巧 · 构建于 '+DATA.meta.builtAt
  +' · <a href="#/about">使用说明</a> · 源笔记更新后运行 <code>05_教材与工具/生成决策树HTML.js</code> 重建';
route();
})();
//__APP_END__
</script>
